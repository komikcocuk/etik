<title>Etik ve Sosyal Sorumluluk Soru Bankası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütun çalışma defteri; set menüsünde üç çalışma modu (test / kart / özet) */
:root{
  --bg:#f3f6f6;
  --surface:#ffffff;
  --fg:#17292c;
  --muted:#5a6f72;
  --accent:#0b7285;
  --accent-ink:#ffffff;
  --accent-soft:#e1f0f3;
  --line:#d7e2e3;
  --good:#2b7a3f;
  --good-soft:#e5f3e8;
  --bad:#b3362e;
  --bad-soft:#faeae8;
  --chip:#eef3f3;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
    --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
    --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
    --chip:#1f2b2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
  --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
  --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
  --chip:#1f2b2e; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- ana ekran ---------- */
.masthead{padding:34px 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.masthead h1{font-size:clamp(28px,6vw,38px);font-weight:700;margin-top:6px}
.masthead p{color:var(--muted);margin:10px 0 0;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.set-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.set-card:hover{border-color:var(--accent)}
.set-num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700}
.set-card.special .set-num{background:var(--accent);color:var(--accent-ink)}
.set-body{min-width:0;flex:1}
.set-title{font-weight:800;font-size:16px}
.set-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.set-meta{display:flex;gap:10px;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.set-meta .best{color:var(--good)}
.go{flex:none;color:var(--accent);font-size:22px;font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
.plan .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.plan ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--fg)}
.plan li{margin:3px 0}
.plan b{color:var(--accent)}

/* ---------- set menüsü ---------- */
.menu-head{padding:26px 0 4px}
.menu-head h2{font-size:clamp(22px,5vw,28px)}
.menu-head p{color:var(--muted);margin:8px 0 0}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.mode:hover{border-color:var(--accent)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent-soft)}
.mode .t{font-weight:800;font-size:15.5px}
.mode .d{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- soru ekranı ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px}
.btn-ghost:hover{color:var(--accent)}
.counts{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .ok{color:var(--good)} .counts .no{color:var(--bad)}
.bar{height:6px;background:var(--chip);border-radius:999px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.quiz-set-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.qtext{font-family:var(--display);font-size:clamp(18px,4.2vw,22px);font-weight:600;line-height:1.45;margin:4px 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--fg);font-size:15.5px;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt span.txt{min-width:0}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{margin-top:16px;font-weight:800;font-size:15px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;padding:13px 15px}
.explain .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.explain p{margin:6px 0 0;font-size:14.5px;color:var(--fg)}
.explain p b,.review-item .re b,.flash-exp b{color:var(--accent)}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.badbtn{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.goodbtn{background:var(--good);color:#fff}
.hint-keys{color:var(--muted);font-size:12.5px;margin-top:14px}

/* ---------- bilgi kartları ---------- */
.flash-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:16px;min-height:200px;display:flex;flex-direction:column}
.flash-q{font-family:var(--display);font-size:clamp(17px,4vw,21px);font-weight:600;line-height:1.5}
.flash-back{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.flash-ctx{color:var(--muted);font-size:14px;line-height:1.5}
.flash-ans{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(18px,4.4vw,22px);line-height:1.4;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.flash-card .flash-exp{font-size:15.5px;line-height:1.6;margin-top:0}
.flash-actions .btn:disabled{opacity:.45;cursor:default}
.flash-exp{font-size:14.5px;color:var(--fg);margin-top:8px}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flash-tag{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash-tag .again{color:var(--bad)}

/* ---------- özet ---------- */
.sum h3{font-size:17px;margin:24px 0 8px;color:var(--accent)}
.sum p{font-size:14px;margin:6px 0}
.sum ul{margin:6px 0;padding-left:20px;font-size:14px}
.sum li{margin:3px 0}
.sum .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
.sum th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sum td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.sum td:first-child{font-weight:800;white-space:nowrap}
.sum .k{color:var(--accent);font-weight:800}
.sum .warn{color:var(--bad);font-weight:700}
.sum .okk{color:var(--good);font-weight:700}

/* ---------- sonuç ekranı ---------- */
.result-head{text-align:center;padding:34px 0 8px}
.score-ring{width:128px;height:128px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:
  conic-gradient(var(--good) calc(var(--p)*1%), var(--chip) 0)}
.score-ring > div{width:100px;height:100px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:26px;font-variant-numeric:tabular-nums}
.score-ring small{color:var(--muted);font-weight:700;font-size:12px}
.result-head h2{font-size:24px;margin-top:14px}
.result-head p{color:var(--muted);margin:6px 0 0}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 8px}
.review h3{font-size:18px;margin:26px 0 10px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.review-item .rq{font-weight:700;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:8px}
.review-item .ra .you{color:var(--bad);font-weight:700}
.review-item .ra .cor{color:var(--good);font-weight:700}
.review-item .re{font-size:13.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.perfect{color:var(--good);font-weight:800}
</style>

<script>
const SETS = [{"title": "Uygulamalı Etik: İş, Meslek, Çalışma, İşletme, Yönetim, Kamu, Bilim, İletişim ve Tıp Etiği", "desc": "İş etiğinin tarihçesi, uluslararası iş etiği, mesleki etik ilkeleri, çalışma/işletme/yönetim etiği, kamu etiği ve kamu görevlisinin emanetleri, bilim, iletişim ve tıp etiği, UNESCO biyoetik ilkeleri, Hekimlik Meslek Etiği Kuralları", "short": "Uygulamalı Etik", "questions": [{"q": "Bölümün “Hedeflenen Kazanımlar” tablosuna göre aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Yönetsel Etik – Yönetsel etiğin içeriği hakkında bilgi sahibi olunması"}, {"t": "İş Etiği – İş etiğinin genel hatlarıyla bilinmesi"}, {"t": "Tıp Etiği – Tıp etiğinin konusuna nelerin girdiğinin bilinmesi"}, {"t": "Meslek Etiği – Meslek etiğinin genel çerçevesinin öğrenilmesi"}, {"t": "Kamu Etiği – Kamu etiğinin konusuna nelerin girdiğinin bilinmesi"}], "a": 4, "exp": "Tabloda kazanımlar: **İş etiği** → genel çerçevesinin öğrenilmesi; **Meslek etiği** → içeriği hakkında bilgi sahibi olunması; **Yönetsel etik** → genel hatlarıyla bilinmesi; **Kamu etiği** → konusuna nelerin girdiğinin bilinmesi; **Tıp etiği** → genel çerçevesinin bilinmesi. Çeldiriciler bu ifadelerin konular arasında yer değiştirilmiş halleridir.\n💡 \"Genel çerçeve\" iki kez geçer: İş etiği ve Tıp etiği."}, {"q": "Kaynağa göre iş etiği kavramı hangi dönemde ön plana çıkmıştır?", "opts": [{"t": "Kitle iletişim araçlarının büyüyüp çeşitlendiği 1970'li yıllarda"}, {"t": "Modernleşme ve demokratikleşmeyle ahlak felsefesinin yerini hukuk felsefesine bıraktığı dönemlerde"}, {"t": "Dini değerlerin çalışma ilişkilerini belirlemeye başladığı Orta Çağ'da"}, {"t": "Uluslararası ticaretin küreselleşmeyle hız kazandığı ve işletmelerin dışa açıldığı 21. yüzyılda"}, {"t": "Sanayi Devrimi ile birlikte işçi sınıfının sendikalar aracılığıyla örgütlenmeye başladığı dönemlerde"}], "a": 1, "exp": "Kaynak, **Hegel**'e atıfla iş etiğinin, **modernleşme ve demokratikleşme** ile **ahlak felsefesinin yerini hukuka ve hukuk felsefesine bıraktığı** dönemlerde öne çıktığını belirtir. 1970'ler **iletişim etiği** araştırmalarının ivme kazandığı dönemdir; küreselleşme ise **uluslararası iş etiği** kavramını gündeme getirmiştir."}, {"q": "İş etiği bilincinin artması ve iş etiğinin ayrı bir çalışma alanı haline gelmesi hangi dönemden itibaren görülmektedir?", "opts": [{"t": "19. yüzyılın ortalarından itibaren"}, {"t": "20. yüzyılın ilk yarısından itibaren"}, {"t": "20. yüzyılın son çeyreğinden itibaren"}, {"t": "17. ve 18. yüzyıllardan itibaren"}, {"t": "21. yüzyılın başından itibaren"}], "a": 2, "exp": "Kaynakta (Serbest, 2001) iş etiği bilincinin **20. yüzyılın son çeyreğinden** itibaren arttığı ve iş etiğinin **ayrı bir çalışma alanı** haline geldiği belirtilir. 17.–18. yüzyıllar ise ekonomi, din ve ahlak arasındaki **yakın ilişkinin** hakim olduğu dönemdir."}, {"q": "Endüstri toplumu öncesinde iş etiği ve iş ahlakı esas olarak neye dayanan kavramlar olarak ortaya çıkmıştır?", "opts": [{"t": "Meslek örgütlerinin etik kodları"}, {"t": "Bilimsel bilgi ve rasyonel yönetim"}, {"t": "Uluslararası ticari normlar"}, {"t": "Gelenekler ve dini değerler"}, {"t": "Yazılı yasalar ve sözleşmeler"}], "a": 3, "exp": "Kaynağa göre **endüstri toplumu öncesinde** iş etiği ve iş ahlakı **gelenekler ve dini değerler** üzerine kurulu kavramlardır; bu dönemlerde dinsel inançlar ekonomik süreci, çalışma ilişkilerini ve iş değerlerini biçimlendirmede önemli bir etkiye sahiptir. Etik kodlar ise günümüz işletme etiğine ait bir kavramdır."}, {"q": "17. ve 18. yüzyıllardaki çalışma hayatına ilişkin aşağıdaki ifadelerden hangisi kaynakla uyumludur?", "opts": [{"t": "Ekonomi, din ve ahlak arasında yakın ilişki hakimdir"}, {"t": "Ticaret, Katolik anlayışta en yüce ahlaki ideal sayılmıştır"}, {"t": "Ahlak felsefesinin yerini tamamen hukuk felsefesi almıştır"}, {"t": "İş etiği ayrı bir akademik çalışma alanı haline gelmiştir"}, {"t": "Çalışma ilişkileri dinden bağımsız, laik ilkelere dayanmaktadır"}], "a": 0, "exp": "Kaynak, **17. ve 18. yüzyıllarda** çalışma hayatında **ekonomi, din ve ahlak arasındaki yakın ilişkinin** hakim olduğunu; çalışma ve ahlak anlayışında **Katolik ahlakı** ile Weber'in **Protestan İş Ahlakı**'nın derin izleri bulunduğunu söyler. Katolik anlayış ticarete **şüpheyle** bakar; iş etiğinin ayrı alan olması ise 20. yüzyılın son çeyreğine aittir."}, {"q": "Katolik anlayışta çalışma ve ticarete bakış için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Çalışma bir ceza olarak görülür; ticaret ise kurtuluş yolu olarak teşvik edilir"}, {"t": "Çalışma dini bir idealdir; ticarete ise ahlaken şüpheyle bakılır"}, {"t": "Ticari başarı, kişinin kurtuluşa erdiğinin işareti sayılır"}, {"t": "Boş zaman yerine çalışma süresinin artırılması ana ilkedir"}, {"t": "Çalışma ve ticaret eşit derecede kutsal kabul edilir"}], "a": 1, "exp": "Kaynağa göre **Katolik anlayışta** dini açıdan **çalışma bir ideal** olarak benimsenmekle birlikte, ahlaki bakımdan **ticarete ve ticari ilişkilere şüpheyle** bakılmaktadır (Aras, 2001). Boş zaman yerine çalışma süresinin artırılması **Protestan iş ahlakına** ait bir özelliktir."}, {"q": "Aşağıdakilerden hangisi Weber tarafından ortaya konan Protestan iş ahlakı anlayışının özelliklerinden biri <b>değildir</b>?", "opts": [{"t": "Boş zaman yerine çalışma süresinin artırılmasının tercih edilmesi"}, {"t": "Öngörülmüş hedeflerin başarılmasında yaratıcılık"}, {"t": "Kaynakların korunması"}, {"t": "Ticari ilişkilere ahlaki bakımdan şüpheyle bakılması"}, {"t": "Her türlü savurganlık ve tembellikten kaçınılması"}], "a": 3, "exp": "**Protestan iş ahlakında** çok çalışma inancı, hedeflerin başarılmasında **yaratıcılık**, din ve ahlak inancı öne çıkar; **savurganlık ve tembellikten kaçınma**, **kaynakları koruma** ve **boş zaman yerine çalışma** tercih edilir. Ticarete **şüpheyle bakmak** ise **Katolik** anlayışın özelliğidir.\n💡 Kaynak ayrıca bu yıllarda pek çok insan için çok çalışma ve itaatkarlığın alternatifinin **aç kalmak** olduğunu hatırlatır."}, {"q": "Kaynağa göre 17.–18. yüzyıllarda pek çok insan için \"çok çalışma ve itaatkar olmanın\" alternatifi neydi?", "opts": [{"t": "Aç kalmak"}, {"t": "Göç etmek"}, {"t": "Topraksız kalmak"}, {"t": "Dini cezaya çarptırılmak"}, {"t": "Hapse girmek"}], "a": 0, "exp": "Kaynak, Protestan iş ahlakını anlatırken bu yıllarda insanların pek çoğu için **çok çalışma ve itaatkar olmanın alternatifinin aç kalmak** olduğu gerçeğinin gözden kaçırılmaması gerektiğini vurgular (Abbas vd., 2001). Yani çalışkanlık yalnızca ahlaki bir tercih değil, aynı zamanda bir zorunluluktu."}, {"q": "İş dünyasında iş ahlakına ilişkin değerlerin oluşumunda rol oynayan etkenler arasında kaynakta aşağıdakilerden hangisi sayılmamıştır?", "opts": [{"t": "Kültürel normlar"}, {"t": "Sosyal çevre"}, {"t": "Coğrafi konum"}, {"t": "Dini inanışlar"}, {"t": "Aile"}], "a": 2, "exp": "Kaynağa göre iş ahlakına ilişkin değerlerin oluşumunda **aile, sosyal çevre, dini inanışlar ve kültürel normlar** gibi etkenler rol oynar. **Coğrafi** bir etken sayılmamıştır.\n💡 Bölüm sonu sorusunda da iş etiğinin gelişiminde \"coğrafik\" etken diğerleri (toplumsal, politik, ekonomik, yönetsel) arasında yer almayan şıktır."}, {"q": "Torlak'ın (2009) sıraladığı iş ahlakı değerlerine ilişkin aşağıdakilerden hangileri kaynakta yer alır?<br>I. Çevresine ve topluma fayda sağlama (istihdam oluşturma, yardımlaşma)<br>II. Kendisine ve ailesine fayda sağlama (geçim temin etme, ailesine yük olmama)<br>III. Grup çıkarlarını koruma<br>IV. Kişisel çıkarlarla örgütsel ve toplumsal çıkarları birlikte gözetebilme", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 4, "exp": "Torlak'ın listesindeki yedi değer: **çevresine ve topluma fayda**, **kendisine ve ailesine fayda**, **grup çıkarlarını koruma**, **ilkeli olma** (dini inanış, kültürel değer, örf ve adetlere bağlılık), **kişisel çıkarlarla örgütsel ve toplumsal çıkarları birlikte gözetebilme**, **adil ve dürüst olma, kendi haklarını koruyabilme**, **sorumluluklarını yerine getirme, sözünde durma, sözleşmelere riayet etme**. Dolayısıyla dört öncülün tümü listededir."}, {"q": "“Sözünde durma ve sözleşmelere riayet etme” Torlak'ın sıraladığı iş ahlakı değerlerinde hangi değerle birlikte anılır?", "opts": [{"t": "Sorumluluklarını yerine getirme"}, {"t": "Kendi haklarını koruyabilme"}, {"t": "Grup çıkarlarını koruma"}, {"t": "Örf ve adetlere bağlılık gösterme"}, {"t": "Ailesine yük olmama"}], "a": 0, "exp": "Listede son madde **\"Sorumluluklarını yerine getirme, sözünde durma, sözleşmelere riayet etme\"** şeklindedir. \"Kendi haklarını koruyabilme\" **adil ve dürüst olma** ile; \"örf ve adetlere bağlılık\" **ilkeli olma** ile; \"ailesine yük olmama\" ise **kendisine ve ailesine fayda sağlama** ile birlikte geçer."}, {"q": "Özgener'e (2009) göre iş etiği özellikle neye odaklanmaktadır?", "opts": [{"t": "Toplumda çalışmaya ne kadar değer verildiğinin ölçülmesine"}, {"t": "Bilim insanlarının araştırma özgürlüğünün korunmasına"}, {"t": "Ahlaki standartların işletme politikalarına, kurumlara ve davranışlara uygulanmasına"}, {"t": "Kamu görevlilerinin davranışlarının yasalarla dışsal denetimine"}, {"t": "Yöneticilerin örgüt kültürünü kendi kişisel çıkarları ve kariyer hedefleri doğrultusunda şekillendirmesine"}], "a": 2, "exp": "Kaynağa göre iş etiği, **ahlaki standartların işletme politikalarına, kurumlara ve davranışlarına nasıl uygulanacağı** üzerine odaklanır; ayrıca mal ve hizmetlerin üretimi ve dağıtımı sırasında ahlaki standartların örgütle ilgili bireylerin hareketlerine nasıl uygulanacağını ele alır. Çalışmaya verilen değer **çalışma etiğinin**, araştırma özgürlüğü **bilim etiğinin**, dışsal denetim **kamu etiğinin** konusudur."}, {"q": "“Uluslararası iş etiği” kavramını gündeme getiren temel gelişme kaynağa göre hangisidir?", "opts": [{"t": "Protestan iş ahlakının sömürgecilikle birlikte dünyaya yayılması"}, {"t": "UNESCO'nun Biyoetik ve İnsan Hakları Bildirgesi'ni kabul etmesi"}, {"t": "Ahlak felsefesinin yerini hukuk felsefesine bırakması"}, {"t": "Küreselleşmeyle işletmelerin dışa açılması"}, {"t": "Kitle iletişim araçlarının 1970'lerde çeşitlenmesi"}], "a": 3, "exp": "Kaynağa göre **ekonomik ve sosyal yaşamın küreselleşmesi** ile birlikte **işletmelerin dışa açılması**, etik açıdan da **uluslararası iş etiği** kavramını gündeme getirmiştir; kültürel farklılaşmaların ticarete yansıdığı gibi etik alana da yansıması kaçınılmaz olmuştur."}, {"q": "Uluslararası iş etiği alanı genel olarak neyi konu edinir?", "opts": [{"t": "Farklı ülkelerin resmi tatil ve yıllık çalışma günü sayılarının birbiriyle karşılaştırılmasını"}, {"t": "İki ya da daha fazla ülkenin etik unsurlarının kültürlerarası karşılaştırılmasını"}, {"t": "Çok uluslu şirket yöneticilerinin kişisel ahlaki gelişimini"}, {"t": "Uluslararası kuruluşların kamu görevlilerine yönelik yasal düzenlemelerini"}, {"t": "Tek bir ülkedeki işletmelerin fonksiyon bazında etik kodlarını"}], "a": 1, "exp": "Kaynağa göre uluslararası iş etiği, genel olarak **kültürlerarası araştırmaları** içeren ve bu araştırmalarda **iki ya da daha fazla ülkenin etik unsurlarının karşılaştırılmasını** konu edinen bir alandır."}, {"q": "Aşağıdakilerden hangisi kaynakta uluslararası iş etiğinin cevap aradığı sorulardan biri <b>değildir</b>?", "opts": [{"t": "Farklı ülkelerde uluslararası işletmeciliği ve ekonomiyi yönlendiren benzer etik normlar var mıdır?"}, {"t": "İşletmeler farklı ülkelerde faaliyet gösterdiklerinde kendi etik normlarını mı kullanacaklardır?"}, {"t": "Etik normlar konusunda ülkeler arasında farklılık var mıdır?"}, {"t": "İşletmeler farklı ülkelerde faaliyet gösterdiklerinde ilgili ülkenin etik normlarını mı kullanacaklardır?"}, {"t": "Uluslararası işletmelerde yöneticiler hangi liderlik tarzını benimsemelidir?"}], "a": 4, "exp": "Yeşil'e (2011) göre uluslararası iş etiği üç soruya cevap arar: (1) Farklı ülkelerde **benzer etik normlar** var mıdır? (2) Ülkeler arasında etik normlarda **farklılık** var mıdır? (3) İşletmeler başka ülkelerde **kendi** etik normlarını mı, yoksa **ilgili ülkenin** etik normlarını mı kullanacaktır? Liderlik tarzı kaynakta geçmez.\n💡 Kodlama: **Benzerlik – Farklılık – Kimin normu?**"}, {"q": "Bir Türk inşaat şirketi Afrika'daki bir ülkede ihale almıştır. Şirket yönetimi \"Burada Türkiye'deki etik kodlarımızı mı uygulayacağız, yoksa bu ülkenin iş dünyasındaki etik normlara mı uyacağız?\" sorusunu tartışmaktadır. Bu tartışma hangi alanın temel sorularından biridir?", "opts": [{"t": "Bilimsel etik"}, {"t": "Çalışma etiği"}, {"t": "Kamu etiği"}, {"t": "Uluslararası iş etiği"}, {"t": "Yönetim etiği"}], "a": 3, "exp": "\"İşletmeler farklı ülkelerde faaliyet gösterdiklerinde **kendi etik normlarını mı**, yoksa **ilgili ülkenin etik normlarını mı** kullanacaklardır?\" sorusu kaynakta doğrudan **uluslararası iş etiğinin** cevap aradığı sorular arasında sayılmıştır."}, {"q": "Kaynağın vardığı sonuca göre iş etiği, bir işin hangi şekilde yapılıp yapılmamasıyla ilgilenir?", "opts": [{"t": "Rakiplerin uyguladığı yöntemlerle aynı biçimde"}, {"t": "Yalnızca yasaların izin verdiği en kârlı yöntemlerle"}, {"t": "İş dünyasınca kabul edilen, toplumca benimsenen yöntemlerle"}, {"t": "Dini değerlerin ve geleneklerin öngördüğü, kuşaktan kuşağa aktarılan yöntemlerle"}, {"t": "İşverenin belirlediği iç yönetmeliklere uygun yöntemlerle"}], "a": 2, "exp": "Kaynakta sonuç olarak iş etiğinin, bir iş yapılırken **o işin iş dünyasının kabul edeceği ve toplumun benimseyeceği yöntemlerle** yapılıp yapılmamasıyla ilgilendiği belirtilir."}, {"q": "Kılınç ve Ağraş'a (2010) göre iş etiği, çalışma hayatının hangi aktörleri arasındaki ilişkilerin nasıl kurulması gerektiğini araştırır?", "opts": [{"t": "Çalışanlar, hissedarlar, paydaşlar ve rakipler"}, {"t": "Yalnızca işveren ile işçiler ve sendikalar"}, {"t": "Hekimler ile hastalar ve hasta yakınları"}, {"t": "Medya kuruluşları ile okuyucular ve izleyiciler"}, {"t": "Devlet ile kamu görevlileri ve vatandaşlar"}], "a": 0, "exp": "Kaynağa göre iş etiği, çalışma hayatının aktörleri olan **çalışanlar, hissedarlar ve diğer paydaşlar ile rakipler** arasındaki ilişkilerin nasıl kurulması gerektiğini araştırır. Hekim–hasta ilişkisi **tıp etiğinin**, devlet–kamu görevlisi ilişkisi **kamu etiğinin** alanıdır."}, {"q": "Kaynağa göre iş etiği, aşağıdaki etik türlerinden hangisini kapsamına almaz?", "opts": [{"t": "Meslek etiği"}, {"t": "Bilimsel etik"}, {"t": "İşletme etiği"}, {"t": "Çalışma etiği"}, {"t": "Yönetim etiği"}], "a": 1, "exp": "Kaynak, **iş etiğinin meslek etiğini, işletme etiğini, yönetim etiğini ve çalışma etiğini kapsadığını** açıkça belirtir. **Bilimsel etik** ise kamu, iletişim ve tıp etiğiyle birlikte **\"Diğer Uygulamalı Etik Türleri\"** başlığı altında ele alınır.\n💡 İş etiğinin şemsiyesi: **M-İ-Y-Ç** (Meslek, İşletme, Yönetim, Çalışma)."}, {"q": "Geleneksel anlamda mesleki etiğin temelinde yatan düşünce hangisidir?", "opts": [{"t": "Meslek mensuplarının ekonomik çıkarlarının korunması"}, {"t": "Meslek örgütlerinin devlet karşısında güç kazanması"}, {"t": "Mesleğin yasalara uygun biçimde icra edilip edilmediğinin devletçe denetlenmesi"}, {"t": "Meslek sahiplerinin toplumdaki statülerini yükseltmesi"}, {"t": "Meslek sahiplerinin, mesleklerini icra ederek ihtiyaç duyanlara hizmet etmesi"}], "a": 4, "exp": "Kaynağa göre geleneksel anlamda mesleki etiğin temelinde, meslek sahiplerinin **mesleklerini yerine getirmek suretiyle kendilerine ihtiyaç duyanlara hizmet etmesi** düşüncesi yatar. Bu nedenle hizmette öncelik **hizmete ihtiyaç duyandır**; hizmet, hizmeti sunanın çıkarından çok hizmete ihtiyacı olanın çıkarına dayanmalıdır."}, {"q": "Kaynakta mesleki etiği açıklamak için verilen \"doktor\" örneğinin vurguladığı ilke hangisidir?", "opts": [{"t": "Doktor hastasından hiçbir koşulda ücret almamalıdır"}, {"t": "Doktor hastaya baktıktan sonra ücretini meslek örgütüne bildirmelidir"}, {"t": "Para için hasta bakılmaz; hastaya bakıldığı için para kazanılır"}, {"t": "Doktor ücretini hastanın ekonomik durumuna göre belirlemelidir"}, {"t": "Doktor yalnızca uzmanlık alanındaki hastalara bakmalıdır"}], "a": 2, "exp": "Arslan'a (2005) dayanan örnekte **\"bir doktor, para kazanmak için hasta bakmamalıdır, hastaya baktığı için para kazanmalıdır\"** denir. Bu, mesleki etikte **hizmetin, hizmeti sunanın değil hizmete ihtiyacı olanın çıkarına dayanması** ilkesini somutlaştırır."}, {"q": "MEGEP'e (2011) göre \"belirli bir meslek grubunun, meslek üyelerine emreden, onları belli kurallarla davranmaya zorlayan, kişisel eğilimlerini sınırlayan, yetersiz ve ilkesiz üyeleri meslekten dışlayan, mesleki rekabeti düzenleyen ve hizmet ideallerini korumayı amaçlayan ilkeler\" hangi kavramın tanımıdır?", "opts": [{"t": "Çalışma etiği"}, {"t": "Uluslararası iş etiği"}, {"t": "İşletme etiği"}, {"t": "Yönetim etiği"}, {"t": "Mesleki etik"}], "a": 4, "exp": "Bu tanım kaynakta MEGEP'ten aktarılan **mesleki etik** tanımıdır. İşletme etiği **etik kuralların işletme davranışlarına uygulanması**; çalışma etiği **toplumda işe ve çalışmaya yönelik tavırlar**; yönetim etiği **yöneticilere yol gösterecek davranış biçimleri** olarak tanımlanır."}, {"q": "Aşağıdakilerden hangisi kaynakta (MEGEP) sayılan mesleki etik ilkelerinden biri <b>değildir</b>?", "opts": [{"t": "Tutumluluk"}, {"t": "Yeterlilik"}, {"t": "Yasallık"}, {"t": "Doğruluk"}, {"t": "Mesleğe bağlılık"}], "a": 0, "exp": "Kaynakta sayılan mesleki etik ilkeleri: **Doğruluk, Yasallık, Yeterlilik, Güvenirlilik, Mesleğe Bağlılık**. \"Tutumluluk\" bu ilkeler arasında yer almaz (savurganlıktan kaçınma Protestan iş ahlakına ait bir özelliktir).\n💡 Kodlama: **D-Y-Y-G-M** → \"**D**oğru **Y**asal **Y**eterli **G**üvenilir **M**eslek\".\n⚠️ Bölüm sonu sorusunda yalnızca dördü (Doğruluk, Yeterlilik, Güvenirlilik, Mesleğe Bağlılık) şıkta verilmiştir; metinde ise Yasallık da ilkedir."}, {"q": "“Bütün meslek sahiplerinin çalışmalarının her safhasında dürüst olması, meslektaşların kurdukları ilişkilerin ve kurum dışındaki temaslarının samimi olması ve yürütülen bütün faaliyetlerde güven ortamı sağlanması” hangi mesleki etik ilkesini ifade eder?", "opts": [{"t": "Yeterlilik"}, {"t": "Doğruluk"}, {"t": "Güvenirlilik"}, {"t": "Mesleğe bağlılık"}, {"t": "Yasallık"}], "a": 1, "exp": "Dürüstlük, samimiyet ve faaliyetlerde güven ortamı sağlanması **doğruluk** ilkesinin içeriğidir. Sık karıştırılan **güvenirlilik** ilkesi ise mesleğin kendine özgü etik değerlerine uyarak **mesleğin toplumdaki imajını korumak** ve geleceğini güvence altına almakla ilgilidir."}, {"q": "İş yaşamında üretim alanını ve çalışma hayatını düzenleyen yasalara bağlı kalmak hangi mesleki etik ilkesi kapsamındadır?", "opts": [{"t": "Yeterlilik"}, {"t": "Güvenirlilik"}, {"t": "Mesleğe bağlılık"}, {"t": "Yasallık"}, {"t": "Doğruluk"}], "a": 3, "exp": "Kaynağa göre günümüzde iş yaşamında gerek üretim alanını gerekse çalışma hayatını düzenleyen yasalar mevcuttur; **bu yasalara bağlı kalmak** da mesleki etik ilkelerindendir → **Yasallık**."}, {"q": "Mesleki etik ilkelerinden \"yeterlilik\"in etik bir boyuta sahip olmasının gerekçesi kaynakta nasıl açıklanmıştır?", "opts": [{"t": "Yeterli olmayan üyelerin meslekten atılması meslek örgütlerinin görevidir"}, {"t": "Yeterlilik, çalışma hayatını düzenleyen yasalarla zorunlu tutulduğu için etik bir yükümlülüktür"}, {"t": "Kişiye toplumda \"uzman/yeterli kişi\" kimliği kazandırdığından, sürdürülmesi toplumsal yarar sağlar"}, {"t": "Yeterlilik, kişinin işini sevmesini sağlayarak verimliliği artırır"}, {"t": "Yeterlilik, meslek mensubunun daha yüksek ücret almasını sağladığı için etiktir"}], "a": 2, "exp": "Yeterlilik; gelişmeleri **takip etmek, kendini yenilemek, iş hayatına uyarlamak** demektir. Mesleki boyut kişiye toplumda **\"uzman\", \"yetkili\", \"yeterli kişi\"** kimliği kazandırdığı için **yeterliliğin devamı toplumsal bir yarar** sağlar ve bu yüzden etik boyutu vardır. Yetersiz üyeleri meslekten ayırmak **güvenirlilik**; işini sevme ve verimlilik **mesleğe bağlılık** ile ilgilidir."}, {"q": "Mesleki etik ilkelerinden \"güvenirlilik\" için kaynakta yapılması gerekenler olarak sayılanlar hangileridir?<br>I. Yetersiz ve ilkesiz üyeleri meslekten ayırmak<br>II. Meslek içi rekabeti düzenlemek<br>III. Mesleğin ideallerini korumak<br>IV. Meslektaşların mesleki gelişimine katkıda bulunmak", "opts": [{"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "I ve IV"}, {"t": "II, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 1, "exp": "**Güvenirlilik** için yapılması gerekenler: (1) **yetersiz ve ilkesiz üyeleri meslekten ayırmak**, (2) **meslek içi rekabeti düzenlemek**, (3) **mesleğin ideallerini korumak**. Böylece mesleğin toplumdaki imajı korunur ve geleceği garanti altına alınır. Meslektaşların gelişimine katkı (IV) ise **mesleğe bağlılık** ilkesinde geçer."}, {"q": "Bir paramedik, kendi eğitim olanaklarından yararlanmakla kalmayıp istasyondaki yeni başlayan meslektaşlarına da vaka sonrası değerlendirme ve beceri eğitimi vermektedir. İşini severek ve huzurlu bir ortamda çalışmaktadır. Bu tutum en çok hangi mesleki etik ilkesiyle örtüşür?", "opts": [{"t": "Mesleğe bağlılık"}, {"t": "Doğruluk"}, {"t": "Güvenirlilik"}, {"t": "Yasallık"}, {"t": "Yeterlilik"}], "a": 0, "exp": "**Mesleğe bağlılık**: kişinin yaptığı işi önemsemesi ve en iyi şekilde yapmaya çalışması; sürekli kendini geliştirmesi, eğitim olanaklarından yararlanması ve **meslektaşlarının mesleki gelişimine katkıda bulunması**. Mesleğe bağlılık kişinin **işini sevmesine** ve huzurlu ortamda çalışmasına katkı sağlar, bu da **verimliliği artırır**. Yeterlilik daha çok kişinin kendini gelişmelere uyarlamasıyla ilgilidir; meslektaşlara katkı vurgusu mesleğe bağlılığa aittir."}, {"q": "Arslan'a (2005) göre \"bir toplumda işe ve çalışmaya yönelik tavırlar ve davranışlar\" olarak anlaşılan ve çalışmaya ne kadar değer verildiğiyle ilgili olan etik türü hangisidir?", "opts": [{"t": "Meslek etiği"}, {"t": "Yönetim etiği"}, {"t": "İş etiği"}, {"t": "İşletme etiği"}, {"t": "Çalışma etiği"}], "a": 4, "exp": "Tanım **çalışma etiğine** aittir. Çalışma etiği, iş etiğinden farklı olarak **çalışmayı sevip sevmemekle** ilgilidir (bölüm özeti).\n⚠️ İş etiği ile çalışma etiği sık karıştırılır: iş etiği işin **etik ilkelere uygun yapılması**, çalışma etiği **çalışmaya verilen değer**dir."}, {"q": "Aşağıdakilerden hangisi kaynakta çalışma etiğinin göstergeleri arasında sayılmamıştır?", "opts": [{"t": "Çalışmaktan kaytarılıp kaytarılmaması"}, {"t": "Çalışmanın sevilip sevilmemesi"}, {"t": "Çalışma ile boş zaman arasındaki tercih"}, {"t": "Mesleki rekabeti düzenleyen kuralların varlığı"}, {"t": "İş seçerken tatil süresinin uzunluğu ve işin rahatlığından yola çıkılması"}], "a": 3, "exp": "Çalışma etiğinin göstergeleri: **çalışmanın sevilip sevilmemesi, kaytarma, çalışma–boş zaman tercihi**; iş seçiminde **tatil süresinin uzun olması, izin sürelerinin olması, işin rahat olması** gibi özelliklerden yola çıkılması. Mesleki rekabetin düzenlenmesi **mesleki etik/güvenirlilik** ile ilgilidir."}, {"q": "Kaynakta çalışma etiğinin toplumsal olarak da kendini gösterdiğine örnek olarak hangisi verilmiştir?", "opts": [{"t": "Sendikaların her yıl toplu sözleşme döneminde grev kararı alması"}, {"t": "Meslek örgütlerinin yıllık etik raporları yayımlaması"}, {"t": "Gazetelerde her yıl kaç gün resmi tatil olacağının duyurulması"}, {"t": "Devletin kamu görevlileri için etik sözleşme imzalatması"}, {"t": "İşletmelerin etik kodlarını internet sitelerinde yayımlaması"}], "a": 2, "exp": "Kaynakta, ülkemizde **her yeni yılda gazetelerde \"Bu yıl bu kadar resmi tatil yapılacak\"** şeklinde çalışılmayacak günlerin sayısının verilmesi, çalışma etiğinin **toplumsal göstergesi** olarak örneklenmiştir.\n💡 Toplumun tatil günlerini merakla saymasının \"çalışmaya verilen değer\"i yansıttığı düşünülür."}, {"q": "“Etik kuralların işletme davranışlarına uygulanması” olarak ifade edilen ve etik kuralların yalnızca işletmeler için geçerli ve onlara özel olmasından doğan etik türü hangisidir?", "opts": [{"t": "Meslek etiği"}, {"t": "İşletme etiği"}, {"t": "Çalışma etiği"}, {"t": "Kamu etiği"}, {"t": "Yönetim etiği"}], "a": 1, "exp": "Tak'a (2011) göre **işletme etiği**, etik kuralların işletme davranışlarına uygulanmasıdır ve etik kuralların **sadece işletmeler için geçerli ve onlara özel** olmasından doğar. Böylece işletmede çalışan bireylerin tek tek etik değerlerinden (**çalışma etiği, meslek etiği**) ayrı olarak **işletmenin kendine özgü etik değerleri** söz konusudur."}, {"q": "Kaynağa göre işletmelerin üretim, pazarlama, muhasebe, insan kaynakları yönetimi gibi fonksiyonlarına paralel olarak sahip olduğu etik ilkeler günümüzde nasıl adlandırılmaktadır?", "opts": [{"t": "Biyoetik ilkeler"}, {"t": "Meslek ilkeleri"}, {"t": "Kurumsal yasalar"}, {"t": "Etik kodlar"}, {"t": "Yönetsel normlar"}], "a": 3, "exp": "İşletmelerin etik değerleri **fonksiyonlarına yayılmıştır**; üretim, pazarlama, muhasebe, insan kaynakları vb. her fonksiyon için farklı etik ilkeler geliştirilmiştir. Bu ilkeler günümüzde **\"etik kodlar\"** olarak ifade edilir."}, {"q": "Kaynağa göre işletmeler etik kodları vasıtasıyla aşağıdaki alanlardan hangisinde çalışma yaptığı belirtilmemiştir?", "opts": [{"t": "Tüketicinin korunması"}, {"t": "Çevreye zarar verilmemesi"}, {"t": "Çalışanlara ayrımcılık yapılmaması"}, {"t": "Hissedarlara ve devlete karşı sorumlulukların yerine getirilmesi"}, {"t": "Rakip firmaların pazar payının sınırlandırılması"}], "a": 4, "exp": "İşletmeler etik kodlarıyla **tüketicinin korunması, hissedarlara ve devlete karşı sorumlulukların yerine getirilmesi, çalışanlara ayrımcılık yapılmaması ve çevreye zarar verilmemesi** yönünde çalışır. Rakiplerin pazar payını sınırlamak etik kodların amacı olarak sayılmamıştır."}, {"q": "Kaynağa göre etik davranışlarda bulunmayan işletmeleri bekleyen sonuç hangisidir?", "opts": [{"t": "Kötü imaj nedeniyle pazar payı kaybı ve rekabet edememe"}, {"t": "Hissedarlarının işletmeyi terk ederek tasfiye istemesi"}, {"t": "Tabip odası gibi meslek örgütlerince onur kuruluna sevk edilmeleri"}, {"t": "Devlet tarafından mahkeme kararı aranmaksızın doğrudan kapatılmaları"}, {"t": "Çalışanlarının tamamının toplu olarak istifa etmesi"}], "a": 0, "exp": "Kaynağa göre işletmeler etik davranmak zorunda olduklarının farkındadır; çünkü etik davranmayan işletmeler **toplumsal anlamda kötü bir imaja** sahip olur, **pazar paylarını kaybeder ve rekabet edemez**. Onur kuruluna sevk, hekimler için Hekimlik Meslek Etiği Kuralları'ndaki disiplin yoludur."}, {"q": "Filizöz'e (2011) göre \"genel olarak yöneticilere işlerinde onlara yol gösterecek davranış biçimleri\" olarak tanımlanan etik türü hangisidir?", "opts": [{"t": "Yönetim etiği"}, {"t": "Kamu etiği"}, {"t": "İş etiği"}, {"t": "İşletme etiği"}, {"t": "Meslek etiği"}], "a": 0, "exp": "Bu tanım **yönetim etiğine** aittir. Yönetim etiği, etiğin yönetimle ilişkilendirildiği ve **yönetim fonksiyonlarının etik boyutunun** ele alındığı alandır. Ayrıca yöneticilerin **örgüt kültürünü etik ilkeler doğrultusunda inşa etmesi** de yönetim etiğinin konusudur."}, {"q": "Yönetim etiğine ilişkin aşağıdaki ifadelerden hangileri doğrudur?<br>I. Yönetim fonksiyonlarının etik boyutunu ele alır.<br>II. Yöneticilerin örgüt kültürünü etik ilkeler doğrultusunda inşa etmesi de konusudur.<br>III. Hem \"yönetimin etiği\" hem de \"etiğin yönetimi\" yönetim ile etik kavramlarını kesiştirir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve III"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Üç ifade de kaynakta yer alır: yönetim etiği **yönetim fonksiyonlarının etik boyutunu** ele alır; **örgüt kültürünün etik ilkelerle inşası** onun konusudur; **\"yönetimin etiği\" ve \"etiğin yönetimi\"** yönetim ile etik kavramlarını kesiştirir.\n💡 Kelime oyunu: yönetimin **etiği** (yöneticinin etik davranması) + etiğin **yönetimi** (örgütte etiğin yönetilmesi)."}, {"q": "Kaynağa göre kamu görevlilerinin davranışlarında rol oynayan iki temel etken hangileridir?", "opts": [{"t": "Hiyerarşi ve disiplin cezaları"}, {"t": "Etik kodlar ve meslek örgütleri"}, {"t": "Yasalar ve etik değerler"}, {"t": "Yasalar ve dini inançlar"}, {"t": "Kamu yararı ve kişisel çıkar"}], "a": 2, "exp": "Kaynağa göre kamu görevlilerinin davranışlarında iki temel etken rol oynar: **yasalar** ve **etik değerler**. Yasalar davranışı **dışsal**, etik değerler ise **içsel** olarak yönetir ve denetler."}, {"q": "Kamu görevlilerinin davranışlarının belirlenmesinde yasalar ile etik değerlerin rolü için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Her ikisi de davranışı yalnızca dışsal olarak denetler"}, {"t": "Yasalar yalnızca kamu görevlisinin bireysel ahlaki değerlerini yansıtır"}, {"t": "Etik değerler kamu görevlisini kamu yararına zorlayan dış kurallardır"}, {"t": "Yasalar davranışı dışsal olarak, etik değerler ise içsel olarak belirler ve denetler"}, {"t": "Yasalar davranışı içsel olarak, etik değerler ise dışsal olarak belirler"}], "a": 3, "exp": "**Yasalar** kamu görevlilerinin davranışını **dışsal** olarak belirler ve denetler; dıştan belirlemede rol oynayan yasalar ve kurallar kamu görevlilerini **kamu yararı** doğrultusunda eylemde bulunmaya **zorlar**. **Etik değerler** ise davranışı **içsel** olarak yönetir ve denetler.\n💡 **Y**asa → **D**ış; **E**tik → **İ**ç."}, {"q": "Kamu görevlilerinin davranışlarının içsel belirleyicisi esas alındığında, kamu yönetimi etiği nasıl tanımlanır?", "opts": [{"t": "Kamu çalışanının her türlü davranışını yasalara, etik kodlara ve çeşitli kurallara göre yapması"}, {"t": "Kamu görevlilerinin eylemlerini bireysel ahlaki değerleri referans alarak yapması"}, {"t": "Kamu görevlilerinin üstlerinden aldıkları emirleri sorgulamadan yerine getirmesi"}, {"t": "Kamu görevlilerinin davranışlarının disiplin kurullarınca denetlenmesi"}, {"t": "Kamu kaynaklarının yalnızca yasal sınırlar içinde harcanması"}], "a": 1, "exp": "Özdemir'e (2007) göre iki bakış vardır: **dışsal** bakışta kamu yönetimi etiği, kamu çalışanının davranışlarını **yasalara, etik kodlara ve çeşitli kurallara** göre yapmasıdır; **içsel** bakışta ise kamu görevlilerinin eylemlerini **bireysel ahlaki değerleri referans alarak** yapmasıdır. Çeldiricideki ilk tanım dışsal bakışa aittir."}, {"q": "“Kamu Görevlisinin Emanetleri” şemasında yer alan kavramlarla açıklamaları eşleştirildiğinde aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Kamu yararı – Hiç kimsenin ve herkesin olan taşınır ve taşınmaz mallar"}, {"t": "Kamu zamanı – Devlet otoritesinin kamu görevlisine vatandaşlar üzerinde güç kullanma hakkı vermesi"}, {"t": "Kamu kaynağı – Birey ve toplum çıkarlarının yarıştığı durumlarda tercih edilen üst yarar"}, {"t": "Kamu gücü – Devletin verdiği unvanların kamu görevlilerini yerine getirme hak ve sorumluluklarını belirlemesi"}, {"t": "Kamu yetkisi – Üstlerin astlara emir verebilme ve onların davranışlarını yönlendirme hakkı"}], "a": 4, "exp": "Şemadaki eşleşmeler: **Kamu yararı** → birey ve toplum çıkarlarının yarıştığı durumlarda tercih edilen üst yarar; **Kamu gücü** → devlet otoritesi, kamu görevlisine sıradan vatandaşlar üzerinde güç kullanma hakkı verir; **Kamu güveni** → kamu hizmeti, kamu güveni demektir; **Kamu yetkisi** → üstlerin astlara emir verebilme ve davranışlarını yönlendirme hakkı; **Kamu kaynağı** → hiç kimsenin ve herkesin olan taşınır/taşınmaz mallar (kamu malı); **Kamu unvanı** → devletin verdiği unvanlar, görevlerin hak ve sorumluluklarını belirler; **Kamu zamanı** → kamu hizmeti için kullanılacak zamanda kişisel işler görülemez."}, {"q": "Bir kamu hastanesinde çalışan memur, mesai saatlerinde bankaya giderek kendi kredi işlemlerini yapmakta ve şahsi alışverişlerini halletmektedir. Bu davranış \"Kamu Görevlisinin Emanetleri\"nden en doğrudan hangisinin ihlalidir?", "opts": [{"t": "Kamu unvanı"}, {"t": "Kamu kaynağı"}, {"t": "Kamu gücü"}, {"t": "Kamu zamanı"}, {"t": "Kamu yetkisi"}], "a": 3, "exp": "Şemaya göre **kamu zamanı**: **kamu hizmeti için kullanılacak zamanlarda kişisel işler görülemez.** Kamu kaynağı ise kamu malı (taşınır/taşınmaz mallar) ile ilgilidir; örneğin resmi aracı özel işte kullanmak kamu kaynağı emanetinin ihlali olurdu."}, {"q": "“Kamu Görevlisinin Emanetleri” şemasında \"hiç kimsenin ve herkesin olan taşınır ve taşınmaz mallar\" olarak tanımlanan emanet hangisidir?", "opts": [{"t": "Kamu kaynağı"}, {"t": "Kamu unvanı"}, {"t": "Kamu yararı"}, {"t": "Kamu zamanı"}, {"t": "Kamu güveni"}], "a": 0, "exp": "Şemada **kamu kaynağı**: \"Hiç kimsenin ve herkesin olan taşınır ve taşınmaz mallara **kamu malı** denir.\" Yedi emanet: **kamu yararı, kamu gücü, kamu güveni, kamu yetkisi, kamu kaynağı, kamu unvanı, kamu zamanı**.\n💡 \"Hiç kimsenin ve herkesin\" paradoksu: kamu malı kimsenin özel malı değildir, ama hepimize aittir."}, {"q": "Kamu etiği materyalinde \"bir siyasal sistemin iyi işleyişinin garantilerinden birisi\" olarak gösterilen durum hangisidir?", "opts": [{"t": "Etik kuralların yalnızca üst düzey yöneticilere uygulanması"}, {"t": "Etik bilincin devlet yönetiminde en tepeden en aşağıya kadar var olması"}, {"t": "Yasaların kamu görevlilerinin tüm davranışlarını ayrıntılı biçimde düzenlemesi"}, {"t": "Kamu görevlilerine geniş kamu gücü ve yetkisi tanınması"}, {"t": "Kamu görevlilerinin yalnızca üstlerinin emirlerine uygun davranması"}], "a": 1, "exp": "Materyalde: **\"Etik bilincin devlet yönetiminde en tepeden en aşağıya kadar var olması, bir siyasal sistemin iyi işleyişinin garantilerinden birisidir.\"** Vurgu, etiğin yalnızca üst yönetimde değil **tüm kademelerde** bulunması gerektiğidir."}, {"q": "“Bilim yapan, bilimsel bilgi üreten bilim adamlarının faaliyeti sırasında uyacağı ahlaki talep ve yükümlülükleri ele alan uygulamalı etik dalı” hangisidir?", "opts": [{"t": "İletişim etiği"}, {"t": "Tıp etiği"}, {"t": "Bilimsel etik"}, {"t": "Yönetim etiği"}, {"t": "Meslek etiği"}], "a": 2, "exp": "Tanım **bilimsel (bilim) etiğe** aittir (Cevizci, 2005). Bilim etiği ayrıca bilim insanının **serbest araştırma, öğretim ve öğrenim hakkının korunmasını** sağlar ve **sorumluluklarını** analiz eder."}, {"q": "Bilim etiğine göre bilim adamının sorumluluğu için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Hem içe hem dışa, kendine ve bütün insanlara karşıdır"}, {"t": "Yalnızca kendi bilimsel vicdanına karşıdır"}, {"t": "Yalnızca devletin bilim politikalarına karşıdır"}, {"t": "Yalnızca bağlı olduğu kuruma karşıdır"}, {"t": "Yalnızca araştırmayı finanse eden kamu veya özel kuruluşa karşıdır"}], "a": 0, "exp": "Kaynağa göre bilim etiğinde bilim adamının sorumluluğu **hem içe hem dışa, hem kendisine hem de bütün insanlara karşıdır**. Sonuç olarak bilim adamları **araştırdıklarının gerçek durumlarının ne olduğunu ortaya çıkarmakla** yükümlüdür."}, {"q": "Kaynağa göre bilim etiğinin, bilim adamlarının \"sınırsız\" olması nedeniyle koruduğu haklar hangileridir?", "opts": [{"t": "Yayın, reklam ve tanıtım hakkı"}, {"t": "Serbest araştırma, öğretim ve öğrenim hakkı"}, {"t": "Patent, telif ve ticari kullanım hakkı"}, {"t": "Grev, toplu sözleşme ve sendika hakkı"}, {"t": "Bilgi edinme, dilekçe ve itiraz hakkı"}], "a": 1, "exp": "Bilim etiği, bilim adamlarının sınırsız olması nedeniyle onun **serbest araştırma, öğretim ve öğrenim hakkının** korunmasını sağlayan ve **sorumluluklarını analiz eden** bir boyuta sahiptir."}, {"q": "İletişim etiği konusundaki araştırmalar hangi gelişmeyle ve hangi dönemde ivme kazanmıştır?", "opts": [{"t": "2005'te UNESCO bildirgesinin kabulüyle"}, {"t": "20. yüzyılın son çeyreğinde iş etiğinin ayrı alan olmasıyla"}, {"t": "1990'larda internetin yaygınlaşmasıyla"}, {"t": "1950'lerde televizyonun yaygınlaşmasıyla"}, {"t": "1970'lerde kitle iletişim araçlarının büyümesi ve çeşitlenmesiyle"}], "a": 4, "exp": "Kaynağa göre **1970'lerde kitle iletişim araçlarının büyümesi ve çeşitlenmesiyle** iletişim etiği araştırmaları ivme kazanmıştır. Bu çerçevede **medya sorumluluğu, medya performansı ve kamusal yarar** sorunları iletişim etiğinin merkezi haline gelmiştir."}, {"q": "Kaynağa göre iletişim etiğinin merkezi haline gelen sorunlar hangileridir?", "opts": [{"t": "Reklam yasağı, haksız rekabet ve tabela boyutları"}, {"t": "Basın özgürlüğü, sansür ve devlet denetimi"}, {"t": "Medya sorumluluğu, medya performansı ve kamusal yarar"}, {"t": "Reyting, tiraj, reklam gelirleri ve yayın kuruluşlarının mülkiyeti"}, {"t": "Telif hakkı, intihal ve kaynak gösterme"}], "a": 2, "exp": "Kieran'a (2000) dayanılarak **medya sorumluluğu, medya performansı ve kamusal yarar** sorunlarının iletişim etiğinin merkezi haline geldiği belirtilir. Reklam yasağı ve tabela boyutları Hekimlik Meslek Etiği Kuralları'nın 11. maddesine aittir."}, {"q": "Kaynağa göre medya çalışanlarının olan biteni doğru aktarabilmesinin ve olayları doğru değerlendirebilmesinin temelinde ne yatar; bunu sağlamanın yollarından biri nedir?", "opts": [{"t": "Ekonomik bağımsızlıkları; reklam gelirlerinin artırılması"}, {"t": "Kurumsal hiyerarşileri; editör denetiminin sıkılaştırılması"}, {"t": "Teknik ekipmanları; yeni yayın teknolojilerine yatırım yapılması"}, {"t": "Bilgisel ve zihinsel donanım; mesleki etik değerlerin belirlenip yaşama geçirilmesi"}, {"t": "Hukuki güvenceleri; basın yasalarının kapsamının genişletilerek güçlendirilmesi"}], "a": 3, "exp": "Tepe'ye (2000) göre medya çalışanlarının iletme görevini iyi yapabilmesi, olan biteni doğru aktarabilmesine bağlıdır ve bunun temelinde **bilgisel ve zihinsel donanımları** yatar. Uzun'a (2007) göre bu donanımı sağlamanın yollarından biri **mesleğe ilişkin etik değerlerin belirlenerek yaşama geçirilmesidir**."}, {"q": "Bir internet haber sitesinde çalışan muhabirin habercilik faaliyetlerinde uyması gereken etik ilkeler, kaynakta hangi uygulamalı etik türü altında ele alınır?", "opts": [{"t": "Çalışma etiği"}, {"t": "İletişim etiği"}, {"t": "Kamu etiği"}, {"t": "İşletme etiği"}, {"t": "Bilimsel etik"}], "a": 1, "exp": "**İletişim etiği**, iletişimle ilgili mesleklerde çalışanların **meslek etiğini** anlatır; **haber ajansları, gazeteler, radyo ve televizyon kuruluşları ya da internet ortamında** habercilik işiyle uğraşanlar bu kapsamdadır."}, {"q": "Kadıoğlu'na (2007) göre tıp etiği neyle ilgilidir?", "opts": [{"t": "Sağlık profesyonellerinin iyi davranmak için neyi yapıp neden kaçınması gerektiğiyle"}, {"t": "Sağlık kurumlarının pazarlama ve muhasebe fonksiyonlarının etik kodlarıyla"}, {"t": "Hekimlerin uyması gereken yasal düzenlemelerin devlet tarafından dışsal olarak denetlenmesiyle"}, {"t": "Sağlık çalışanlarının çalışmaya verdikleri değer ve tatil tercihleriyle"}, {"t": "Tıbbi araştırmaların finansmanı ve patent haklarıyla"}], "a": 0, "exp": "Tıp etiği, **tıbbi ilişkiler çerçevesinde sağlık profesyonellerinin iyi davranmak adına neleri yapmaları ve nelerden kaçınmaları gerektiği** ile ilgilidir. Farklı bir söyleyişle **tıbbi eylemi düzenleyen kurallarla** ve **tıbba özgü değerler dünyasıyla** ilgilenir."}, {"q": "Tıp etiğine ilişkin aşağıdaki ifadelerden hangileri kaynakla uyumludur?<br>I. Tıbbi eylemlerde neyin \"iyi\", neyin \"kötü\" olduğu ve mutlak iyi/kötünün olup olmayacağı alanın temel sorunlarıdır.<br>II. Tıp etiği yalnızca değer sorunlarıyla karşılaşılan durumlarda ortaya çıkar.<br>III. Her tıbbi eylemin kendince bir etik boyutu vardır.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve III"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "Arda'ya (2004) göre tıbbi eylemlerde **neyin iyi neyin kötü olduğu** ve **mutlak iyi/kötünün** olup olmayacağı temel sorunlardır (I doğru). Kaynak, tıp etiğinin gündelik tıpta ortaya çıkışının **sadece değer sorunlarıyla karşılaşma durumlarıyla sınırlı olmadığını** söyler (II yanlış); **her tıbbi eylemin bir etik boyutu** vardır ve etik bilinç bu boyutu gözden kaçırmamayı sağlar (III doğru)."}, {"q": "Kaynakta (Ülman, 2010) tıp etiğinde değer, ödev, norm ve ilke arasındaki ilişki nasıl açıklanmıştır?", "opts": [{"t": "Değerler ödevlerden bağımsızdır; ilkeler ise yalnızca yasalarla belirlenir"}, {"t": "İlkeler normları doğurur; normlar değerleri, değerler de ödevleri oluşturur"}, {"t": "Ödevler, normların ihlali sonucunda ortaya çıkan ve yasalarla belirlenen yaptırımlardır"}, {"t": "Ödev değerlerin uygulanmasıdır; harekete geçen değerler normları, normlar da ilkeleri oluşturur"}, {"t": "Normlar yasalardır; ilkeler ise yalnızca bireysel değerlerdir"}], "a": 3, "exp": "Kaynağa göre sağlık çalışanlarının verdiği tüm kararlarda **değerler** söz konusudur. **Ödevlerimiz değerlerin uygulanması ya da harekete geçirilmesidir**; **değerlerin harekete geçirilmesi normları oluşturur**; bu **normlar geniş anlamda ilkeler** olarak adlandırılır.\n💡 Sıra: **Değer → Ödev (harekete geçirme) → Norm → İlke**."}, {"q": "“Uluslararası Biyoetik ve İnsan Hakları Bildirgesi” hangi tarihte, hangi kurulda benimsenmiş ve kaç biyoetik ilke içermektedir?", "opts": [{"t": "1 Şubat 1999 – Türk Tabipleri Birliği Büyük Kongresi – 15 ilke"}, {"t": "19 Ekim 2008 – UNESCO Genel Konferansı – 4 ilke"}, {"t": "19 Ekim 2005 – Dünya Sağlık Örgütü Genel Kurulu – 12 ilke"}, {"t": "10 Aralık 1948 – BM Genel Kurulu – 30 ilke"}, {"t": "19 Ekim 2005 – UNESCO Genel Konferansı – 15 ilke"}], "a": 4, "exp": "Bildirge **19 Ekim 2005** tarihinde **UNESCO Genel Konferansı**'nda benimsenmiş ve **15 biyoetik ilke** içermektedir. 01.02.1999 Hekimlik Meslek Etiği Kuralları'nın yayın tarihidir; 4 ilke ise HMEK Madde 6'daki evrensel tıbbi etik ilkeleridir. (2008, kaynakçadaki UNESCO yayınının yılıdır.)"}, {"q": "Aşağıdakilerden hangisi UNESCO Uluslararası Biyoetik ve İnsan Hakları Bildirgesi'nin 15 ilkesi arasında <b>yer almaz</b>?", "opts": [{"t": "Kültürel farklılıklara saygı ve çoğulculuk"}, {"t": "Onam verme yeterliğine sahip olmayan bireylerin rızası"}, {"t": "Mesleki rekabetin düzenlenmesi"}, {"t": "Çevreyi, biyosferi ve canlı çeşitliliğini korumak"}, {"t": "Gelecek kuşakları koruma"}], "a": 2, "exp": "15 ilke: **insan onuru ve insan hakları; yarar ve zarar; özerklik ve birey sorumluluğu; onam; onam verme yeterliğine sahip olmayan bireylerin rızası; bireye ve bütünlüğüne saygı; mahremiyet ve sır; eşitlik, adalet, hakkaniyet; ayrımcılık yapmamak, damgalamamak; kültürel farklılıklara saygı ve çoğulculuk; dayanışma ve işbirliği; toplumsal sorumluluk ve sağlık; ortak yararlar; gelecek kuşakları koruma; çevreyi, biyosferi ve canlı çeşitliliğini korumak.** Mesleki rekabetin düzenlenmesi MEGEP'in mesleki etik (güvenirlilik) ilkesine aittir."}, {"q": "UNESCO Biyoetik Bildirgesi'ndeki \"Onam\" ilkesi kaynakta parantez içinde nasıl açıklanmıştır?", "opts": [{"t": "Hastanın yasal temsilcisinin bilgilendirilmesi"}, {"t": "Hastanın tedaviyi reddetme hakkı"}, {"t": "Hasta bilgilerinin gizli tutulması"}, {"t": "Tedavi için hastanın onayının alınması"}, {"t": "Hastanın hekimini seçme özgürlüğü"}], "a": 3, "exp": "Bildirge ilkelerinden **Onam**, kaynakta **\"(Tedavi için hastanın onayının alınması)\"** şeklinde açıklanmıştır. Onam verme yeterliği olmayan bireyler için ayrı bir ilke (**onam verme yeterliğine sahip olmayan bireylerin rızası**) bulunur."}, {"q": "Hekimlik Meslek Etiği Kuralları hangi yasanın hangi maddesine dayanılarak hazırlanmıştır?", "opts": [{"t": "1219 sayılı Tababet ve Şuabatı San'atlarının Tarzı İcrasına Dair Kanun'un 1. maddesi"}, {"t": "6023 sayılı (Türk Tabipleri Birliği) Yasası'nın 59/g maddesi"}, {"t": "3359 sayılı Sağlık Hizmetleri Temel Kanunu'nun 59. maddesi"}, {"t": "6023 sayılı Türk Tabipleri Birliği Yasası'nın 47. maddesi"}, {"t": "657 sayılı Devlet Memurları Kanunu'nun 59/g maddesi"}], "a": 1, "exp": "Madde 3 (Dayanak): Kurallar **6023 sayılı yasanın 59/g maddesine** dayanılarak hazırlanmıştır. Madde 46'da da aykırı davranan hekimlerin **6023 sayılı Türk Tabipleri Birliği Yasası**'na göre onur kurullarına sevk edileceği belirtilir. 47, kuralların yürürlük maddesinin numarasıdır.\n💡 6023 hem dayanak (59/g) hem disiplin (Md. 46) maddesinde geçer."}, {"q": "Hekimlik Meslek Etiği Kuralları'nın \"Tanımlar\" maddesine göre \"Hekim örgütü\" deyimi neyi ifade eder?", "opts": [{"t": "Türk Tabipleri Birliği'ni"}, {"t": "Sağlık Bakanlığı'nı"}, {"t": "Tabip odası onur kurulunu"}, {"t": "Yükseköğretim Kurulu'nu"}, {"t": "Yerel tabip odasını"}], "a": 0, "exp": "Madde 4: **Bakanlık** → Sağlık Bakanlığı; **Hekim** → tıp doktorları; **Hekim örgütü** → **Türk Tabipleri Birliği**."}, {"q": "Hekimlik Meslek Etiği Kuralları'na (Madde 5) göre hekimin öncelikli görevi nedir?", "opts": [{"t": "Meslek örgütünün belirlediği taban ücreti uygulamak"}, {"t": "Hastanın tüm isteklerini koşulsuz yerine getirmek"}, {"t": "Meslektaşlarını mesleki yönden onur kırıcı ve haksız saldırılara karşı her koşulda korumak"}, {"t": "Yalnızca uzmanlık alanındaki hastaları tedavi etmek"}, {"t": "Hastalıkları önleyip hastaları iyileştirmeye çalışarak yaşamı ve sağlığı korumak"}], "a": 4, "exp": "Madde 5'e göre hekimin **öncelikli görevi**, hastalıkları önlemeye ve bilimsel gerekleri yerine getirerek hastaları iyileştirmeye çalışarak **insanın yaşamını ve sağlığını korumaktır**. Meslek uygulaması sırasında **insan onurunu gözetmesi** de öncelikli ödevidir; bunun için hekim **gelişmeleri yakından izler**."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 6'ya göre hekimin uyması gereken evrensel tıbbi etik ilkeleri hangileridir?", "opts": [{"t": "Yararlılık, zarar vermeme, adalet ve özerklik"}, {"t": "Yararlılık, mahremiyet, eşitlik ve dayanışma"}, {"t": "Zarar vermeme, onam, sır saklama ve yansızlık"}, {"t": "İnsan onuru, özerklik, ortak yararlar ve hakkaniyet"}, {"t": "Doğruluk, yasallık, yeterlilik ve güvenirlilik"}], "a": 0, "exp": "Madde 6: evrensel tıbbi etik ilkeleri **yararlılık, zarar vermeme, adalet ve özerklik** ilkeleridir. Doğruluk, yasallık, yeterlilik, güvenirlilik ise **MEGEP mesleki etik** ilkeleridir.\n💡 Bu dört ilke, tıp etiğinde Beauchamp ve Childress'in \"dört ilke yaklaşımı\" olarak da bilinir."}, {"q": "Bir hekimin hastaları arasında siyasal görüş, dini inanç, etnik köken, cinsiyet, yaş veya ekonomik durum farkı gözetmeksizin görevini yerine getirmesi Hekimlik Meslek Etiği Kuralları'nda hangi başlık altında düzenlenmiştir?", "opts": [{"t": "Mesleki dayanışma"}, {"t": "Hasta haklarına saygı"}, {"t": "Hekim seçme özgürlüğü"}, {"t": "Hekimin yansızlığı"}, {"t": "Vicdani ve mesleki kanı"}], "a": 3, "exp": "Madde 7 (**Hekimin Yansızlığı**): Hekim görevlerini her durumda hastaları arasındaki siyasal görüş, sosyal durum, dini inanç, milliyet, etnik köken, ırk, cinsiyet, yaş, toplumsal ve ekonomik durum vb. farklılıkları **gözetmeksizin** yerine getirmekle yükümlüdür. Madde 8 (**Vicdani ve mesleki kanı**) ise hekimin vicdani ve mesleki bilimsel kanaatine göre hareket etmesidir."}, {"q": "Hekimlik Meslek Etiği Kuralları'ndaki sır saklama yükümlülüğü (Madde 9) ile ilgili aşağıdaki ifadelerden hangileri doğrudur?<br>I. Hastanın ölmesi hekimin sır saklama yükümlülüğünü ortadan kaldırır.<br>II. Sırrın saklanması hasta ya da öteki insanların yaşamını tehlikeye sokuyorsa, hastanın kişilik hakları zedelenmemek koşuluyla hekim sırrı saklamakla yükümlü değildir.<br>III. Yasal zorunluluk durumlarında rapor düzenlemek meslek sırrının açıklanması anlamına gelmez.<br>IV. Hekim, tanık veya bilirkişi olarak mahkemeye çağrıldığında olayın meslek sırrı olduğunu ileri sürerek bu görevlerden çekilebilir.", "opts": [{"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II ve IV"}, {"t": "III ve IV"}, {"t": "II, III ve IV"}], "a": 4, "exp": "Madde 9'a göre **hastanın ölmesi ya da hekimle ilişkisinin sona ermesi** sır saklama yükümlülüğünü **ortadan kaldırmaz** (I yanlış). **Hastanın onam vermesi** veya sırrın saklanmasının **hasta ya da başkalarının yaşamını tehlikeye sokması** durumunda, kişilik hakları zedelenmeden sır saklama yükümlülüğü kalkar (II doğru). **Yasal zorunlulukla rapor** düzenlemek sırrı açıklamak sayılmaz (III doğru). Hekim **tanık/bilirkişi** olarak çağrıldığında meslek sırrını ileri sürerek çekilebilir (IV doğru)."}, {"q": "Göz hastalıkları uzmanı bir hekim, alışveriş merkezinde yere yığılan ve nefes almayan birine rastlıyor. Hekimlik Meslek Etiği Kuralları'na göre doğru tutum hangisidir?", "opts": [{"t": "Muayenesiz tedavi yasağı nedeniyle önce hastayı tam muayene etmelidir"}, {"t": "Hastanın aydınlatılmış onamını almadan müdahale etmemelidir"}, {"t": "Uzmanlığı ne olursa olsun ilk yardımda bulunmalıdır"}, {"t": "Yetkinlik dışı faaliyet yasağı nedeniyle müdahale etmeyip 112'yi aramakla yetinmelidir"}, {"t": "Yalnızca yakınlarından yazılı izin alınırsa müdahale edebilir"}], "a": 2, "exp": "Madde 10 (**Acil Yardım**): Hekim, **görevi ve uzmanlığı ne olursa olsun**, gerekli tıbbi girişimlerin yapılamadığı acil durumlarda **ilk yardımda bulunur**. Madde 18'deki yetkinlik dışı faaliyet yasağının istisnası da **gecikmenin hasta yaşamını tehdit edebileceği** zorunlu durumlardır; Madde 23 muayenesiz tedavi yasağına da **acil vakalar** istisnadır."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 11'e (Ticari amaç ve reklam yasağı) göre aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Hekim, ticari ürünlerin reklamında yer alabilir"}, {"t": "Hekim duyurularda uzmanlık alanını ve çalışma gün/saatlerini bildirebilir"}, {"t": "Hekim, tedavi başarı oranlarını reklamlarla duyurabilir"}, {"t": "Tabela boyutlarını Türk Tabipleri Birliği Merkez Konseyi belirler"}, {"t": "Tabela ve tanıtım araçlarının biçim ve boyutları Sağlık Bakanlığı'nca saptanır"}], "a": 1, "exp": "Madde 11: Hekim **reklam yapamaz, ticari reklamlara araç olamaz**, çalışmalarına ticari görünüm veremez; yanıltıcı, paniğe düşürücü, haksız rekabete yol açıcı davranışlarda bulunamaz. Yayın araçlarıyla duyurularda **Tababet Uzmanlık Tüzüğü'ne göre kabul edilmiş uzmanlık alanını, çalışma gün ve saatlerini** bildirebilir. **Tabela ve tanıtım araçlarının biçim ve boyutları yerel tabip odası** tarafından saptanır."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre \"hekimliğin kötü uygulaması (malpractice)\" nasıl tanımlanmıştır?", "opts": [{"t": "Ruhsatlandırılmamış maddelerin ilaç olarak kullanılması"}, {"t": "Bilgisizlik, deneyimsizlik ya da ilgisizlikle hastanın zarar görmesi"}, {"t": "Hekimin hastaya gereksiz harcama yaptırması"}, {"t": "Hastanın aydınlatılmış onamı alınmadan herhangi bir tedaviye başlanması"}, {"t": "Tedavinin beklenen sonucu vermemesi ve hastanın iyileşmemesi"}], "a": 1, "exp": "Madde 13: **Bilgisizlik, deneyimsizlik ya da ilgisizlik** nedeniyle bir hastanın **zarar görmesi** \"hekimliğin kötü uygulaması\" anlamına gelir. Ruhsatsız madde kullanımı Madde 12 (meşru ve yasak yöntemler), gereksiz harcama Madde 30 kapsamındadır; tedavinin tek başına başarısız olması malpractice tanımında yer almaz.\n💡 Malpractice'in üç nedeni: **B-D-İ** (Bilgisizlik, Deneyimsizlik, İlgisizlik)."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre aşağıdakilerden hangisi hekim için yasaklanmış bir davranış <b>değildir</b>?", "opts": [{"t": "Endüstri kuruluşları ile çıkar ilişkisi kurmak"}, {"t": "Gerekli bilimsel aşamalardan geçip ruhsatlandırılmamış maddeleri ilaç olarak kullanmak"}, {"t": "Hasta sağlamak amacıyla aracı kişilerden yararlanmak"}, {"t": "Hastanın kimlik bilgilerini saklı tutarak dosya bilgilerini araştırmada kullanmak"}, {"t": "Öteki hekimlere veya tetkik-tedavi kuruluşlarına maddi çıkar karşılığı hasta göndermek"}], "a": 3, "exp": "Madde 31'e göre hekim, **hastanın kimlik bilgilerini saklı tutmak koşuluyla** dosya bilgilerini **araştırmalarda kullanabilir**. Diğerleri yasaktır: maddi çıkar karşılığı hasta gönderme ve aracı kullanma (**Md. 14**), ruhsatsız madde kullanma (**Md. 12**), endüstriyle çıkar ilişkisi (**Md. 15**; bilimsel araştırma ve eğitime yönelik ilişkiler ise **şeffaf ve kurumsal** olmalı, TTB'nin \"Hekim ve İlaç Tanıtım İlkeleri\" geçerlidir)."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre hekimlerin endüstri kuruluşlarıyla bilimsel araştırma ve eğitime yönelik ilişkilerinde hangi belge geçerlidir?", "opts": [{"t": "İnsan Hakları Evrensel Bildirgesi"}, {"t": "Tababet Uzmanlık Tüzüğü"}, {"t": "Sağlık Bakanlığı'nın ruhsatlandırma yönetmeliği"}, {"t": "UNESCO Uluslararası Biyoetik ve İnsan Hakları Bildirgesi"}, {"t": "TTB'nin \"Hekim ve İlaç Tanıtım İlkeleri\""}], "a": 4, "exp": "Madde 15: Hekimler endüstri kuruluşları ile **hiçbir çıkar ilişkisi kuramaz**; bilimsel araştırma ve eğitime yönelik ilişkiler **şeffaf ve kurumsal** olmalıdır ve bu ilişkilerde **TTB'nin \"Hekim ve İlaç Tanıtım İlkeleri\"** geçerlidir. Tababet Uzmanlık Tüzüğü Madde 11'de uzmanlık alanı duyurusu bağlamında geçer."}, {"q": "Hekimlik Meslek Etiği Kuralları'nın \"Hekimler Arası İlişkiler\" bölümüne göre aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Hekim, gecikme hasta yaşamını tehdit etse bile özel beceri gerektiren girişimde bulunamaz"}, {"t": "Hekim, tedavi ekibindeki hekim dışı meslek mensuplarıyla ilişkilerinde serbesttir"}, {"t": "Hekim, meslektaşlarını mesleki yönden onur kırıcı ve haksız saldırılara karşı korur"}, {"t": "Meslektaşıyla uzlaşmaz anlaşmazlığa düşen hekim durumu doğrudan savcılığa bildirir"}, {"t": "Konsültasyon istenen hekim, uygun görmezse davete uymayabilir"}], "a": 2, "exp": "Madde 17 (**Mesleki dayanışma**): hekim meslektaşlarını **onur kırıcı ve haksız saldırılara karşı korur**. Madde 16'ya göre hekim **insan sağlığıyla uğraşan öteki meslek mensuplarıyla da** iyi ilişki kurar, tedavi ekibinin hiçbir üyesine küçük düşürücü davranamaz. Madde 18'de **gecikmenin hasta yaşamını tehdit ettiği** durumlar istisnadır. Madde 19/g: konsültasyon istenen hekim **davete uymak zorundadır**. Madde 20: bildirim **yerel tabip odasına** yapılır."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre konsültasyon (danışım) süreciyle ilgili aşağıdakilerden hangisi <b>yanlıştır</b>?", "opts": [{"t": "Konsültan hekim süreç boyunca hastadan sorumlu değildir"}, {"t": "Hasta konsültan hekimin önerilerini kabul ederse tedaviyi yürüten hekim tedaviyi bırakabilir"}, {"t": "Konsültasyonu, hastanın tedaviyi yürüten hekimi yazılı olarak ister"}, {"t": "Konsültasyonun gerekçesi ve sonuçları açık ve anlaşılır biçimde bir tutanakla belgelenir"}, {"t": "Konsültasyon sonuçlarından hastalar da yeterli ölçüde bilgilendirilir"}], "a": 0, "exp": "Madde 19/b'ye göre **konsültasyon sürecinde konsültan hekim de, hastanın sürekli hekimi gibi hastadan sorumludur**. Diğer şıklar maddede yer alır: istem **yazılı** yapılır ve hastanın özellikleri ile istem nedenleri belirtilir (a); sonuçlar **tutanakla** belgelenir (d); hasta **bilgilendirilir** (e); görüş farkında hasta konsültanın önerisini kabul ederse tedaviyi yürüten hekim **tedaviyi bırakabilir** (f). Ayrıca konsültan hekim alanında bilimsel ve teknik bilgiye sahip olmalıdır (c)."}, {"q": "Bir hekim, tıp etiği açısından yanlış davranan bir meslektaşının bu davranışını kasıtlı olarak sürdürdüğünü görmektedir. Hekimlik Meslek Etiği Kuralları'na göre bu durumu nereye bildirmelidir?", "opts": [{"t": "Sağlık Bakanlığı'na"}, {"t": "Yerel tabip odasına"}, {"t": "UNESCO Biyoetik Komitesi'ne"}, {"t": "Hastane başhekimliğine"}, {"t": "Cumhuriyet savcılığına"}], "a": 1, "exp": "Madde 20 (**Odaya bildirme yükümlülüğü**): Hekim, meslektaşlarıyla meslek uygulaması konusunda **uzlaşmaz bir anlaşmazlığa** düştüğünde ya da tıp etiği açısından yanlış davranan bir meslektaşının bu davranışını **kasıtlı biçimde sürdürmesi** durumunda **yerel tabip odasına** bildirimde bulunur."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 21'e göre hekimin hastasının sağlığıyla ilgili karar alırken saygı göstermek zorunda olduğu hasta hakları arasında açıkça sayılmayan hangisidir?", "opts": [{"t": "Bilgilenme hakkı"}, {"t": "Aydınlatılmış onam hakkı"}, {"t": "Ücretsiz tedavi hakkı"}, {"t": "Tedaviyi kabul hakkı"}, {"t": "Tedaviyi red hakkı"}], "a": 2, "exp": "Madde 21'de sayılan haklar: **bilgilenme hakkı, aydınlatılmış onam hakkı, tedaviyi kabul ya da red hakkı** vb. Ücretsiz tedavi bir hak olarak sayılmamıştır; aksine Madde 29'a göre hekim meslek örgütünün belirlediği **taban ücretin altında** ücret alamaz (meslektaş ve yakınlarından masraflar dışında ücret almaması ise **uygundur**)."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre hastanın hekim seçme özgürlüğü (Madde 22) neye göre sınırlıdır?", "opts": [{"t": "Mevzuata, tıbbi uygulamanın özelliklerine ve kurum koşullarına"}, {"t": "Tabip odasının belirlediği bölge sınırlarına"}, {"t": "Hekimin onayına ve uygun gördüğü saatlere"}, {"t": "Hasta yakınlarının görüşüne ve yasal temsilcinin iznine"}, {"t": "Hastanın sosyal güvenlik durumuna ve ödeme gücüne"}], "a": 0, "exp": "Madde 22: Hasta, **mevzuatın belirlediği kurallara, tıbbi uygulamanın özelliklerine ve kurumun koşullarına göre** hekimini seçmekte **özgürdür**."}, {"q": "Bir hekim, hastasını bizzat muayene etmeden yalnızca telefonda anlatılan şikâyetlere göre tedavi başlatmak istemektedir. Hekimlik Meslek Etiği Kuralları'na göre bu davranış hangi durumda kabul edilebilir?", "opts": [{"t": "Hekim aynı hastalığı daha önce tedavi etmişse"}, {"t": "Hastanın hekime ulaşması ekonomik açıdan zorsa"}, {"t": "Hasta daha önce aynı hekime başvurmuşsa"}, {"t": "Hasta yazılı onam vermişse"}, {"t": "Acil vakalar gibi zorunlu durumlarda"}], "a": 4, "exp": "Madde 23 (**Muayenesiz tedavi yasağı**): Hekim, **acil vakalar gibi zorunlu durumlar dışında** hastasını bizzat muayene etmeden tedavisine başlayamaz. Madde 24'e göre de hekim hasta üzerindeki etkisini **tıbbi amaçlar dışında** kullanamaz."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 25'e göre bir hekimin hastanın tedavisini üstlenmemesi veya yarıda bırakması için gerekli koşullar hangileridir?<br>I. Tıbbi bilgisini gerektiği gibi uygulayamayacağına karar vermesi<br>II. Hastanın başvurabileceği başka bir hekimin bulunması<br>III. Hastanın ücret ödemeyi reddetmesi", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t": "I ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "Madde 25: Hekim **ancak** tıbbi bilgisini gerektiği gibi **uygulayamayacağına karar verdiğinde ve** hastanın başvurabileceği **başka bir hekim bulunduğu** durumlarda tedaviyi üstlenmeyebilir veya yarım bırakabilir. Hekim durumu ve hastanın sağlığının tehlikeye düşmeyeceğini hastaya/yakınlarına anlatır; **ikinci hekim bulunmadan hastasını bırakamaz** ve tedaviyi üstlenen meslektaşına **tüm bilgileri aktarmakla** yükümlüdür. Ücret ödememe bir koşul olarak sayılmamıştır."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 26'ya (Aydınlatılmış Onam) göre aşağıdakilerden hangisi <b>yanlıştır</b>?", "opts": [{"t": "Tedavisi yasalarla zorunlu kılınan hastalıklarda onam alınmasa da gerekli tedavi yapılır"}, {"t": "Hasta vermiş olduğu aydınlatılmış onamı dilediği zaman geri alabilir"}, {"t": "Aydınlatma, hastanın kültürel, toplumsal ve ruhsal durumuna özen gösteren bir uygunlukta olmalıdır"}, {"t": "Hastanın dışında bilgilendirilecek kişileri hekim belirler"}, {"t": "Baskı, tehdit, eksik aydınlatma ya da kandırma yoluyla alınan onam geçersizdir"}], "a": 3, "exp": "Madde 26: **Hastanın dışında bilgilendirilecek kişileri hasta kendisi belirler.** Diğer ifadeler maddede yer alır: baskı/tehdit/eksik aydınlatma/kandırma ile alınan onam **geçersizdir**; hasta onamını **dilediği zaman geri alabilir**; aydınlatma hastanın **kültürel, toplumsal ve ruhsal durumuna** uygun ve **anlaşılabilir** olmalıdır; **toplum sağlığını tehdit eden**, tedavisi yasalarla zorunlu hastalıklarda onam alınmasa da tedavi yapılır.\n⚠️ Bilinçsiz hastada yakınların bilgilendirilmesine ise (Md. 27) **hekim** karar verir; ikisini karıştırmayın."}, {"q": "Madde 26'ya göre hastanın aydınlatılması gereken konular arasında aşağıdakilerden hangisi sayılmamıştır?", "opts": [{"t": "Olası tedavi seçenekleri ve riskleri"}, {"t": "Hekimin mesleki deneyim süresi ve diploma numarası"}, {"t": "Verilen ilaçların kullanılışı ve olası yan etkileri"}, {"t": "Önerilen tedavi yönteminin türü, başarı şansı ve süresi"}, {"t": "Hastanın tedaviyi kabul etmemesi durumunda hastalığın yaratacağı sonuçlar"}], "a": 1, "exp": "Hekim hastayı: **sağlık durumu ve tanı; önerilen tedavinin türü, başarı şansı ve süresi; tedavinin riskleri; ilaçların kullanılışı ve olası yan etkileri; tedaviyi kabul etmemenin sonuçları; olası tedavi seçenekleri ve riskleri** konularında aydınlatır. Diploma numarası, Madde 35'te **tutuklu/hükümlü muayene raporlarında** mutlaka bulunması gereken bilgiler arasında geçer (ad, soyad, diploma no, imza)."}, {"q": "Bilinci kapalı, yaşamı tehlikede olan bir hastanın yasal temsilcisi, hekimin kötü niyete dayandığını düşündüğü bir gerekçeyle hayati müdahaleye izin vermemektedir. Hekimlik Meslek Etiği Kuralları'na göre hekimin ilk yapması gereken nedir?", "opts": [{"t": "Durumu adli mercilere bildirerek izin almak"}, {"t": "Hiçbir izin aramadan istediği tüm girişimleri uygulamak"}, {"t": "Hastanenin etik kurulundan yazılı onay almak"}, {"t": "Durumu yerel tabip odasına bildirip onur kurulunun kararını beklemek"}, {"t": "Temsilcinin kararına uyarak müdahaleden vazgeçmek"}], "a": 0, "exp": "Madde 26: Hekim, temsilcinin izin vermemesinin **kötü niyete dayandığını** düşünüyor ve durum **hastanın yaşamını tehdit ediyorsa**, durum **adli mercilere bildirilerek izin alınmalıdır**. Bu mümkün değilse hekim **başka bir meslektaşına danışmaya** çalışır ya da **yalnızca yaşamı kurtarmaya yönelik** girişimlerde bulunur. Acil durumlarda müdahale etmek **hekimin takdirindedir**."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 27'ye (Bilgilendirilmeme Hakkı) göre aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Bilgilendirilmeme hakkı yalnızca terminal dönemdeki hastalara tanınır"}, {"t": "Ailenin hastalıktan haberdar edilmesine hastaya danışmadan hekim tek başına karar verir"}, {"t": "Hasta bilgilendirilmek istemese de hekim tüm bilgileri vermek zorundadır"}, {"t": "Bilinçsiz hastanın yakınlarının bilgilendirilmesine hekim karar verir"}, {"t": "Bilinçsiz hastaların yakınları her durumda bilgilendirilmek zorundadır"}], "a": 3, "exp": "Madde 27: Hasta bilgilendirilmek istemediğini belirtmişse **hekimin bilgi vermesi gerekmez**. **Ailenin haberdar edilmesi hastayla görüş birliğine varılarak** yapılmalıdır. **Bilinçsiz** hastalarda yakınların bilgilendirilip bilgilendirilmemesine **hekim** karar verir."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 28'e göre hekimin terminal dönemdeki hastalara yönelik yükümlülüğü hangisidir?", "opts": [{"t": "Hastayı hastalığı konusunda bilgilendirmeden tedaviyi sürdürmek"}, {"t": "Yalnızca ağrı kesici tedavi uygulayıp başka girişimde bulunmamak"}, {"t": "Tedaviyi yarıda bırakarak hastayı yakınlarına teslim etmek"}, {"t": "Hastanın açık isteği halinde yaşamını sonlandıracak tıbbi bir girişimde bulunmak"}, {"t": "İnsani yardım, onura yaraşır koşullar ve acıyı olabildiğince azaltma"}], "a": 4, "exp": "Madde 28 (**Terminal hastalara yardım**): Hekim, terminal dönemdeki hastalara **her türlü insani yardımı** yapmaya, **insan onuruna yaraşır koşulları** sağlamaya ve **çekilen acıyı olabildiğince azaltmaya** çalışır."}, {"q": "Hekimlik Meslek Etiği Kuralları'nın ücretle ilgili maddesine (Madde 29) göre aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Hekimin meslektaşlarından masraflar dahil hiçbir ücret alması uygun değildir"}, {"t": "Ücret tarifesini her hekim kendisi serbestçe belirler"}, {"t": "Hasta ücret konusunda ancak tedavi bittikten sonra bilgi alabilir"}, {"t": "Hekim, meslek örgütünün belirlediği taban ücretin altında ücret alamaz"}, {"t": "Hekim, hastanın ekonomik durumuna göre taban ücretin altına inebilir"}], "a": 3, "exp": "Madde 29: Hasta ücret konusunda **önceden** bilgi alabilir. Hekim, muayene, tetkik, tıbbi ve cerrahi girişimlerde **meslek örgütünün belirlediği taban ücretin altında ücret alamaz**. Meslektaşları, eşleri ve bakmakla yükümlü olduklarından muayene ve tedavi için **masraflar dışında** ücret almaması uygundur."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 30'a göre aşağıdakilerden hangisi hekim için bir yasaktır?", "opts": [{"t": "Meslektaşının eşinden muayene ücreti almamak"}, {"t": "Bizzat muayene ettiği hastaya istirahat raporu vermek"}, {"t": "Hastanın isteği üzerine dosyasındaki bilgilerin geniş bir özetini hastaya vermek"}, {"t": "Ücret konusunda hastayı önceden bilgilendirmek"}, {"t": "Hastanın parası olsa da zorunluluk yokken pahalı ilaç önermek"}], "a": 4, "exp": "Madde 30 (**Gereksiz harcama yaptırma yasağı**): Hekim, **hastasının parasal durumu ne olursa olsun**, kesin zorunluluk olmadıkça **pahalı ilaç ve yöntem öneremez**, gereksiz harcama yaptıramaz ve **yararı olmayacağını bildiği tedaviyi veremez**. Diğer şıklar Madde 31, 32 ve 29'a göre izin verilen/uygun davranışlardır."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 32'ye göre hekim rapor düzenlemeyle ilgili hangi koşula uymalıdır?", "opts": [{"t": "Rapor yalnızca bizzat muayene ve tedavi ettiği hastaya verilir"}, {"t": "Hasta yakınlarının talebi üzerine muayene etmediği hastaya da rapor verebilir"}, {"t": "Rapor yalnızca kalıcı bilgileri içerebilir, geçici öneriler yazılamaz"}, {"t": "Raporda yalnızca tanı yer alır; öneri bulunamaz"}, {"t": "Rapor ancak tabip odasının onayıyla verilebilir"}], "a": 0, "exp": "Madde 32: Hekim, **bizzat muayene ve tedavi ettiği hastasına** gerekli gördüğünde hastalıkla ilgili rapor verir. Raporda tıbbi gerekçelere bağlı **istirahat, tedavi şekli, diyet, çalışma koşulları** gibi **geçici ya da kalıcı** bilgiler ve **hekimin önerileri** bulunur."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 33'e göre her hekimin uymakla yükümlü olduğu belgelerin başında hangisi gelir?", "opts": [{"t": "6023 sayılı TTB Yasası"}, {"t": "Hekim ve İlaç Tanıtım İlkeleri"}, {"t": "İnsan Hakları Evrensel Bildirgesi"}, {"t": "Tababet Uzmanlık Tüzüğü"}, {"t": "UNESCO Biyoetik ve İnsan Hakları Bildirgesi"}], "a": 2, "exp": "Madde 33 (**Uluslararası sözleşmelere uyma zorunluluğu**): Her hekim, **başta İnsan Hakları Evrensel Bildirgesi** olmak üzere tüm insan hakları belgelerine ve hekimlikle ilgili ortak kurallara uymakla yükümlüdür."}, {"q": "Gözaltından getirilen ve işkence gördüğünü iddia eden bir kişiyi muayene eden hekimin tutumu, Hekimlik Meslek Etiği Kuralları'na göre hangisi olmalıdır?", "opts": [{"t": "Raporu baskı altında yazdıysa bunu kimseye bildirmemelidir"}, {"t": "Bilgi ve becerisini gerçeğin ortaya çıkması için kullanmalı, gerçeğe aykırı rapor vermemelidir"}, {"t": "Kişi muayeneyi reddederse zorla muayene yoluna gitmelidir"}, {"t": "Muayeneyi kolluk görevlilerinin yanında yapıp raporu onlara teslim etmelidir"}, {"t": "İddia başka delillerle kanıtlanana kadar rapor düzenlemekten kaçınmalıdır"}], "a": 1, "exp": "Madde 34: Hekim işkence ve benzeri uygulamalara **katılamaz, yardımcı olamaz, gerçeğe aykırı rapor düzenleyemez**; işkence iddiası olan olgularda **mesleki bilgi ve becerisini gerçeğin ortaya çıkarılması için** kullanır. Madde 35'e göre tutuklu/hükümlülerin **gizlilik hakları korunur**, rapor baskı altında yazılmışsa hekim bunu **en kısa zamanda meslek örgütüne** bildirir; Madde 36'ya göre **zorla muayene ve tedavi** yolunu deneyemez, öneremez."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 35'e göre tutuklu ve hükümlülerin muayenesi sonucu düzenlenen belge veya raporlarla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Tutuklu ve hükümlülerin gizlilik hakkı bulunmamaktadır"}, {"t": "Rapor baskı altında yazılmışsa hekim bunu yalnızca savcılığa bildirir"}, {"t": "Raporda hekimin kimlik bilgileri gizli tutulur"}, {"t": "Rapor yalnızca cezaevi yönetimine verilir; muayene edilen kişiye örnek verilmez"}, {"t": "Raporda hekimin adı, soyadı, diploma no ve imzası bulunur; örneği kişiye verilir"}], "a": 4, "exp": "Madde 35: Tutuklu ve hükümlülerin muayenesi öteki hastalar gibi **kişilik haklarına saygılı**, uygun koşullarda yapılır, **gizlilik hakları korunur**. Belge/raporlarda hekimin **adı, soyadı, diploma numarası ve imzası mutlaka** bulunur; **bir örneği kişiye verilir**. Baskı altında yazılmışsa hekim bunu **en kısa zamanda meslek örgütüne** bildirir."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre hekimin ölüm cezası ile ilgili tutumu hangisidir?", "opts": [{"t": "Yalnızca ölüm tespiti amacıyla infazda bulunabilir"}, {"t": "Hiçbir koşulda infazda bulunamaz ve yardım edemez"}, {"t": "İnfaz sırasında yalnızca ağrıyı azaltıcı ilaç uygulayab
