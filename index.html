: "I ve III"}, {"t": "I, II ve III"}], "a": 2, "exp": "Bazı işletmelerde karmaşık durumlar için karar almak üzere **görevlendirilmiş etik sorumluları** bulunur; bazı işletmeler ise **etik kurulları** oluşturmuştur. Vergi denetim birimleri bu bağlamda geçmez. Etik sorunların çözümü ise farklı yaklaşımlara dayanır."}, {"q": "Ekonomik durgunlukta üniversite mezunu olmanın işe alınmada dezavantaj olduğunu fark eden bir kişinin kendini bilinçli olarak lise mezunu diye tanıtması, kaynakta hangi bağlamda örnek verilmiştir?", "opts": [{"t": "Sorunun etki gücünü belirleyen ölçüleri ve zarar büyüklüğünü göstermek için"}, {"t": "Etik kusurun her durumda yasa dışı bir davranış olduğunu kanıtlamak için"}, {"t": "Prosedürel adaletin işe alım süreçlerinde nasıl ihlal edildiğini göstermek için"}, {"t": "Verilen yanıtların kişinin etiğe ilişkin yaklaşımını yansıttığını göstermek için"}, {"t": "Faydacılık yaklaşımının sayısal yöntemini ve maliyet-fayda hesabını açıklamak için"}], "a": 3, "exp": "\"Etik Karar Alma Yaklaşımları\" bölümü rüşvet vermek, kendini lise mezunu tanıtmak, şirket olanaklarını özel ihtiyaç için kullanmak, kat sekreterine özel iş yaptırmak, iş telefonuyla yurt dışındaki akrabayı aramak gibi sorularla başlar. Bu sorulara verilen yanıtlar **sizin etiğe ilişkin yaklaşımınızı yansıtır**; \"doğru/yanlış yapıyorsun\" demenin arkasında birtakım **kurallar ya da ilkeler** vardır."}, {"q": "Etik karar alma ile ilgili olarak kaynakta aşağıdaki ifadelerden hangisi YER ALMAZ?", "opts": [{"t": "Sorun, genellikle alınan kararların mükemmelinin bulunamamasıdır"}, {"t": "Etik karar almada tüm perspektifler sonunda aynı karara ulaşır"}, {"t": "Özellikle etik ikilemlerde yaratıcı seçeneklere ihtiyaç duyulur"}, {"t": "İşletme yöneticilerinin rasyonel karar almaları beklenir"}, {"t": "Kararlar hem süreçte hem sonuçta kimlerin etkileneceğinin göz önünde bulundurulmasını gerektirir"}], "a": 1, "exp": "Kaynağa göre **etik karar almada farklı perspektifler farklı kararlara yol açar**; \"Tüm perspektifler aynı karara ulaşır\" ifadesi bunun tersidir. Diğerleri kaynakta geçer: yöneticilerden **rasyonel karar** beklenir ama kararların bir de **etik yönü** vardır; sorun **mükemmel kararın bulunamamasıdır**; etik ikilemlerde **yaratıcı seçenekler** gerekir."}, {"q": "Kaynaktaki KİTAP kutusunda \"Grup, bireyin esenliği için ne zaman sorumluluk taşır?\" sorusuyla ilgili okunması önerilen eser hangisidir?", "opts": [{"t": "Bowen H. McCoy – \"Sadhu'nun Öyküsü\""}, {"t": "Milton Friedman – \"Kapitalizm ve Özgürlük\""}, {"t": "Kohlberg – \"Ahlaki Gelişim Evreleri\""}, {"t": "Thomas Hobbes – \"Leviathan\""}, {"t": "Crane ve Matten – \"Business Ethics\""}], "a": 0, "exp": "KİTAP kutusu, **Bowen H. McCoy**'un yazdığı \"**Sadhu'nun (Sadunun) Öyküsü**\"nü önerir: Harvard Business Review Dergisi'nden seçmeler (2004), Şirket Ahlakı, MESS Yayın No: 466. Konu, grubun bireyin esenliğinden ne zaman sorumlu olduğudur."}, {"q": "Kaynakta yer verilen dört iş etiği yaklaşımı aşağıdakilerden hangisinde doğru olarak verilmiştir?", "opts": [{"t": "Faydacılık, bireyselcilik, Kohlberg kuramı ve sosyal sözleşme kuramı"}, {"t": "Haklar, adalet, paydaş kuramı ve sürdürülebilirlik yaklaşımları"}, {"t": "Adalet, ekonomik, yasal ve etik sorumluluk yaklaşımları"}, {"t": "Faydacılık, haklar, adalet kuramı, bütünleştirici sosyal sözleşme kuramı"}, {"t": "Faydacılık, haklar, klasik görüş ve sosyoekonomik görüş yaklaşımları"}], "a": 3, "exp": "İş etiğine dört yaklaşım: **1) Faydacılık, 2) Haklar, 3) Adalet kuramı, 4) Bütünleştirici sosyal sözleşme kuramı**. Klasik/sosyoekonomik görüş sosyal sorumluluk yaklaşımlarıdır; ekonomik/yasal/etik sorumluluk Carroll piramidinin basamaklarıdır.\n💡 \"F-H-A-B\": Fayda, Hak, Adalet, Bütünleşik sözleşme."}, {"q": "\"Çoğunluğun iyiliğini üreten karar etik karardır\" görüşünü savunan ve 19. yüzyıl filozoflarınca desteklenen yaklaşım ile bu filozoflar hangi seçenekte doğru eşleştirilmiştir?", "opts": [{"t": "Haklar yaklaşımı – Thomas Hobbes ve John Stuart Mill"}, {"t": "Haklar yaklaşımı – Jeremy Bentham ve John Stuart Mill"}, {"t": "Adalet kuramı – Jeremy Bentham ve Thomas Hobbes"}, {"t": "Faydacılık – Thomas Hobbes ve Milton Friedman"}, {"t": "Faydacılık – Jeremy Bentham ve John Stuart Mill"}], "a": 4, "exp": "**Faydacılık yaklaşımı** 19. yy filozofları **Jeremy Bentham ve John Stuart Mill** tarafından desteklenir; çoğunluğun iyiliğini üreten kararı etik sayar. **Hobbes** (1588-1679) haklar yaklaşımı bağlamında, **Friedman** klasik sosyal sorumluluk görüşünde geçer."}, {"q": "Faydacılık yaklaşımına göre aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Ekonomik referans çerçevesi olarak maliyet-fayda hesaplaması kullanılabilir"}, {"t": "Karar verici her seçeneğin tüm kesimler üzerindeki etkisini göz önüne almalıdır"}, {"t": "Etik karar almada sayısal bir yöntem elde etme kaygısı taşır"}, {"t": "Karmaşık hesaplamalar yerine basitleştirme tercih edilir"}, {"t": "Karar verilirken dolaylı etkilenenler de mutlaka hesaba katılmalıdır"}], "a": 4, "exp": "Faydacılıkta karar **sadece kararın doğrudan etkilediği kişiler** göz önüne alınarak verilmeli, **dolaylı etkilenenler hesaba katılmamalıdır**; \"dolaylı etkilenenler de hesaba katılmalı\" ifadesi bu nedenle yanlıştır. Diğerleri doğrudur: basitleştirme, **maliyet-fayda** hesabı, tüm seçeneklerin etkilerini değerlendirip çoğunluğun en yüksek tatminini seçmek ve **sayısal yöntem** kaygısı."}, {"q": "Büyük ölçekli bir otomotiv firmasının yöneticileri bir şehirdeki fabrikayı kapatıp başka bir şehirde faaliyete devam etme kararını \"şirketin bütünü için en büyük yararı ürettiği\" gerekçesine dayandırmıştır. Bu gerekçe hangi etik yaklaşımı yansıtır?", "opts": [{"t": "Faydacılık yaklaşımı"}, {"t": "Etkileşimsel adalet"}, {"t": "Haklar yaklaşımı"}, {"t": "Dağıtım adaleti"}, {"t": "Bütünleşik sosyal sözleşme kuramı"}], "a": 0, "exp": "\"En büyük yararı üretme\" gerekçesi **faydacılığın** özüdür: çoğunluğun en yüksek tatmini/faydası. Kaynakta bu örnek doğrudan faydacılık başlığı altında verilmiştir."}, {"q": "Çalışanların dörtte birini işten çıkarmanın; kârlılığı artıracağı, kalan dörtte üçün iş güvencesini iyileştireceği ve hissedarların çıkarına hizmet edeceği gerekçesiyle savunulması hangi yaklaşıma örnektir?", "opts": [{"t": "Prosedürel adalet"}, {"t": "Haklar yaklaşımı"}, {"t": "Faydacılık"}, {"t": "Hayırseverlik sorumluluğu"}, {"t": "Etkileşimsel adalet"}], "a": 2, "exp": "Kaynakta faydacılığı benimseyen yöneticinin **çalışanların dörtte birini işten çıkarmayı** bu gerekçelerle savunabileceği belirtilir; amaç **çoğunluğun en iyi faydasıdır**. Faydacılık verimlilik, üretkenlik ve kâr maksimizasyonuyla uyumludur.\n💡 1/4 çıkar, 3/4 güvende: \"çoğunluk kazanır\" = faydacılık."}, {"q": "Kaynağa göre faydacılık yaklaşımının olumsuz yönü aşağıdakilerden hangisidir?", "opts": [{"t": "Verimlilik ve üretkenliği engelleyerek işletmenin rekabet gücünü uzun vadede zayıflatması"}, {"t": "Kaynakların ön yargıyla dağıtılıp temsil edilmeyen paydaşların zarar görebilmesi"}, {"t": "Kâr maksimizasyonu hedefiyle çelişerek hissedarların çıkarlarını ikinci plana atması"}, {"t": "Daha az risk, daha az teşvik ve daha az yenilikle sonuçlanabilir bir yaklaşım olması"}, {"t": "Yöneticilerin yalnızca endüstri içindeki etik normları dikkate almasını zorunlu kılması"}], "a": 1, "exp": "Faydacılık verimlilik, üretkenlik ve **kâr maksimizasyonuyla uyumludur**; yani verimliliği engellediği ya da kârla çeliştiği söylenemez. Olumsuz yanı: **kaynakların ön yargıyla dağıtılması**; özellikle söz hakkı olmayan ya da **temsil edilmeyen** paydaşların hakları olumsuz etkilenebilir. \"Daha az risk, teşvik ve yenilik\" ise **adalet kuramının zayıf yanıdır**."}, {"q": "Temel sorusu \"Nelere hakkım var?\" olan ve bireyselcilik yaklaşımı olarak da anılan etik yaklaşım hangisidir?", "opts": [{"t": "Bütünleşik sosyal sözleşme kuramı"}, {"t": "Sosyoekonomik görüş"}, {"t": "Faydacılık yaklaşımı"}, {"t": "Adalet kuramı"}, {"t": "Haklar yaklaşımı"}], "a": 4, "exp": "**Haklar yaklaşımı** \"bireyselcilik yaklaşımı\" olarak da anılır; temel sorusu **\"nelere hakkım var?\"**dır. Bu yaklaşıma göre etik olan karar, etkilenen insanların **haklarını en iyi koruyandır**; haklar **BM İnsan Hakları Evrensel Bildirgesi**'nde yer alan haklardır."}, {"q": "Haklar yaklaşımında haklar \"özgürlük hakları\" ve \"refah hakları\" olarak ikiye ayrılır. Aşağıdakilerden hangisi REFAH HAKLARINA örnektir?", "opts": [{"t": "Seyahat özgürlüğü"}, {"t": "Beslenme hakkı"}, {"t": "Vicdan özgürlüğü"}, {"t": "İfade özgürlüğü"}, {"t": "Konuşma özgürlüğü"}], "a": 1, "exp": "**Özgürlük hakları**: ifade özgürlüğü, seyahat özgürlüğü. **Refah hakları**: mülkiyet, **beslenme hakkı**, sağlık hizmeti/sağlığı koruma hakkı. Özgürlük haklarında toplumun öteki bireylerinin **müdahale etmemesi** beklenir; refah haklarında ise toplumun öteki bireylerinin **katılımı ve çabası** gerekir.\n💡 Özgürlük = \"karışma\"; Refah = \"katkı ver\"."}, {"q": "Haklar yaklaşımında, toplumun öteki bireylerinin MÜDAHALE ETMEMESİNİN beklendiği hak grubu ile KATILIM VE ÇABASININ gerektiği hak grubu sırasıyla hangisidir?", "opts": [{"t": "Mülkiyet hakları – ifade hakları"}, {"t": "Sağlık hakları – seyahat hakları"}, {"t": "Özgürlük hakları – refah hakları"}, {"t": "Bireysel haklar – yasal haklar"}, {"t": "Refah hakları – özgürlük hakları"}], "a": 2, "exp": "İlk grup olan **özgürlük haklarında** (ifade, seyahat) toplumun **müdahale etmemesi**; ikinci grup olan **refah haklarında** (mülkiyet, beslenme, sağlık) ise toplumun **katılımı ve çabası** gerekir."}, {"q": "Thomas Hobbes (1588-1679) ile ilgili kaynakta verilen bilgilere göre aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Barış için insanların kendisi için hak gördüğünü başkalarına da tanıması gerektiğini belirtmiştir"}, {"t": "Kişinin başkalarına karşı özgürlüğünü, onlardan beklediği ölçüde sınırlaması gerektiğini savunmuştur"}, {"t": "Her ahlak ve hukuk düzeninin temel amacının toplumda barışın kurulması olduğunu söylemiştir"}, {"t": "Görüşleri haklar yaklaşımı bağlamında aktarılmıştır"}, {"t": "Ahlakın soyut ve deney dışı ilkelere dayanması gerektiğini savunmuştur"}], "a": 4, "exp": "Hobbes **deneysel gerçeklere dayalı ahlakı** savunur; \"soyut ve deney dışı ilkeler\" ifadesi bu nedenle yanlıştır. Ona göre her ahlak ve hukuk düzeninin temel amacı **toplumda barışın kurulmasıdır**; barış için insanlar kendileri için hak gördüklerini başkalarına da tanımalı, özgürlüklerini **başkalarından bekledikleri ölçüde** sınırlamalıdır."}, {"q": "Bir yöneticinin çalışanların ne konuştuklarını gizlice dinlemesi, haklar yaklaşımına göre hangi hakkın ihlalidir?", "opts": [{"t": "Konuşma özgürlüğü hakkı"}, {"t": "Gizlilik hakkı"}, {"t": "Beslenme hakkı"}, {"t": "Seyahat özgürlüğü"}, {"t": "Mülkiyet hakkı"}], "a": 1, "exp": "Kaynağa göre çalışanların ne konuştuklarını gizlice dinlemek onların **gizlilik hakkını** ihlal etmektir. Benzer örnekler: işyerinde **cinsel taciz** kişinin ahlaki normlarını ihlal ettiği için etik değildir; şirketindeki yolsuzlukları kamuoyuna duyuran kişileri desteklemek ise **konuşma özgürlüğü** hakkını desteklemektir."}, {"q": "Haklar yaklaşımını faydacılık yaklaşımından ayıran temel nokta aşağıdakilerden hangisidir?", "opts": [{"t": "Endüstri ve şirket içindeki etik normların esas alınması"}, {"t": "Kararlarda maliyet-fayda hesabının esas alınması ve basitleştirme"}, {"t": "Etik kararlarda toplumun değil bireyin odak noktada olması"}, {"t": "Yalnızca karardan doğrudan etkilenenlerin dikkate alınması"}, {"t": "Kuralların açık, tarafsız ve tutarlı biçimde uygulanması"}], "a": 2, "exp": "Haklar yaklaşımında **birey** odak noktadadır; **faydacılıkta ise bireysel haklar toplumun refahına göre ikinci planda** dikkate alınır. Maliyet-fayda hesabı ve yalnızca doğrudan etkilenenleri dikkate almak faydacılığa, endüstri normları bütünleşik sosyal sözleşmeye, kuralların tutarlı uygulanması prosedürel adalete aittir."}, {"q": "Adalet kuramı yaklaşımı, etik kararların hangi standartlara dayalı olmasını savunur?", "opts": [{"t": "Gizlilik, şeffaflık ve hesap verebilirlik"}, {"t": "Özgürlük, refah ve mülkiyet"}, {"t": "Ekonomik, yasal ve hayırseverlik"}, {"t": "Eşitlik, doğruluk ve tarafsızlık"}, {"t": "Fayda, verimlilik ve kârlılık"}], "a": 3, "exp": "**Adalet kuramı**, etik kararların **eşitlik, doğruluk ve tarafsızlık** standartlarına dayalı olmasını savunur. İşletmelerde üç tür adalet gözetilmelidir: **dağıtım, prosedürel/işlemsel ve etkileşimsel** adalet."}, {"q": "Aynı işi yapan kadın ve erkek çalışanlara farklı ücret verilmemesi gerektiği ilkesi hangi adalet türüyle ilgilidir?", "opts": [{"t": "Dağıtım adaleti"}, {"t": "Prosedürel adalet"}, {"t": "Etkileşimsel adalet"}, {"t": "Bütünleşik sosyal sözleşme"}, {"t": "Haklar yaklaşımı"}], "a": 0, "exp": "**Dağıtım adaleti**, insanlara keyfiyete göre farklı davranılmamasını gerektirir; bir kararla ilgili tüm kişilere aynı şekilde davranılmalıdır. Ancak çalışanlar beceri ve sorumluluk gibi alanlarda farklılaştığında **bu farklılıklar oranında** ücret farkı olabilir; yeter ki farklılık **örgütsel amaç ve görevlerle net ilişkili** olsun."}, {"q": "\"Kuralların açık bir şekilde ortaya konması, tarafsız ve tutarlı bir şekilde yürürlüğünün sağlanması\" hangi adalet türünün gereğidir?", "opts": [{"t": "Ödüllendirme (ücret) adaleti"}, {"t": "Sosyal (toplumsal) adalet"}, {"t": "Prosedürel (işlemsel) adalet"}, {"t": "Dağıtım adaleti"}, {"t": "Etkileşimsel adalet"}], "a": 2, "exp": "**Prosedürel/işlemsel adalet** kuralların adil bir şekilde uygulanmasını gerektirir: kurallar **açık** konmalı, **tarafsız ve tutarlı** uygulanmalıdır. Etkileşimsel adalet ise ilişkilerin formal olmayan yönüyle ilgilidir."}, {"q": "Bir yöneticinin astlarıyla ilişkilerinde gösterdiği açık yüreklilik, duyarlılık ve saygı hangi adalet türüne göre yorumlanır?", "opts": [{"t": "Dağıtım adaleti"}, {"t": "Etkileşimsel adalet"}, {"t": "Faydacı adalet"}, {"t": "Yasal adalet"}, {"t": "Prosedürel adalet"}], "a": 1, "exp": "**Etkileşimsel adalet**, örgüt içindeki bireyler arası davranışlara ilişkindir ve bireylerin birbirlerine karşı davranışlarında algılanan **dürüstlük düzeyiyle** yorumlanır. **Prosedürel adaletin aksine** ilişkilerin **formal olmayan** yönüne ilişkindir.\n💡 Dağıtım = ne aldın; Prosedürel = hangi kuralla; Etkileşimsel = nasıl davranıldı."}, {"q": "Adalet kuramına göre \"bedel ödemeye ilişkin kararlar\" için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Bedel, işletmenin faaliyet gösterdiği yerdeki ücret düzeyi baz alınarak belirlenir"}, {"t": "Bireyler kontrolleri dışındaki meselelerden doğan hasarlardan da sorumlu tutulmalıdır"}, {"t": "Bedel, karardan etkilenen çoğunluğun en yüksek faydasına göre belirlenmelidir"}, {"t": "Bireyler yalnızca sorumlulukları altındaki alandaki hasarların maliyetinden sorumludur"}, {"t": "Bedel ödemeye ilişkin kararlar adalet yaklaşımıyla açıklanamaz, faydacılıkla açıklanır"}], "a": 3, "exp": "Bedel ödemeye ilişkin kararlar da **adalet yaklaşımıyla** açıklanabilir: bireyler sadece **sorumlulukları altındaki alandaki** hasarların maliyetinden sorumlu tutulabilir, **kontrolü altında olmayan** meselelerden tutulamaz. Bu konu İK'nın **ödüllendirme ve cezalandırma** sistemleriyle yakından ilişkilidir."}, {"q": "Adalet teorisinin ZAYIF tarafı olarak kaynakta belirtilen husus hangisidir?", "opts": [{"t": "İnsan kaynakları yasalarıyla çelişmesi"}, {"t": "Statü ve grupların ayrıcalıklı olmasını önlemesi"}, {"t": "Kaynakların ön yargıyla dağıtılmasına yol açması"}, {"t": "Daha az risk, daha az teşvik ve yenilikle sonuçlanabilir olması"}, {"t": "Bireysel hakları toplumun refahına göre ikinci plana atması"}], "a": 3, "exp": "Adalet teorisinin **zayıf tarafı**: daha az risk, daha az teşvik ve yenilikle sonuçlanabilmesi. **Güçlü tarafı**: kurallarla bazı statü ve grupların **ayrıcalıklı olmasını önlemesi** ve tüm kesimlerin kaynak ve fırsatlardan **eşit pay** almasını sağlaması (bu nedenle zayıf yan değildir). Ayrıca **insan kaynakları yönetimine rehberlik eden yasaların çoğu** adalet yaklaşımına dayalıdır. \"Kaynakların ön yargıyla dağıtılması\" ve \"bireysel hakları toplum refahına göre ikinci plana atma\" ise faydacılığa ilişkin noktalardır."}, {"q": "Kaynağa göre insan kaynakları yönetimine rehberlik eden yasaların çoğu hangi etik yaklaşıma dayalıdır?", "opts": [{"t": "Haklar yaklaşımı"}, {"t": "Klasik görüş"}, {"t": "Bütünleşik sosyal sözleşme kuramı"}, {"t": "Faydacılık yaklaşımı"}, {"t": "Adalet yaklaşımı"}], "a": 4, "exp": "Kaynakta açıkça **insan kaynakları yönetimine rehberlik eden yasaların çoğunun adalet yaklaşımına dayalı** olduğu belirtilir. Bu, eşit işe eşit ücret ve tutarlı kurallar gibi ilkelerle uyumludur."}, {"q": "İş etiğine deneysel/ampirik (\"ne\") ve normatif (\"ne olmalı\") yaklaşımların birleştirilmesini öneren, nispeten yeni yaklaşım hangisidir?", "opts": [{"t": "Adalet kuramı yaklaşımı"}, {"t": "Faydacılık (yararcılık) yaklaşımı"}, {"t": "Bütünleşik sosyal sözleşme kuramı"}, {"t": "Sosyoekonomik sorumluluk görüşü"}, {"t": "Haklar (bireyselcilik) yaklaşımı"}], "a": 2, "exp": "**Bütünleşik (bütünleştirici) sosyal sözleşme kuramı** nispeten yeni bir yaklaşımdır; **ampirik (ne)** ve **normatif (ne olmalı)** yaklaşımların birleştirilmesini önerir ve **iki sözleşmenin** entegrasyonuna dayanır."}, {"q": "Bütünleşik sosyal sözleşme kuramının dayandığı iki sözleşme ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Her iki sözleşme de yalnızca bir topluluğun üyeleri arasındadır"}, {"t": "Genel sosyal sözleşme kabul edilebilir davranış biçimlerini; spesifik sözleşme iş yapmanın temel kurallarını belirler"}, {"t": "Genel sözleşme hissedarlar, spesifik sözleşme çalışanlar arasındadır"}, {"t": "Genel sosyal sözleşme iş yapmanın temel kurallarını; spesifik sözleşme kabul edilebilir davranış biçimlerini belirler"}, {"t": "Her iki sözleşme de ulusal yasalarla yazılı hâle getirilmiştir"}], "a": 3, "exp": "İlki **iktisadi birimler/üyeler arasındaki genel sosyal sözleşme**dir ve **iş yapmanın temel kurallarını** belirler. Diğeri **bir topluluğun üyeleri arasındaki daha spesifik sözleşme**dir ve **kabul edilebilir davranış biçimlerini** kapsar. Bu iki işlevi yer değiştiren seçenek yanlıştır."}, {"q": "Türkiye'den bir işletme Romanya'nın bir şehrinde fabrika kurmuştur. Çalışanlara ödenecek ücretin orada yaşayanların mevcut ücret düzeyi baz alınarak belirlenmesi hangi yaklaşıma uygundur?", "opts": [{"t": "Prosedürel adalet yaklaşımı"}, {"t": "Haklar (bireyselcilik) yaklaşımı"}, {"t": "Bütünleşik sosyal sözleşme kuramı"}, {"t": "Dağıtım adaleti yaklaşımı"}, {"t": "Faydacılık (yararcılık) yaklaşımı"}], "a": 2, "exp": "Kaynaktaki örneğe göre ücret kararı, **bütünleşik sosyal sözleşme kuramına** göre **orada yaşayanların mevcut ücret düzeyleri** baz alınarak verilmelidir. Bu yaklaşımın diğer üçünden farkı, doğru/yanlışı ayırt ederken **endüstriler ve şirketler içinde var olan etik normların** dikkate alınmasını önermesidir.\n💡 \"Romada Romalı gibi\" – yerel topluluğun normu esas."}, {"q": "Kaynağa göre etik yaklaşımlar arasında daha çok taraftar bulan yaklaşım ve buna rağmen bu bakış açısının değişmesi ihtiyacını doğuran gelişmeler hangisinde doğru verilmiştir?", "opts": [{"t": "Haklar yaklaşımı; küreselleşme, keskin rekabet ve teknolojideki gelişmeler"}, {"t": "Adalet kuramı; hisselerin halka arzı ve paydaş sayısının giderek artması"}, {"t": "Faydacılık; kâr maksimizasyonu hedefinin işletmeler için önem kaybetmesi"}, {"t": "Faydacılık; bireysel haklar, sosyal adalet, çevrenin korunması gibi trendler"}, {"t": "Bütünleşik sosyal sözleşme; ulusal yasaların sayısının hızla çoğalması"}], "a": 3, "exp": "Etkinlik, üretkenlik ve yüksek kâr gibi işletme amaçlarını destekleyen **faydacılık** daha çok taraftar bulur. Ancak global iş dünyası–toplum etkileşimi, **bireysel haklar, sosyal adalet, doğal çevrenin korunması** gibi trendlerle **yararlılık kriterine dayalı olmayan** etik standartlara ihtiyaç doğurmuştur; bu nedenle günümüz işletmeleri **etik ikilemlerle daha çok** uğraşmaktadır."}, {"q": "Kaynağa göre örgüt içindeki bireylerin etik davranışta bulunup bulunmayacağı neyin sonucu oluşur?", "opts": [{"t": "Bireyin ahlaki gelişmişlik düzeyi ile pek çok faktörün karmaşık etkileşiminin"}, {"t": "Yalnızca işletmede yazılı etik kodların bulunup bulunmamasının"}, {"t": "Yalnızca bireyin aldığı eğitim düzeyinin ve mesleki deneyiminin"}, {"t": "Yalnızca yasal yaptırımların ağırlığının ve cezalandırılma olasılığının"}, {"t": "Yalnızca yöneticinin verdiği talimatların ve örgütteki hiyerarşik baskının"}], "a": 0, "exp": "Yöneticiler dâhil örgüt içindeki bireylerin etik davranıp davranmayacağı, **bireyin ahlaki gelişmişlik düzeyi ile pek çok faktör arasındaki karmaşık etkileşim** sonucu oluşur (Şekil 3.1). Tek bir faktöre indirgenemez."}, {"q": "Şekil 3.1'de (Robbins ve Coulter, 2007) \"muhakeme sürecini\" etkileyen faktörler arasında aşağıdakilerden hangisi YER ALMAZ?", "opts": [{"t": "Yasal yaptırımlar"}, {"t": "Yapısal değişkenler"}, {"t": "Sorunun etki gücü"}, {"t": "Bireysel karakteristikler"}, {"t": "Örgüt kültürü"}], "a": 0, "exp": "Şekil 3.1'de muhakeme sürecini etkileyen beş faktör: **bireysel karakteristikler, ahlaki gelişmişlik düzeyi, sorunun etki gücü, yapısal değişkenler, örgüt kültürü**. Akış: **etik sorunla karşılaşma → muhakeme süreci → etik/etik olmayan davranış**. Yasal yaptırımlar şekilde yoktur.\n💡 \"BASYÖ\": Bireysel, Ahlaki, Sorun, Yapısal, Örgüt kültürü."}, {"q": "Şekil 3.1'deki modele göre etik ya da etik olmayan davranışa giden süreç aşağıdakilerden hangisinde doğru sırayla verilmiştir?", "opts": [{"t": "Ahlaki gelişmişlik → Etik/etik olmayan davranış → Muhakeme süreci"}, {"t": "Etik sorunla karşılaşma → Muhakeme süreci → Etik/etik olmayan davranış"}, {"t": "Etik sorunla karşılaşma → Etik/etik olmayan davranış → Muhakeme süreci"}, {"t": "Muhakeme süreci → Etik sorunla karşılaşma → Etik/etik olmayan davranış"}, {"t": "Örgüt kültürü → Etik sorunla karşılaşma → Muhakeme süreci"}], "a": 1, "exp": "Şekil 3.1'de **etik sorunla karşılaşma** muhakeme sürecine girer; beş faktör **muhakeme sürecini** etkiler; sürecin çıktısı **etik/etik olmayan davranıştır**."}, {"q": "Bireyin ahlaki gelişmişlik düzeyini belirlemek için kullanılan üç aşamalı gelişim basamağı modeli kim tarafından, hangi yaklaşıma göre oluşturulmuştur?", "opts": [{"t": "Kohlberg – bilişsel gelişim yaklaşımı"}, {"t": "Carroll – paydaş yaklaşımı"}, {"t": "Crane ve Matten – stratejik yönetim yaklaşımı"}, {"t": "Robbins ve Coulter – davranışsal yaklaşım"}, {"t": "Hobbes – deneysel ahlak yaklaşımı"}], "a": 0, "exp": "Üç aşamalı ahlaki gelişim basamağı **Kohlberg (1976)** tarafından **bilişsel gelişim yaklaşımına** göre oluşturulmuştur. Robbins & Coulter Şekil 3.1'in, Crane & Matten etik yönetimi araçları ve Şekil 3.2'nin kaynağıdır."}, {"q": "Kohlberg'in ahlaki gelişim modeline göre \"kendisine yakın olan kişilerin beklentileri doğrultusunda yaşayan, kendisinin de onayladığı yükümlülükleri yerine getirerek var olan düzeni koruyan\" birey hangi düzeydedir?", "opts": [{"t": "Altkültür normlarına uyma düzeyi"}, {"t": "Etkileşimsel adalet düzeyi"}, {"t": "En üst basamak (ilkelere dayalı)"}, {"t": "İlk aşama"}, {"t": "İkinci gelişmişlik düzeyi"}], "a": 4, "exp": "Kohlberg: **1. aşama** – sadece kendi çıkarlarına uygun olduğunda ve/veya **fiziksel cezadan kaçınmak** için kurallara uyma; **2. düzey** – yakın kişilerin **beklentileri** doğrultusunda yaşama, **var olan düzeni koruma**; **en üst basamak** – **ilkelere dayalı** davranış.\n💡 1: Ceza/çıkar → 2: Çevre/düzen → 3: İlke."}, {"q": "Bir çalışan, çoğunluğun fikrine aldırmaksızın başkalarının haklarına saygı gösteriyor ve kanuna aykırı olsa bile kendi seçtiği etik ilkelere uygun karar veriyor. Kohlberg'e göre bu çalışan hangi düzeydedir?", "opts": [{"t": "Faydacı düzey"}, {"t": "En üst basamak – ilkelere dayalı davranış düzeyi"}, {"t": "Altkültür normlarına uyma düzeyi"}, {"t": "İkinci düzey – var olan düzeni koruma düzeyi"}, {"t": "İlk aşama – ceza ve çıkar düzeyi"}], "a": 1, "exp": "**En üst basamak**, **ilkelere dayalı** davranışın söz konusu olduğu düzeydir. Bu düzeydeki bireyler **çoğunluğun fikrine aldırmaksızın** diğerlerinin haklarına saygı ve etik değerlere sıkı bağlılık gösterir; **kanuna aykırı olsa bile** kendi seçtiği etik ilkelere uygun karar verir."}, {"q": "Kaynağa göre bireyin neyin doğru neyin yanlış olduğu konusundaki temel muhakemelerini belirleyen, erken yaşlarda ailesinden, arkadaşlarından ve öğretmenlerinden öğrendiği değerler hangi faktör başlığı altında ele alınmıştır?", "opts": [{"t": "Etik kodlar"}, {"t": "Yapısal değişkenler"}, {"t": "Örgüt kültürü"}, {"t": "Sorunun etki gücü"}, {"t": "Bireysel özellikler"}], "a": 4, "exp": "**Bireysel özellikler**: herkes örgüte nispeten **yerleşik değerleriyle** gelir; bu değerler erken yaşta aile, arkadaş, öğretmen vb.den öğrenilir ve **temel muhakemeleri** belirler. Yöneticiler, birbirinden çok farklı bireysel değerlere sahip çalışanlarla karşı karşıya olduklarının farkında olmalıdır."}, {"q": "Resmî kurallar ve düzenlemeler, iş tanımları ve etik kodlar, Şekil 3.1'deki hangi faktörün unsurları olarak örgüt içindeki belirsizliği ve yanlış anlamayı önemli ölçüde azaltır?", "opts": [{"t": "Bireysel özellikler"}, {"t": "Ahlaki gelişmişlik düzeyi"}, {"t": "Sorunun etki gücü"}, {"t": "Örgüt kültürü"}, {"t": "Yapısal değişkenler"}], "a": 4, "exp": "**Yapısal değişkenler**: örgütün yapısal tasarımı, etik davranışların oluşmasına yardımcı olur; bazı yapılar belirsizlik yaratırken bazıları çalışanlara güçlü şekilde yol gösterir. **Resmî kurallar, iş tanımları, etik kodlar** etik davranışı teşvik eder, tutarlı davranmayı yerleştirir ve **belirsizliği/yanlış anlamayı** azaltır."}, {"q": "Kaynağa göre örgüt kültürünün etik davranış üzerindeki etkisiyle ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Zayıf örgüt kültürleri, etik davranışı her koşulda olumlu yönde etkiler"}, {"t": "Örgüt kültürünün güçlülüğü, bireylerin etik davranışıyla doğrudan ilgisizdir"}, {"t": "Zayıf örgüt kültürlerinde bireyler büyük olasılıkla altkültürün normlarına uyar"}, {"t": "Çalışma grupları ve bölüm standartları örgüt içi davranışı etkilemez"}, {"t": "Güçlü kültürlerin, bireylerin etik davranışı üzerindeki etkisi oldukça azdır"}], "a": 2, "exp": "Örgüt kültürünün **özellikleri ve güçlülüğü** etik davranışı etkiler. **Güçlü** ve yüksek etik standartların desteklendiği kültür etik davranışı **olumlu** etkiler. **Zayıf** kültürlerde bireyler büyük olasılıkla **altkültürün normlarına** uygun davranır. Çalışma grupları ve bölüm standartları da davranışı güçlü şekilde etkileyebilir."}, {"q": "Bir çalışanın iş yerinden birkaç malzemeyi evine götürmekte tereddüt etmezken şirketin parasını zimmete geçirme konusunda son derece duyarlılık göstermesi, etik davranışı etkileyen hangi faktörü açıklar?", "opts": [{"t": "Bireysel özellikler"}, {"t": "Dağıtım adaleti"}, {"t": "Yapısal değişkenler"}, {"t": "Örgüt kültürü"}, {"t": "Sorunun etki gücü"}], "a": 4, "exp": "Bu örnek **sorunun etki gücünü** gösterir: etik meselenin **özellikleri** etik davranışı etkiler. Ölçütler: davranışın taraflara **ne büyüklükte zarar/yarar** sağladığı, iyi/kötü olduğu konusunda **uzlaşma** olup olmadığı, zarar/faydanın **gerçekleşme olasılığı**. Çalışanlar önemli gördükleri konularda etik davranmaya daha özenli yaklaşır."}, {"q": "Sorunun etki gücünü belirlemek için kaynakta sayılan ölçüler arasında aşağıdakilerden hangisi YOKTUR?", "opts": [{"t": "Davranışın taraflarına sağladığı zarar ya da yararın büyüklüğü"}, {"t": "Öngörülen zarar ya da faydanın gerçekleşme olasılığı"}, {"t": "Davranışı gerçekleştiren kişinin örgütteki kıdemi"}, {"t": "Davranıştan etkilenen tarafların gördüğü zararın büyüklüğü"}, {"t": "Davranışın iyi ya da kötü olduğu konusunda uzlaşma olup olmadığı"}], "a": 2, "exp": "Kaynaktaki ölçüler: **zarar/yararın büyüklüğü**, davranışın iyiliği/kötülüğü konusunda **uzlaşma**, zarar/faydanın **gerçekleşme olasılığı**. Kişinin kıdemi sayılmamıştır."}, {"q": "Kaynaktaki DİKKAT kutusuna göre kuruluşlar etiğe stratejik olarak yaklaşırlarsa ne olur?", "opts": [{"t": "Kârları kısa vadede mutlaka ve belirgin biçimde artar"}, {"t": "Riskleri minimize ederler; cezalandırılma riskleri de düşer"}, {"t": "Sosyal denetime ve raporlamaya tabi olmazlar"}, {"t": "Yasal yükümlülüklerden kısmen ya da tamamen muaf olurlar"}, {"t": "Etik ikilemlerle hiçbir koşulda karşılaşmazlar"}], "a": 1, "exp": "DİKKAT kutusu: kuruluşlar etiğe **stratejik** yaklaşırlarsa **riskleri minimize** ederler; bu nedenle **cezalandırılma riskleri de düşer**."}, {"q": "\"Spesifik politikalar, pratikler ve programlar aracılığı ile etik konuların ya da sorunlarının formal ya da informal yönetilmesine yönelik doğrudan girişimler\" hangi kavramın tanımıdır?", "opts": [{"t": "Etik kod"}, {"t": "Sosyal denetim"}, {"t": "Risk yönetimi"}, {"t": "İş etiği yönetimi"}, {"t": "Kurumsal iletişim"}], "a": 3, "exp": "**İş etiği yönetimi**, spesifik politika, pratik ve programlarla etik konuların **formal ya da informal** yönetilmesine yönelik **doğrudan girişimlerdir**. Bu girişimler etik olmayan davranışları azaltmada etkili oldukları için değerlidir. **Sosyal denetim** ise sosyal sorumluluk performansının değerlendirilmesidir."}, {"q": "Crane ve Matten'e (2010) göre özellikle belirli büyüklükteki şirketlerin iş etiği yönetiminde kullandığı güncel yaklaşım ve araçlar arasında aşağıdakilerden hangisi YER ALMAZ?", "opts": [{"t": "Paydaşlara danışma, diyalog ve iş birliği"}, {"t": "Denetim, hesap verme ve raporlama"}, {"t": "Performansa dayalı prim sistemi"}, {"t": "Raporlama/tavsiye kanalları"}, {"t": "Misyon ve/veya değerler bildirgesi"}], "a": 2, "exp": "Dokuz araç: **misyon/değerler bildirgesi, etik kodlar, raporlama/tavsiye kanalları, risk analizi ve yönetimi, etik yöneticisi/sorumlusu/komiteleri, etik danışmanları, etik eğitimi, paydaşlara danışma-diyalog-iş birliği, denetim-hesap verme-raporlama**. Prim sistemi listede yoktur."}, {"q": "Kaynağa göre misyon ifadeleri kısaca neyi açıklar?", "opts": [{"t": "İşletmenin varlık nedenini"}, {"t": "Etik ihlallerin cezalarını"}, {"t": "Çalışanların ücret düzeyini"}, {"t": "İşletmenin yıllık kâr hedefini"}, {"t": "İşletmenin tabi olduğu yasaları"}], "a": 0, "exp": "**Misyon ifadeleri kısaca işletmenin varlık nedenini açıklar.** İçeriğinde kurum felsefesi, iş yapma felsefesi, işletmenin kendini nasıl gördüğü, hangi ürün/hizmetle hangi pazarlara ulaşacağı, teknolojisi, büyüme-kârlılık düşünceleri ve vermek istediği imaj yer alır. İşletmenin **vizyonuna hangi görevi üstlenerek ulaşacağını** netleştirdiği için önemlidir."}, {"q": "Kaynağa göre sosyal amaçlardan söz eden misyon ifadelerinin amacına ulaşabilmesi için ne gerekir?", "opts": [{"t": "Değişen koşullara uyum için her yıl yeniden yazılması"}, {"t": "Yalnızca işletmenin web sitesinde kamuya duyurulması"}, {"t": "Yalnızca tepe yönetimince bilinip gizli tutulması"}, {"t": "Yasal düzenlemelerle işletmeler için zorunlu hâle getirilmesi"}, {"t": "Örgüt bütününü kapsayan bir etik yönetimiyle desteklenmesi"}], "a": 4, "exp": "Misyon ifadeleri bazen sosyal amaçlardan açıkça bahsetmez; bahsedenler de bu amacın **çalışanların davranışlarına yansıyıp yansımadığı** konusunda ipucu vermez. Bu yüzden iyi bir sosyal misyon, **örgütün bütününü kapsayan yerleşik bir etik yönetimiyle** desteklenmelidir; aksi hâlde **sadece bir dilek olarak yazıda kalır**."}, {"q": "Kaynağa göre değer bildirgeleri ve değerlerle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Değerler yalnızca belirgin kuralların olduğu koşullarda etik karara yol açar"}, {"t": "İşletmelerin açıkladığı değerler, öncelikli olan değerlerdir"}, {"t": "Kişinin kendi başına verdiği kararların kökeninde değerler yer alır"}, {"t": "Değer bildirgeleri işletmede neyin öncelikli değer olduğunu ortaya koyar"}, {"t": "Değer bildirgeleri çalışanları cesaretlendirip etik davranışa yönlendirir"}], "a": 0, "exp": "Değerler, **hiçbir belirgin kuralın olmadığı koşullarda** etik karar almaya yol açar; \"yalnızca belirgin kuralların olduğu koşullarda\" ifadesi bu yüzden yanlıştır. Değer bildirgeleri **öncelikli değerleri** ortaya koyar, çalışanlara yol gösterip etik davranışa yönlendirir; kişinin kendi başına verdiği kararların kökeninde değerler vardır."}, {"q": "Örgütün bütününde geçerli olacak ortak değerlerin katılımcı bir yöntemle, tüm kesimlerin temsilcileriyle birlikte belirlendiği yaklaşım hangisidir?", "opts": [{"t": "Prosedürel adalet"}, {"t": "Klasik görüş"}, {"t": "Risk yönetimi"}, {"t": "Bütünleşik sosyal sözleşme"}, {"t": "Değerlere dayalı yönetim"}], "a": 4, "exp": "**Değerlere Dayalı Yönetim**de ortak değerler **katılımcı bir yöntemle, tüm kesimlerin temsilcileriyle** belirlenir. Değerler işletmede neye inanıldığını ve neyin savunulduğunu belirtir; değerler hem etik yönetiminin unsuru hem de **etiksel yönetim yaklaşımının temelidir**."}, {"q": "Kaynağa göre paylaşılan değerler oluşturmanın amaçları arasında aşağıdakilerden hangisi YOKTUR?", "opts": [{"t": "Hissedarlara garantili kâr payı sağlamak"}, {"t": "Çalışanların davranışlarını biçimlendirmek"}, {"t": "İşletme bütününde takım ruhu oluşturmak"}, {"t": "Yöneticilerin karar ve eylemlerine rehberlik etmek"}, {"t": "Pazarlama çabalarını etkilemek"}], "a": 0, "exp": "Paylaşılan değerler **örgüt kültürünü şekillendirir**. Amaçları: **yöneticilerin karar ve eylemlerine rehberlik etmek, çalışanların davranışlarını biçimlendirmek, pazarlama çabalarını etkilemek, takım ruhu oluşturmak**.\n💡 \"Yönet–Biçimle–Pazarla–Takım\"."}, {"q": "\"Belirli bir işletme, meslek grubu veya endüstri içinde etiksel açıdan çalışanlardan/üyelerden beklenen ve istenen davranış türlerini açıklayan bildirgeler\" nedir ve etik yönetimindeki yeri nedir?", "opts": [{"t": "Değer bildirgeleri; yalnızca küçük işletmelerde kullanılır"}, {"t": "Sosyal sorumluluk raporları; yasal zorunluluktur"}, {"t": "Etik eğitimi programları; yalnızca üniversitelerde uygulanır"}, {"t": "Etik kodlar; etik yönetiminde en yaygın yaklaşımdır"}, {"t": "Misyon bildirgeleri; etik yönetiminde en az kullanılan araçtır"}], "a": 3, "exp": "**Etik kodlar**, yazılı etik ilkelerin geliştirilmesiyle davranış standartları oluşturmanın ve sürekli güncel tutmanın bir yoludur. **Etik yönetiminde en yaygın yaklaşım etik kodların oluşturulmasıdır.** Kuruluşlar bulundukları sektörün etik yasalarına uymayı da taahhüt edebilir."}, {"q": "Kaynakta, üyelerinden \"üçlü sorumluluk\" anlayışına göre iş yapmalarını ve raporlamalarını beklediği belirtilen kuruluş hangisidir?", "opts": [{"t": "Türkiye Kimya Sanayicileri Derneği"}, {"t": "İstanbul Sanayi Odası (İSO)"}, {"t": "Etik ve İtibar Derneği (TEİD)"}, {"t": "Türkiye Odalar ve Borsalar Birliği (TOBB)"}, {"t": "Türkiye Etik Değerler Merkezi (TEDMER)"}], "a": 0, "exp": "Kaynağa göre **Türkiye Kimya Sanayicileri Derneği** üyelerinden **üçlü sorumluluk** anlayışına göre iş yapmalarını ve raporlamalarını bekler. TEDMER, TOBB, İSO sivil toplum/meslek kuruluşlarına örnek olarak, TEİD ise etik kodu verilen dernek olarak geçer."}, {"q": "Kaynakta üyeleri için etik rehberler ve meslek ilkeleri hazırlayan sivil toplum/meslek kuruluşlarına örnek olarak verilen kısaltmalar ile açılımları hangisinde doğru eşleşmiştir?", "opts": [{"t": "TEİD – Türkiye Etik İşletmeler Derneği"}, {"t": "İSO – İzmir Sanayi Odası"}, {"t": "TEDMER – Türkiye Ekonomik Denetim Merkezi"}, {"t": "TOBB – Türkiye Organize Bölgeler Birliği"}, {"t": "TEDMER – Türkiye Etik Değerler Merkezi"}], "a": 4, "exp": "Kaynaktaki açılımlar: **TEDMER – Türkiye Etik Değerler Merkezi**, **TOBB – Türkiye Odalar ve Borsalar Birliği**, **İSO – İstanbul Sanayi Odası**, **TEİD – Etik ve İtibar Derneği**."}, {"q": "Etik ve İtibar Derneği (TEİD) üyeleri, sorumlu iş modelinin özünü teşkil eden kaç temel ilkeye olan inançlarını beyan eder; ayrıca hangi uluslararası belgenin özünü oluşturan kaç ilkeye desteklerini bildirir?", "opts": [{"t": "12 ilke; BM Küresel İlkeler Sözleşmesi'nin 9 ilkesi"}, {"t": "10 ilke; BM Küresel İlkeler Sözleşmesi'nin 13 ilkesi"}, {"t": "9 ilke; OECD İlkeleri'nin 10 ilkesi"}, {"t": "13 ilke; BM İnsan Hakları Evrensel Bildirgesi'nin 10 ilkesi"}, {"t": "13 ilke; BM Küresel İlkeler Sözleşmesi'nin 10 ilkesi"}], "a": 4, "exp": "TEİD üyeleri **13 temel ilkeye** inançlarını beyan eder; bunlardan biri de **Birleşmiş Milletler Küresel İlkeler Sözleşmesi'nin özünü oluşturan 10 temel ilkeye** desteğin beyanıdır.\n💡 TEİD = 13, BM Küresel İlkeler = 10."}, {"q": "TEİD etik kodunda yer alan ilkelerle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Kayıt dışı istihdamda bulunulmaz; gençlerin, kadınların ve engellilerin adil istihdamı desteklenir"}, {"t": "Tarafsızlığı etkileyecek hediyeler belirli bir tutarın altındaysa kabul edilebilir"}, {"t": "Doğruluk ve şeffaflık tüm iş süreçlerinde öncelikli değerler olarak kabul edilir"}, {"t": "Kamu kurumları, sivil toplum örgütleri ve siyasi partilere menfaat beklentisi olmaksızın eşit mesafede durulur"}, {"t": "İş etiği ilkelerinin iş ortakları ve tedarikçiler dâhil tüm etki alanlarına yayılması sağlanır"}], "a": 1, "exp": "TEİD kodunda çalışanların tarafsız karar ve davranışlarını etkileyecek **hediyeler almasını ve aynı amaçla hediye vermesini yasaklarız** denir; tutar sınırına dayalı bir istisna yoktur. Diğer şıklar kodda aynen yer alır (eşit mesafe, kayıt dışı istihdam yasağı, doğruluk-şeffaflık, etki alanına yayma)."}, {"q": "TEİD etik kodunda aşağıdaki taahhütlerden hangisi YER ALIR?\nI. Yolsuzluklara yol açmamak, göz yummamak ve yolsuzlukla mücadele etmek\nII. Haksız rekabette bulunmamak, adil rekabeti ve tüketici haklarını gözetmek\nIII. Çalışanların mevcut görevlerinden yararlanarak kişisel çıkar sağlamalarını yasaklamak ve denetlemek", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Üçü de TEİD kodundadır: **yolsuzlukla mücadele**, **adil rekabet ve tüketici hakları**, çalışanları **çıkar çatışmalarından** uzak tutup görevden kişisel çıkar sağlamayı **yasaklamak ve denetlemek**. Ayrıca Anayasa başta tüm mevzuata uyum, beyan ve raporların gerçeğe uygunluğu, iş etiğinin yazılı kurum kültürünün yapı taşı olması, ekonomik ve sosyal kalkınmaya katkı da koddadır."}, {"q": "Kaynağa göre raporlama/tavsiye kanallarının etik yönetimindeki işlevi aşağıdakilerden hangisidir?", "opts": [{"t": "Çalışan geri bildirimleriyle etik değerleri korumak, tüketiciye yansıyabilecek ihlalleri önlemek"}, {"t": "Çalışanların ücret ve özlük haklarına ilişkin taleplerini doğrudan tepe yönetimine iletmek"}, {"t": "Yalnızca finansal tabloların bağımsız denetçilerce denetlenmesini ve raporlanmasını sağlamak"}, {"t": "Rakip işletmelerin etik ihlallerini tespit edip bunları kamuoyuna ve basına duyurmak"}, {"t": "Hisse senetlerinin halka arzını kolaylaştırmak ve işletmenin yatırımcı sayısını artırmak"}], "a": 0, "exp": "Raporlama/tavsiye kanallarında **çalışanlardan gelecek bilgi ve geri bildirimler**, kanal ne olursa olsun, **etik değerlerin korunmasını** sağlar ve **tüketicilere yansıyabilecek potansiyel etik ihlallerin** önüne geçmek için önemli bir bilgi kanalıdır. Bilgi toplama hem bilgi birikimi hem **efektif yönetim** açısından fayda sağlar; işletmeler önceden duyurdukları etik değer bildirileriyle çalışanlarını bilgilendirir."}, {"q": "Kaynağa göre günümüzde iş etiği açısından değerlendirilmeye alınan en önemli konular hangileridir?", "opts": [{"t": "Fiyat rekabeti, reklam, ambalaj"}, {"t": "Kopya çekme, intihal, hilekârlık"}, {"t": "Kişisel bilgilerin gizliliği, izinsiz e-posta, e-ticaret"}, {"t": "İnsan hakları ihlalleri, yolsuzluklar, küresel ısınma"}, {"t": "Vergi kaçakçılığı, kayıt dışı istihdam, enflasyon"}], "a": 3, "exp": "Risk analizi ve yönetimi başlığında, günümüzde iş etiği açısından en önemli konuların **insan hakları ihlalleri, yolsuzluklar ve küresel ısınma** olduğu, bunların birçok işletmeyi ilgilendiren konular hâline geldiği belirtilir. Kişisel bilgilerin gizliliği, izinsiz e-posta ve e-ticaret ise e-ticaretle ilgili etik konulardır."}, {"q": "Risk analizi ve yönetimi başlığı altında kaynakta belirtilen bilgilerle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Risk yönetimi iş etiğinin de ilgi alanlarından biridir"}, {"t": "Risk yönetimi ve risklerin azaltılması günümüzde işletmelerin en çok üzerinde durduğu konulardandır"}, {"t": "İşletmenin basın ve halkla ilişkilerde kullandığı dil, faaliyet gösterdiği coğrafyanın değerleriyle çatışmamalıdır"}, {"t": "İş etiği, içeriği sabit ve durağan bir yapıya sahiptir"}, {"t": "Risk yönetimi teknikleriyle geliştirilecek iş etiği uygulamaları çevre kirliliği gibi konularda olumlu imaj yaratabilir"}], "a": 3, "exp": "Kaynağa göre iş etiği konusu **durağan olmayan**, işletmeler gibi **dinamik** ve içeriğine sürekli yeni konu başlıkları eklenen bir yapıya sahiptir; \"sabit ve durağan\" ifadesi yanlıştır. Diğerleri doğrudur: risk yönetimi en çok durulan konulardandır, kullanılan dil coğrafyanın değerleriyle **çatışmamalı**, çevre kirliliği ve **çevre dostu materyal** gibi konularda olumlu imaj yaratılabilir."}, {"q": "Kaynağa göre işletmelerin kuruculuğunu üstlendiği etik komiteleri nasıl çalışır?", "opts": [{"t": "Yalnızca hissedarlara karşı sorumludur ve onlara yıllık rapor sunar"}, {"t": "İşletme içinde departman gibi çalışıp tepe yönetimine tavsiye kararları alır"}, {"t": "İşletmeden bağımsız bir mahkeme gibi çalışanlara bağlayıcı cezalar verir"}, {"t": "Yalnızca çevre mühendislerinden oluşur ve çevre mevzuatını izler"}, {"t": "Devlet adına işletmeleri denetler ve kamu otoritesine rapor verir"}], "a": 1, "exp": "Etik komiteleri işletme içinde **bir departman gibi** çalışır ve kurumsal sorumluluk alanında **tepe yönetimine iletilmek üzere tavsiye kararları** alır. Ayrıca **ücretsiz telefon hatlarıyla** etik komitelerine ya da danışmanlarına ulaşılabilmesi, çalışanları etikle bağdaşmayan uygulamaları bildirmeye yöneltmek için yararlıdır."}, {"q": "Kaynakta, işletmelerin uyması gereken kurallar ve yasal zorunluluklar konusunda danışmanlık yaparak işletmenin iş etiği konusunda diğer kuruluş ve tüzel kişilerle ilişkilerini yönetmesine yardımcı olan uzmanlara örnek olarak kim verilmiştir?", "opts": [{"t": "Mali müşavirler"}, {"t": "Halkla ilişkiler uzmanları"}, {"t": "Çevre mühendisleri"}, {"t": "İnsan kaynakları uzmanları"}, {"t": "Avukatlar"}], "a": 2, "exp": "**Etik danışmanları** başlığında, özellikle içinde yaşadığımız çevreyle ilgili olarak **çevre mühendislerinin** yaptığı danışmanlık çalışmalarının işletmenin iş etiği ilişkilerini yönetmesine yardımcı olduğu belirtilir. İş etiği danışmanları günümüzde kurumsal bir yapıya bürünerek işletmelerce **istihdam** edilebilmektedir."}, {"q": "Etik eğitimi ile ilgili olarak kaynakta aşağıdakilerden hangisi belirtilmiştir?", "opts": [{"t": "Etik eğitimi ancak işe başladıktan ve deneyim kazanıldıktan sonra verilmelidir"}, {"t": "Etik eğitimine profesyonel yaşamdan önce, akademik ortamda başlanması önerilir"}, {"t": "Etik eğitiminde teknoloji kullanımı önerilmez; yüz yüze eğitim esastır"}, {"t": "Etik eğitimi yalnızca gelişmiş ülkelerde yaygınlık kazanmaktadır"}, {"t": "Etik eğitiminin içeriğini ve kapsamını yalnızca devlet kurumları belirler"}], "a": 1, "exp": "Etik eğitiminin **akademik ortamlardan başlanarak**, **işe başlamadan önce** verilmesi önerilir. Eğitim gelişmiş **ve gelişmekte olan** ülkelerin çoğunda yaygınlaşmaktadır; içeriği konusunda **üniversiteler, danışmanlar ve diğer birimler** çalışır. Çalışan sayısı yüksek kuruluşlar eğitimde **teknolojiden** de yararlanır."}, {"q": "Kaynakta, çalışanların tüketicilerle kurduğu diyalogların daha sonra etik açıdan değerlendirildiği ve böylece etik kodların öğretildiği simülasyon oyunu örneği hangi işletmeye aittir?", "opts": [{"t": "Japon bir otomotiv firması"}, {"t": "Alman bir enerji şirketi"}, {"t": "Türk bir kimya şirketi"}, {"t": "Amerikan bir bankacılık şirketi"}, {"t": "İsveçli bir ilaç firması"}], "a": 4, "exp": "Etik eğitiminde teknolojiden yararlanmaya örnek olarak **İsveçli bir ilaç firmasının** kullandığı, işletmenin etik yaklaşımını öğretme amaçlı **simülasyon oyunu** verilmiştir."}, {"q": "Kaynağa göre işletmelerin hisselerini halka arz etmesinin etik karar verme süreci açısından sonucu nedir?", "opts": [{"t": "Kararları etkileyen ve kararlardan etkilenen kişi sayısını artırır"}, {"t": "İşletmenin paydaş sayısını ve paydaş çeşitliliğini azaltır"}, {"t": "Etik değerlerin karar sürecindeki önemini tamamen ortadan kaldırır"}, {"t": "Kurumsal iletişim çabalarına duyulan ihtiyacı önemli ölçüde azaltır"}, {"t": "Tutundurma çalışmalarına yönelik kararları etik dışı bırakır"}], "a": 0, "exp": "Hisselerin **halka arzı**, kararları doğrudan etkileyen ve kararlardan doğrudan etkilenen **kişi sayısını artırır**. Paydaşların çokluğu, kişisel özellikleri ve profesyonel hayata bakışları etik yaklaşımı da etkiler. **Tutundurma** kararlarında etik değerlerin dikkate alınması daha da önemlidir; **kurumsal iletişim** çabaları kurumsal sorumlulukta diyalog ve tartışma platformudur."}, {"q": "Kaynakta aktarılan araştırmaya göre kurumsal sorumluluk raporu yayınlama oranının en yüksek ve en düşük olduğu ülkeler ile oranları hangisinde doğru verilmiştir?", "opts": [{"t": "En yüksek ABD (%90), en düşük Meksika (%20)"}, {"t": "En yüksek Japonya (%80), en düşük Türkiye (%20)"}, {"t": "En yüksek Japonya (%90), en düşük Meksika (%20)"}, {"t": "En yüksek Japonya (%62), en düşük Meksika (%10)"}, {"t": "En yüksek İsveç (%90), en düşük Japonya (%20)"}], "a": 2, "exp": "Günümüz işletmeleri ve özellikle **ilk 250 içindeki büyük işletmeler** kurumsal sorumluluk raporları yayımlar. Rapor yayınlama oranı **%90 ile en çok Japonya'da**, **%20 ile en az Meksika'da**dır.\n💡 \"Japonya Doksan, Meksika Yirmi\"."}, {"q": "\"İşletmelerin sosyal sorumluluk performansının değerlendirilmesi\" hangi kavramla ifade edilir?", "opts": [{"t": "Risk analizi"}, {"t": "Etik denetim"}, {"t": "Sosyal denetim"}, {"t": "Kurumsal iletişim"}, {"t": "Paydaş diyaloğu"}], "a": 2, "exp": "DİKKAT kutusu: **Sosyal denetim**, işletmelerin **sosyal sorumluluk performansının değerlendirilmesidir.** Ünitenin anahtar kavramlarından biridir."}, {"q": "İşletme yönetimlerinin tek sosyal sorumluluğunun kâr maksimizasyonu olduğunu savunan görüş ve bu görüşün en hararetli savunucusu hangisidir?", "opts": [{"t": "Klasik/ekonomik görüş – Milton Friedman"}, {"t": "Faydacılık – John Stuart Mill"}, {"t": "Klasik görüş – Archie B. Carroll"}, {"t": "Sosyoekonomik görüş – Milton Friedman"}, {"t": "Sosyoekonomik görüş – Kohlberg"}], "a": 0, "exp": "**Klasik (ekonomik) görüş**, yönetimin tek sosyal sorumluluğunun **kâr maksimizasyonu** olduğunu söyler. En hararetli savunucusu ekonomist ve Nobel ödüllü **Milton Friedman**'dır: yöneticilerin temel sorumluluğu **hissedarların/şirket sahiplerinin çıkarlarını** en iyi koruyacak şekilde işi yürütmektir; sahipler tek şeyle ilgilenir: **finansal kazanç**."}, {"q": "Milton Friedman'ın görüşleriyle ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Organizasyonların tek sosyal sorumluluğunun hissedarlar için kârı maksimize etmek olduğunu söyler"}, {"t": "Şirket sahiplerinin tek ilgilendiği şeyin finansal kazanç olduğunu ileri sürer"}, {"t": "Temel faaliyet dışı harcamaların ya ürün fiyatına ya da sahiplerin kâr paylarına yansıyacağını ileri sürer"}, {"t": "Organizasyonların hiçbir sosyal sorumluluk taşımaması gerektiğini savunur"}, {"t": "Yöneticilerin örgüt kaynaklarını \"toplumun iyiliği\" için harcama kararı alamayacağını savunur"}], "a": 3, "exp": "Kaynak özellikle uyarır: Friedman organizasyonların sosyal sorumluluk **taşımamaları gerektiğini söylemiyor**; tam tersine **bir tek sosyal sorumluluğu** olduğunu söylüyor: **hissedarlar için kârın maksimize edilmesi**. Toplum için yapılan harcamalar ilave maliyettir ve ya **yüksek fiyat** ödeyen müşterilere ya da **daha az kâr payı** alan sahiplere yansır."}, {"q": "Yönetimin sosyal sorumluluğunun kâr elde etmenin ötesinde toplumun refahını korumayı ve iyileştirmeyi de kapsadığını savunan görüş hangisidir?", "opts": [{"t": "Ekonomik görüş"}, {"t": "Bireyselcilik"}, {"t": "Faydacılık"}, {"t": "Sosyoekonomik görüş"}, {"t": "Klasik görüş"}], "a": 3, "exp": "**Sosyoekonomik görüş**: şirketler sadece patronlarına karşı sorumlu bağımsız varlıklar değildir; kanun ve düzenlemelerle yapılarını oluşturan, ürünlerini satın alarak destekleyen **toplumun daha büyük bir kesimine** karşı da sorumludur. İşletmeler **tümüyle ekonomik kurumlar değildir**; toplum onların sosyal, politik, yasal, çevresel meselelerle uğraşmasını bekler."}, {"q": "Kaynakta sosyoekonomik görüşü destekleyen araştırma kaç ülkeden kaç yöneticiyle yapılmıştır?", "opts": [{"t": "42 ülkeden 1160 yönetici"}, {"t": "116 ülkeden 4200 yönetici"}, {"t": "250 ülkeden 4200 yönetici"}, {"t": "116 ülkeden 250 yönetici"}, {"t": "25 ülkeden 25.000 yönetici"}], "a": 1, "exp": "**116 ülkeden 4200 yöneticiyle** yapılan araştırma sosyoekonomik görüşü desteklemektedir: katılımcıların büyük çoğunluğu, şirketlerin toplumdaki rolünün **ortakların çıkarlarını korumanın ötesini** kapsadığında hemfikirdir. (25.000 ise kopya araştırmasındaki öğrenci sayısıdır.)"}, {"q": "Kaynağa göre yatırımcılar cephesinde ortaya çıkan yeni eğilim aşağıdakilerden hangisidir?", "opts": [{"t": "Yatırımcıların halka arzlardan kaçınıp yalnızca devlet tahvillerine yönelmeyi tercih etmesi"}, {"t": "Yatırımcıların etik kodu olan şirketlerin hisselerinden uzak durup kısa vadeli getiriye yönelmesi"}, {"t": "Yatırımcıların şirketlerin sosyal sorumluluk raporlarını yatırım kararında dikkate almaması"}, {"t": "Kimi yatırımcıların sosyal sorumlu şirketleri seçmesi ya da aracı kuruma bu yönde talimat vermesi"}, {"t": "Yatırımcıların sosyal sorumluluk yerine yalnızca kısa vadeli kâr payına odaklanmaya başlaması"}], "a": 3, "exp": "Yeni eğilim: kimi potansiyel hisse yatırımcıları **sosyal sorumlu şirketleri tercih etmekte** ya da **aracı kurumlarına bu yönde talimat** vermektedir."}, {"q": "Kaynakta sosyoekonomik görüşün günümüzde ağırlıklı olarak kabul görmesinin nedenleri arasında aşağıdakilerden hangisi SAYILMAMIŞTIR?", "opts": [{"t": "Yüksek nitelikli işgücünün işletme tercihinde kurumsal itibarın önemli bir faktör olması"}, {"t": "İşletmelerin aşırı büyümesi ve büyük çaplı kaynak kullanımı"}, {"t": "Devletin işletmelere sosyal sorumluluk harcamaları için vergi muafiyeti tanıması"}, {"t": "Topluma katkının daha güvenli, eğitimli ve adil bir toplum için uzun dönemli yatırım olması"}, {"t": "Tüketici ve yatırımcı tercihlerinin sosyal sorumlu kurum, marka ve ürünlere kayması"}], "a": 2, "exp": "Kaynaktaki nedenler: işletmelerin **aşırı büyümesi**, **büyük çaplı kaynak kullanımı**, **toplum sağlığı** üzerindeki rolü, **doğal çevreye etkileri**; tüketici ve yatırımcı tercihlerinin sosyal sorumlu kurumlara kayması; **nitelikli işgücü** için kurumsal itibar; topluma katkının **uzun dönemli yatırım** olması ve sağlıklı rekabet koşulları. Vergi muafiyeti geçmez."}, {"q": "Kaynakta sosyal sorumlu uygulamalar bağlamında incelenmesi önerilen \"Haydi Kızlar Okula\" kampanyası hangi kuruluşun sitesinde yer almaktadır?", "opts": [{"t": "OECD"}, {"t": "UNICEF"}, {"t": "Dünya Bankası"}, {"t": "TOBB"}, {"t": "TEİD"}], "a": 1, "exp": "İNTERNET kutusunda \"**Haydi kızlar okula**\" kampanyası için **UNICEF** Türkiye sitesinin ziyaret edilmesi önerilir."}, {"q": "Kaynağa göre aşağıdaki tanımlardan hangisi tek başına sosyal sorumluluğu tanımlamaya YETERLİ kabul edilmiştir?", "opts": [{"t": "Sosyal sorumluluk, işletmenin kâr etmenin ötesine geçerek topluma kaynak aktarmasıdır"}, {"t": "Sosyal sorumluluk, işletmenin yasalara uyarak sadece kâr elde etmesi ve sürdürmesidir"}, {"t": "Sosyal sorumluluk, işletmenin geniş açıdan sosyal sisteme ilgi göstermesi ve onu gözetmesidir"}, {"t": "Yasal-ekonomik yükümlülüklerin yanında toplum yararına doğru şeyleri doğru yöntemle yapma niyeti"}, {"t": "Sosyal sorumluluk, işletmenin yasal zorunluluk olmaksızın gönüllü faaliyetlerde bulunmasıdır"}], "a": 3, "exp": "Kaynağa göre \"sadece kâr\", \"kârın ötesine geçmek\", \"gönüllü faaliyet\", \"sosyal sisteme ilgi\" tanımlarının **hiçbiri tek başına** sosyal sorumluluğu tanımlamaz. Sosyal sorumluluk, işletmenin **yasal ve ekonomik yükümlülüklerinin yanı sıra** toplumun iyiliği için **doğru şeyleri doğru yöntemlerle** yapma niyetidir."}, {"q": "Kaynağa göre sosyal sorumluluk, kurumların hangi kesimlerin yaşam kalitesini yükseltirken aynı zamanda ekonomik gelişmeye katkı sağlamaları anlamını içerir?", "opts": [{"t": "Toplumun, çalışanlarının ve ailelerinin"}, {"t": "Yalnızca hissedarlarının ve ortaklarının"}, {"t": "Yalnızca müşterilerinin ve tüketicilerin"}, {"t": "Yalnızca yöneticilerinin ve yönetim kurulunun"}, {"t": "Yalnızca tedarikçilerinin ve iş ortaklarının"}], "a": 0, "exp": "Sosyal sorumluluk, kurumların **içinde yaşadıkları toplumun, çalışanlarının ve onların ailelerinin** yaşam kalitesini yükseltirken **ekonomik gelişmeye** de katkı sağlamalarıdır; bu nedenle işletmelerin bu sorumlulukları operasyon ve ilişkilerine **entegre** etmeleri beklenir."}, {"q": "Kaynakta \"organizasyonun paydaşları üzerindeki olumsuz etkisini minimize, olumlu etkisini maksimize etme yükümlülüğü\" olarak tanımlanan kavram hangisidir?", "opts": [{"t": "Etik kod"}, {"t": "Sosyal sorumluluk"}, {"t": "İş etiği"}, {"t": "Hayırseverlik"}, {"t": "Sosyal denetim"}], "a": 1, "exp": "**Sosyal sorumluluk**, organizasyonun paydaşları üzerindeki **olumsuz etkisini minimize, olumlu etkisini maksimize** etme yükümlülüğüdür. Etik ve sosyal sorumluluk farklı anlamlara sahip olsa da **birbiri yerine kullanılabilmektedir**."}, {"q": "Kaynakta iş etiği ve sosyal sorumluluk arasındaki ilişki için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "İki kavram tamamen aynı anlama gelir; aralarında hiçbir anlam farkı bulunmamaktadır"}, {"t": "İş etiği yalnızca hayırseverlik faaliyetlerini, sosyal sorumluluk yalnızca kâr hedefini kapsar"}, {"t": "İş etiği karar almaya rehberlik eden kuralları içerir; sosyal sorumluluk toplumla yapılmış sözleşmedir"}, {"t": "Sosyal sorumluluk karar almaya rehberlik eden kurallardır; iş etiği toplumla yapılmış sözleşmedir"}, {"t": "Sosyal sorumluluk yalnızca yasal yükümlülükleri, iş etiği yalnızca ekonomik yükümlülükleri kapsar"}], "a": 2, "exp": "**İş etiği**: karar almaya rehberlik eden, dikkatle oluşturulmuş **kurallar** veya keşfedilmiş **iş yapma biçimleri**. **Sosyal sorumluluk**: **toplumla yapılmış bir sözleşme**; toplum işletmelerden sorumlu ve etik davranış bekler. **Sosyal sorumlu davranış** ise etik kavramına dayanan ve toplumun beklentilerini karşılayan **eyleme dönüşmüş** davranış biçimidir. İki kavramın anlamları farklıdır (\"tamamen aynı\" değildir) ama birbirinin yerine kullanılabilir."}, {"q": "Kaynakta \"etik kavramına dayanan ve toplumun beklentilerini karşılayan, eyleme dönüşmüş davranış biçimi\" olarak tanımlanan kavram hangisidir?", "opts": [{"t": "Etik kod"}, {"t": "Sosyal sorumlu davranış"}, {"t": "Kurumsal vatandaşlık"}, {"t": "Etik açıdan kabul edilebilir davranış"}, {"t": "Hayırseverlik sorumluluğu"}], "a": 1, "exp": "**Sosyal sorumlu davranış**, etik kavramına dayanan ve toplumun beklentilerini karşılayan **eyleme dönüşmüş** davranış biçimidir. **Etik açıdan kabul edilebilir davranış** ise hem yasal hem de toplumun büyük kesimince ahlaken kabul edilebilir olandır; **kurumsal vatandaşlık** paydaş beklentilerinin stratejik kararlarda gözetilmesini vurgular.\n💡 Sosyal sorumluluk = toplumla sözleşme; sosyal sorumlu davranış = o sözleşmenin eyleme dönüşmesi."}, {"q": "Carroll piramidinde ilk basamakta yer alan ekonomik sorumluluklarla ilgili aşağıdakilerden hangisi YANLIŞTIR?", "opts": [{"t": "Diğer sorumluluklardan bağımsızdır; onların gerçekleşmesi ekonomik yükümlülüklere bağlı değildir"}, {"t": "Müşteriler uygun fiyatlı, kaliteli ürünler talep eder"}, {"t": "İşletmenin bu konudaki zaafiyeti ülke ekonomisini de olumsuz etkiler"}, {"t": "Bu basamakta yatırımcılar yatırımlarının karşılığını, çalışanlar iş güvenliği ve adil ücret talep eder"}, {"t": "İşletmenin toplum içindeki varlık nedeni ve temel sorumluluğuyla ilişkilidir"}], "a": 0, "exp": "Ekonomik basamak iki açıdan önemlidir: **1)** diğer sorumlulukların hepsi göreceli olarak **ekonomik yükümlülüklerin gerçekleştirilmesine bağlıdır** (\"diğerlerinden bağımsızdır\" ifadesi bu yüzden yanlış); **2)** bu konudaki zaafiyet yatırımcı, çalışan, tedarikçi ve müşterileri derinden etkiler, **ülke ekonomisi** de olumsuz etkilenir. Basamak, işletmenin işlevini yerine getirmesi ve **varlığını sürdürmesi**dir."}, {"q": "Kuzey Amerika'da iklim değişikliğine karşı yasal bir çerçeve olmamasına rağmen tüketici baskısının işletmelerin gönüllü girişimleriyle sonuçlanması, Carroll piramidinin hangi basamağına örnektir?", "opts": [{"t": "Klasik sorumluluk"}, {"t": "Yasal sorumluluklar"}, {"t": "Etik sorumluluklar"}, {"t": "Ekonomik sorumluluklar"}, {"t": "Hayırseverlik sorumluluğu"}], "a": 2, "exp": "Üçüncü basamak **etik sorumluluklar**: adil ve doğru olma yükümlülükleri, iyi niyetli yaklaşımlar. **Yasal engel olmasa bile** toplum ve paydaşların beklentilerine uygun doğru faaliyetlere işaret eder. Kuzey Amerika iklim örneği bu basamakta verilmiştir ve stratejilerde **paydaş beklentilerinin** dikkate alınması gerektiğini gösterir."}, {"q": "Rekabet stratejilerini oluştururken yasalara uymak zorunda olunması, Carroll piramidinin hangi basamağıyla ilgilidir?", "opts": [{"t": "Hayırseverlik sorumluluğu (tepe)"}, {"t": "Yasal sorumluluklar (ikinci basamak)"}, {"t": "Ekonomik sorumluluklar (ilk basamak)"}, {"t": "Etik sorumluluklar (üçüncü basamak)"}, {"t": "Bütünleşik sosyal sözleşme"}], "a": 1, "exp": "Piramidin **ikinci basamağı yasal sorumluluklardır**: işletmeler faaliyetlerinde ilgili **yasalara ve düzenlemelere** uymakla yükümlüdür; ör. **rekabet stratejilerini** oluştururken yasalara uymak zorundadırlar."}, {"q": "Carroll piramidinin tepesinde kuruluşun \"iyi, sorumlu bir vatandaş\" kimliğiyle karşımıza çıktığı basamak için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Rekabet stratejileri oluşturulurken yasalara uyumu ve düzenlemeleri kapsar"}, {"t": "Toplum tarafından gerekli görülen ve yasalarla zorunlu tutulan sorumluluktur"}, {"t": "İşletmenin varlık nedeniyle ve varlığını sürdürmesiyle doğrudan ilgilidir"}, {"t": "Yatırımcıların yatırım karşılığı ve çalışanların adil ücret taleplerini kapsar"}, {"t": "Gönüllü sorumluluk da denir; para, zaman, bilgi gibi kaynaklar topluma aktarılır"}], "a": 4, "exp": "Tepe basamak **hayırseverlik sorumluluğu**dur; **gönüllü sorumluluklar** olarak da anılır. Topluma **kaynak aktarımı (para, zaman, bilgi)** ya da projelerle toplumun refahını artırma ve yaşam kalitesini iyileştirme öne çıkar. Şekil 3.2'ye göre bu basamak toplum tarafından **arzu edilir** (zorunlu değil)."}, {"q": "Şekil 3.2'deki Carroll piramidinde basamaklar ile toplumun bu basamaklara bakışı eşleştirildiğinde aşağıdakilerden hangisi DOĞRUDUR?", "opts": [{"t": "Ekonomik ve yasal: gerekli görülür; etik: beklenir; hayırseverlik: arzu edilir"}, {"t": "Ekonomik ve etik: gerekli görülür; yasal: beklenir; hayırseverlik: arzu edilir"}, {"t": "Ekonomik: gerekli görülür; yasal: beklenir; etik ve hayırseverlik: arzu edilir"}, {"t": "Ekonomik: beklenir; yasal ve etik: gerekli görülür; hayırseverlik: arzu edilir"}, {"t": "Ekonomik: arzu edilir; yasal ve hayırseverlik: gerekli görülür; etik: beklenir"}], "a": 0, "exp": "Şekil 3.2: **Ekonomik** ve **yasal** sorumluluklar toplum tarafından **gerekli görülür**; **etik** sorumluluk toplum tarafından **beklenir**; **hayırseverlik** sorumluluğu toplum tarafından **arzu edilir**.\n💡 Gerekli–Gerekli–Beklenir–Arzu edilir: yukarı çıktıkça zorunluluk azalır, gönüllülük artar."}]}, {"title": "Genel Tekrar II: Sosyal Sorumluluk Düzeyleri, Sürdürülebilirlik, Paydaş Yaklaşımı, Yol Haritası, İlke ve Standartlar", "desc": "Carroll piramidi, sürdürülebilirlik ve üçlü sorumluluk, paydaş yaklaşımı, kurumsal vatandaşlık ve itibar, sosyal sorumlu işletmenin 6 adımı, Caux, Global Compact, ISO 14000/SA 8000/ISO 26000, GRI, ünite özeti ve okuma parçaları", "short": "Etik Tekrar II", "questions": [{"q": "Carroll'ın Dört Parçalı Kurumsal Sosyal Sorumluluk Modeli'nde (Şekil 3.2) basamaklar alttan üste doğru hangi sırayla yer alır?", "opts": [{"t": "Yasal – Ekonomik – Etik – Hayırseverlik"}, {"t": "Ekonomik – Etik – Yasal – Hayırseverlik"}, {"t": "Hayırseverlik – Etik – Yasal – Ekonomik"}, {"t": "Ekonomik – Yasal – Etik – Hayırseverlik"}, {"t": "Etik – Yasal – Ekonomik – Hayırseverlik"}], "a": 3, "exp": "Piramidin tabanında **ekonomik**, üstünde **yasal**, sonra **etik**, en tepede **hayırseverlik** sorumluluğu vardır. Ters sıralama (hayırseverlikten başlayan) üstten alta okumadır. Alt basamaktan üste çıkıldıkça işletmenin toplumun daha geniş kesimine duyarlılığı artar.\n💡 \"**E-Y-E-H**\": Ekmek (ekonomik) – Yasa – Etik – Hayır; önce ayakta kal, sonra kurala uy, sonra doğru ol, en son ver."}, {"q": "Şekil 3.2'de piramidin yan yüzünde her basamak için toplumun bakışı belirtilmiştir. Buna göre \"toplum tarafından beklenir\" ifadesi hangi sorumluluk düzeyine aittir?", "opts": [{"t": "Ekonomik sorumluluk"}, {"t": "Etik sorumluluk"}, {"t": "Yasal sorumluluk"}, {"t": "Hayırseverlik sorumluluğu"}, {"t": "Çevresel sorumluluk"}], "a": 1, "exp": "Şekil 3.2'ye göre **ekonomik** ve **yasal** sorumluluklar \"toplum tarafından **gerekli görülür**\", **etik** sorumluluk \"toplum tarafından **beklenir**\", **hayırseverlik** sorumluluğu ise \"toplum tarafından **arzu edilir**\". Çevresel sorumluluk Carroll piramidinde değil, üçlü sorumluluk modelinde yer alır."}, {"q": "Carroll'ın modeline göre \"toplum tarafından gerekli görülen\", yani işletmeler için zorunlu sayılan sorumluluk düzeyleri hangileridir?", "opts": [{"t": "Ekonomik ve yasal"}, {"t": "Yasal ve etik"}, {"t": "Etik ve hayırseverlik"}, {"t": "Ekonomik ve hayırseverlik"}, {"t": "Ekonomik ve etik"}], "a": 0, "exp": "Şekil 3.2'de alttaki iki basamak (**ekonomik** ve **yasal**) \"toplum tarafından gerekli görülür\". Sıra Sizde 3 yanıtında da ilk ikisinin işletmelerin **zorunlu** sorumlulukları olduğu belirtilir. Etik sorumluluk toplumca beklenir, hayırseverlik ise arzu edilir; bunlar zorunlu değildir."}, {"q": "Bir ilaç firması, hiçbir yasal zorunluluk olmamasına rağmen kâr amacı gütmeyen bir derneğe ürün bağışlıyor ve çalışanlarının mesai saatinin bir kısmını gönüllü sağlık taramalarına ayırmasına izin veriyor. Bu uygulama Carroll piramidinde hangi basamağa karşılık gelir ve toplum bunu nasıl görür?", "opts": [{"t": "Etik sorumluluk – toplum tarafından beklenir"}, {"t": "Yasal sorumluluk – toplum tarafından gerekli görülür"}, {"t": "Ekonomik sorumluluk – toplum tarafından gerekli görülür"}, {"t": "Etik sorumluluk – toplum tarafından arzu edilir"}, {"t": "Hayırseverlik – toplum tarafından arzu edilir"}], "a": 4, "exp": "Topluma kaynak aktarımı (**para, zaman, bilgi**, ürün) **hayırseverlik** (gönüllü) sorumluluğudur; piramidin tepesindedir ve toplum tarafından **arzu edilir**. Bu basamakta kuruluş \"iyi, sorumlu bir vatandaş\" kimliğiyle görünür. Etik sorumluluk ise \"toplumca beklenir\"; yasal engel olmasa da doğru olanı yapmayı ifade eder."}, {"q": "Sıra Sizde 3'ün yanıt anahtarına göre sosyal sorumluluk düzeyleriyle ilgili aşağıdaki ifadelerden hangileri doğrudur?\nI. Ekonomik ve yasal sorumluluklar zorunlu olanlardır.\nII. Etik sorumluluklar toplum tarafından beklenir.\nIII. Hayırseverlik sorumluluğu toplumda memnuniyet yaratır.\nIV. Günümüzde ekonomik ve yasal sorumluluklar ön plana çıkmıştır.", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 2, "exp": "Yanıt anahtarına göre dört düzey vardır; **ilk ikisi zorunlu**, **etik** sorumluluk toplumca **beklenir**, **hayırseverlik** toplumda **memnuniyet yaratır**. IV yanlıştır: günümüzde ön plana çıkanlar **etik ve hayırseverlik** sorumluluklarıdır."}, {"q": "Organizasyonların sorumlulukları bağlamında öne çıkan iki konudan biri \"makro amaçlı\", diğeri ise \"yönetsel yaklaşım ve stratejilerin dayanağı\" olarak nitelenir. Bu eşleştirme hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Makro amaçlı: paydaş kuramı – Strateji dayanağı: sürdürülebilirlik"}, {"t": "Makro amaçlı: sürdürülebilirlik – Strateji dayanağı: paydaş kuramı"}, {"t": "Makro amaçlı: kurumsal vatandaşlık – Strateji dayanağı: itibar"}, {"t": "Makro amaçlı: hayırseverlik – Strateji dayanağı: üçlü sorumluluk"}, {"t": "Makro amaçlı: itibar – Strateji dayanağı: kurumsal vatandaşlık"}], "a": 1, "exp": "Kaynak, sorumluluklar bağlamında iki önemli konudan söz eder: **makro amaçlı \"sürdürülebilirlik\"** ve yönetsel yaklaşım/stratejilerin dayanağı olarak **\"paydaş kuramı\"**. Kurumsal vatandaşlık ve itibar ise sosyal sorumlulukla bağlantılı iki ayrı kavram olarak sonra ele alınır."}, {"q": "Küreselleşmeyle birlikte şirket etkilerini düzenlemeye yönelik yeni yollar arayışını doğuran sorunlara kaynakta verilen örnekler arasında aşağıdakilerden hangisi yoktur?", "opts": [{"t": "Teknoloji şirketlerinin pazarda tekelleşmesi"}, {"t": "İklim değişikliği üzerinde etkili olan çevre kirliliği"}, {"t": "\"Kullan at\" kültürü ve aşırı paketlemeden doğan atık sorunu"}, {"t": "Şirketlerin küçülmesinin ya da kapanmasının yerel halka yıkıcı etkisi"}, {"t": "Yerel kültürlerin erozyonu"}], "a": 0, "exp": "Kaynaktaki örnekler: **çevre kirliliği** (iklim değişikliği), **\"kullan at\" kültürü ve aşırı ürün paketleme** sonucu atıklar, **şirketlerin küçülmesi/kapanmasının** yerel halka etkisi ve **yerel kültürlerin erozyonu**. Tekelleşme kaynakta geçmez. Bu sorunlar işletmelerin amaç ve sonuçlarını yeniden düşünmeyi gerekli kılmıştır."}, {"q": "\"Sürdürülebilirlik\" kavramından işletmeler, endüstriler ve sosyal kalkınmanın değerlendirilmesi için yeni bir çerçeve olarak çokça söz edilmeye hangi gelişmenin ardından başlanmıştır?", "opts": [{"t": "1987 Dünya Çevre ve Kalkınma Komisyonu raporu"}, {"t": "2000 BM Küresel İlkeler Sözleşmesi"}, {"t": "1994 Caux Yuvarlak Masası"}, {"t": "1997 Küresel Raporlama Girişimi"}, {"t": "1992 Rio Dünya Zirvesi"}], "a": 4, "exp": "Kaynağa göre **1992'de Rio Dünya Zirvesi**'nin ardından \"sürdürülebilirlik\"ten çokça söz edilmeye başlanmıştır. **1987** ise Dünya Çevre ve Kalkınma Komisyonu'nun **sürdürülebilir kalkınma** tanımının yılıdır; sık karıştırılır. Kavram daha sonra büyük şirketlerin kamuya yönelik raporlarının başlığına da yerleşmiştir (\"Sürdürülebilirlik Raporu\")."}, {"q": "\"Gelecek nesillerin kendi ihtiyaçlarını karşılama yeteneğine zarar vermeksizin, bugünkü nesillerin ihtiyaçlarını karşılayacak kalkınma\" tanımı hangi kavrama aittir ve kaynağı nedir?", "opts": [{"t": "Sürdürülebilirlik – Rio Dünya Zirvesi'nin sonuç bildirgesi (1992)"}, {"t": "Üçlü sorumluluk – John Elkington'un çalışması (1998)"}, {"t": "Paydaş yaklaşımı – Edward Freeman'ın çalışması (1980'ler)"}, {"t": "Sürdürülebilir kalkınma – Dünya Çevre ve Kalkınma Komisyonu (1987)"}, {"t": "Kurumsal vatandaşlık – Carroll'ın piramit modeli (1991)"}], "a": 3, "exp": "Bu, **Sürdürülebilir Kalkınma**'nın **Dünya Çevre ve Kalkınma Komisyonu (1987)** tarafından yapılan genel tanımıdır. Bu hedef idealist ve tartışmalı bir bakış açısı ortaya koysa da ulaşılması gereken spesifik bir amaca işaret eder.\n💡 Tanımın özü \"nesiller arası adalet\": bugünü yaşarken yarını borçlandırmamak."}, {"q": "Sürdürülebilir kalkınma ile bağlantılı bir kavram olarak \"sürdürülebilirlik\" kaynakta nasıl tanımlanmıştır?", "opts": [{"t": "İşletmenin kârını uzun dönemde ve istikrarlı biçimde maksimize etmesi"}, {"t": "Yalnızca doğal kaynakların tüketiminin tamamen durdurulması"}, {"t": "Çevresel, ekonomik ve sosyal açıdan sistemin uzun dönemli korunması"}, {"t": "Paydaşların işletme kararlarına doğrudan ve sürekli katılması"}, {"t": "Yasal düzenlemelere uzun dönemli ve eksiksiz uyum sağlanması"}], "a": 2, "exp": "**Sürdürülebilirlik**, **çevresel, ekonomik ve sosyal** açıdan **tüm sistemin uzun dönemli korunması** anlamına gelir. Yalnızca kâr ya da yalnızca doğal kaynak odaklı tanımlar eksiktir; kavramın üç boyutu üçlü sorumluluk modelinin temelini oluşturur."}, {"q": "İşletmelerin amacı ve sorumluluğu konusunda bir çerçeve önerisi olan sürdürülebilirliğin daha net ifadesi olan \"üçlü sorumluluk – triple bottom line\" anlayışının isim babası ve hararetli savunucusu kimdir?", "opts": [{"t": "Edward Freeman (1980'ler)"}, {"t": "Archie B. Carroll (1991)"}, {"t": "Crane ve Matten (2010)"}, {"t": "Ferrell, Fraedrich ve Ferrell (2011)"}, {"t": "John Elkington (1998)"}], "a": 4, "exp": "**Üçlü sorumluluk (triple bottom line)** anlayışının isim babası **John Elkington (1998)**'dur. **Freeman** paydaş yaklaşımını, **Carroll** dört basamaklı piramidi geliştirmiştir; **Crane ve Matten** şekillerin alındığı kitabın yazarları, **Ferrell ve ark.** ise yol haritası adımlarının kaynağıdır."}, {"q": "Üçlü sorumluluk (triple bottom line) anlayışı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "opts": [{"t": "İşletmelerin tek bir kâr hedefi olduğu fikrini reddeder."}, {"t": "Finansal sorumlulukları dışlayıp yalnızca sosyal ve çevresel değere odaklanır."}, {"t": "İşletmelerin bir amaç setine sahip olduğunu savunur."}, {"t": "İşletmelerin ekonomik, sosyal ve çevresel değer üretmesi gerektiğini savunur."}, {"t": "İşletmelerden beklentilerin genişlediğini ortaya koyar."}], "a": 1, "exp": "Kaynak özellikle vurgular: üçlü sorumluluk **finansal sorumlulukları dışlamaz**. Anlayış, işletmelerin **tek kâr hedefi** olduğu fikrini reddeder; bir **amaç seti** olduğunu ve **ekonomik, sosyal ve çevresel değer** üretmeleri gerektiğini savunur. Bu bağlamda sürdürülebilirlik, iş etiği için potansiyel yeni bir hedef olarak görülmelidir."}, {"q": "Şekil 3.3'te \"sürdürülebilirlik hedefinden işletmelere yansıyan sorumluluk alanları\" gösterilmiştir. Aşağıdakilerden hangisi bu üç alandan biri değildir?", "opts": [{"t": "Yasal"}, {"t": "Ekonomik"}, {"t": "Sosyal"}, {"t": "Çevresel"}, {"t": "Hiçbiri; dördü de şekilde yer alır"}], "a": 0, "exp": "Şekil 3.3'teki üçgenin üç yüzü **ekonomik, sosyal ve çevresel** sorumluluklardır. **Yasal** sorumluluk Carroll'ın dört basamaklı piramidinde yer alır, üçlü sorumlulukta yoktur.\n💡 Dört basamak = Carroll (E-Y-E-H); üç yüz = Elkington (Ekonomik-Sosyal-Çevresel; İngilizcede \"People, Planet, Profit\")."}, {"q": "Kaynaktaki DİKKAT kutusunda sıralanan Birleşmiş Milletler Milenyum Kalkınma Hedefleri arasında aşağıdakilerden hangisi yoktur?", "opts": [{"t": "Aşırı boyutlardaki yoksulluk ve açlığı ortadan kaldırmak"}, {"t": "Çocuk ölüm oranını azaltmak ve anne sağlığını iyileştirmek"}, {"t": "HIV/AIDS, sıtma ve diğer hastalıklarla mücadele etmek"}, {"t": "Rüşvet ve haraç dâhil her türlü yolsuzlukla savaşmak"}, {"t": "Kalkınma için küresel iş birliğini geliştirmek"}], "a": 3, "exp": "Milenyum Kalkınma Hedefleri: aşırı **yoksulluk ve açlığı** ortadan kaldırmak; **temel eğitim**; **kadını güçlendirme ve cinsiyet eşitliği**; **çocuk ölüm oranını azaltma**; **anne sağlığı**; **HIV/AIDS, sıtma** ve diğer hastalıklarla mücadele; **çevresel sürdürülebilirlik**; **kalkınma için küresel iş birliği** (8 hedef). Yolsuzlukla mücadele, **BM Küresel İlkeler Sözleşmesi**'nin (İlke 10) konusudur."}, {"q": "BM Milenyum Kalkınma Hedefleri ile ilgili olarak aşağıdakilerden hangileri kaynakta sayılan hedefler arasındadır?\nI. Dünyanın her tarafında temel eğitimi başarmak\nII. Kadını güçlendirmek ve cinsiyetler arası eşitlikte ilerleme kaydetmek\nIII. Çevresel sürdürülebilirliği sağlamak\nIV. Çok taraflı ticareti desteklemek", "opts": [{"t": "Yalnız I"}, {"t": "I ve III"}, {"t": "II ve IV"}, {"t": "I, II ve III"}, {"t": "I, II, III ve IV"}], "a": 3, "exp": "I, II ve III Milenyum Kalkınma Hedefleri arasındadır. **Çok taraflı ticarete destek** ise **Caux ilkelerinin 5. ilkesidir**. Milenyum hedefleri, dünyanın karşı karşıya olduğu **sosyal ve kalkınma sorunları** hakkında net bilgi verir."}, {"q": "Paydaş yaklaşımı ile ilgili aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Geliştiren: John Elkington – Geliştirildiği dönem: 1990'lar"}, {"t": "Geliştiren: Edward Freeman – Geliştirildiği dönem: 1960'lar"}, {"t": "Geliştiren: Edward Freeman – Geliştirildiği dönem: 1980'ler"}, {"t": "Geliştiren: Archie Carroll – Geliştirildiği dönem: 1990'lar"}, {"t": "Geliştiren: Milton Friedman – Geliştirildiği dönem: 1970'ler"}], "a": 2, "exp": "Paydaş yaklaşımı **1980'lerde Edward Freeman** tarafından geliştirilmiştir. **1960'lar**, \"paydaş\" kavramının iş dünyasında **ilk kullanıldığı** dönemdir; kavram daha sonra popülerleşmiştir — sık karıştırılan nokta budur."}, {"q": "Sosyal sorumluluk yaklaşımı ile paydaş yaklaşımı arasındaki temel odak farkı nedir?", "opts": [{"t": "Sosyal sorumluluk sorumluluklara, paydaş yaklaşımı sorumlu olunan gruplara odaklanır."}, {"t": "Sosyal sorumluluk gruplara, paydaş yaklaşımı sorumluluklara odaklanır."}, {"t": "Sosyal sorumluluk yalnızca hissedarlara, paydaş yaklaşımı yalnızca topluma odaklanır."}, {"t": "İkisi de yalnızca yasal yükümlülüklere odaklanır."}, {"t": "Paydaş yaklaşımı klasik görüşle, sosyal sorumluluk sosyoekonomik görüşle örtüşür."}], "a": 0, "exp": "Kaynağa göre **sosyal sorumluluk yaklaşımı işletmelerin sorumlulukları** üzerine odaklanırken **paydaş yaklaşımı işletmelerin sorumlu olduğu çeşitli gruplara** odaklanır. Paydaş yaklaşımının temel iddiası ise **sosyoekonomik görüş**le örtüşür (klasik görüşle değil)."}, {"q": "Paydaş yaklaşımının temel iddiası, işletmelerin sorumluluğu konusundaki hangi görüşle örtüşür?", "opts": [{"t": "Klasik görüş"}, {"t": "Sosyoekonomik görüş"}, {"t": "Faydacı görüş"}, {"t": "Görecelilik görüşü"}, {"t": "Hissedar değerini maksimize etme görüşü"}], "a": 1, "exp": "Paydaş yaklaşımı, işletmelerin yalnızca **hissedarların ya da sahiplerin** çıkarları doğrultusunda değil, işletme içinde ve etrafındaki önemli birçok grubun göz önüne alınarak yönetilmesini savunur; bu, işletmelerin toplumun daha geniş kesimine karşı sorumlu olduğunu söyleyen **sosyoekonomik görüş**le örtüşür. Klasik görüş ise tek sorumluluğu hissedar getirisini maksimize etmek olarak görür."}, {"q": "Kaynakta \"paydaş\" nasıl tanımlanmıştır?", "opts": [{"t": "İşletmede hisse sahibi olan ve kârdan pay alan gerçek ya da tüzel kişi"}, {"t": "İşletmeyle yazılı sözleşmesi bulunan tedarikçi ve müşteriler"}, {"t": "İşletme amaçlarına ulaşırken etkilediği ya da ondan etkilenen grup veya birey"}, {"t": "İşletmenin yalnızca iç çevresinde yer alan çalışan ve yöneticiler"}, {"t": "İşletmenin faaliyetlerinden yasal olarak sorumlu tutulan kişiler"}], "a": 2, "exp": "**Paydaş**, işletmelerin amaçlarını gerçekleştirirken **etkiledikleri veya etkilendikleri herhangi bir grup veya birey**dir. Hissedar (ortak) yalnızca paydaşlardan biridir. Yaklaşım şirketlerden, amaçlarını gerçekleştirirken diğerlerinin haklarını ihlal etmemelerini ve diğerleri üzerindeki etkilerinden sorumlu olmalarını talep eder."}, {"q": "Paydaşlarla ilgili aşağıdaki ifadelerden hangileri kaynağa göre doğrudur?\nI. Paydaşların kimler olduğu işletmeden işletmeye değişebilir.\nII. Aynı işletmenin farklı durum, görev ya da projeleri için paydaşlar değişebilir.\nIII. Özel ilgi grupları, kitlesel medya, ticari birlikler ve rakipler de paydaşlar arasında yer alabilir.", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız III"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, II ve III"}], "a": 4, "exp": "Üç ifade de doğrudur. Paydaşlar **işletmeden işletmeye** ve **aynı işletmenin farklı durum/görev/projelerinde** değişebilir. Bir üretim işletmesi için **devlet, işletme sahipleri, tedarikçiler, çalışanlar, müşteriler, yerel toplum** sayılabilir; **özel ilgi grupları, kitlesel medya, ticari birlikler, rakipler** de paydaş olabilir."}, {"q": "Şekil 3.4'teki Geleneksel Yönetim Modeli ile Paydaş Modeli karşılaştırıldığında aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Geleneksel modelde tüm ilişkiler iki yönlüdür; paydaş modelinde ise tek yönlüdür."}, {"t": "Geleneksel modelde devlet, rakipler ve sivil toplum da paydaş olarak yer alır."}, {"t": "Paydaş modelinde müşteriler, çıkarları gözetilecek tek baskın gruptur."}, {"t": "Geleneksel modelde sahipler baskındır; paydaş modelinde ilişkiler iki yönlüdür."}, {"t": "İki modelde yer alan gruplar aynıdır; yalnızca okların yönü farklıdır."}], "a": 3, "exp": "Geleneksel modelde **işletme sahipleri (hissedarlar)**, faaliyetlerde çıkarları gözetilecek **baskın grup**tur. Paydaş modelinde ise ilişkilerin **iki yönlü** olduğuna dikkat edilmelidir ve gruplar genişler (devlet, rakipler, sivil toplum eklenir). Bu bakış açısı işletme yönetimlerine yeni bir rol tanımlar."}, {"q": "Şekil 3.4'e göre aşağıdaki gruplardan hangisi Paydaş Modeli'nde yer aldığı hâlde Geleneksel Yönetim Modeli'nde gösterilmemiştir?", "opts": [{"t": "Hissedarlar"}, {"t": "Müşteriler"}, {"t": "Tedarikçiler"}, {"t": "Çalışanlar"}, {"t": "Sivil toplum"}], "a": 4, "exp": "Geleneksel modelde dört grup vardır: **hissedarlar, müşteriler, tedarikçiler, çalışanlar**. Paydaş modeline bunlara ek olarak **devlet, rakipler ve sivil toplum** eklenmiştir; tüm oklar çift yönlüdür.\n💡 Geleneksel modelde işletmeyle çift yönlü ok yalnızca **hissedarlarla** çizilmiştir: tedarikçi ve çalışandan işletmeye, işletmeden müşteriye tek yönlü akış vardır."}, {"q": "Şekil 3.4'teki Geleneksel Yönetim Modeli'nde işletme ile arasında çift yönlü ok bulunan tek grup hangisidir?", "opts": [{"t": "Müşteriler"}, {"t": "Hissedarlar"}, {"t": "Tedarikçiler"}, {"t": "Çalışanlar"}, {"t": "Devlet"}], "a": 1, "exp": "Geleneksel modelde yalnızca **hissedarlar** ile işletme arasında çift yönlü ilişki çizilmiştir; bu, sahiplerin baskın grup olmasını yansıtır. Tedarikçiler ve çalışanlardan işletmeye, işletmeden müşterilere tek yönlü ok vardır. Devlet bu modelde yer almaz."}, {"q": "Kaynağa göre \"kâr ve güvenilir bilgi akışı\" hangi paydaş grubunun işletmeden temel beklentisidir?", "opts": [{"t": "Ortaklar ve yatırımcılar"}, {"t": "Tüketiciler"}, {"t": "Çalışanlar"}, {"t": "Yöneticiler"}, {"t": "Toplum (doğal çevre açısından)"}], "a": 0, "exp": "Beklentiler: **toplum** (doğal çevre) → temiz çevre; **ortaklar/yatırımcılar** → **kâr ve güvenilir bilgi akışı**; **tüketiciler** → güvenilir ürün, doğru bilgilendirme, seçme hakkına saygı; **çalışanlar** → fırsat eşitliği, ayrımcılık yapılmaması, iş güvencesi, güvenli ortam vb.; **yöneticiler** → yüksek ücret, yetki ve statü."}, {"q": "Aşağıdakilerden hangisi kaynakta çalışanların işletmeden beklentileri arasında sayılmamıştır?", "opts": [{"t": "İstihdamda fırsat eşitliğinin sağlanması"}, {"t": "Cinsiyete göre ayrımcılık yapılmaması"}, {"t": "Doğru bilgilendirilme ve ürün seçme hakkına saygı"}, {"t": "Engelli çalışanların dikkate alınması"}, {"t": "Mesleğini yapabilmesi için güvenli ve sağlıklı bir ortam"}], "a": 2, "exp": "Doğru bilgilendirilme ve ürün seçme hakkına saygı **tüketicilerin** beklentisidir. Çalışanlar ise **fırsat eşitliği, cinsiyet ayrımcılığı yapılmaması, iş güvencesi ve kazançların korunması, engelli çalışanların dikkate alınması, güvenli ve sağlıklı ortam** bekler."}, {"q": "Paydaş modeli, işletme yönetimine nasıl bir görev yükler?", "opts": [{"t": "Yalnızca en güçlü paydaş grubunun beklentisini karşılamak"}, {"t": "Hissedar beklentilerini her koşulda diğerlerinin önüne koymak"}, {"t": "Farklı kesimlerin beklentileri arasında bir denge gözetmek"}, {"t": "Paydaş beklentilerini tamamen yasal düzenlemelere bırakmak"}, {"t": "Her paydaşın beklentisini eşit bütçe ayırarak karşılamak"}], "a": 2, "exp": "Paydaş modeli, işletmelerin yönetiminde **farklı kesimlerin beklentilerine göre bir denge gözetilmesini** önerir. Kaynak bunun **zorlu bir süreç** olduğunu ve günümüz işletmelerine düşen yeni görevin bu olduğunu vurgular."}, {"q": "\"İşletmelerin çeşitli paydaş gruplarının işletmeden bekledikleri sorumlulukları stratejik kararlarında göz önünde bulundurmasını vurgulamak için kullanılan kavram\" hangisidir?", "opts": [{"t": "Kurumsal vatandaşlık"}, {"t": "İtibar"}, {"t": "Hayırseverlik"}, {"t": "Kurumsal kimlik yönetimi"}, {"t": "Bağımsız sosyal denetim"}], "a": 0, "exp": "Bu tanım **kurumsal vatandaşlık** kavramına aittir. **İtibar** ise paydaşlar nezdinde şirketin eyl
