em, seçim, davranış ve sonuçlarına göre oluşan/değişen, işletmenin **fiziksel olmayan en değerli varlıklarından** biridir. İkisi de sosyal sorumlulukla bağlantılı iki önemli kavramdır."}, {"q": "Kaynağa göre \"itibar\" ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Bir kez oluştuktan sonra hiç değişmeyen, sabit ve kalıcı bir kurumsal özelliktir."}, {"t": "Tek atımlık büyük ve görünür bir sosyal projeyle kalıcı olarak kazanılabilir."}, {"t": "Yalnızca hissedarların algısıyla ilgili, bilançoda izlenen finansal bir göstergedir."}, {"t": "Yalnızca yasal sorumlulukların eksiksiz yerine getirilmesiyle sınırlı bir kavramdır."}, {"t": "Paydaşlar nezdinde şirketin davranışlarına göre oluşan, fiziksel olmayan değerli bir varlıktır."}], "a": 4, "exp": "**İtibar**, paydaşlar nezdinde şirketin **eylemleri, seçimleri, davranışları ve sonuçlarına göre oluşan ya da değişen**, **fiziksel olmayan** en değerli varlıklardan biridir. En itibarlı şirket olarak algılanmak için **tek atımlık sosyal projeler yeterli değildir**; tüm düzeyleri kapsayan sosyal sorumluluk anlayışı **sistematik** biçimde uygulamalara yerleştirilmelidir."}, {"q": "Ferrell, Fraedrich ve Ferrell'e (2011) göre sosyal sorumlu işletme olma yolundaki süreçte yer alan adımlardan ilki hangisidir?", "opts": [{"t": "Paydaş gruplarının tanınması"}, {"t": "Kurum kültürünün gözden geçirilmesi"}, {"t": "Paydaşlarla ilgili konuların belirlenmesi"}, {"t": "Kaynaklar ve önceliklerin belirlenmesi"}, {"t": "Paydaşlardan geri bildirim alınması"}], "a": 1, "exp": "Altı adım sırasıyla: **1) Kurum kültürünün gözden geçirilmesi**, 2) paydaş gruplarının tanınması, 3) paydaşlarla ilgili konuların belirlenmesi, 4) işletmenin sosyal sorumluluk alanlarının tespiti, 5) kaynaklar ve önceliklerin belirlenmesi, 6) paydaşlardan geri bildirim alınması.\n💡 \"**Kültür → Kim → Konu → Kapsam (alan) → Kaynak → Kulak (geri bildirim)**\": altı K."}, {"q": "Sosyal sorumlu işletme olmanın yol haritasındaki altı adımdan dördüncüsü hangisidir?", "opts": [{"t": "Paydaşlarla ilgili konuların belirlenmesi"}, {"t": "Kaynaklar ve önceliklerin belirlenmesi"}, {"t": "Paydaş gruplarının tanınması ve güçlerinin analizi"}, {"t": "İşletmenin sosyal sorumluluk alanlarının tespit edilmesi"}, {"t": "Paydaşlardan geri bildirim alınması"}], "a": 3, "exp": "4. adım **işletmenin sosyal sorumluluk alanlarının tespiti**dir: ilk üç adımda elde edilenleri, özellikle **işletmenin yararına uygun** sosyal sorumluluk çerçevesini anlamak için bir araya getirir. 3. adım konuların belirlenmesi, 5. adım kaynak ve öncelikler, 6. adım geri bildirimdir."}, {"q": "Etik ve sosyal sorumluluğun yönetiminde \"paydaş çerçevesinden yararlanma\" yaklaşımının ayırt edici özelliği nedir?", "opts": [{"t": "Stratejinin yalnızca üst yönetim tarafından, paydaşlara danışılmadan belirlenmesi"}, {"t": "Sosyal sorumluluk projelerinin tamamen bağımsız dış kuruluşlara devredilmesi"}, {"t": "Strateji oluşturma ve uygulamada ilgili paydaşlardan geri bildirim alınmasını içermesi"}, {"t": "Strateji belirlenirken yalnızca yasal zorunlulukların dikkate alınması"}, {"t": "Paydaş görüşlerinin yalnızca yıllık faaliyet raporlarında yayımlanması"}], "a": 2, "exp": "Kaynağa göre bu yaklaşımın özelliği, **işletme stratejisinin oluşturulması ve uygulanmasında ilgili paydaşlardan geri bildirim alınmasını** içermesidir. Başarıya ulaşmada etik ve sosyal sorumluluğun önemini kavrayan işletme bu süreçleri yerine getirir; ilkeler paydaş görüşlerine paralel şekillendirilir."}, {"q": "\"Kurum kültürünün gözden geçirilmesi\" adımında paydaş gruplarını belirlemede ve işletmenin önemli gördüğü konuları tespit etmede özellikle kilit rol oynayan unsurlar hangileridir?", "opts": [{"t": "Finansal tablolar"}, {"t": "Değerler ve normlar"}, {"t": "Rakip analizleri"}, {"t": "Ürün portföyü"}, {"t": "Organizasyon şeması"}], "a": 1, "exp": "İşletmenin **misyonu, değerleri ve normları**, sosyal sorumluluk anlayışının izlerinin bulunabileceği alanlardır; özellikle **değerler ve normlar** paydaş gruplarını belirlemede ve önemli konuları tespit etmede kilit rol oynar. Bunlar **stratejik planlar, misyon açıklamaları, yıllık raporlar ve İnternet siteleri**nden gözlemlenebilir."}, {"q": "\"Paydaş gruplarının tanınması\" adımına göre paydaşlar hangi durumda daha çok güçlüdür?", "opts": [{"t": "Yaşamlarını sürdürmeleri tamamen örgütün başarısına bağlı olduğunda"}, {"t": "Önemli örgütsel kaynaklara hiçbir şekilde erişimleri olmadığında"}, {"t": "Diğer paydaş gruplarıyla iş birliği yapma potansiyelleri bulunmadığında"}, {"t": "Yalnızca medyada görünür olduklarında ve kamuoyu ilgisi arttığında"}, {"t": "Örgütün başarısına bağımlı olmadıklarında ve önemli örgütsel kaynaklara erişebildiklerinde"}], "a": 4, "exp": "Kaynağa göre örgütün başarılı olması ile paydaşların kendi yaşamlarını sürdürmeleri arasında **bir bağ olmadığı** ve paydaşların **önemli örgütsel kaynaklara erişebildiği** durumda paydaşlar daha çok güçlüdür. Gücü değerlendirirken paydaşın işletmeye baskı yapabilecek **diğer paydaş gruplarıyla iş birliği potansiyeli** de hesaba katılmalıdır."}, {"q": "\"Paydaş gruplarının tanınması\" adımıyla ilgili aşağıdaki ifadelerden hangileri doğrudur?\nI. Paydaşların ihtiyaç, istek ve arzularının farkında olmak önemlidir.\nII. Çelişen yaklaşımların üstesinden gelmek için iş birliği önerilir.\nIII. Politikalar işletmenin ve paydaş grubunun özelliklerine bağlı olarak geliştirilmelidir.\nIV. Yöneticiler yalnızca politikadan etkilenecek grupları tespit eder; politikayı etkileyen gruplar dikkate alınmaz.", "opts": [{"t": "I ve II"}, {"t": "I, II ve III"}, {"t": "II, III ve IV"}, {"t": "I ve IV"}, {"t": "I, II, III ve IV"}], "a": 1, "exp": "I, II ve III doğrudur. IV yanlıştır: yöneticiler örgüt politikası geliştirmede **etkisi olan veya** bu politikadan **etkilenebilecek** paydaş gruplarını birlikte tespit eder. Paydaşlar ya **örgütsel kaynakları ellerinde tutar** ya da en azından mevcut kaynaklar için **tehdit oluşturabilir**."}, {"q": "Gıda sektöründe faaliyet gösteren bir işletme, \"obezite\" konusunu diğer konulardan öncelikli olarak gündemine alıyor. Bu, sosyal sorumlu işletme olmanın yol haritasında hangi adıma örnektir?", "opts": [{"t": "Paydaşlarla ilgili konuların belirlenmesi"}, {"t": "Kurum kültürünün gözden geçirilmesi"}, {"t": "Paydaş gruplarının tanınması"}, {"t": "Kaynaklar ve önceliklerin belirlenmesi"}, {"t": "Paydaşlardan geri bildirim alınması"}], "a": 0, "exp": "Kaynakta **obezite** örneği, 3. adım olan **paydaşlarla ilgili konuların belirlenmesi** başlığı altında verilir. Bu adım paydaşların temel meselelerinin yapısını anlamaya yarar. Diğer örnek konular: bazı bölgelerde **açlık**, **kadına yönelik şiddet**, **kültürel mirasın korunması**, **silahsızlanma**, **kanserle mücadele**."}, {"q": "\"Paydaşlarla ilgili konuların belirlenmesi\" adımında konuların tespitinde önemli rol oynayan etkenler arasında aşağıdakilerden hangisi kaynakta sayılmamıştır?", "opts": [{"t": "Konuların şiddeti"}, {"t": "Paydaşların gücü"}, {"t": "İşletmenin politikaları"}, {"t": "Rakiplerin pazar payı"}, {"t": "İşletmenin kaynakları"}], "a": 3, "exp": "Kaynağa göre bu konuların tespitinde **konuların şiddeti, paydaşların gücü, işletmenin politikaları ve kaynakları** önemli rol oynar. Önceki iki adım paydaşların **gücü ve meşruiyeti** hakkında bilgi sağlar; bu güç ve meşruiyet düzeyi neyin acil olduğunun anlaşılmasında önemlidir. Bir sorun çok sayıda paydaşı ilgilendiriyorsa paydaşlar arası iş birliği koşulları oluşur ve dikkatin yönü belirginleşir."}, {"q": "Şirketlerin sosyal sorumluluk taahhüt ve ilerlemelerini yıllık raporlarda, web sayfalarında ve tanıtım broşürlerinde açıklamalarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "opts": [{"t": "Kamuyu bilgilendirme amacıyla yaygın olarak kullanılan kanallardır."}, {"t": "Pazarlama iletişimi kapsamında da değerlendirilebilir."}, {"t": "Web sayfalarında genellikle \"kurumsal\" başlığı altında yer alır."}, {"t": "İşletmenin sosyal sorumluluk alanlarının tespiti adımıyla ilişkilidir."}, {"t": "Resmi belge niteliği taşımaz ve işletme için bağlayıcı değildir."}], "a": 4, "exp": "Kaynağa göre bu açıklamalar **resmi belgelerdir** ve işletmeler açısından **bağlayıcılığı vardır**. Kamuyu bilgilendirme amaçlı yaygın kullanılır, **pazarlama iletişimi** kapsamında da değerlendirilebilir; büyük işletmelerin web sitelerinde genellikle **\"kurumsal\"** başlığı altında bulunur. Örnek: kahve satan bir işletmenin çevre projeleri ve kahvenin **sosyalleşme aracı** olduğu planına bağlı desteklediği toplumsal programlar."}, {"q": "\"Kaynakların ve önceliklerin belirlenmesi\" adımında kaynak kullanımına ilişkin kararlar için kaynakta önerilen iki kullanışlı kriter hangileridir?", "opts": [{"t": "Rakiplerin harcamaları ve medyanın gösterdiği ilgi"}, {"t": "Hissedar onayı ve sağlanacak vergi avantajı"}, {"t": "Çalışan sayısı ve faaliyet gösterilen sektörün büyüklüğü"}, {"t": "Finansal durum/yatırım ihtiyacı ve aciliyet tespiti"}, {"t": "Yasal zorunluluk ve uluslararası standart belgesi"}], "a": 3, "exp": "İki kriter: birincisi **işletmenin finansal durumu ve farklı girişim seçeneklerinin ihtiyaç duyduğu yatırım miktarı**, ikincisi konuların önceliklendirilmesinde işe yarayan **aciliyet tespiti**dir. Aciliyeti belirlemede **konunun önemine ilişkin gözlem** ve **paydaşlardan beklenen baskının düzeyi** yol gösterir. Projeler hem hissedarların hem kamunun beklentilerine uygun olmalıdır; ele alınan konu ve mesajlar işletmenin **itibarını oluşturan kaynaklar**dır."}, {"q": "Paydaşlardan geri bildirim alınmasında kaynakta \"daha formal araştırma yöntemleri\" olarak sayılanlardan biri aşağıdakilerden hangisidir?", "opts": [{"t": "Odak grup çalışması"}, {"t": "Paydaşların oluşturduğu bloglar"}, {"t": "Podcast yayınları"}, {"t": "Haber bültenleri"}, {"t": "Paydaşların kurduğu web siteleri"}], "a": 0, "exp": "Paydaşların oluşturduğu **blog, web sitesi, podcast ve haber bültenleri** ölçüm amaçlı kullanılabilen ortamlardır; **daha formal araştırma yöntemleri** ise **odak grup, gözlem ve anket**tir. Genel değerlendirmeler **paydaş tatmini veya itibar araştırmaları**yla elde edilebilir."}, {"q": "Bir işletme paydaşlarından anketler ve özel web siteleri aracılığıyla yoğun geri bildirim topluyor ancak bu bildirimleri hiçbir kararında dikkate almıyor. Kaynağa göre bu durumun sonucu nedir?", "opts": [{"t": "Yöntem formal olduğu için geri bildirim işlevini yine de yerine getirir."}, {"t": "Geri bildirim yalnızca itibar araştırmasıyla toplanırsa geçerli olur."}, {"t": "Eylemlerde dikkate alınmadığı için beklenen işlevini yerine getiremez."}, {"t": "Özel web siteleri kullanıldığı için paydaş baskısı kendiliğinden ortadan kalkar."}, {"t": "İşletme son adımı tamamlamış sayılır ve sosyal sorumluluk süreci biter."}], "a": 2, "exp": "Kaynak açıkça belirtir: geri bildirim **hangi kanalla gelirse gelsin, hangi yöntemle toplanırsa toplansın**, işletme eylemlerinde **göz önüne alınmadığı sürece** beklenen işlevini yerine getiremez. Özel web siteleri aracılığıyla gelen yoğun müşteri baskıları, işletmelerin iş yapma yöntemlerini değiştirmesiyle sonuçlanabilir."}, {"q": "Sıra Sizde 5'in yanıt anahtarında sosyal sorumlu işletmelerin uygulamalarına verilen örnekler arasında aşağıdakilerden hangisi yoktur?", "opts": [{"t": "Rakip fiyatlarına göre indirim kampanyası düzenleme"}, {"t": "Bağımsız kuruluşlarca sosyal denetimden geçme"}, {"t": "Nedene dayalı pazarlama uygulamaları"}, {"t": "Sporun gelişmesine ve kültürel etkinliklere katkı"}, {"t": "Yerel toplumun sorunlarına katkı"}], "a": 0, "exp": "Yanıt anahtarındaki örnekler: **doğal çevrenin korunması, eğitime katkı, sosyal ve kültürel etkinliklere katkı, sporun gelişmesine katkı, yerel toplumun sorunlarına katkı** gibi hayırseverlikler; **bağımsız kuruluşlarca sosyal denetimden geçme**; **nedene dayalı pazarlama**. Rakip fiyatına göre indirim bir pazarlama/rekabet uygulamasıdır."}, {"q": "Dinler arası Bildirge (Interfaith Declaration) ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "2000 yılında Birleşmiş Milletler tarafından evrensel ilkeler seti olarak oluşturuldu."}, {"t": "Avrupa, Amerika ve Japonya'dan iş liderlerinin kurduğu uluslararası bir ağdır."}, {"t": "2009 küresel finansal kriz nedeniyle yeniden düzenlenerek güncellendi."}, {"t": "Yalnızca Müslüman ülkelerde faaliyet gösteren işletmeler için hazırlandı."}, {"t": "1994'te üç dinin iş ve hükümet liderleri, ilahiyatçı ve akademisyenlerince tasarlandı."}], "a": 4, "exp": "**Dinler arası Bildirge**, Hıristiyan, Müslüman ve Yahudiler için Uluslararası İşletme Etik Kodları'dır; **1994**'te üç dini temsil eden **iş ve hükümet liderleri, ilahiyatçılar ve akademisyenler** tarafından tasarlanmıştır. Avrupa-Amerika-Japonya ağı ve 2009 revizyonu **Caux Roundtable**'a, 2000 yılı **UN Global Compact**'a aittir.\n💡 1994 yılında iki girişim var: Dinler arası Bildirge ve Caux — ikisini yıl üzerinden değil, kurucuları üzerinden ayırın."}, {"q": "Dinler arası Bildirge'de üç dinin temsilcilerinin ortaklaştığı temel ilkeler arasında aşağıdakilerden hangisi yoktur?", "opts": [{"t": "Adalet"}, {"t": "Karşılıklı saygı"}, {"t": "Kyosei"}, {"t": "Dürüstlük"}, {"t": "Çevresel-ekonomik-sosyal faktörlerin yönetiminden sorumlu olma"}], "a": 2, "exp": "Dinler arası Bildirge'nin dört ortak ilkesi: **adalet, karşılıklı saygı, çevresel-ekonomik-sosyal faktörlerin yönetiminden sorumlu olma ve dürüstlük**. **Kyosei** ise **Caux Roundtable** ilkelerinin dayandığı iki etik idealden biridir."}, {"q": "Caux Roundtable ilkelerinin dayandığı iki etik idealden biri olan \"kyosei\" kavramı neyi ifade eder?", "opts": [{"t": "Yasaların ötesinde paydaşlarla güven oluşturma"}, {"t": "Çevre sorunlarına karşı ihtiyati yaklaşımı destekleme"}, {"t": "Hissedar değerinin uzun vadede korunması"}, {"t": "Herkesin iyiliği için birlikte yaşama ve çalışmaya inanç"}, {"t": "Paydaş beklentileri arasında denge kurma"}], "a": 3, "exp": "Caux ilkeleri iki etik ideale dayanır: **insana saygı** ve **kyosei** — **herkesin iyiliği için birlikte yaşamaya ve çalışmaya olan inanç**. \"Yasaların ötesinde güven oluşturma\" Caux'nun 3. ilkesinin başlığıdır, ihtiyati yaklaşım ise Global Compact'ın 7. ilkesidir.\n💡 Kyosei Japonca bir kavramdır; Caux ağında Japon iş liderlerinin bulunmasıyla uyumludur."}, {"q": "Caux Roundtable ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "opts": [{"t": "1994'te Avrupa, Amerika ve Japonya'dan iş dünyası liderlerinin oluşturduğu uluslararası bir ağdır."}, {"t": "Birleşmiş Milletler tarafından 2000 yılında evrensel ilkeler seti olarak oluşturulmuştur."}, {"t": "\"Etik ve sorumlu şirket davranışı için evrensel bir vizyon\" oluşturarak ilkelerini açıklamıştır."}, {"t": "2009'da küresel finansal kriz nedeniyle yeniden düzenlenmiştir."}, {"t": "İlkeleri Minnesota İlkeleri olarak da bilinir."}], "a": 1, "exp": "Yanlış olan ifade **UN Global Compact**'ı tanımlar. **Caux Roundtable**, **1994**'te **Avrupa, Amerika ve Japonya**'dan iş liderlerinin kurduğu ağdır; **2009'da küresel finansal kriz** nedeniyle yeniden düzenlenmiş, dünya barışı ve istikrarı için sosyal ve ekonomik tehditleri azaltmada küresel kurumsal sorumluluğun önemine vurgu yapar. İlkeleri **Minnesota İlkeleri** olarak da anılır."}, {"q": "Caux ilkelerinden \"İlke 3\" aşağıdakilerden hangisidir?", "opts": [{"t": "İşletmenin sorumluluğu: Ortakların ötesine paydaşlara yönelme"}, {"t": "İşletme davranışı: Yasaların ötesinde güven oluşturmaya yönelme"}, {"t": "İşletmenin ekonomik ve sosyal etkisi: İnovasyon, adalet ve tüm insanlığa yönelme"}, {"t": "Çok taraflı ticarete destek"}, {"t": "Yasadışı operasyonlardan kaçınma"}], "a": 1, "exp": "Caux'nun 7 ilkesi: **1)** İşletmenin sorumluluğu – ortakların ötesine paydaşlara yönelme; **2)** Ekonomik ve sosyal etki – inovasyon, adalet ve tüm insanlığa yönelme; **3)** İşletme davranışı – **yasaların ötesinde güven** oluşturma; **4)** Kurallara saygı; **5)** Çok taraflı ticarete destek; **6)** Doğal çevreye saygı; **7)** Yasadışı operasyonlardan kaçınma."}, {"q": "Aşağıdakilerden hangisi Caux (Minnesota) ilkeleri arasında yer almaz?", "opts": [{"t": "Kurallara saygı gösterme"}, {"t": "Doğal çevreye saygı gösterme"}, {"t": "Sendikalaşma ve toplu müzakere özgürlüğünü destekleme"}, {"t": "Çok taraflı ticarete destek verme"}, {"t": "Yasadışı operasyonlardan kaçınma"}], "a": 2, "exp": "Sendikalaşma ve toplu müzakere özgürlüğü **BM Küresel İlkeler Sözleşmesi**'nin **3. ilkesidir** (Çalışma Standartları). Kurallara saygı (4), çok taraflı ticarete destek (5), doğal çevreye saygı (6) ve yasadışı operasyonlardan kaçınma (7) **Caux** ilkeleridir."}, {"q": "UN Global Compact (BM Küresel İlkeler Sözleşmesi) ile ilgili aşağıdaki bilgilerden hangisi doğrudur?", "opts": [{"t": "2000'de kuruldu; 2009'a dek 120 ülkeden 4700'ü aşkın işletme imzaladı."}, {"t": "1994'te kuruldu; 2009'a dek 4700 ülkeden 120'yi aşkın işletme imzaladı."}, {"t": "1997'de kuruldu; yedi ilkeden oluşur ve Minnesota İlkeleri olarak bilinir."}, {"t": "2000'de kuruldu; 2009'a dek 4700 ülkeden 120 işletme imzaladı."}, {"t": "1992 Rio Zirvesi'nde kabul edildi; sekiz kalkınma hedefinden oluşur."}], "a": 0, "exp": "**UN Global Compact** **2000** yılında BM tarafından oluşturulmuş evrensel ilkeler setidir; **on ilke** insan hakları, işgücü, çevre ve yolsuzlukla mücadeleyle ilgilidir. **2009** itibarıyla **120 ülkeden 4700'ü aşkın işletme** imzalamıştır. 7 ilke Caux'ya, 8 hedef Milenyum Kalkınma Hedefleri'ne, 1997 GRI'ya aittir."}, {"q": "BM Küresel İlkeler Sözleşmesi'nin (Tablo 3.1) on ilkesinin dört alana dağılımı hangi seçenekte doğru verilmiştir?", "opts": [{"t": "İnsan hakları 3 – Çalışma standartları 3 – Çevre 3 – Yolsuzlukla mücadele 1"}, {"t": "İnsan hakları 2 – Çalışma standartları 3 – Çevre 4 – Yolsuzlukla mücadele 1"}, {"t": "İnsan hakları 4 – Çalışma standartları 2 – Çevre 2 – Yolsuzlukla mücadele 2"}, {"t": "İnsan hakları 1 – Çalışma standartları 4 – Çevre 3 – Yolsuzlukla mücadele 2"}, {"t": "İnsan hakları 2 – Çalışma standartları 4 – Çevre 3 – Yolsuzlukla mücadele 1"}], "a": 4, "exp": "Tablo 3.1: **İnsan hakları** ilke 1–2 (**2**), **Çalışma standartları** ilke 3–6 (**4**), **Çevre** ilke 7–9 (**3**), **Yolsuzlukla mücadele** ilke 10 (**1**).\n💡 \"**2-4-3-1**\" — toplam 10."}, {"q": "BM Küresel İlkeler Sözleşmesi'nde \"İş dünyası çevre sorunlarına karşı ihtiyati yaklaşımları desteklemeli\" ilkesi hangi alanda ve kaçıncı ilkedir?", "opts": [{"t": "İnsan hakları – İlke 2"}, {"t": "Çevre – İlke 9"}, {"t": "Çalışma standartları – İlke 6"}, {"t": "Çevre – İlke 7"}, {"t": "Yolsuzlukla mücadele – İlke 10"}], "a": 3, "exp": "Çevre alanı üç ilkeden oluşur: **İlke 7** ihtiyati yaklaşımları desteklemek, **İlke 8** çevresel sorumluluğu artıracak her türlü faaliyete destek, **İlke 9** çevre dostu teknolojilerin gelişmesi ve yaygınlaşmasını desteklemek."}, {"q": "Aşağıdakilerden hangileri BM Küresel İlkeler Sözleşmesi'nin \"Çalışma Standartları\" başlığı altındadır?\nI. Zorbalıkla ve zorla işçi çalıştırılmasına son verilmesi\nII. Her türlü çocuk işçi çalıştırılmasına son verilmesi\nIII. İşe alım ve işe yerleştirmede ayrımcılığa son verilmesi\nIV. İnsan hakları ihlallerinin suç ortağı olunmaması", "opts": [{"t": "I, II ve III"}, {"t": "Yalnız II"}, {"t": "I ve IV"}, {"t": "II ve III"}, {"t": "I, II, III ve IV"}], "a": 0, "exp": "Çalışma standartları: **İlke 3** sendikalaşma ve toplu müzakere özgürlüğü, **İlke 4** zorla işçi çalıştırmaya son, **İlke 5** çocuk işçiliğe son, **İlke 6** işe alım ve yerleştirmede ayrımcılığa son. IV (insan hakları ihlallerinin suç ortağı olmamak) **İnsan Hakları** başlığındaki **İlke 2**'dir."}, {"q": "BM Küresel İlkeler Sözleşmesi'nin \"Yolsuzlukla Mücadele\" alanındaki tek ilke neyi öngörür?", "opts": [{"t": "İlan edilmiş insan haklarını desteklemesini ve saygı duymasını"}, {"t": "Yasadışı operasyonlardan kaçınılmasını"}, {"t": "Rüşvet ve haraç dâhil her türlü yolsuzlukla savaşmasını"}, {"t": "Vergi kaçakçılığıyla mücadele programı oluşturulmasını"}, {"t": "Etik ihbar hatlarının kurulmasını"}], "a": 2, "exp": "**İlke 10**: İş dünyası **rüşvet ve haraç dâhil** her türlü yolsuzlukla savaşmalı. \"Yasadışı operasyonlardan kaçınma\" Caux'nun 7. ilkesidir; vergi kaçakçılığı ve ihbar hatları okuma parçasındaki önerilerdir."}, {"q": "Kaynağa göre küresel ilkelerin yanında yerel, sektörel ve mesleki anlamda rehberlik eden ilkelere örnek olarak aşağıdakilerden hangisi verilmemiştir?", "opts": [{"t": "Yayın kuruluşlarının belirlediği yayın ilkeleri"}, {"t": "Muhasebe uzmanlarının uyması gereken meslek ilkeleri"}, {"t": "Sivil toplum kuruluşlarının belirlediği etik ilkeler"}, {"t": "Hastanelerin belirlediği hasta hakları ilkeleri"}, {"t": "Hiçbiri; dördü de kaynakta örnek verilmiştir"}], "a": 3, "exp": "Kaynaktaki örnekler: **yayın kuruluşlarının yayın ilkeleri**, **muhasebe uzmanlarının meslek ilkeleri** ve **sivil toplum kuruluşlarının etik ilkeleri**. Hasta hakları ilkeleri kaynakta geçmez (gerçekte var olsa da bu ünitede örnek verilmemiştir)."}, {"q": "Çok uluslu bir firma, tedarikçilerini seçerken onların çevre yönetim sistemlerinin akredite olup olmadığına bakmak istiyor. Kaynağa göre bu amaçla seçme kriteri olarak kullanılan standart hangisidir?", "opts": [{"t": "SA 8000"}, {"t": "ISO 26000"}, {"t": "GRI"}, {"t": "ISO 9000"}, {"t": "ISO 14000"}], "a": 4, "exp": "**ISO 14000** bir standart serisidir; işletmelerin **doğal çevre** ile etkileşimlerini yönetmede yol gösterir ve özünde **çevre yönetim sistemlerini akredite eder**. Çevre yönetiminde **en yaygın** standarttır; kimi çok uluslu firmalar **tedarikçi seçiminde** kriter olarak kullanır.\n💡 \"14000 → **çevre**\": Kendimizi Sınayalım 10'un yanıtı da ISO 14000'dir."}, {"q": "Uluslararası Sosyal Hesapverebilirlik (SAI) Kurumu tarafından oluşturulan, tedarik zincirinde işgörenlerle ilgili konulara ve iş yeri çalışma koşullarına odaklanan standart hangisidir?", "opts": [{"t": "ISO 14000"}, {"t": "SA 8000"}, {"t": "ISO 26000"}, {"t": "UN Global Compact"}, {"t": "Caux ilkeleri"}], "a": 1, "exp": "**SA 8000 (Social Accountability 8000)**, **SAI** tarafından oluşturulmuş; **sosyal hesap verebilirlik** ve **iş yeri çalışma koşulları** ile ilgilidir. Tedarik zincirindeki işgörenlere odaklanır ve **insan hakları ile iş hukuku** konusundaki uluslararası anlaşmalara dayanır."}, {"q": "ISO 26000 standardı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "opts": [{"t": "ISO'nun şirket sosyal sorumluluğu için geliştirdiği en yeni girişimdir."}, {"t": "İş dünyası, sanayi odaları, sendikalar, hükümetler ve STK'lardan geniş katılımlı temsilcilerce tartışılmıştır."}, {"t": "Daha çok bir rehber niteliği taşır."}, {"t": "Çevre yönetim sistemlerini akredite eden ve tedarikçi seçiminde en yaygın kullanılan standarttır."}, {"t": "Sorumluluk süreçleri açısından değerli bir yol göstericidir."}], "a": 3, "exp": "Yanlış ifade **ISO 14000**'i tanımlar. **ISO 26000**, ISO'nun **şirket sosyal sorumluluğu** için en yeni girişimidir; **geniş katılımlı** küresel temsilcilerce tartışılmış, daha çok **rehber** niteliğindedir ve sorumluluk süreçleri açısından değerli bir yol göstericidir."}, {"q": "ISO 26000 bağlamında kaynakta belirtildiğine göre çalışan tatmini, müşteri motivasyonu, şirket değerleri ve etik karar alma süreçleri gibi sorumluluk göstergeleri nasıl ölçülür?", "opts": [{"t": "Yalnızca finansal tablolarla, nicel olarak ölçülür."}, {"t": "Niteliksel olup algısal ölçülür; bu, değerlerini eksiltmez."}, {"t": "Ölçülemedikleri için standardın kapsamı dışında bırakılır."}, {"t": "Bağımsız denetçilerin verdiği sayısal puanlarla ölçülür."}, {"t": "Algısal ölçüldükleri için değeri düşük kabul edilir."}], "a": 1, "exp": "Kaynağa göre sorumlulukla ilgili kimi göstergeler doğaları gereği **niteliksel**dir; **çalışan tatmini, müşteri motivasyonu, şirket değerleri, etik karar alma süreçleri** gibi boyutlar **algısal** olarak ölçülür ve **bu onların değerini eksiltmez**."}, {"q": "Küresel Raporlama Girişimi (GRI) ile ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "2000'de BM tarafından kuruldu ve on evrensel ilke yayımladı."}, {"t": "Yalnızca çevresel boyutu ele alan bir akreditasyon standardıdır."}, {"t": "1997'de çalışmaya başladı; sürdürülebilirlik raporlama rehberi oluşturdu."}, {"t": "1994'te iş liderlerince kuruldu ve yedi ilke belirledi."}, {"t": "İş yeri çalışma koşullarına odaklanan bir sosyal standarttır."}], "a": 2, "exp": "**GRI (Global Reporting Initiative)** **1997**'de çalışmalarına başlamıştır; **bütünleşik sorumluluk raporlaması** konusunda dünyada en yaygın kabul gören inisiyatiftir. **Çevre, sosyal ve ekonomik** boyutlardan oluşan üçlü sorumluluğu bütünleşik ele almış ve işletmelerin bu sonuçları raporlayabilmesi için **sürdürülebilirlik raporlama rehberi** oluşturmuştur."}, {"q": "Aşağıdaki girişim/standart – yıl eşleştirmelerinden hangisi yanlıştır?", "opts": [{"t": "Dünya Çevre ve Kalkınma Komisyonu tanımı – 1987"}, {"t": "Rio Dünya Zirvesi – 1992"}, {"t": "Caux Roundtable – 1994"}, {"t": "GRI – 2000"}, {"t": "UN Global Compact – 2000"}], "a": 3, "exp": "**GRI 1997**'de çalışmalarına başlamıştır; 2000 **UN Global Compact**'ın yılıdır. Diğerleri doğrudur: sürdürülebilir kalkınma tanımı **1987**, Rio Zirvesi **1992**, Caux ve Dinler arası Bildirge **1994**, Elkington üçlü sorumluluk **1998**, Caux revizyonu **2009**.\n💡 Kronoloji: 87 tanım → 92 Rio → 94 Caux/Dinler arası → 97 GRI → 98 Elkington → 2000 Global Compact → 2009 Caux revizyonu."}, {"q": "Ünite özetine göre aşağıdaki iş yaşamı konularından hangisi hem yasal hem etik bir yükümlülüktür?", "opts": [{"t": "Yalan söylememek"}, {"t": "Hayırseverlik"}, {"t": "İşletme olanaklarının özel amaçla kullanılmaması"}, {"t": "Gönüllü sosyal projelere katılmak"}, {"t": "Sigortasız işçi çalıştırılmaması"}], "a": 4, "exp": "Etik ile yasaların örtüştüğü alanlara örnekler: **iş yeri güvenliğinin sağlanması, vergi yükümlülükleri, sigortasız işçi çalıştırılmaması**. **Yalan söylememek, hayırseverlik, işletme olanaklarının özel amaçla kullanılmaması** ise etik meselelerdir ancak yasal yaptırımları yoktur; bunlarda yalnızca **sosyal cezalandırma**dan söz edilebilir."}, {"q": "Bir çalışan şirketin aracını sık sık kişisel işlerinde kullanıyor. Ünite özetindeki etik–yasa ayrımına göre bu durum için hangisi söylenebilir?", "opts": [{"t": "Etik bir meseledir; yasal yaptırımı olmadığından sosyal cezalandırma söz konusudur."}, {"t": "Yasal bir suçtur; yaptırım gücü bulunduğundan cezalandırılması kesindir."}, {"t": "Etik ikilem örneğidir; çünkü iki seçeneğin de geçerli etik yönü vardır."}, {"t": "Hem etik hem yasal açıdan sorun yoktur; araç zaten çalışana tahsislidir."}, {"t": "Ekonomik sorumluluk kapsamında değerlendirilir ve maliyet sorunudur."}], "a": 0, "exp": "Özet, **işletme olanaklarının özel amaçlarla kullanılmaması**nı etik olup yasal yaptırımı olmayan konular arasında sayar; burada yalnızca **sosyal cezalandırma** söz konusudur. **Yasa**, değer ve standartların yazılı hâlde bulunduğu tanımlanmış davranışlardır; **yaptırım gücü** vardır ve uymayanların cezalandırılması kesindir."}, {"q": "Ünite özetine göre aşağıdakilerden hangisi \"etik olmayan davranış\" değil de \"etik ikilem\" örneğidir?", "opts": [{"t": "Serbest satılan ilaçların bazı risklerinin tüketiciden gizlenmesi"}, {"t": "Şirket sırlarının rakip şirkete bilerek sızdırılması"}, {"t": "Mali tablolarla bilerek oynanıp kârın şişirilmesi"}, {"t": "Satın alma sürecinde tedarikçiden rüşvet alınması"}, {"t": "Maliyeti düşürmek için sigortasız işçi çalıştırılması"}], "a": 0, "exp": "**Etik olmayan davranış**, bireyin ahlaki açıdan yanlış, yasa dışı veya etik dışı kararlarına dayanır (ör. **şirket sırlarını rakibe sızdırmak**). **Etik ikilem**de bir meselenin **her iki çözümü de geçerlidir** ama her ikisinde de tarafların hakları çatışır; özetteki örnek **serbest satılan ilaçların riskleri konusunda bazı bilgilerin gizlenmesi**dir."}, {"q": "Kendimizi Sınayalım bölümüne göre \"etik ikilem\" nasıl tanımlanır?", "opts": [{"t": "Bireyin ahlaki açıdan yanlış olduğunu bildiği hâlde bilerek etik dışı karar alması"}, {"t": "İki karar seçeneğinden ikisinin de hiçbir çatışma içermeden tam anlamıyla etik olması"}, {"t": "Her ikisinin de geçerli etik yönleri olan, çatışan iki seçenekten birini seçmek zorunda kalmak"}, {"t": "Karar seçeneklerinden birinin açıkça etik, diğerinin ise açıkça etik dışı olması"}, {"t": "Bir kararın etik olup olmamasının ülkeden ülkeye ve kültürden kültüre değişmesi"}], "a": 2, "exp": "**Etik ikilem**: birbiriyle **çatışan** ama **her ikisinin de olası geçerli etik yönleri** olan iki seçenekten birini seçmek zorunda kalmak. Biri açıkça etik diğeri etik dışı ise ikilem yoktur, doğru seçim bellidir; bilerek etik dışı karar ise etik olmayan davranıştır."}, {"q": "Ünite özetine göre işletmelerin sorumluluk alanlarına ilişkin \"klasik görüş\" ile \"sosyoekonomik görüş\" hakkında hangisi doğrudur?", "opts": [{"t": "Klasik görüş topluma karşı geniş sorumluluğu savunur; bugün klasik görüş baskındır."}, {"t": "Klasik görüşe göre tek sorumluluk hissedar getirisidir; bugün sosyoekonomik görüş baskındır."}, {"t": "Sosyoekonomik görüşe göre işletmeler yalnızca müşterilerine karşı sorumludur."}, {"t": "İki görüş de işletmenin tek sorumluluğunun mal ve hizmet üretmek olduğunu savunur."}, {"t": "Sosyoekonomik görüş, paydaş yaklaşımının tam tersini savunan bir görüştür."}], "a": 1, "exp": "**Klasik görüş**: işletmelerin tek sosyal sorumluluğu **ortakların ve hissedarların yatırımlarının geri dönüşünü maksimize etmek**tir. **Sosyoekonomik görüş**: işletmeler yalnızca sahiplerine değil **toplumun daha geniş kesimine** karşı da sorumludur; günümüzde bu görüş **daha baskın**dır ve paydaş yaklaşımıyla örtüşür."}, {"q": "Ünite özetinde işletmelerde etik davranışları artırmak için kullanılan araç ve yaklaşımlar arasında aşağıdakilerden hangisi yoktur?", "opts": [{"t": "Etik kodların hazırlanması ve duyurulması"}, {"t": "Etik komiteleri ve etik danışmanları"}, {"t": "Risk analizi ve yönetimi"}, {"t": "Etik denetim, hesap verme ve raporlama"}, {"t": "Çalışanlara yemin ettirilmesi"}], "a": 4, "exp": "Özetteki araçlar: **misyon ve/veya değerler bildirgeleri, etik kodların hazırlanması ve duyurulması, etik eğitimi, etik komiteleri, etik danışmanları, tavsiye ve bilgi paylaşma kanalları, risk analizi ve yönetimi, paydaşlarla iletişim, etik denetim, hesap verme ve raporlama**. Yemin ettirme ve günlük tutturma sayılmaz (Kendimizi Sınayalım 7'de de çeldiricidir)."}, {"q": "Ünite özetine göre etik ve sosyal sorumluluk \"ilkeleri\" kapsamında en çok bilinenler hangileridir?", "opts": [{"t": "ISO 14000 çevre standardı ve SA 8000"}, {"t": "Caux Roundtable ilkeleri ve Küresel İlkeler Sözleşmesi"}, {"t": "ISO 26000 rehberi ve Küresel Raporlama Girişimi"}, {"t": "Milenyum Kalkınma Hedefleri ve Rio Bildirgesi"}, {"t": "Carroll piramidi ve üçlü sorumluluk modeli"}], "a": 1, "exp": "Özete göre **ilkeler** kapsamında en bilinenler **Caux Roundtable ilkeleri** ve **Küresel İlkeler Sözleşmesi**dir; **standartlar** arasında ise **ISO 14000, SA 8000 ve ISO 26000** sayılır. İlke ile standart ayrımı sık karıştırılır: standartlar, ilkelerin benimsendiğini ve planlı iyileştirme yapıldığını **onaylayan** ve paydaşlara duyurulmasını sağlayan araçlardır."}, {"q": "Kendimizi Sınayalım yanıt anahtarına göre aşağıdakilerden hangisi etik karar alma sürecini etkileyen faktörlerden biri değildir?", "opts": [{"t": "Örgüt kültürü"}, {"t": "Yapısal faktörler"}, {"t": "Bireysel karakteristikler"}, {"t": "Eğitim düzeyi"}, {"t": "Konunun derinliği"}], "a": 3, "exp": "Etik karar almayı etkileyen faktörler: **bireysel karakteristikler, yapısal faktörler, örgüt kültürü** ve **konunun derinliği**. Yanıt anahtarına göre **eğitim düzeyi** bu faktörler arasında yer almaz."}, {"q": "\"Çoğunluğun en yüksek iyiliğine yol açmaya çabalayan\" etik karar alma yaklaşımı hangisidir?", "opts": [{"t": "Haklar yaklaşımı"}, {"t": "Adalet yaklaşımı"}, {"t": "Sosyal sözleşme yaklaşımı"}, {"t": "Görecelilik yaklaşımı"}, {"t": "Faydacılık yaklaşımı"}], "a": 4, "exp": "**Faydacılık**, kararı sonuçlarına göre değerlendirir ve **en çok sayıda kişi için en yüksek iyiliği** hedefler. Ünitedeki diğer yaklaşımlar haklar, adalet kuramı ve bütünleşik sosyal sözleşme kuramıdır; \"görecelilik yaklaşımı\" ünitede anlatılmaz, yalnızca Kendimizi Sınayalım 4'te çeldiricidir.\n💡 Acil tıpta toplu yaralanma triyajı faydacı mantığın tipik örneğidir: sınırlı kaynakla en çok hayatı kurtarmak."}, {"q": "Etik kodlar için aşağıdakilerden hangisi geçerli değildir?", "opts": [{"t": "Karar almada yol gösterir."}, {"t": "İşletmenin temel değerlerini bildirir."}, {"t": "Yalnızca yöneticileri ilgilendirir."}, {"t": "İşletmenin iş yapma ilkelerini açıklar."}, {"t": "Yazılıdır."}], "a": 2, "exp": "**Etik kodlar** yazılıdır; karar almada yol gösterir, işletmenin temel değerlerini ve iş yapma ilkelerini açıklar. **Tüm çalışanları** ilgilendirir; bu nedenle okuma parçasında da etik kuralların **herkese iletilmesi** ve **tüm çalışanlara eğitim** verilmesi önerilir."}, {"q": "Okuma parçasına göre etik dışı davranışlara hemen her sektörde rastlanmakla birlikte en çok hangi birimlerde rastlanmaktadır?", "opts": [{"t": "Satın alma, finans, muhasebe gibi parayla uğraşan birimlerde"}, {"t": "Ar-Ge, tasarım ve üretim planlama birimlerinde"}, {"t": "İnsan kaynakları ve eğitim birimlerinde"}, {"t": "Halkla ilişkiler ve kurumsal iletişim birimlerinde"}, {"t": "Bilgi işlem ve teknik destek birimlerinde"}], "a": 0, "exp": "Okuma parçasına göre etik dışı davranışlara hemen her sektörde tanık olunur ama daha çok **parayla uğraşan** birimlerde, yani **satın alma, finans, muhasebe** gibi departmanlarda rastlanır. Şirketler de özellikle **ulaşılmaz hedefler** söz konusu olduğunda çalışanlarını etik olmayan davranışlara yönlendirebilir (\"Şirket teşvik ediyor\")."}, {"q": "Sıra Sizde 2'nin yanıt anahtarında \"kuruluşlarda paylaşılan değerlerin oluşturulması, teşvik edilmesi ve uygulanması\" olarak tanımlanan kavram hangisidir?", "opts": [{"t": "Kurumsal vatandaşlık"}, {"t": "Etik denetim"}, {"t": "Değerlere dayalı yönetim"}, {"t": "Paydaş yönetimi"}, {"t": "Hayırsever <p><span class="warn">Sık karıştırılır:</span> İş etiği = işin etik ilkelere uygun yapılması; çalışma etiği = <b>çalışmayı sevip sevmemek</b>.</p>

<h3>4. İşletme Etiği</h3>
<p><b>Etik kuralların işletme davranışlarına uygulanması</b>; kuralların yalnızca işletmeler için geçerli ve onlara özel olmasından doğar (Tak). Bireylerin etik değerlerinden (çalışma, meslek etiği) ayrı olarak <b>işletmenin kendine özgü</b> etik değerleri vardır ve bunlar <b>fonksiyonlara yayılmıştır</b> (üretim, pazarlama, muhasebe, insan kaynakları). Bu ilkeler = <span class="k">etik kodlar</span>.</p>
<ul>
<li>Etik kodlarla: tüketicinin korunması, hissedarlara ve devlete sorumluluk, çalışanlara ayrımcılık yapmama, çevreye zarar vermeme.</li>
<li>Etik davranmayan işletme: <b>kötü imaj → pazar payı kaybı → rekabet edememe</b>.</li>
</ul>

<h3>5. Yönetim Etiği</h3>
<p>Etiğin yönetimle ilişkilendirildiği, <b>yönetim fonksiyonlarının etik boyutunu</b> ele alan alan. Tanım (Filizöz): <b>yöneticilere işlerinde yol gösterecek davranış biçimleri</b>. Yöneticilerin <b>örgüt kültürünü etik ilkelerle inşa etmesi</b> de konusudur. <b>"Yönetimin etiği"</b> ve <b>"etiğin yönetimi"</b> yönetim ile etiği kesiştirir.</p>

<h3>6. Kamu Etiği</h3>

<tr><td>Etik değerler</td><td><b>İçsel</b></td><td>Eylemleri <b>bireysel ahlaki değerleri</b> referans alarak yapmak</td></tr>

<h3>7. Bilimsel Etik</h3>
<p>Bilim insanlarının faaliyeti sırasında uyacağı <b>ahlaki talep ve yükümlülükler</b> (Cevizci). <b>Serbest araştırma, öğretim ve öğrenim hakkını</b> korur, sorumlulukları analiz eder. Sorumluluk: <b>içe ve dışa, kendine ve bütün insanlara</b>. Yükümlülük: araştırdığının <b>gerçek durumunu ortaya çıkarmak</b>.</p>

<h3>8. İletişim Etiği</h3>
<p>İletişim mesleklerinde çalışanların meslek etiği: haber ajansları, gazeteler, radyo-TV, internet habercileri. <b>1970'ler</b>de kitle iletişim araçlarının büyüyüp çeşitlenmesiyle araştırmalar ivme kazandı. Merkez sorunlar: <b>medya sorumluluğu, medya performansı, kamusal yarar</b>. Doğru aktarmanın temeli: <b>bilgisel ve zihinsel donanım</b>; bunu sağlama yolu: <b>mesleğe ilişkin etik değerlerin belirlenip yaşama geçirilmesi</b>.</p>

<h3>9. Tıp Etiği</h3>
<p>Sağlık profesyonellerinin iyi davranmak için <b>neyi yapıp neden kaçınması</b> gerektiği; tıbbi eylemi düzenleyen kurallar ve tıbba özgü değerler. Temel sorun: tıbbi eylemde <b>iyi/kötü</b> nedir, <b>mutlak</b> iyi/kötü var mı? <span class="warn">Yalnızca değer sorunu çıkan durumlarla sınırlı değildir</span> — <b>her tıbbi eylemin etik boyutu vardır</b>.</p>
<p><b>Değer → Ödev</b> (değerlerin uygulanması) <b>→ Norm</b> (değerlerin harekete geçirilmesi) <b>→ İlke</b> (geniş anlamda normlar).</p>

`<h3>Temel çerçeve</h3>
<p>Meslek mensuplarının davranışlarını biçimlendiren <b>üç ana faktör</b>: <span class="k">yasal düzenlemeler</span>, <span class="k">özgür seçim hakları</span> ve <span class="k">etik olgusu</span>.</p>
<p><span class="k">Etik dışı davranış</span>: bireylerin, grupların veya örgütlerin, toplumun ya da mesleğin iyi, güzel ve doğru saydığı etik kuralları/ilkeleri terk etmesi ve bunlara aykırı davranmasıdır. Örnek: <b>ihmal, ayrımcılık, rüşvet</b>.</p>
<ul>
<li>İnsanlarda ahlaksızlığın temel nedenleri: <span class="k">çıkarcılık ve kolaycılık</span>.</li>
<li>İyi niyetli olmayan, görev ve yetkisini kötüye kullanan personel işletme için büyük tehlikedir. Personeli çok olan işletmelerde bu kişilere rastlama olasılığı fazladır; küçük kuruluşlar da paylarını alır, ama <span class="warn">küçük kuruluşlarda hile ve sahtekârlık olanakları daha azdır</span>.</li>
<li>Bazı işlerin özellikleri etik dışı alternatifi seçme olasılığını artırır; bazı pozisyonlar buna izin vermez.</li>
<li><b>Cinsiyet, sektöre göre sınıflama ve şirket büyüklüğü</b> farklılıkları etik dışı davranışta etkilidir.</li>
<li>Kişisel özellikler (hayaller, değerler, ahlak anlayışı) iş yapma tarzını belirler → <span class="k">motivasyon teorileri</span> etik dışı davranışı analiz etmede ve önceden kestirmede araç olabilir.</li>
</ul>

<tr><td>Etik çıkmazlar</td><td>Rekabet</td></tr>
<tr><td>Etik standartlardaki farklılıklar</td><td>Karşılıklı güvensizlik</td></tr>
<tr><td>Bencil davranma</td><td>Ücretlendirme</td></tr>
<tr><td>Etik davranışları farklı algılama</td><td>Etik davranışların esnetilmesi</td></tr>
<tr><td>Mesleki bilgi yetersizliği</td><td>Yasaların etkisi</td></tr>
<tr><td>–</td><td>Geleneklerin etkisi</td></tr></table></div>
<p><b>Bireysel nedenler</b></p>
<ul>
<li><span class="k">Etik çıkmazlar</span>: örgüt/yöneticilerin doğru ile yanlış arasındaki "parlak çizgiyi" görememesi. Etik dışı davranış ile etik yanlışı ayırmak için 3 faktör: <b>Niyet, Pişmanlık, Sorumluluk</b>.</li>
<li><span class="k">Etik standartlardaki farklılıklar</span>: kişinin standartlarının toplumca öngörülenden farklı olması. Oluşumunda <b>eğitim, aile yapısı ve kültür</b> önemli.</li>
<li><span class="k">Bencillik</span>: yalnız kendini düşünen, çıkarını herkesinkinden üstün tutan (egoist, hodbin); insancıl eğilimleri geri iterek çevreyi kendi çıkarına uygun <b>sömürü ortamına</b> dönüştürmeye yönelik çıkar güdüsü. 3 başlık: <b>kendine düşkünlük, kendini korumak, kendini haklı görmek</b>.</li>
<li><span class="k">Farklı algılama</span>: algı = çevreyle ilgili bilgiyi duyma, organize etme, anlama ve değerleme süreci (duyu verilerini organize edip anlam verme). Değer yargıları, amaç-hedefler, ihtiyaçlar, kültürel ortam, bilgi, hisler, geçmiş tecrübeler etkiler. Algı farkı → etik standart farkı: birine göre etik dışı olan diğerine normal gelir.</li>
<li><span class="k">Mesleki yetersizlik</span>: giderilmezse tatmin azalır, etik dışı eğilim artar. Rasyonel davranışın görülmemesi, hataların çoğalması, işini kaybetme ve sorumluluk altına girme korkusu gibi baskılar etik dışı davranışa yol açar.</li>
</ul>
<p><b>Çevresel nedenler</b></p>
<ul>
<li><span class="k">Rekabet</span>: aynı amacı güdenler arasındaki çekişme/yarış. Dürüstlük kurallarına aykırı, aldatıcı davranışlarla bozulursa <span class="k">haksız rekabet</span> (meslekle bağdaşmayan işler, hak edilmeyen kazanç, üretmeden paylaşma). İki kısım: (1) <b>örgütler arası</b> rekabette avantaj için, (2) <b>örgüt içinde</b> avantaj isteyen yönetici/işgörenlerin etik dışı davranışları.</li>
<li><span class="k">Karşılıklı güvensizlik</span>: çalışanların/yöneticilerin birbirine veya işletmeye güven eksikliği etik dışı davranışa yöneltir.</li>
<li><span class="k">Ücretlendirme</span>: gelir düzeyi ve sürekliliği bilgi, beceri, tecrübe ve müşteri gereksinimini karşılama başarısıyla ilgilidir. Gelir ön plana alınınca: performansı fazla gösterme, yetersiz ücret nedeniyle mesaide farklı işlere yönelme, terfi için yanıltma/hile/haksız rekabet.</li>
<li><span class="k">Etik davranışların esnetilmesi</span>: iş dünyası etik kurallara oranla daha esnek ve yumuşaktır; özellikle <b>küreselleşme</b> şirketleri esnek davranmaya zorlayabilir.</li>
<li><span class="k">Yasaların etkisi</span>: hukuk düzeninin amacı <b>"toplumsal mutluluk" ve "adalet"</b>. Gelenekler yetki organlarınca yasaya dönüşebilir → aykırılık resmi cezayla karşılaşır. Aldatma, dolandırma yasakla önlenebilir; ama <span class="warn">doğruluk, dürüstlük, iyi niyet gibi erdemlerin yasa yoluyla uygulanması kolay değildir</span>. Hukuk etik dışı davranışları ne ölçüde cezalandırıyorsa bu davranışlar o ölçüde zorlaşır.</li>
<li><span class="k">Geleneklerin etkisi</span>: gelenek aktif, yapıcı, yaratıcı bir şekle dönüşerek davranış ve yaşam biçimini etkiler; toplumun saygın değerlerinin etik davranışı destekleme ölçüsü etik dışı davranış miktarını belirler. Etik dışı davranış → ekonomik, sosyal, politik istikrarsızlık, kişisel çıkarın öne çıkması, örf ve âdetlere bağlılığın azalması.</li>
</ul>

<h3>Etik dışı davranış türleri</h3>
<div class="tbl"><table><tr><th>Tür</th><th>Alt tür</th><th>Açıklama</th></tr>
<tr><td>Ayrımcılık</td><td>Açık</td><td>Geleneksel olarak cinsiyete ya da ırka dayalı</td></tr>
<tr><td>Ayrımcılık</td><td>Kurumsal</td><td>Kadınların/azınlıkların örgütte eşit oranda temsil edilmemesi. Önlem: belli sayıda engelli çalıştırma</td></tr>
<tr><td>Kayırma</td><td>Yakınları kayırma</td><td>Kamu atamalarında yeterlik yerine akrabalık, hemşericilik</td></tr>
<tr><td>Kayırma</td><td>Siyasal kayırmacılık</td><td>İktidara gelen partinin destekçi seçmene ayrıcalık sağlayıp haksız çıkar sağlaması</td></tr>
<tr><td>Rüşvet</td><td>Basit</td><td>Memurun görevi gereği <b>yapmaya mecbur olduğunu yapmak</b> (veya yapmamaya mecbur olduğunu yapmamak) için rüşvet alması/vaadi kabulü</td></tr>
<tr><td>Rüşvet</td><td>Ağır</td><td>Görevi kötüye kullanarak <b>görevine aykırı</b> iş yapması/yapmaması (yapmaması gerekeni yapar, yapması gerekeni yapmaz)</td></tr></table></div>
<ul>
<li><span class="k">İhmal</span>: görevin yapılmaması, savsaklanması veya üstten verilen buyrukların geçerli neden olmadan yapılmaması.</li>
<li><span class="k">Bencil davranışlar</span>: bencillik fiile dönüşünce önde gelen etik dışı davranış olur; olayları kendi kazanç/kaybına göre yorumlar, diğerlerinin ihtiyaçlarını görmezden gelir.</li>
<li><span class="k">Yolsuzluk</span>: rüşvet, zimmete para geçirme, memuriyet görevini kötüye kullanma gibi tutum ve davranışların tamamı. Nedenleri: <b>kapasite yetersizliği</b> (kamu hizmeti yetersizse hizmet almak isteyenler arasında çekişme), <b>sosyoekonomik</b> (kamuda performans–maaş ilişkisinin olmaması), <b>siyasal</b> (iktidara gelen partilerin yandaşlarını işe yerleştirip kollaması, yükseltmesi).</li>
<li><b>Diğer</b>: sahte/yanıltıcı belge düzenleme, zimmet, hakaret ve küfür, cinsel taciz, bezdiri (mobbing) ve korkutma, yaranma, kötü alışkanlıklar, kamu/şirket sırlarını sızdırma.</li>
</ul>

<h3>Etik dışı davranışların sonuçları</h3>

<tr><td>İşini kaybetme; saygınlığını kaybetme; toplumdan soyutlanma; güvenirliğini yitirme; kişisel benliğin zarar görmesi; mesleki ve örgütsel bağlılığın zayıflaması; özsaygının yitirilmesi; çalışma arkadaşlarıyla ilişkilerin bozulması; kişisel imajın bozulması</td><td>Saygınlığını yitirme; müşterisini kaybetme; imajının zedelenmesi; iş birliğinin zayıflaması; grup çalışmalarının etkililiğini yitirmesi; kurum içi iletişimin zarar görmesi; örgütsel bağlılığın zayıflaması</td><td>Yozlaşmanın kurumsallaştırılması; etik değerlerin önemini yitirmesi; anomik davranışların yaygınlaşması</td></tr></table></div>

<h3>Etik dışı davranışı haklılaştırma</h3>
<p>Terazi görseli: <b>Yanlış</b> kefesinde <i>çıkar, kazanç</i>; <b>Doğru</b> kefesinde <i>saygı, eşitlik, adalet</i>.</p>
<p><span class="k">Etik gerekçelendirme</span>: kişinin karar, eylem ve davranışlarını haklı ve mantıklı göstermeye çalışması; bunun için çeşitli yollara başvurulur.</p>
<div class="tbl"><table><tr><th>Gerekçe</th><th>Neden geçersiz?</th></tr>
<tr><td>1. Eğer gerekli ise etiktir</td><td>Meşru yolla zor amaca etik dışı yolla ulaşıp "gereklilik" demek; durumu kurtarmak için başvurulan yol etik değildir</td></tr>
<tr><td>2. Sahte gereklilikler tuzağı</td><td>Yanlışı haklı göstermek için <b>uydurulmuş</b> gerekçeler; aslında öyle bir gereklilik yoktur</td></tr>
<tr><td>3. Yasal ve izin verilebilir ise uygundur</td><td>Sirk, hayvanat bahçesi, yunus parkı yasaldır ama etik midir? <span class="warn">Yasal ≠ etik</span></td></tr>
<tr><td>4. Bu işin bir parçası</td><td>Görsel: "Hamili kart yakınımdır" kartı (torpil "işin doğası" sayılır)</td></tr>
<tr><td>5. Sonuçta herkesin yararı sağlanacak</td><td>Çoğunluğun faydasına olsa da etik dışı uygulamadan kaçınılmalı</td></tr>
<tr><td>6. Bunu sadece senin için yapıyorum</td><td>Bir kişi korunarak işlem yapılıyorsa orada etik sorun vardır</td></tr>
<tr><td>7. Sadece ateşe ateşle karşılık veriyorum</td><td>Başkasının önce başlatması karşılık vermeyi haklı çıkarmaz; etik dışı olan etik dışıdır</td></tr>
<tr><td>8. Kimse zarar görmeyecek</td><td>Zarar vermeyeceği varsayımı davranışı etik yapmaz</td></tr>
<tr><td>9. Yüce/asil/kutsal amaç için yozlaşma (noble cause corruption)</td><td>Ülke/kurum/toplum çıkarı iddiası davranışı etik yapmaz; kişiler kendi çıkarı için üst amaçları <b>paravan</b> yapar</td></tr>
<tr><td>10. Meslektaşlarının suçlarını gizleme (code of silence)</td><td><b>Sessizlik yasası</b>: görülen etik dışı davranışları bilmezden/görmezden gelme → etik dışı davranan kamu görevlilerinin korunması, etik dışılığın <b>kurum kültürüne</b> dönüşmesi</td></tr>
<tr><td>11. Kimsenin fark etmeyeceği inancı</td><td><span class="k">Akvaryum teorisi</span>: herkesin yaptığı akvaryumdaki balıklar gibi dışarıdan görünür</td></tr>
<tr><td>12. Yakalanırsam kurum bana arka çıkar inancı</td><td>Kurumun göz ardı edeceği, kişiyi koruyacağı inancı</td></tr>
<tr><td>13. Başkaları ile kendini karşılaştırma</td><td>Başkalarının etik dışılığını örnek gösterip kendininkini önemsizleştirme; kimsenin etik derecesi başkasına ölçü olamaz, herkes kendinden sorumlu</td></tr>
<tr><td>14. Herkes aynı şeyi yapıyor</td><td>Herkesin yapması yanlışı doğru kılmaz; yanlış, yanlıştır</td></tr>
<tr><td>15. Kişisel olarak benim kazancım yoksa tamam</td><td>Kişisel çıkar olmaması davranışı doğru/savunulur kılmaz</td></tr>
<tr><td>16. Hak ettiğimi alamıyorum</td><td>Maaşın yetersizliği <b>ikinci iş</b> gerekçesi olamaz; ikinci iş = performansın, kararların ve <b>sadakatin</b> bozulması</td></tr>
<tr><td>17. Hâlâ tarafsız olabilirim</td><td>Tarafsızlığı bozan bir adımdan sonra tarafsız kalmak imkânsız; <b>tarafsız olmak kadar tarafsız görünmek</b> de önemli; algı bozulursa toplumun güveni sarsılır</td></tr>
<tr><td>18. Benden bulmasın düşüncesi</td><td>Kamu görevlisi yetkisini yasal ve etik sınırlarda kullanmakla sorumlu; gerektiğinde etik dışı davrananların cezalandırılması da göreve dahil; baskı/nüfuzdan korkmadan görev yapılmalı</td></tr></table></div>

<h3>Davranışın etik açıdan yargılanması: 9 soru</h3>
<ol><li>Bu doğru mu?</li><li>Bu adil mi?</li><li>Gazetede yayınlansaydı ne hissederdin?</li><li>Birisi zarar görecekse bu kim?</li><li>Ailenize, çocuğunuza, akrabalarınıza bunu söyler miydiniz?</li><li>Herkes senin gibi davransaydı ne olurdu?</li><li>Soruşturma açılsa kendini savunabilir misin?</li><li>Kararının sonuçlarına katlanabilecek misin?</li><li>Olay nasıl kokuyor?</li></ol>
<p><b>Etik değerlendirme testleri</b>: <span class="k">Doğruluğun ölçüsü</span> = değerler, ilkeler, kurallar ve standartlar. "<i>Bana yapılsaydı ne hissederdim, adil bulur muydum?</i>" testi. <span class="k">Evrensellik</span> (herkes böyle davransaydı?).</p>
<p>"Doğru şeyi yapmak için yanlış zaman yoktur." – <b>H. Jackson Brown Jr.</b> · "Etiğin ödülü yine etiktir."</p>`,
`<h3>Sosyal sorumluluk kavramı</h3>
<p><span class="k">Sosyal sorumluluk</span> (kısa tanım): bir kurumun <b>kaynaklarını toplum yararına</b> olacak şekilde kullanmasıdır.</p>
<p><b>Geniş tanım</b>: "Bir kurumun <b>ekonomik ve yasal koşullara, iş ahlakına, kurum içi ve çevresindeki kişi ve kurumların beklentilerine</b> uygun bir çalışma stratejisi ve politikası gütmesidir."</p>
<p><span class="k">Sosyal sorumluluk uygulamaları</span>: kurumun benimsediği ve yürüttüğü; toplumun refahını iyileştirme, çevreyi koruma ve sosyal konuları destekleyen <span class="warn">isteğe bağlı (gönüllü)</span> iş uygulamaları ve yatırımlarıdır.</p>
<p>Buradaki <b>toplum</b> kavramı geniştir: kurum <b>çalışanları, tedarikçiler, dağıtıcılar, kâr amacı gütmeyenler, kamu sektörü ortakları</b> ve <b>genel toplum üyeleri</b>.</p>

<h3>Sosyal sorumluluk türleri / boyutları</h3>
<p>İşletmeler <b>eğitim, sağlık, kültür</b> gibi birçok alanda sosyal sorumluluk faaliyeti yürütebilir. Bu hizmetler toplumun, devletin ve insanlığın lehine ise bu <b>ahlaki bir davranışın sonucudur</b>; dolayısıyla sosyal sorumluluğun çeşitli boyutları vardır.</p>
<p><b>Dört boyut</b>:</p><ol><li>Ekonomik boyut</li><li>Hukuki boyut</li><li>Ahlaki boyut</li><li>Gönüllülük boyutu</li></ol>

<h3>İşletmenin sosyal sorumluluk yönleri</h3>
<ul>
<li>İşletme bir yandan <span class="k">sosyal bir organizma</span> olarak <b>kendi içindeki insan topluluklarının</b> sorunlarına eğilir.</li>
<li>Diğer yandan işletme dışındaki geniş toplumsal kesimle ilişki kurar; toplumun çeşitli kesimlerini ve özellikle <b>ürettiği mal/hizmeti satın alan tüketici kesimini</b> yakından takip eder.</li>
<li>İşletmeyi saran toplumun <b>bileşimi, demografik yapısı, kültürü, gelenek-görenek ve alışkanlıkları</b> işletmeyi önemli ölçüde etkiler.</li>
<li>İşletme hem bu özellikleri taşıyan insanları barındıran bir kurumdur hem de üretimini topluma yönelttiği için <b>toplumla iç içe yaşamak zorunda</b> olan bir kuruluştur.</li>
</ul>

`<h3>Ünitenin çerçevesi</h3>
<p><b>Anahtar kavramlar:</b> Etik, Etik İkilemler, Etik Kodlar, Sosyal Sorumluluk, Paydaş, Sosyal Denetim, Üçlü Sorumluluk.</p>
<p><b>Amaçlar:</b> etik–yasa ilişkisini; etik olmayan davranış ile etik ikilem farkını açıklamak; işletmelerin sorumluluk alanlarındaki tarihsel değişimi karşılaştırmak; etik davranışı artıran araç ve yaklaşımları tanımak; sosyal sorumlu işletme olmanın yol haritasını açıklamak; etik ve sosyal sorumluluk ilke ve standartlarını tanımlamak.</p>

<h3>Giriş</h3>
<ul>

<li>Günümüz işletmeleri karmaşık iş etiği sorunlarını <b>tanıma ve üstesinden gelme</b> yeteneğine ihtiyaç duyar.</li>

<li>Kararları mercek altına alanlar: tüketiciler, çalışanlar, yatırımcılar, hükümetler, özel ilgi grupları.</li>

<li><b>DİKKAT:</b> 25.000 üniversite öğrencisiyle araştırma → <b>%62</b> en az bir kez kopya çekmiş; öğrenciler internetten ödev/müzik indirmeyi veya başkasının cevabını kopyalamayı hilekârlık saymıyor (Ferrell vd., 2008).</li>

<h3>Etik kavramı</h3>
<div class="tbl"><table>
<tr><th>Kavram</th><th>Tanım</th></tr>
<tr><td>Ahlak</td><td>Toplumda birey/grupların <b>uymak zorunda</b> oldukları davranış biçimleri ve kurallar</td></tr>
<tr><td>Etik (ahlak bilimi)</td><td>Davranışların doğruluğu/yanlışlığı hakkında <b>hüküm vermeyi sağlayan</b> ahlaki ilke ve değerler toplamı; kişi/grubun davranışının doğruluğunu belirleyen kurallar ve ilkeler</td></tr>

<h3>Etik ve yasa ilişkisi</h3>
<p>Bazı kararlar için ulusal/uluslararası yasal çerçeve vardır; bazıları özgür seçime bağlıdır. İnsan davranışları <b>dışsal kontrolün yoğunluğuna</b> göre 3 kategoride:</p>
<div class="tbl"><table>
<tr><th>Alan</th><th>Özellik</th><th>Standart</th></tr>
<tr><td>Yasa (hukuk)</td><td>Değerler yazılı; kurallar kanun yapıcılarca net. <b>Dışsal kontrol en yoğun.</b> Ör. motosiklet sürücüsü olma şartları, şirketlerin vergi yükümlülükleri</td><td>Yasal</td></tr>
<tr><td>Etik (ortada)</td><td>Spesifik yasa yok; toplumca genel kabul görmüş ilke ve değerlere dayalı davranış standartları var; yasaların <b>yaptırım gücü yok</b></td><td>Toplumsal</td></tr>
<tr><td>Özgür seçim (diğer uç)</td><td>Yasalarda hiç yer almayan davranışlar; <b>itaat kurumu yok</b>, kişi kendini sınırlar. Ör. neye yatırım yapılacağı, ne kadar mamul üretileceği</td><td>Bireysel</td></tr>
</table></div>
<ul>
<li><span class="k">Etik açıdan kabul edilebilir davranış</span>: hem <b>yasal</b> hem toplumun büyük kesimince <b>ahlaki</b> açıdan kabul edilebilir olan.</li>
<li>Güçlük: yasal yükümlülükler dışındaki kararları <b>özgür seçim bölgesinde</b> ele almak → <span class="warn">"yasal olan her şey etiktir" yanılgısı</span>. Etik alanın farkında olmak, davranışı içeride ve dışarıda düzenler.</li>
<li>Şirketler kendi <b>etik kodlarını</b> oluşturup kültürlerini dönüştürünce <b>ilave yasal düzenleme ihtiyacı azalır</b>.</li>
</ul>

<h3>Etik kusur – etik ikilem</h3>
<div class="tbl"><table>
<tr><th>Kavram</th><th>Anlamı</th></tr>
<tr><td>Etik kusur</td><td>Kararın ahlaki açıdan yanlış, yasa dışı veya etik dışı olması; <b>net</b> kusur</td></tr>
<tr><td>Etik ikilem</td><td>Birbiriyle çatışan, ikisinin de olası geçerli etik yönleri olan iki seçenekten birini seçme zorunluluğu; her iki seçeneğin de potansiyel zararlı sonuçları var; <b>doğru-yanlış net değil</b> (Nasreddin Hoca, oğlu ve eşeği hikâyesi)</td></tr>
</table></div>
<ul>
<li>İkilemlerin nedeni: etik standartların resmî, yazılı, herkesçe kabul edilmiş, <b>uzlaşılmış maddeler olmaması</b>.</li>
<li><b>DİKKAT:</b> Küreselleşme, keskin rekabet ve teknoloji etik meseleleri etkiler. E-ticaret etik konuları: <b>kişisel bilgilerin gizliliği, izinsiz ticari e-posta, çocuklara yönelik e-ticaret uygulamaları</b> (Varinli ve Öz, 2006).</li>
<li>Bazı işletmelerde <b>etik sorumluları</b>, bazılarında <b>etik kurulları</b> vardır.</li>
</ul>

<h3>Etik karar alma</h3>
<ul>
<li>Örnek sorular: şirkete menfaat için rüşvet; durgunlukta kendini lise mezunu tanıtmak; şirket olanaklarını özel ihtiyaç için kullanmak; kat sekreterine özel iş yaptırmak; iş telefonuyla yurt dışındaki akrabayı aramak → yanıtlarınız <b>etiğe yaklaşımınızı</b> yansıtır.</li>
<li>Yöneticilerden <b>rasyonel karar</b> beklenir; ama kararların etik yönü de vardır: süreçte ve sonuçta <b>kimlerin etkileneceği</b> gözetilmeli.</li>
<li><span class="k">Farklı perspektifler farklı kararlara yol açar.</span> Sorun: <b>mükemmel kararın bulunamaması</b>. Etik ikilemlerde <b>yaratıcı seçeneklere</b> ihtiyaç var.</li>
<li><b>KİTAP:</b> Bowen H. McCoy, "Sadhu'nun Öyküsü" (HBR seçmeleri 2004, Şirket Ahlakı, MESS Yayın No: 466) – grup bireyin esenliğinden ne zaman sorumludur?</li>
</ul>

<h3>Dört etik karar alma yaklaşımı</h3>
<div class="tbl"><table>
<tr><th>Yaklaşım</th><th>Öz</th><th>Örnek / not</th></tr>
<tr><td>1. Faydacılık</td><td>Çoğunluğun iyiliğini üreten karar etiktir (19. yy: <b>Bentham, J.S. Mill</b>); sayısal yöntem kaygısı</td><td>Otomotiv fabrikasını kapatıp taşımak; çalışanların 1/4'ünü çıkarmak</td></tr>
<tr><td>2. Haklar (bireyselcilik)</td><td>"Nelere hakkım var?"; etkilenenlerin haklarını en iyi koruyan karar etiktir</td><td>Gizli dinleme = gizlilik ihlali</td></tr>
<tr><td>3. Adalet kuramı</td><td>Eşitlik, doğruluk, tarafsızlık; 3 adalet türü</td><td>Eşit işe eşit ücret</td></tr>
<tr><td>4. Bütünleşik sosyal sözleşme</td><td>Ampirik (ne) + normatif (ne olmalı); iki sözleşme</td><td>Romanya fabrikasında yerel ücret düzeyi</td></tr>
</table></div>

<h3>Faydacılık</h3>
<ul>
<li>Karar verici her seçeneğin tüm kesimlere etkisini gözetip <b>çoğunluğun en yüksek tatmini</b>ni seçer.</li>
<li>Karmaşık hesap yerine <b>basitleştirme</b>; ör. <b>maliyet–fayda</b> hesabı.</li>
<li><span class="warn">Sadece doğrudan etkilenenler dikkate alınır; dolaylı etkilenenler hesaba katılmaz.</span></li>
<li>Artı: verimlilik, üretkenlik, <b>kâr maksimizasyonu</b> ile uyumlu.</li>
<li>Eksi: kaynakların <b>ön yargıyla dağıtılması</b>; söz hakkı olmayan/temsil edilmeyen paydaşların hakları zarar görebilir.</li>
</ul>

<h3>Haklar yaklaşımı</h3>
<div class="tbl"><table>
<tr><th>Hak grubu</th><th>Örnekler</th><th>Toplumdan beklenen</th></tr>
<tr><td>Özgürlük hakları</td><td>İfade, seyahat özgürlüğü</td><td><b>Müdahale etmeme</b></td></tr>
<tr><td>Refah hakları</td><td>Mülkiyet, beslenme, sağlık hizmeti/sağlığı koruma</td><td><b>Katılım ve çaba</b></td></tr>
</table></div>
<ul>
<li><b>Thomas Hobbes (1588-1679):</b> her ahlak ve hukuk düzeninin amacı <b>toplumda barış</b>; deneysel gerçeklere dayalı ahlak; kendine tanıdığın hakkı başkasına da tanı, özgürlüğünü başkalarından beklediğin ölçüde sınırla.</li>
<li>Haklar = <b>BM İnsan Hakları Evrensel Bildirgesi</b>'ndeki haklar. Yönetimde önemli: yaşam ve güvenlik, gizlilik, doğruluk, vicdan ve konuşma özgürlüğü, özel mülkiyet.</li>
<li>Yöneticiler başkalarının temel haklarını engellememeli: gizli dinleme → gizlilik ihlali; cinsel taciz → ahlaki normları ihlal; yolsuzluğu ifşa edeni desteklemek → konuşma özgürlüğünü desteklemek.</li>
<li><span class="warn">Faydacılıktan farkı: odakta toplum değil birey.</span> Faydacılıkta bireysel haklar toplum refahına göre ikinci planda.</li>
</ul>

<h3>Adalet kuramı</h3>
<div class="tbl"><table>
<tr><th>Tür</th><th>Gerektirdiği</th></tr>
<tr><td>Dağıtım adaleti</td><td>Keyfî farklı davranmamak; eşit işe eşit ücret. Beceri/sorumluluk farkı oranında ücret farkı olabilir; fark örgütsel amaç ve görevlerle net ilişkili olmalı</td></tr>
<tr><td>Prosedürel / işlemsel</td><td>Kuralların adil uygulanması: açık, tarafsız, tutarlı</td></tr>
<tr><td>Etkileşimsel</td><td>Bireyler arası davranışlarda algılanan dürüstlük; ilişkilerin <b>formal olmayan</b> yönü (yöneticinin astlarına açık yüreklilik, duyarlılık, saygı)</td></tr>
</table></div>
<ul>
<li><b>Bedel ödeme:</b> kişi yalnızca sorumluluğu altındaki alandaki hasardan sorumlu; kontrolü dışındakinden değil → İK ödül/ceza sistemleri.</li>
<li><span class="k">Zayıf taraf:</span> daha az risk, daha az teşvik ve yenilik. <span class="k">Güçlü taraf:</span> ayrıcalıklı statü/grupları önler; kaynak ve fırsatlardan eşit pay.</li>
<li>İK yönetimine rehberlik eden yasaların çoğu <b>adalet yaklaşımına</b> dayalıdır.</li>
</ul>

<h3>Bütünleşik sosyal sözleşme kuramı</h3>
<ul>
<li>Nispeten yeni; <b>ampirik (ne) + normatif (ne olmalı)</b> birleşimi; iki sözleşmenin entegrasyonu:</li>
<li><b>Genel sosyal sözleşme</b> (iktisadi birimler/üyeler arası): iş yapmanın temel kuralları.</li>
<li><b>Spesifik sözleşme</b> (bir topluluğun üyeleri arası): kabul edilebilir davranış biçimleri.</li>
<li>Örnek: Türk işletmesinin Romanya'daki fabrikasında ücret, <b>yerel ücret düzeyi</b> baz alınarak belirlenir.</li>
<li>Diğer üçünden farkı: doğru/yanlışı ayırırken <b>endüstri ve şirket içindeki etik normları</b> dikkate almak.</li>
</ul>
<p>Genel değerlendirme: <b>Faydacılık</b> (etkinlik, üretkenlik, kâr) daha çok taraftar bulur; ama bireysel haklar, sosyal adalet, doğal çevrenin korunması gibi trendler yararlılığa dayanmayan standartlar gerektirir → işletmeler <b>etik ikilemlerle daha çok</b> uğraşır.</p>

<h3>Etik davranışı etkileyen faktörler (Şekil 3.1)</h3>
<p>Kaynak: Robbins ve Coulter (2007). Akış: <b>Etik sorunla karşılaşma → Muhakeme süreci → Etik/etik olmayan davranış</b>. Muhakemeyi etkileyen 5 faktör: <span class="k">bireysel karakteristikler, ahlaki gelişmişlik düzeyi, sorunun etki gücü, yapısal değişkenler, örgüt kültürü</span>.</p>
<div class="tbl"><table>
<tr><th>Kohlberg (1976) düzeyi</th><th>Davranış</th></tr>
<tr><td>1. İlk aşama</td><td>Sadece çıkarına uygunsa ve/veya <b>fiziksel cezadan kaçınmak</b> için kurala uyar</td></tr>
<tr><td>2. İkinci düzey</td><td>Yakınlarının <b>beklentileri</b> doğrultusunda yaşar, onayladığı yükümlülükleri yerine getirir, <b>var olan düzeni korur</b></td></tr>
<tr><td>3. En üst basamak</td><td><b>İlkelere dayalı</b>; çoğunluğa aldırmadan haklara saygı; kanuna aykırı olsa bile kendi etik ilkesine göre karar</td></tr>
</table></div>
<p>Kohlberg'in modeli <b>bilişsel gelişim yaklaşımına</b> göre oluşturulmuştur.</p>
<ul>
<li><b>Bireysel özellikler:</b> herkes örgüte yerleşik değerleriyle gelir (aile, arkadaş, öğretmen); bunlar temel doğru/yanlış muhakemesini belirler.</li>
<li><b>Yapısal değişkenler:</b> yapısal tasarım; resmî kurallar, iş tanımları, etik kodlar → etik davranışı teşvik, tutarlılık; <b>belirsizlik ve yanlış anlamayı azaltır</b>.</li>
<li><b>Örgüt kültürü:</b> güçlü ve yüksek etik standartlı kültür olumlu etkiler; <span class="warn">zayıf kültürde birey altkültür normlarına uyar</span>; çalışma grupları ve bölüm standartları da etkili.</li>
<li><b>Sorunun etki gücü:</b> birkaç malzemeyi eve götüren çalışan zimmete karşı çok duyarlı olabilir. Ölçüler: zarar/yararın büyüklüğü, iyi/kötü konusunda uzlaşma, gerçekleşme olasılığı. Önemli görülen konularda daha özenli davranılır.</li>
<li><b>DİKKAT:</b> Etiğe <b>stratejik</b> yaklaşan kuruluş riskleri minimize eder → cezalandırılma riski düşer.</li>
</ul>

<h3>Etik yönetimi ve unsurları</h3>
<p><span class="k">İş etiği yönetimi</span>: spesifik politika, pratik ve programlarla etik konuların formal/informal yönetimine yönelik doğrudan girişimler; etik olmayan davranışı azaltır. Araçlar (Crane ve Matten, 2010):</p>
<ol>
<li>Misyon ve/veya değerler bildirgesi</li>
<li>Etik kodlar</li>
<li>Raporlama/tavsiye kanalları</li>
<li>Risk analizi ve yönetimi</li>
<li>Etik yöneticisi / etik sorumlusu / etik komiteleri</li>
<li>Etik danışmanları</li>
<li>Etik eğitimi</li>
<li>Paydaşlara danışma, diyalog ve iş birliği</li>
<li>Denetim, hesap verme ve raporlama</li>
</ol>

<h3>Misyon ve değerler bildirgesi</h3>
<ul>
<li>Amaç, inanç ve değerleri kapsar. <span class="k">Misyon ifadeleri işletmenin varlık nedenini açıklar</span>; içerik: kurum ve iş yapma felsefesi, kendini nasıl gördüğü, ürün/hizmet ve pazarlar, teknoloji, büyüme-kârlılık, imaj. Vizyona hangi görevle ulaşılacağını netleştirir.</li>
<li>KOBİ'lerde, özellikle büyük örgütlerde yazılı, kamuya açık misyon ifadeleri bulunur; bazen sosyal amaçtan söz etmez. Sosyal misyon, örgütün bütününü kapsayan <b>yerleşik etik yönetimiyle</b> desteklenmezse <span class="warn">sadece bir dilek olarak yazıda kalır</span>.</li>
<li>Değer bildirgeleri <b>öncelikli değerleri</b> ortaya koyar, çalışanları etik davranışa yönlendirir. Değerler, <b>belirgin kural olmayan koşullarda</b> etik karara yol açar; kişinin kendi kararlarının kökenindedir.</li>
<li><span class="k">Değerlere Dayalı Yönetim</span>: ortak değerler katılımcı yöntemle, tüm kesimlerin temsilcileriyle belirlenir. Paylaşılan değerler örgüt kültürünü şekillendirir. Amaçlar: yöneticilerin karar/eylemlerine rehberlik, çalışan davranışını biçimlendirme, pazarlama çabalarını etkileme, takım ruhu.</li>
</ul>

<h3>Etik kodlar</h3>
<ul>
<li>Belirli işletme, meslek grubu veya endüstride çalışanlardan/üyelerden beklenen davranışları açıklayan <b>bildirgeler</b>; yazılı etik ilkeler geliştirme yolu.</li>
<li><span class="k">Etik yönetiminde en yaygın yaklaşım etik kodların oluşturulmasıdır.</span> Kuruluşlar sektörün etik yasalarına uymayı taahhüt edebilir.</li>
<li><b>Türkiye Kimya Sanayicileri Derneği</b> üyelerinden <b>üçlü sorumluluk</b> anlayışına göre iş ve raporlama bekler.</li>
<li>STK/meslek kuruluşları: <b>TEDMER</b> (Türkiye Etik Değerler Merkezi), <b>TOBB</b> (Türkiye Odalar ve Borsalar Birliği), <b>İSO</b> (İstanbul Sanayi Odası).</li>
</ul>
<p><b>TEİD (Etik ve İtibar Derneği)</b> üyeleri <b>13 temel ilkeye</b> inanç beyan eder:</p>
<ul>
<li>Anayasa başta tüm ulusal mevzuata ve uluslararası anlaşmalara uyum</li>
<li>Beyan ve raporların gerçeğe uygun, doğru, anlaşılır, zamanında sunulması</li>
<li>Doğruluk ve şeffaflık öncelikli değer</li>
<li>İş etiğinin yazılı kurum kültürünün yapı taşı olması</li>
<li>Çalışanları çıkar çatışmasından uzak tutma; görevden kişisel çıkarı yasaklama ve denetleme</li>
<li>Tarafsızlığı etkileyecek <b>hediye almayı ve vermeyi yasaklama</b></li>
<li>Kamu kurumları, STK ve siyasi partilere menfaat beklemeden <b>eşit mesafe</b></li>
<li>Yolsuzluğa yol açmama, göz yummama, mücadele</li>
<li>Haksız rekabet yok; adil rekabet ve tüketici hakları</li>
<li>Kayıt dışı istihdam yok; iş sağlığı-güvenliği; gençler, kadınlar, engellilerin adil istihdamı</li>
<li>Ekonomik ve sosyal kalkınmaya katkı</li>
<li>İlkelerin iş ortakları ve tedarikçiler dâhil tüm etki alanına yayılması</li>
<li><b>BM Küresel İlkeler Sözleşmesi'nin 10 temel ilkesine</b> destek</li>
</ul>

<h3>Diğer etik yönetimi araçları</h3>
<div class="tbl"><table>
<tr><th>Araç</th><th>Ana bilgi</th></tr>
<tr><td>Raporlama/tavsiye kanalları</td><td>Bilgi toplama bilgi birikimi ve efektif yönetim sağlar; çalışan geri bildirimleri etik değerleri korur, tüketiciye yansıyabilecek ihlalleri önler; önceden duyurulan etik değer bildirileri</td></tr>
<tr><td>Risk analizi ve yönetimi</td><td>İşletmelerin en çok durduğu konulardan. Basın/halkla ilişkilerde dil, coğrafyanın değerleriyle <b>çatışmamalı</b>. Çevre kirliliği, çevre dostu materyal gibi konularda olumlu imaj. İş etiği <b>dinamik</b>, durağan değil. En önemli konular: <b>insan hakları ihlalleri, yolsuzluklar, küresel ısınma</b></td></tr>
<tr><td>Etik yöneticisi / sorumlusu / komiteleri</td><td>Komiteler departman gibi çalışır, <b>tepe yönetimine tavsiye kararları</b> alır; <b>ücretsiz telefon hatları</b> ile ihbar teşviki</td></tr>
<tr><td>Etik danışmanları</td><td>Kurumsal yapıda istihdam edilebilir; örnek: <b>çevre mühendisleri</b>nin kurallar ve yasal zorunluluklar danışmanlığı</td></tr>
<tr><td>Etik eğitimi</td><td>Üniversiteler, danışmanlar içerik üzerine çalışır; gelişmiş ve gelişmekte olan ülkelerde yaygınlaşıyor; <b>akademik ortamdan, işe başlamadan önce</b> önerilir; teknoloji kullanımı: <b>İsveçli ilaç firmasının simülasyon oyunu</b></td></tr>
<tr><td>Paydaş görüşü, diyalog, iş birliği</td><td><b>Halka arz</b> etkileyen/etkilenen kişi sayısını artırır; tutundurma kararlarında etik daha önemli; kurumsal iletişim = diyalog platformu</td></tr>
<tr><td>Denetim, hesap verme, raporlama</td><td><b>İlk 250</b> büyük işletme kurumsal sorumluluk raporu yayımlar; oran en çok <b>Japonya %90</b>, en az <b>Meksika %20</b></td></tr>
</table></div>
<p><span class="k">Sosyal denetim</span> = işletmelerin sosyal sorumluluk performansının değerlendirilmesi.</p>

<h3>Sosyal sorumluluk: iki uç görüş</h3>
<div class="tbl"><table>
<tr><th>Görüş</th><th>Savunusu</th></tr>
<tr><td>Klasik / ekonomik</td><td>Tek sosyal sorumluluk <b>kâr maksimizasyonu</b>. <b>Milton Friedman</b> (Nobel'li ekonomist): yönetici hissedar/sahip çıkarını korur; sahipler yalnız <b>finansal kazanç</b> ister; toplum için harcama ilave maliyettir → ya <b>ürün fiyatına</b> ya <b>kâr payına</b> yansır</td></tr>
<tr><td>Sosyoekonomik</td><td>Kârın ötesinde <b>toplumun refahını korumak ve iyileştirmek</b>; şirketler sadece patronlarına değil, onları kuran ve destekleyen toplumun geniş kesimine sorumlu; tümüyle ekonomik kurum değiller</td></tr>
</table></div>
<ul>
<li><span class="warn">Friedman sosyal sorumluluğu reddetmez; "tek" sorumluluk olarak hissedar kârını görür.</span></li>
<li><b>116 ülkeden 4200 yönetici</b>: çoğunluk şirketin rolünün ortak çıkarını korumanın ötesinde olduğuna inanıyor. Yatırımcılar sosyal sorumlu şirketleri tercih ediyor / aracı kurumlara talimat veriyor.</li>
<li>İNTERNET: <b>"Haydi Kızlar Okula"</b> – UNICEF.</li>
<li>Bugün <b>sosyoekonomik görüş</b> ağırlıkta; nedenler: aşırı büyüme, büyük kaynak kullanımı, toplum sağlığına ve doğal çevreye etki; tüketici/yatırımcı tercihlerinin sosyal sorumlu kurum-marka-ürünlere kayması; nitelikli işgücü için kurumsal itibar; daha güvenli, eğitimli, adil toplum için uzun dönemli yatırım ve sağlıklı rekabet.</li>
</ul>

<h3>Sosyal sorumluluk tanımları</h3>
<ul>
<li>"Sadece kâr", "kârın ötesi", "gönüllü faaliyet", "sosyal sisteme ilgi" → <span class="warn">hiçbiri tek başına yeterli değil</span>.</li>
<li><span class="k">Sosyal sorumluluk</span>: yasal ve ekonomik yükümlülüklerin yanı sıra toplumun iyiliği için doğru şeyleri doğru yöntemlerle yapma niyeti.</li>
<li>Toplumun, çalışanların ve ailelerinin yaşam kalitesini yükseltirken ekonomik gelişmeye katkı; operasyonlara entegre edilmeli.</li>
<li>Paydaşlar üzerindeki <b>olumsuz etkiyi minimize, olumlu etkiyi maksimize</b> etme yükümlülüğü.</li>
<li>Etik ve sosyal sorumluluk farklı anlamlı ama <b>birbiri yerine kullanılabilir</b>. İş etiği = karar almaya rehberlik eden kurallar/iş yapma biçimleri; sosyal sorumluluk = <b>toplumla yapılmış sözleşme</b>.</li>
<li><span class="k">Sosyal sorumlu davranış</span>: etiğe dayanan ve toplum beklentisini karşılayan, eyleme dönüşmüş davranış.</li>
</ul>

<h3>Sosyal sorumluluk düzeyleri – Carroll piramidi (Şekil 3.2)</h3>
<p>Kaynak: Crane ve Matten (2010), Carroll (1991)'den uyarlanmış. Dört ardışık katman; alttan üste çıkıldıkça toplumun daha geniş kesimine duyarlılık artar.</p>
