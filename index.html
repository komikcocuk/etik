ilir"}, {"t": "Tabip odasının izniyle infazda görev alabilir"}, {"t": "Kesinleşmiş mahkeme kararı varsa infaza yardımcı olabilir"}], "a": 1, "exp": "Madde 37 (**Ölüm cezasına etkin katılım yasağı**): Hekim **hiçbir zaman** ölüm cezasının infazında bulunamaz, infaza yardımcı olamaz, ölüm cezası uygulamasında tıbbi hizmet veremez."}, {"q": "Büyük bir deprem sonrası sahada çok sayıda yaralı varken herkese gerekli tıbbi yardımın verilemediği bir durumda, Hekimlik Meslek Etiği Kuralları'na (Madde 38) göre hekim önceliği hangi hastalara vermelidir?", "opts": [{"t": "Çocuk ve yaşlı vakalara, durumlarına bakılmaksızın"}, {"t": "Olay yerine ilk ulaşan vakalara"}, {"t": "Tedavi olasılığı yüksek olan ağır vakalara"}, {"t": "Hafif yaralı ve yürüyebilen vakalara"}, {"t": "En ağır durumdaki, kurtarılma şansı en düşük vakalara"}], "a": 2, "exp": "Madde 38: Hekim olağanüstü durumlar ve savaşta evrensel tıbbi etik kurallarını **yansızlıkla** uygular. Hasta ve yaralı sayısının çokluğu nedeniyle herkese yardım verilemiyorsa, hekim **tedavi olasılığı yüksek olan ağır vakalara** öncelik verir.\n💡 Bu, afet triyajının (ör. START) etik temelidir: kaynak kıt olduğunda \"en çok kişiyi kurtarma\" ilkesi gereği, yardımla kurtarılabilecek ağır vakalar öne alınır."}, {"q": "Hekimlik Meslek Etiği Kuralları Madde 39'a göre hekim, cinsel ilişki muayenesi istemlerini hangi kurumlardan gelmesi halinde dikkate alabilir?", "opts": [{"t": "İşverenler ve sigorta şirketleri"}, {"t": "Tabip odaları ve hastane yönetimleri"}, {"t": "Emniyet müdürlükleri ve jandarma"}, {"t": "Savcılıklar ve mahkemeler"}, {"t": "Okul idareleri ve aile"}], "a": 3, "exp": "Madde 39: Hekim, **savcılıklar ve mahkemeler dışında** kalan kişi ve kurumlardan gelen cinsel ilişki muayenesi istemlerini dikkate alamaz. Ayrıca ilgilinin veya ilgili reşit değilse **veli ya da vasisinin aydınlatılmış onamı** olmadıkça muayene yapamaz."}, {"q": "Hekimlik Meslek Etiği Kuralları'na göre insan üzerinde yapılacak araştırmalarla ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yerel etik kurul onayı gerekir; sorumluluk tümüyle araştırmacıdadır"}, {"t": "Araştırma giderleri deneğin sosyal güvenlik kurumuna yansıtılabilir"}, {"t": "Denek araştırma başladıktan sonra onamını geri alamaz"}, {"t": "Deneğin sözlü onamı, tanık eşliğinde alınırsa yeterlidir"}, {"t": "Beklenen bilimsel katkı büyükse denek için ciddi tehlike şüphesi olsa da araştırma sürdürülür"}], "a": 0, "exp": "Madde 40: Araştırmalar **yerel etik kurullardan geçmek** koşuluyla, yeterli ve yetkin kişilerce yapılır; **sorumluluk tümüyle araştırmacıya** aittir. Madde 41: deneğin **yazılı onamı** alınır; denek isterse **vazgeçebilir**, bu nedenle tedavisi aksamaz. Madde 43: **ciddi tehlike şüphesinde araştırma durdurulur**; giderler deneğe, yakınlarına ya da **sosyal güvenlik kurumuna yansıtılamaz**; deneğin yaşamı ve sağlığı **toplumsal veya bilimsel çıkarların üzerinde** tutulur."}, {"q": "Reşit ve/veya mümeyyiz olmayan kişiler üzerinde yapılacak araştırmalarda Hekimlik Meslek Etiği Kuralları'na göre kimin aydınlatılmış onamı gerekir?", "opts": [{"t": "Araştırmayı yürüten hekimin"}, {"t": "Yerel etik kurul başkanının"}, {"t": "Sağlık Bakanlığı'nın"}, {"t": "Tabip odası yönetim kurulunun"}, {"t": "Veli veya vasisinin"}], "a": 4, "exp": "Madde 42: **Reşit ve/veya mümeyyiz olmayan** kişiler yönünden **veli veya vasisinin aydınlatılmış onamı** gerekir. (Mümeyyiz: ayırt etme gücüne sahip.)"}, {"q": "Hekimlik Meslek Etiği Kuralları'ndaki yayın etiği maddesine (Madde 44) göre aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Başkalarına ait veriler kaynak gösterilirse izin alınmadan kullanılabilir"}, {"t": "Bölüm başkanının adı katkısı olmasa da yayına eklenmelidir"}, {"t": "Çalışmaya fiilen katılmamış kişilerin adları o yayında yer alamaz"}, {"t": "Akademik sunumlarda deneğin kimliği açıklanabilir"}, {"t": "Hekim yayına hazırlarken verileri hipotezine uygun hale getirebilir"}], "a": 2, "exp": "Madde 44: Hekim verileri değerlendirirken ve yayına hazırlarken **bilimsel gerçekleri yansıtmalıdır**; **çalışmaya fiilen katılmamış kişilerin adları yayında yer alamaz**; başkalarına ait veriler, olgular ve eserler **kaynak göstermeden ve izin almadan** kullanılamaz (ikisi birlikte gerekir). Madde 43'e göre akademik sunuşlarda da **deneğin kimliği gizli** tutulur."}, {"q": "Hekimlik Meslek Etiği Kuralları'nda hüküm bulunmayan bir durumla karşılaşan hekim neye uymalıdır?", "opts": [{"t": "Genel etik ilkeler, ulusal ve uluslararası düzenlemeler"}, {"t": "Yalnızca kendi vicdani ve mesleki bilimsel kanaatine"}, {"t": "Hastanın ve birinci derece yakınlarının ortak isteklerine"}, {"t": "Çalıştığı kurumun yöneticisinin ve başhekimin yazılı talimatına"}, {"t": "Benzer durumda meslektaşlarının çoğunluğunun uygulamasına"}], "a": 0, "exp": "Madde 45 (**Hüküm bulunmayan durumlar**): Hekim **genel etik ilkelere, ulusal düzenlemelere, uluslararası düzeydeki bildirge ve sözleşme hükümlerine** uyar."}, {"q": "Hekimlik Meslek Etiği Kuralları'na aykırı davranan hekimlerle ilgili disiplin süreci için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Türk Tabipleri Birliği Büyük Kongresi tarafından yargılanırlar"}, {"t": "Disiplin soruşturması açılırsa aynı fiil için ayrıca hukuki ve cezai takibat yapılamaz"}, {"t": "Doğrudan Sağlık Bakanlığı tarafından meslekten men edilirler"}, {"t": "Tabip odası yönetim kurulunca onur kuruluna sevk edilir; bu, hukuki/cezai takibata engel değildir"}, {"t": "Yalnızca hastanın şikâyeti üzerine yerel etik kurula sevk edilirler"}], "a": 3, "exp": "Madde 46: Kurallara aykırı davranan hekimler **6023 sayılı TTB Yasası**'na göre **tabip odaları yönetim kurulları** tarafından **onur kurullarına** sevk edilir. Disiplin soruşturması, **ayrıca hukuki veya cezai takibat yapılmasına engel değildir**."}, {"q": "Hekimlik Meslek Etiği Kuralları'nın yürürlüğe girişi (Madde 47) için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yerel tabip odalarınca ayrı ayrı onaylandıktan sonra"}, {"t": "TTB Büyük Kongresi kabulü + yayımdan bir ay sonra"}, {"t": "Sağlık Bakanlığı onayıyla Resmi Gazete'de yayımlandığı gün"}, {"t": "Sağlık Bakanlığı'nın onayından altı ay sonra"}, {"t": "TTB Merkez Konseyi'nde kabul edildiği gün"}], "a": 1, "exp": "Madde 47: Kurallar **TTB Büyük Kongresi**'nde kabul edilip TTB yayın organlarından birinde yayımlandıktan **bir ay sonra** yürürlüğe girer; **TTB Merkez Konseyi ve tabip odaları** tarafından yürütülür. Kuralların yayın tarihi **01.02.1999**'dur."}, {"q": "Bölüm özetine göre \"insanların ister işveren, ister memur, ister işçi olsun, yaptığı iş ile ilgili etik ilkelere uygun davranması\" hangi kavramı tanımlar?", "opts": [{"t": "Meslek etiği"}, {"t": "İşletme etiği"}, {"t": "Kamu etiği"}, {"t": "Çalışma etiği"}, {"t": "İş etiği"}], "a": 4, "exp": "Bölüm özetinde **iş etiği**, insanların ister işveren, ister memur, ister işçi olsun **yaptığı iş ile ilgili etik ilkelere uygun davranması** olarak tanımlanır. **Meslek etiği** iş etiğinin uzantısıdır ve **meslek sahiplerinin** uyması gereken kuralları anlatır; **çalışma etiği** ise **çalışmayı sevip sevmemekle** ilgilidir."}, {"q": "Bölüm sonu sorularına göre, iş etiği ve iş ahlakı kavramlarının gelişimi tarihsel süreç içinde ele alındığında aşağıdakilerden hangisinin etkisi diğerlerine göre daha fazladır?", "opts": [{"t": "Politik"}, {"t": "Ekonomik"}, {"t": "Coğrafik"}, {"t": "Toplumsal"}, {"t": "Yönetsel"}], "a": 3, "exp": "Bölüm sonu sorusunun cevap anahtarı **a) Toplumsal**tır. Metinde iş etiği ve iş ahlakı kavramlarının gelişiminin **toplumsal, politik, ekonomik ve yönetsel** alanlardaki değişimlerden etkilendiği belirtilir ve bu sayımda **toplumsal** ilk sıradadır; **coğrafik** bir etken hiç sayılmaz.\n⚠️ Metin bu dört etken arasında açık bir derecelendirme yapmaz; \"daha fazla\" yargısı kitabın cevap anahtarından gelir. Sınavda bu soru aynen çıkarsa cevap **Toplumsal**dır."}]}, {"title": "Etik Dışı Davranışlar, Nedenleri ve Haklılaştırma", "desc": "Etik dışı davranış tanımı, ahlaki gelişim düzeyleri, işletme içi/dışı ve bireysel/çevresel nedenler, ayrımcılık-kayırma-rüşvet-yolsuzluk, sonuçlar, 18 haklılaştırma biçimi ve etik değerlendirme soruları", "short": "Etik Dışı", "questions": [{"q": "Meslek mensuplarının davranışlarını biçimlendiren üç ana faktör hangi seçenekte doğru verilmiştir?", "opts": [{"t": "Yasal düzenlemeler, örgüt kültürü, ücret sistemi"}, {"t": "Etik olgusu, rekabet, gelenekler"}, {"t": "Yasal düzenlemeler, özgür seçim hakları, etik olgusu"}, {"t": "Meslek odaları, yasal düzenlemeler, ahlak anlayışı"}, {"t": "Aile yapısı, din, özgür seçim hakları"}], "a": 2, "exp": "Kaynağa göre meslek mensuplarının davranışlarını biçimlendiren üç ana faktör **yasal düzenlemeler**, **özgür seçim hakları** ve **etik olgusu**dur. Aile, din, örgüt kültürü gibi unsurlar etik/etik dışı davranışı etkileyen faktörler arasında sayılır ama bu üçlünün parçası değildir.\n💡 \"Yasa – Seçim – Etik\": dışarıdan kural, içeriden tercih, ikisinin üstünde değer."}, {"q": "Kaynağa göre insanlarda ahlaksızlığın temel nedenleri nelerdir?", "opts": [{"t": "Açgözlülük ve ideoloji"}, {"t": "Çıkarcılık ve kolaycılık"}, {"t": "Rekabet ve güvensizlik"}, {"t": "Bencillik ve kıskançlık"}, {"t": "Yoksulluk ve eğitimsizlik"}], "a": 1, "exp": "Slayt, insanlarda ahlaksızlığın temel nedenlerini **çıkarcılık ve kolaycılık** olarak verir. Açgözlülük ve ideoloji etik dışı davranış nedenleri listesinde; rekabet ve güvensizlik ise çevresel nedenlerde geçer, ancak \"temel neden\" ikilisi değildir."}, {"q": "İşletme büyüklüğü ile etik dışı davranış ilişkisine dair aşağıdakilerden hangisi kaynakla uyumludur?", "opts": [{"t": "Küçük kuruluşlarda etik dışı davranan personele hiç rastlanmaz."}, {"t": "Personel sayısı arttıkça etik dışı personele rastlama olasılığı azalır."}, {"t": "Küçük kuruluşlarda hile ve sahtekârlık olanakları daha azdır."}, {"t": "Büyük işletmelerde hile olanakları küçüklere göre daha azdır."}, {"t": "Şirket büyüklüğünün etik dışı davranış üzerinde etkisi yoktur."}], "a": 2, "exp": "Kaynağa göre personel sayısı fazla olan işletmelerde görev ve yetkisini kötüye kullanan kişilere rastlama olasılığı **fazladır**; küçük kuruluşlar da bu kişilerden **paylarını alır**, ancak **küçük kuruluşlarda hile ve sahtekârlık olanakları daha azdır**. Ayrıca cinsiyet, sektör ve **şirket büyüklüğü** farklılıklarının etik dışı davranışta etkili olduğu belirtilir."}, {"q": "Etik dışı davranışta etkili olduğu savunulan farklılıklar arasında aşağıdakilerden hangisi kaynakta SAYILMAMIŞTIR?", "opts": [{"t": "Cinsiyet"}, {"t": "Çalışanın yaşı"}, {"t": "Sektöre göre sınıflama"}, {"t": "İşin özellikleri"}, {"t": "Şirket büyüklüğü"}], "a": 1, "exp": "Kaynak **cinsiyet, sektöre göre sınıflama ve şirket büyüklüğü** farklılıklarının etik dışı davranışta etkili olduğunu söyler; ayrıca bazı **işlerin özelliklerinin** etik dışı alternatifi seçme olasılığını kuvvetlendirdiğini, bazı pozisyonların ise buna izin vermediğini belirtir. **Yaş** bu listede yer almaz."}, {"q": "Kişisel özelliklerin iş yapma tarzını belirlemesi nedeniyle etik dışı davranışları analiz etmede ve önceden kestirmede hangi araçların etkili olabileceği belirtilmiştir?", "opts": [{"t": "Sosyal öğrenme teorisi"}, {"t": "Klasik yönetim teorileri"}, {"t": "Oyun teorisi"}, {"t": "Liderlik teorileri"}, {"t": "Motivasyon teorileri"}], "a": 4, "exp": "Hayaller, değerler ve ahlak anlayışı hem kişinin iş yapma biçimini hem başkalarının onunla iş yapma biçimini etkiler. Bu nedenle kaynak, **motivasyon teorilerini** etik dışı davranışları analiz etmede ve belki de önceden kestirmede etkili olabilecek araçlardan biri olarak gösterir."}, {"q": "\"Bireylerin, grupların veya örgütlerin; toplumun veya mesleğin iyi, güzel ve doğru saydığı etik kuralları terk etmesi ve bunlara aykırı davranması\" tanımı neyi ifade eder? Kaynakta buna verilen örnekler de hangisidir?", "opts": [{"t": "Yolsuzluk – zimmet, yaranma, mobbing"}, {"t": "Etik gerekçelendirme – gereklilik, yasallık, yarar"}, {"t": "Etik dışı davranış – ihmal, ayrımcılık, rüşvet"}, {"t": "Etik çıkmaz – niyet, pişmanlık, sorumluluk"}, {"t": "Haksız rekabet – hile, aldatma, taklit"}], "a": 2, "exp": "Tanım **etik dışı davranış**a aittir; kaynak örnek olarak **ihmal, ayrımcılık, rüşvet**i verir. Niyet-pişmanlık-sorumluluk üçlüsü etik çıkmazlarda etik dışı davranış ile etik yanlışı ayırmak için bakılan faktörlerdir."}, {"q": "Etik ve etik dışı davranışları etkileyen faktörlerde (ahlaki gelişim) kaç düzey ve kaç aşama tanımlanmıştır?", "opts": [{"t": "2 düzey, 4 aşama"}, {"t": "4 düzey, 6 aşama"}, {"t": "6 düzey, 3 aşama"}, {"t": "3 düzey, 6 aşama"}, {"t": "3 düzey, 9 aşama"}], "a": 3, "exp": "Kaynak modeli **üç düzey altı aşama** olarak verir: **geleneksel öncesi** (1-2), **geleneksel** (3-4) ve **ilkesel** (5-6) düzey; her düzeyde iki aşama vardır.\n💡 Bu model Kohlberg'in ahlaki gelişim kuramıdır; \"3×2 = 6\" diye hatırla."}, {"q": "Bir çalışan, kurallara yalnızca fiziksel şiddete uğramamak için uymaktadır. Bu kişi hangi düzey ve aşamadadır?", "opts": [{"t": "Geleneksel öncesi düzey – 1. aşama"}, {"t": "Geleneksel düzey – 4. aşama"}, {"t": "İlkesel düzey – 5. aşama"}, {"t": "Geleneksel düzey – 3. aşama"}, {"t": "Geleneksel öncesi düzey – 2. aşama"}], "a": 0, "exp": "**Birinci aşamada (geleneksel öncesi)** kişi fiziksel şiddete uğramamak için kurallara uyar. **İkinci aşamada** (yine geleneksel öncesi) ise kurallara yalnızca işine geldiğinde uyar. Üçüncü ve dördüncü aşamalar geleneksel düzeye aittir."}, {"q": "\"Geleneksel emirleri uzlaşı içinde yerine getiren, diğer bir ifadeyle iyi bir örgüt vatandaşı olan\" kişi hangi aşamadadır?", "opts": [{"t": "2. aşama (geleneksel öncesi düzey)"}, {"t": "6. aşama (ilkesel düzey)"}, {"t": "5. aşama (ilkesel düzey)"}, {"t": "3. aşama (geleneksel düzey)"}, {"t": "4. aşama (geleneksel düzey)"}], "a": 4, "exp": "**Dördüncü aşama** geleneksel düzeydedir: kişi geleneksel emirleri uzlaşı içinde yerine getirir, yani **iyi bir örgüt vatandaşı**dır. **Üçüncü aşamada** ise kişi kendisine **yakın insanların beklentileri** yönünde davranır; ikisi aynı düzeyde olduğu için sık karıştırılır."}, {"q": "Ahlaki gelişim aşamalarıyla ilgili aşağıdaki eşleştirmelerden hangisi YANLIŞTIR?", "opts": [{"t": "2. aşama – Kendisine yakın insanların beklentileri yönünde davranma"}, {"t": "6. aşama – Kanunlara aykırı da olsa etik prensiplerden taviz vermeme"}, {"t": "5. aşama – Çoğunluğa aldırmadan temel değer ve hakları koruma"}, {"t": "4. aşama – Geleneksel emirleri uzlaşı içinde yerine getirme"}, {"t": "1. aşama – Fiziksel şiddete uğramamak için kurallara uyma"}], "a": 0, "exp": "Yakın insanların beklentileri yönünde davranma **3. aşamaya** (geleneksel düzey) aittir. **2. aşamada** kişi kurallara sadece **işine geldiğinde** uyar. Diğer eşleştirmeler doğrudur: 5. aşama başkalarının haklarına değer verir, 6. (son) aşama kanuna aykırı da olsa etik prensiplerden taviz vermez."}, {"q": "Bir sağlık çalışanı, uygulanan bir kural kanuna uygun olsa bile etik prensiplere aykırı bulduğu için ona uymayı reddediyor ve etik ilkelerinden asla taviz vermiyor. Bu davranış hangi düzeyi yansıtır?", "opts": [{"t": "Geleneksel öncesi düzey (1. aşama)"}, {"t": "Geleneksel öncesi düzey (2. aşama)"}, {"t": "İlkesel düzey (son aşama)"}, {"t": "Geleneksel düzey (3. aşama)"}, {"t": "Geleneksel düzey (4. aşama)"}], "a": 2, "exp": "Kaynağa göre **son aşamada** (ilkesel düzey) kişi **kanunlara aykırı da olsa** etik prensiplerden asla taviz vermez. İlkesel düzeyin beşinci aşamasında ise başkalarının haklarına değer verilir ve çoğunluğun fikrine aldırmadan temel değer ve haklar korunur."}, {"q": "Kaynakta sayılan etik dışı davranış nedenleri arasında aşağıdakilerden hangisi YER ALMAZ?", "opts": [{"t": "İdeoloji"}, {"t": "Yasaların, kuralların ve yöntemlerin bilinmemesi"}, {"t": "İyi niyetler"}, {"t": "Aşırı iş yükü"}, {"t": "Arkadaşlık"}], "a": 3, "exp": "Slayt 6'daki liste: **iyi niyetler**, yasaların/kuralların/yöntemlerin bilinmemesi, **açgözlülük**, **ideoloji**, **arkadaşlık**, **kişisel veya ailesel kazanç**. \"Aşırı iş yükü\" bu listede yoktur (iş ve zaman baskısı ayrıca işletme içi faktörlerde geçer).\n💡 \"İyi niyetler\" şaşırtıcı ama listede! İyi niyetle kural esnetmek de etik dışı davranışa götürebilir."}, {"q": "Bireylerin etik ve etik dışı davranışları üzerinde etkisi olduğu herkesçe kabul edilen unsurlar aşağıdakilerden hangisinde birlikte verilmiştir?", "opts": [{"t": "Sosyal çevre, cinsiyet, yaş, örgüt kültürü ve sektör"}, {"t": "Sosyal çevre, aile ve sosyal eğitim, din, örgüt kültürü"}, {"t": "Aile, kitle iletişim araçları, ekonomik durum, siyaset"}, {"t": "Din, ücret düzeyi, rekabet ortamı ve küreselleşme"}, {"t": "Eğitim düzeyi, sektör, yasalar ve örgüt hiyerarşisi"}], "a": 1, "exp": "Kaynak, bireylerin davranışları üzerinde **sosyal çevrenin, aile ve sosyal eğitimin, dinin ve çalıştığı örgüt kültürünün** etkisi olduğunun herkes tarafından kabul edildiğini belirtir."}, {"q": "Aşağıdakilerden hangisi etik dışı davranışa yol açan İŞLETME DIŞI faktörlerdendir?", "opts": [{"t": "Kâr maksimizasyonunun her şeyin önüne geçmesi"}, {"t": "İşletme içi denetim ve yaptırım mekanizmalarının zayıflığı"}, {"t": "Tecrübesiz ve yetersiz yöneticiler"}, {"t": "Adalet mekanizmasının eksik veya yetersiz olması, ağır işlemesi"}, {"t": "Şirket yönetiminde akrabalık / hısımlık"}], "a": 3, "exp": "İşletme dışı faktörler dörttür: **hayat tarzlarında değişim ve tüketimdeki artış**, **kitle iletişim araçlarıyla kültürdeki değişim**, **adalet mekanizmasının eksik/yetersiz olması, ağır işlemesi** ve **ekonomik yapının işletmeleri bu tür davranışlara itmesi**. Diğer şıklar işletme içi faktörlerdir.\n💡 Dış faktörler = toplum, medya, adalet, ekonomi (işletmenin kontrolü dışında)."}, {"q": "Aşağıdakilerden hangisi etik dışı davranışa yol açan İŞLETME İÇİ faktörlerden biri DEĞİLDİR?", "opts": [{"t": "Kriz dönemleriyle başa çıkabilmek"}, {"t": "Şirket yöneticileri ve çalışanlarının çıkar çatışması"}, {"t": "Ulaşılması güç veya imkânsız hedefler konulması, iş ve zaman baskısı"}, {"t": "Ödüllendirme ve ücretlendirme sistemlerinde eksiklik"}, {"t": "Hayat tarzlarında değişim ve tüketimdeki artış"}], "a": 4, "exp": "**Hayat tarzlarında değişim ve tüketimdeki artış** işletme **dışı** faktördür. İşletme içi faktörler (10 adet): kâr maksimizasyonu, bireysel ahlaki yargılar, denetim/yaptırım zayıflığı, güç hedefler ve iş-zaman baskısı, kriz dönemleriyle başa çıkma, akrabalık/hısımlık, çıkar çatışması, ödül/ücret sistemi eksikliği, tecrübesiz yöneticiler, değerlerin/misyon-vizyonun/örgüt kültürünün etik davranışı desteklememesi."}, {"q": "Bir şirketin misyon, vizyon ve örgüt kültürü etik davranışı desteklemiyor; çalışanların kendi ahlaki yargıları da zayıf. Bu iki durum etik dışı davranışa yol açan faktörlerden hangi gruba girer?", "opts": [{"t": "Her ikisi de işletme içi faktördür."}, {"t": "Birincisi işletme dışı, ikincisi işletme içi faktördür."}, {"t": "Her ikisi de işletme dışı faktördür."}, {"t": "Her ikisi de toplumsal sonuç kategorisindedir."}, {"t": "Birincisi işletme içi, ikincisi işletme dışı faktördür."}], "a": 0, "exp": "Tabloda **temel değerler, şirket misyon ve vizyonunun, örgüt kültürünün etik davranışı desteklememesi** ile **iş görenlerin bireysel ahlaki yargıları** her ikisi de **işletme içi** faktörler sütunundadır."}, {"q": "Aşağıdakilerden hangisi etik dışı davranışın BİREYSEL nedenlerinden biridir?", "opts": [{"t": "Etik davranışları farklı algılama"}, {"t": "Geleneklerin etkisi"}, {"t": "Karşılıklı güvensizlik"}, {"t": "Etik davranışların esnetilmesi"}, {"t": "Ücretlendirme"}], "a": 0, "exp": "**Bireysel nedenler** (5): etik çıkmazlar, etik standartlardaki farklılıklar, bencil davranma, **etik davranışları farklı algılama**, mesleki bilgi yetersizliği. **Çevresel nedenler** (6): rekabet, karşılıklı güvensizlik, ücretlendirme, etik davranışların esnetilmesi, yasaların etkisi, geleneklerin etkisi.\n💡 \"Esnetme\" ve \"algılama\" kolay karışır: esnetilmesi ÇEVRESEL (küreselleşme, iş dünyası), algılama BİREYSEL (kişinin algısı)."}, {"q": "I. Rekabet\nII. Mesleki bilgi yetersizliği\nIII. Yasaların etkisi\nIV. Etik çıkmazlar\nV. Karşılıklı güvensizlik\n\nYukarıdakilerden hangileri etik dışı davranışın ÇEVRESEL nedenleridir?", "opts": [{"t": "I, II ve III"}, {"t": "I, III ve V"}, {"t": "II ve IV"}, {"t": "III, IV ve V"}, {"t": "I, II, III ve V"}], "a": 1, "exp": "**Rekabet (I), yasaların etkisi (III) ve karşılıklı güvensizlik (V)** çevresel nedenlerdir. **Mesleki bilgi yetersizliği (II)** ve **etik çıkmazlar (IV)** bireysel nedenler grubundadır."}, {"q": "Etik çıkmazlarda, etik dışı davranış ile etik yanlış arasındaki ayrımı anlamak için bakılan üç faktör hangisidir?", "opts": [{"t": "Değer, ilke, standart"}, {"t": "Bilgi, beceri, tecrübe"}, {"t": "Niyet, sonuç, ceza"}, {"t": "Kendine düşkünlük, kendini koruma, kendini haklı görme"}, {"t": "Niyet, pişmanlık, sorumluluk"}], "a": 4, "exp": "Etik çıkmazlar, örgüt ve yöneticilerin **doğru ile yanlış arasındaki parlak çizgiyi** görememesinden kaynaklanır. Ayrım için üç faktöre bakılır: **Niyet, Pişmanlık, Sorumluluk**. Kendine düşkünlük-kendini koruma-kendini haklı görme ise bencilliğin üç başlığıdır.\n💡 \"NPS\": Niyet – Pişmanlık – Sorumluluk."}, {"q": "Kaynağa göre kişinin etik standartlarının oluşumunda önemli faktörler olduğu düşünülen unsurlar hangileridir?", "opts": [{"t": "Örgüt kültürü, yasalar ve rekabet"}, {"t": "Gelir düzeyi, meslek ve yaş"}, {"t": "Din, siyasi görüş ve cinsiyet"}, {"t": "Algı, ihtiyaçlar ve hedefler"}, {"t": "Alınan eğitim, aile yapısı ve kültür"}], "a": 4, "exp": "**Etik standartlardaki farklılıklar** nedeninde, kişinin davranış ve standartlarının toplumca öngörülenden farklı olması etik dışı davranışa yönlendirir. Bu standartların oluşumunda **alınan eğitim, aile yapısı ve kültür** önemli faktörlerdir."}, {"q": "Kaynakta bencillik kaç ana başlık altında incelenmiş ve bunlar nelerdir?", "opts": [{"t": "Üç başlık: kendine düşkünlük, kıskançlık, kendini haklı görmek"}, {"t": "İki başlık: kendine düşkünlük, kendini korumak"}, {"t": "Üç başlık: niyet, pişmanlık, sorumluluk"}, {"t": "Üç başlık: kendine düşkünlük, kendini korumak, kendini haklı görmek"}, {"t": "Dört başlık: egoizm, hodbinlik, çıkarcılık, kolaycılık"}], "a": 3, "exp": "Bencillik **üç ana başlık** altında incelenir: **1. Kendine düşkünlük, 2. Kendini korumak, 3. Kendini haklı görmek**. Bencillik; kişinin insancıl eğilimlerini geri iterek çevresini kendi çıkarlarına uygun bir **sömürü ortamına** dönüştürmeye yönelik çıkar güdüsüdür (egoist, hodbin)."}, {"q": "\"Kişilerin çevreleriyle ilgili bilgiyi duyma, organize etme, anlama ve değerleme süreci\" olarak tanımlanan kavram hangisidir?", "opts": [{"t": "Etik standart"}, {"t": "Motivasyon"}, {"t": "Algı"}, {"t": "Değer yargısı"}, {"t": "Gelenek"}], "a": 2, "exp": "Bu tanım **algı**ya aittir; algı, duyu organlarından gelen verilerin organize edilmesi ve onlara anlam verilmesi sürecidir. Algılama; değer yargıları, amaç ve hedefler, ihtiyaçlar, kültürel ortam, bilgiler, hisler ve geçmiş tecrübelerden etkilenir. Bireyler arasındaki algı farkı etik standartlarda da fark getirir."}, {"q": "İki çalışandan birinin etik dışı saydığı bir davranışı diğerinin \"gayet normal\" bulması, kaynağa göre en çok hangi bireysel nedenle açıklanır?", "opts": [{"t": "Etik davranışları farklı algılama"}, {"t": "Etik çıkmazlar"}, {"t": "Mesleki bilgi yetersizliği"}, {"t": "Karşılıklı güvensizlik"}, {"t": "Bencil davranma"}], "a": 0, "exp": "Kaynak: \"Birine göre etik dışı olarak kabul edilen davranış, bir diğerine göre gayet normaldir ve bu tamamen davranışı **farklı algılamalarından** kaynaklanmaktadır.\" Karşılıklı güvensizlik ise çevresel bir nedendir."}, {"q": "Aşağıdakilerden hangisi kaynakta mesleki yetersizliğin etik dışı davranışa yol açan baskıları arasında SAYILMAMIŞTIR?", "opts": [{"t": "İşini kaybetme korkusu"}, {"t": "Rakip örgütlerle haksız rekabet"}, {"t": "Rasyonel davranışların görülmemesi"}, {"t": "Hataların çoğalması"}, {"t": "Sorumluluk altına girme korkusu"}], "a": 1, "exp": "Mesleki yetersizlikler giderilmezse kişinin **tatmin duygusu azalır** ve etik dışı davranış **eğilimi artar**. Baskılar: **rasyonel davranışların görülmemesi, hataların çoğalması, işini kaybetme ve sorumluluk altına girme korkusu**. Haksız rekabet ise çevresel neden olan rekabet başlığındadır."}, {"q": "Rekabetin dürüstlük kurallarına aykırı olarak ve aldatıcı davranışlarla bozulmasına ne ad verilir?", "opts": [{"t": "Etik çıkmaz"}, {"t": "Etik davranışların esnetilmesi"}, {"t": "Haksız rekabet"}, {"t": "Kurumsal ayrımcılık"}, {"t": "Siyasal kayırmacılık"}], "a": 2, "exp": "Rekabetin dürüstlük kurallarına aykırı ve aldatıcı davranışlarla bozulması **haksız rekabet**tir. Haksız rekabette **meslekle bağdaşmayan işler, hak edilmeyen kazançlar ve üretmeden paylaşma** söz konusudur."}, {"q": "Etik dışı davranışlara yol açan haksız rekabet kaynakta hangi iki kısımda incelenmiştir?", "opts": [{"t": "Fiyat ve kalite üzerinden yapılan yanıltıcı etik dışı davranışlar"}, {"t": "Kamu sektöründe ve özel sektörde yapılan etik dışı davranışlar"}, {"t": "Yöneticilerin ve müşterilerin birbirine karşı etik dışı davranışları"}, {"t": "Ulusal ve uluslararası pazarda yapılan aldatıcı etik dışı davranışlar"}, {"t": "Örgütler arası ve örgüt içi avantaj sağlamaya yönelik etik dışı davranışlar"}], "a": 4, "exp": "Birinci kısım **örgütler arasındaki rekabette** avantaj elde etmek için yapılan etik dışı davranışlar; ikinci kısım **örgüt içinde** avantaj elde etmek isteyen yönetici ve diğer işgörenlerin etik dışı davranışlarıdır."}, {"q": "Yetersiz ücret aldığını düşünen bir çalışan, mesai saatinde başka işlere yöneliyor ve performansını olduğundan fazla gösteriyor. Bu durum hangi çevresel nedenle açıklanır?", "opts": [{"t": "Etik davranışların esnetilmesi"}, {"t": "Geleneklerin etkisi"}, {"t": "Ücretlendirme"}, {"t": "Yasaların etkisi"}, {"t": "Karşılıklı güvensizlik"}], "a": 2, "exp": "**Ücretlendirme** başlığında kaynak; meslekten elde edilen gelir ön plana alındığında kişinin **performansını olduğundan fazla gösterebileceğini**, **yetersiz ücretten dolayı mesaisinde farklı işlere yönelebileceğini** veya terfi için **yanıltma, hile, haksız rekabet**e başvurabileceğini söyler. Gelir düzeyi ve sürekliliği; bilgi, beceri, tecrübe ve müşteri gereksinimini karşılamadaki başarıyla ilgilidir."}, {"q": "Bir örgütte çalışanların ve yöneticilerin birbirlerine veya işletmeye güven duygularında eksiklik bulunması hangi neden başlığında ele alınır?", "opts": [{"t": "Bencil davranma (bireysel neden)"}, {"t": "Etik standartlardaki farklılıklar (bireysel neden)"}, {"t": "Rekabet (çevresel neden)"}, {"t": "Etik çıkmazlar (bireysel neden)"}, {"t": "Karşılıklı güvensizlik (çevresel neden)"}], "a": 4, "exp": "Kaynağa göre iş görenlerin ve yöneticilerin birbirlerine veya işletmeye **güven duygularında eksiklik** varsa bu onları etik dışı davranışlara yöneltebilir. Bu **karşılıklı güvensizlik**tir ve **çevresel** nedenler arasındadır."}, {"q": "Kaynağa göre özellikle hangi olgu şirketleri etik davranışlar doğrultusunda daha esnek davranmaya zorlayabilir?", "opts": [{"t": "Küreselleşme"}, {"t": "Örgüt kültürü"}, {"t": "Kitle iletişim araçları"}, {"t": "Yasal düzenlemeler"}, {"t": "Gelenekler"}], "a": 0, "exp": "**Etik davranışların esnetilmesi** başlığında iş dünyasının etik kurallara oranla daha **esnek ve yumuşak** bir yapıda olduğu belirtilir; özellikle **küreselleşme** şirketleri etik davranışlar doğrultusunda daha esnek davranmaya zorlayabilir."}, {"q": "Yasaların etkisiyle ilgili aşağıdaki ifadelerden hangisi kaynağa göre YANLIŞTIR?", "opts": [{"t": "Aldatma ve dolandırma gibi eylemler kanunla yasaklanabilir."}, {"t": "Doğruluk, dürüstlük ve iyi niyet gibi erdemler yasalar yoluyla kolayca uygulanabilir."}, {"t": "Toplumun yetki organları kararlaştırırsa gelenekler yasaya dönüşebilir."}, {"t": "Hukuk düzeninin amacı toplumsal mutluluk ve adalettir."}, {"t": "Hukuk etik dışı davranışları ne ölçüde cezalandırıyorsa bu davranışlar o ölçüde zorlaşır."}], "a": 1, "exp": "Kaynak, aldatma ve dolandırma gibi eylemlerin kanunla yasaklanabileceğini; ancak **doğruluk, dürüstlük, iyi niyet gibi erdemlerin bu yolla uygulanmasının kolay olmadığını** söyler. Hukuk düzeninin amacı **«toplumsal mutluluk» ve «adalet»**tir; gelenekler yasaya dönüşünce aykırı davranış resmi cezayla karşılaşır."}, {"q": "Kaynağa göre etik dışı davranışların miktarını belirleyen unsur, geleneklerin etkisi bağlamında nedir?", "opts": [{"t": "Kişinin geleneksel öncesi düzeyde kalması"}, {"t": "Toplumun saygın değerlerinin etik davranışı destekleme ölçüsü"}, {"t": "Ceza yasalarının ağırlığı ve mahkemelerdeki uygulanma hızı"}, {"t": "Örgüt içi denetim mekanizmalarının sayısı"}, {"t": "İşletmelerin kâr maksimizasyonu hedefi"}], "a": 1, "exp": "**Geleneklerin etkisi**: gelenek aktif, yapıcı ve yaratıcı bir şekle dönüşerek toplumun davranış ve yaşam biçimini etkiler; **toplumun saygın değerlerinin etik davranışları destekleme veya desteklememe ölçüsü**, etik dışı davranışların miktarının belirleyicisidir. Etik dışı davranış yaygınlaşırsa ekonomik, sosyal ve politik **istikrarsızlık** çıkar, kişisel çıkar öne geçer ve **örf ve âdetlere bağlılık azalır**."}, {"q": "Bir örgütte kadınların ya da azınlıkların diğer gruplarla eşit oranda temsil edilmemesi hangi etik dışı davranış türüdür?", "opts": [{"t": "Bezdiri (mobbing)"}, {"t": "Yakınları kayırma"}, {"t": "Açık ayrımcılık"}, {"t": "Siyasal kayırmacılık"}, {"t": "Kurumsal ayrımcılık"}], "a": 4, "exp": "**Kurumsal ayrımcılık**, kadınların veya azınlıkların örgütte eşit oranlı temsil edilmemesidir; önlemek için örneğin **belli sayıda engelli çalıştırma** zorunluluğuyla istihdam ortamı sağlanır. **Açık ayrımcılık** ise geleneksel olarak **cinsiyete ya da ırka** dayalı ortaya çıkar."}, {"q": "Bir kamu kurumuna yapılan atamalarda yeterlik esasları yerine akrabalık ve hemşericiliğin esas alınması hangi kavramla ifade edilir?", "opts": [{"t": "Kurumsal ayrımcılık"}, {"t": "Siyasal kayırmacılık"}, {"t": "Basit rüşvet"}, {"t": "Yakınları kayırma"}, {"t": "Yaranma"}], "a": 3, "exp": "**Yakınları kayırma**: kamu görevlerine atamalarda yeterlik esaslarının yerini akrabalık, hemşericilik gibi şahsi unsurların almasıdır. **Siyasal kayırmacılık** ise iktidara gelen siyasi partilerin kendilerini destekleyen seçmenlere ayrıcalık sağlayıp haksız çıkar sağlamasıdır.\n💡 Haklılaştırma görsellerindeki \"Hamili kart yakınımdır\" kartı tam da bu kayırmanın simgesidir."}, {"q": "Bir memur, zaten yapmakla yükümlü olduğu bir ruhsat işlemini yapmak için para alıyor. Bu eylem kaynağa göre hangisidir?", "opts": [{"t": "Basit rüşvet"}, {"t": "Zimmet"}, {"t": "Yaranma"}, {"t": "Ağır rüşvet"}, {"t": "İhmal"}], "a": 0, "exp": "**Basit rüşvet**: memurun görevi gereğince **yapmaya mecbur olduğu şeyi yapmak** (veya yapmamaya mecbur olduğunu yapmamak) için rüşvet alması, vaat veya taahhüdü kabul etmesidir. **Ağır rüşvet** ise görevin kötüye kullanılmasıyla memurun **görevine aykırı** bir şey yapması/yapmamasıdır.\n💡 Basit = yapacağı işi parayla yapar; Ağır = yapmaması gereken işi parayla yapar."}, {"q": "Para karşılığında, mevzuata göre verilmemesi gereken bir izni veren memurun eylemi hangisidir?", "opts": [{"t": "Kurumsal ayrımcılık"}, {"t": "Ağır rüşvet"}, {"t": "İhmal"}, {"t": "Basit rüşvet"}, {"t": "Kapasite yetersizliği"}], "a": 1, "exp": "**Ağır rüşvet**te memur, görevini kötüye kullanarak **görevine aykırı** davranır: yapmaması gerekeni yapar ya da yapması gerekeni yapmaz. Verilmemesi gereken izni vermek görevine aykırı bir işlemdir."}, {"q": "\"Görevin yapılmaması, savsaklanması veya üst taraftan verilen buyrukların geçerli bir neden olmadan yapılmaması\" hangi etik dışı davranışın tanımıdır?", "opts": [{"t": "İhmal"}, {"t": "Bencil davranış"}, {"t": "Bezdiri"}, {"t": "Zimmet"}, {"t": "Yolsuzluk"}], "a": 0, "exp": "Bu tanım **ihmal**e aittir. **Bencil davranışlar** ise bencilliğin fiile dönüşmesidir: olayları kendi kazanç veya kaybına göre yorumlar, diğerlerinin ihtiyaçlarını görmezden gelir."}, {"q": "Rüşvet, zimmete para geçirme, memuriyet görevini kötüye kullanma gibi tutum ve davranışların tamamını ifade eden kavram hangisidir?", "opts": [{"t": "Yolsuzluk"}, {"t": "Kapasite yetersizliği"}, {"t": "Kayırmacılık"}, {"t": "Ağır rüşvet"}, {"t": "Haksız rekabet"}], "a": 0, "exp": "Kaynağa göre **yolsuzluk**, rüşvet, zimmete para geçirme, memuriyet görevini kötüye kullanma gibi tutum ve davranışların **tamamı**dır; yani rüşvet yolsuzluğun bir alt türüdür."}, {"q": "Kamu sektöründe ücretin performansa dayanmamasının yolsuzluğu artırabileceği görüşü, yolsuzluğun hangi nedenine örnektir?", "opts": [{"t": "Kapasite yetersizliği"}, {"t": "Sosyal ekonomik nedenler"}, {"t": "Geleneklerin etkisi"}, {"t": "Siyasal nedenler"}, {"t": "Etik çıkmazlar"}], "a": 1, "exp": "**Sosyal ekonomik nedenler**: kamu sektöründe **performans–maaş ilişkisine dayanmaması** yolsuzluğu artırabilir. **Kapasite yetersizliği**: kamu hizmetleri yetersiz olduğunda hizmet almak isteyenler arasında çekişme olur. **Siyasal nedenler**: iktidara gelen partilerin yandaşlarını işe yerleştirip kollaması ve yükseltmesi."}, {"q": "Bir şehirde kamu hastanesi yatakları yetersiz kaldığı için hastalar arasında sıra için çekişme yaşanıyor ve bu ortam yolsuzluğa zemin hazırlıyor. Bu, yolsuzluğun hangi nedenidir?", "opts": [{"t": "Sosyal ekonomik nedenler"}, {"t": "Siyasal nedenler"}, {"t": "Kurumsal ayrımcılık"}, {"t": "Kapasite yetersizliği"}, {"t": "Karşılıklı güvensizlik"}], "a": 3, "exp": "**Kapasite yetersizliği**: kamu hizmetlerinin yeterli olmadığı durumlarda hizmet almak isteyenler arasında bir **çekişme** olur; bu da yolsuzluğa zemin hazırlar."}, {"q": "Kaynakta \"diğer\" etik dışı davranışlar arasında sayılanlardan biri aşağıdakilerden hangisi DEĞİLDİR?", "opts": [{"t": "Sahte ve yanıltıcı belge düzenleme"}, {"t": "Hizmet içi eğitime katılmamak"}, {"t": "Bezdiri (mobbing) ve korkutma"}, {"t": "Yaranma"}, {"t": "Kamu veya şirket sırlarını sızdırma"}], "a": 1, "exp": "Diğer etik dışı davranışlar (8): **sahte ve yanıltıcı belge düzenleme, zimmet, hakaret ve küfür, cinsel taciz, bezdiri (mobbing) ve korkutma, yaranma, kötü alışkanlıklar, kamu veya şirket sırlarını sızdırma**. Hizmet içi eğitime katılmamak listede yoktur."}, {"q": "Aşağıdakilerden hangisi etik dışı davranışların KURUMSAL sonuçlarından biridir?", "opts": [{"t": "Müşterisini kaybetme"}, {"t": "Toplumdan soyutlanma"}, {"t": "Yozlaşmanın kurumsallaştırılması"}, {"t": "Özsaygının yitirilmesi"}, {"t": "Anomik davranışların yaygınlaşması"}], "a": 0, "exp": "**Kurumsal sonuçlar**: saygınlığını yitirme, **müşterisini kaybetme**, imajının zedelenmesi, iş birliğinin zayıflaması, grup çalışmalarının etkililiğini yitirmesi, kurum içi iletişimin zarar görmesi, örgütsel bağlılığın zayıflaması. Toplumdan soyutlanma ve özsaygı kaybı **bireysel**, yozlaşmanın kurumsallaştırılması ve anomik davranışlar **toplumsal** sonuçlardır."}, {"q": "Etik dışı davranışların TOPLUMSAL sonuçları aşağıdakilerden hangisinde doğru verilmiştir?", "opts": [{"t": "Etik değerlerin önemini yitirmesi, özsaygının yitirilmesi, örgütsel bağlılığın zayıflaması"}, {"t": "Yozlaşmanın kurumsallaştırılması, etik değerlerin önemini yitirmesi, anomik davranışların yaygınlaşması"}, {"t": "Yozlaşmanın kurumsallaştırılması, kurum içi iletişimin zarar görmesi, güvenirliğin yitirilmesi"}, {"t": "İşini kaybetme, toplumdan soyutlanma, kişisel imajın bozulması"}, {"t": "İmajın zedelenmesi, iş birliğinin zayıflaması, müşteri kaybı"}], "a": 1, "exp": "Tabloda **toplumsal** sütunda yalnız üç madde vardır: **yozlaşmanın kurumsallaştırılması, etik değerlerin önemini yitirmesi, anomik davranışların yaygınlaşması**. Diğer şıklar bireysel ve kurumsal sonuçlarla karıştırılmıştır.\n💡 Anomi = toplumsal normların zayıflaması / kuralsızlık hali (Durkheim)."}, {"q": "I. Toplumdan soyutlanma\nII. Grup çalışmalarının etkililiğini yitirmesi\nIII. Çalışma arkadaşlarıyla ilişkilerin bozulması\nIV. Güvenirliğini yitirme\n\nYukarıdakilerden hangileri etik dışı davranışların BİREYSEL sonuçlarıdır?", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 3, "exp": "**Toplumdan soyutlanma (I), çalışma arkadaşlarıyla ilişkilerin bozulması (III) ve güvenirliğini yitirme (IV)** bireysel sonuçlardır. **Grup çalışmalarının etkililiğini yitirmesi (II)** kurumsal sonuçtur. Bireysel sonuçlar ayrıca işini ve saygınlığını kaybetme, kişisel benliğin zarar görmesi, mesleki ve örgütsel bağlılığın zayıflaması, özsaygı kaybı ve kişisel imajın bozulmasını içerir."}, {"q": "Meşru araçlarla ulaşılması zor görünen bir amaca etik dışı yollarla ulaşmak isteyen birinin \"başka çare yoktu, bu bir zorunluluktu\" demesi hangi haklılaştırma biçimidir?", "opts": [{"t": "Bunu sadece senin için yapıyorum"}, {"t": "Eğer gerekli ise etiktir"}, {"t": "Kimse zarar görmeyecek"}, {"t": "Yakalanırsam kurum bana arka çıkar"}, {"t": "Hak ettiğimi alamıyorum"}], "a": 1, "exp": "1. biçim **\"Eğer gerekli ise etiktir\"**: meşru araçlarla elde edilmesi zor görünen amaçlara ulaşmak için etik dışı yol kullanmak isteyenler bunun **bir gereklilik olduğunu** ileri sürer. Oysa **durumu kurtarmak için başvurulan bu yol etik değildir**."}, {"q": "\"Etik dışı davranışlarımın kurum tarafından göz ardı edileceğine ve korunacağıma inanıyorum.\" Bu düşünce hangi haklılaştırma biçimidir?", "opts": [{"t": "Benden bulmasın düşüncesi"}, {"t": "Hâlâ tarafsız olabilirim"}, {"t": "Meslektaşlarının suçlarını gizleme"}, {"t": "Yakalanırsam kurum bana arka çıkar inancı"}, {"t": "Kimsenin durumu fark etmeyeceği inancı"}], "a": 3, "exp": "12. biçim **\"Yakalanırsam kurum bana arka çıkar inancı\"**: etik dışı davranışların kurum tarafından **göz ardı edileceği** ve kişinin **korunacağına** olan inançtır. \"Kimsenin fark etmeyeceği inancı\" (11.) yakalanmamaya, bu ise yakalandıktan sonra korunmaya güvenir."}, {"q": "Haklılaştırma biçimlerini anlatan terazi görselinde \"Doğru\" kefesinde yer alan değerler hangileridir?", "opts": [{"t": "Dürüstlük, sadakat, güven"}, {"t": "Eşitlik, kazanç, adalet"}, {"t": "Niyet, pişmanlık, sorumluluk"}, {"t": "Saygı, eşitlik, adalet"}, {"t": "Çıkar, kazanç, saygı"}], "a": 3, "exp": "Görselde terazinin **Yanlış** kefesinde **çıkar ve kazanç**, **Doğru** kefesinde ise **saygı, eşitlik ve adalet** bulunur. Mesaj: etik dışı davranışı haklılaştırma, çıkar/kazancı doğru değerlerin önüne koymaktır."}, {"q": "\"Bir kişinin karar, eylem ve davranışlarını haklı ve mantıklı göstermeye çalışması\" hangi kavramın tanımıdır?", "opts": [{"t": "Sahte gereklilik"}, {"t": "Etik çıkmaz"}, {"t": "Evrensellik testi"}, {"t": "Etik algı"}, {"t": "Etik gerekçelendirme"}], "a": 4, "exp": "Bu tanım **etik gerekçelendirme**ye aittir. Kaynak, karar, eylem ve davranışları haklı göstermek için bireylerin **çeşitli yollara** başvurduğunu belirtir; bu yollar 18 haklılaştırma biçimi olarak sıralanır."}, {"q": "Yapılan yanlış davranışları haklı göstermek için uydurulmuş, aslında var olmayan gerekçelere ne ad verilir?", "opts": [{"t": "Kimse zarar görmeyecek"}, {"t": "Ateşe ateşle karşılık"}, {"t": "Eğer gerekli ise etiktir"}, {"t": "Sahte gereklilikler tuzağı"}, {"t": "Noble cause corruption"}], "a": 3, "exp": "**Sahte gereklilikler tuzağı**: yapılan yanlış davranışları haklı göstermek için **uydurulmuş** gerekçelerdir; aslında öyle bir gereklilik yoktur. \"**Eğer gerekli ise etiktir**\" ise meşru araçlarla elde edilmesi zor görünen amaçlara etik dışı yolla ulaşmak isteyenlerin bunun **bir gereklilik olduğunu ileri sürmesidir**; kaynak, durumu kurtarmak için başvurulan bu yolun da etik olmadığını vurgular."}, {"q": "Kaynakta \"Sirkler, hayvanat bahçeleri, yunus parkları yasaldır ama etik midir?\" sorusuyla hangi haklılaştırma biçiminin geçersizliği vurgulanmaktadır?", "opts": [{"t": "Eğer yasal ve izin verilebilir ise uygundur"}, {"t": "Sonuçta herkesin yararı sağlanacak"}, {"t": "Kimse zarar görmeyecek"}, {"t": "Herkes aynı şeyi yapıyor"}, {"t": "Bu işin bir parçası"}], "a": 0, "exp": "Örnek, **\"Eğer yasal ve izin verilebilir ise uygundur\"** gerekçesinin geçersizliğini gösterir: bir şeyin **yasal** olması onu **etik** yapmaz. (Bkz. yasaların etkisi: erdemler yasa yoluyla kolayca uygulanamaz.)"}, {"q": "Kaynakta \"Hamili kart yakınımdır\" yazılı kartı uzatan bir el karikatürüyle simgelenen haklılaştırma biçimi hangisidir?", "opts": [{"t": "Benden bulmasın düşüncesi"}, {"t": "Bunu sadece senin için yapıyorum"}, {"t": "Bu işin bir parçası"}, {"t": "Kimsenin fark etmeyeceği inancı"}, {"t": "Hak ettiğimi alamıyorum"}], "a": 2, "exp": "4. haklılaştırma biçimi **\"Bu işin bir parçası\"** başlığı altında yalnızca **\"Hamili kart yakınımdır\"** kartı görseli vardır: torpil/kayırmanın \"işin doğası\" gibi sunulması. Kartın kendisi yakınları kayırmanın simgesidir."}, {"q": "\"Çoğunluğun faydasına sonuçları olsa da etik dışı uygulamalardan kaçınılması gerekir.\" ifadesi hangi haklılaştırma biçimine verilen yanıttır?", "opts": [{"t": "Sonuçta herkesin yararı sağlanacak"}, {"t": "Kişisel olarak benim kazancım yoksa tamam"}, {"t": "Herkes aynı şeyi yapıyor"}, {"t": "Bunu sadece senin için yapıyorum"}, {"t": "Eğer gerekli ise etiktir"}], "a": 0, "exp": "Bu cümle 5. biçim olan **\"Sonuçta herkesin yararı sağlanacak\"** gerekçesine karşı söylenir: sonuç çoğunluğa yarasa bile etik dışı yol meşrulaşmaz."}, {"q": "Bir memur, belirli bir vatandaşı kayırarak onun işini öne alıyor ve \"Bunu sadece senin için yapıyorum\" diyor. Kaynağa göre bu durumun değerlendirmesi hangisidir?", "opts": [{"t": "Yasal ve izin verilebilir ise davranış uygundur."}, {"t": "Bir kişi korunarak işlem yapılıyorsa orada etik sorun vardır."}, {"t": "Kimse zarar görmüyorsa davranış etik kabul edilir."}, {"t": "Kişisel kazanç yoksa davranış etik kabul edilir."}, {"t": "Bu bir etik çıkmazdır; niyet iyi olduğu için etiktir."}], "a": 1, "exp": "6. biçim **\"Bunu sadece senin için yapıyorum\"**: kaynak, **bir kişi korunarak** bir eylem ya da işlem yapılıyorsa **orada bir etik sorun vardır** der. Diğer şıklar da ayrı haklılaştırma biçimleridir ve hiçbiri davranışı etik yapmaz."}, {"q": "\"Önce o başlattı, ben sadece karşılık verdim\" diyerek etik dışı davranışını savunan bir kişi hangi haklılaştırma biçimini kullanmaktadır?", "opts": [{"t": "Herkes aynı şeyi yapıyor"}, {"t": "Yakalanırsam kurum bana arka çıkar"}, {"t": "Sadece ateşe ateşle karşılık veriyorum"}, {"t": "Eğer gerekli ise etiktir"}, {"t": "Başkaları ile kendini karşılaştırma"}], "a": 2, "exp": "7. biçim **\"Sadece ateşe ateşle karşılık veriyorum\"**: etik dışı eylemi önce başkalarının başlatması, bizim de etik dışı karşılık vermemizi haklı çıkarmaz. Kaynağın formülü: \"**Etik dışı olan, etik dışıdır.**\"\n💡 Bu bölümün totolojileri: \"Yanlış, yanlıştır\" (herkes yapıyor) ve \"Etik dışı olan, etik dışıdır\" (ateşe ateşle)."}, {"q": "\"Yüce/asil/kutsal amaç için yozlaşma\" (noble cause corruption) ile ilgili kaynağın vurguladığı nokta hangisidir?", "opts": [{"t": "Kurum içinde görülen etik dışı davranışların bilmezden gelinmesidir."}, {"t": "Ülke çıkarı söz konusu olduğunda etik dışı davranış meşrulaşır."}, {"t": "Etik dışı davranışın kimseye zarar vermeyeceği varsayımıdır."}, {"t": "Kişiler kendi çıkarları için üst amaçları paravan olarak kullanır."}, {"t": "Başkalarının etik dışı davranışlarının örnek gösterilmesidir."}], "a": 3, "exp": "9. biçimde etik dışı davranışların ülkenin, kurumun, toplumun çıkarlarını korumak amacıyla yapıldığını iddia etmek o davranışların etik olmasını sağlamaz; **kişiler kendi çıkarı için bu üst amaçları paravan olarak kullanır**. Bilmezden gelme \"code of silence\", zarar görmeme varsayımı \"kimse zarar görmeyecek\", örnek gösterme \"başkaları ile kendini karşılaştırma\"dır."}, {"q": "Meslektaşlarının zarar görmemesi için onların etik dışı davranışlarını gizlemeye ve bir kurumda görülen etik dışı uygulamaları bilmezden/görmezden gelmeye yol açan yaklaşıma ne ad verilir?", "opts": [{"t": "Yüce amaç için yozlaşma (noble cause corruption)"}, {"t": "Akvaryum teorisi"}, {"t": "Sahte gereklilikler tuzağı"}, {"t": "Benden bulmasın düşüncesi"}, {"t": "Sessizlik yasası (code of silence)"}], "a": 4, "exp": "10. biçim **meslektaşlarının suçlarını gizleme**dir; zamanla **sessizlik yasası (code of silence)** denilen yaklaşıma yol açar. Sonuçları: **etik dışı davranan kamu görevlilerinin korunması** ve **etik dışı davranışların bir kurum kültürü haline dönüşmesi**dir."}, {"q": "Code of silence (sessizlik yasası) yaklaşımının sonuçları olarak kaynakta belirtilen ikili hangisidir?", "opts": [{"t": "Görevlilerin işini kaybetmesi ve toplumdan soyutlanmaya başlaması"}, {"t": "Kurumun müşterilerini kaybetmesi ve kurum imajının zedelenmesi"}, {"t": "Etik dışı davrananların korunması, etik dışılığın kurum kültürü olması"}, {"t": "Ücret sisteminin bozulması ve kurum içi haksız rekabetin artması"}, {"t": "Yasaların sertleşmesi ve geleneklere bağlılığın giderek zayıflaması"}], "a": 2, "exp": "Kaynak, sessizlik yasasının sonuçlarını **etik dışı davranan kamu görevlilerinin korunması** ve **etik dışı davranışların bir kurum kültürü haline dönüşmesi** olarak açıkça belirtir. Diğer şıklar genel sonuç tablosundan veya başka başlıklardan alınmıştır."}, {"q": "\"Herkesin ne yaptığı akvaryumdaki balıklar gibi dışarıdan görünür.\" Akvaryum teorisi hangi haklılaştırma biçimini çürütmek için kullanılmıştır?", "opts": [{"t": "Herkes aynı şeyi yapıyor"}, {"t": "Hâlâ tarafsız olabilirim"}, {"t": "Kimsenin durumu fark etmeyeceği inancı"}, {"t": "Meslektaşlarının suçlarını gizleme"}, {"t": "Yakalanırsam kurum bana arka çıkar inancı"}], "a": 2, "exp": "11. biçim **\"Kimsenin durumu fark etmeyeceği inancı\"**na karşı **akvaryum teorisi** verilir: herkesin yaptığı, akvaryumdaki balıklar gibi dışarıdan görünür. 12. biçim olan \"yakalanırsam kurum bana arka çıkar\" ise kurumun göz yumacağı ve kişiyi koruyacağı inancıdır.\n💡 Akvaryum = \"Gizli sandığın her şey camın ardından görünür.\""}, {"q": "Bir çalışan \"Ben ne yaptım ki, X kişisi çok daha büyük usulsüzlükler yapıyor\" diyerek kendi etik dışı davranışını önemsizleştiriyor. Bu haklılaştırma biçimi ve kaynağın yanıtı hangisidir?", "opts": [{"t": "Herkes aynı şeyi yapıyor – herkesin yapması yanlışı doğru kılmaz."}, {"t": "Bu işin bir parçası – kayırma iş hayatının doğal bir parçasıdır."}, {"t": "Sadece ateşe ateşle karşılık veriyorum – etik dışı olan etik dışıdır."}, {"t": "Kimse zarar görmeyecek – zarar olmaması davranışı etik yapmaz."}, {"t": "Başkaları ile kendini karşılaştırma – kimsenin etik derecesi başkasına ölçü olamaz."}], "a": 4, "exp": "13. biçim **başkaları ile kendini karşılaştırma**: kişi başkalarının etik dışı davranışlarını örnek göstererek kendininkini önemsiz göstermeye çalışır. Kaynağın yanıtı: **kimsenin etik davranma derecesi bir başkası için ölçü olamaz; herkes kendi davranışlarından sorumludur**. \"Herkes aynı şeyi yapıyor\" ise yaygınlığa dayanır (\"Yanlış, yanlıştır\")."}, {"q": "Bir kamu görevlisi, bir ihalede usulsüzlüğe göz yumuyor ve \"Bundan bana kişisel olarak bir çıkar yok, o yüzden sorun değil\" diyor. Kaynağa göre doğru değerlendirme hangisidir?", "opts": [{"t": "Davranış çoğunluğun yararına ise kabul edilebilir."}, {"t": "Davranış ilkesel düzeyde bir tercih olarak kabul edilir."}, {"t": "Davranış ancak yasal değilse etik dışıdır."}, {"t": "Kişisel çıkar olmaması davranışı etik ve savunulur kılmaz."}, {"t": "Kişisel kazanç yoksa davranış etik dışı sayılmaz."}], "a": 3, "exp": "15. biçim **\"Kişisel olarak benim kazancım yoksa tamam\"**: kaynak, etik dışı bir davranıştan onu yapanın **kişisel çıkarının olmamasının**, o davranışı **etik açıdan doğru ve savunulur kılmayacağını** belirtir."}, {"q": "\"Hak ettiğimi alamıyorum\" haklılaştırma biçimine kaynakta verilen yanıtla ilgili aşağıdaki ifadelerden hangisi kaynakta YER ALMAZ?", "opts": [{"t": "İkinci iş yapmak, kararların bozulması anlamına gelir."}, {"t": "Devletin verdiği maaşın yetersiz bulunması, ikinci iş yapmanın gerekçesi olamaz."}, {"t": "İkinci iş yapmak, kişinin mesleki bilgisini artırdığı için kabul edilebilir."}, {"t": "İkinci iş yapmak, performansın bozulması anlamına gelir."}, {"t": "İkinci iş yapmak, sadakatin bozulması anlamına gelir."}], "a": 2, "exp": "16. biçimde kaynak: **devletin verdiği maaşın yetersiz bulunması ikinci iş yapmanın gerekçesi olamaz**; ikinci iş yapmak **performansın, kararların ve sadakatin bozulması** anlamına gelir. \"Mesleki bilgiyi artırdığı için kabul edilebilir\" ifadesi kaynakta yoktur ve kaynağın görüşüyle çelişir.\n💡 İkinci iş = 3 bozulma: Performans – Karar – Sadakat."}, {"q": "\"Hâlâ tarafsız olabilirim\" haklılaştırmasına karşı kaynakta vurgulanan ilke hangisidir?", "opts": [{"t": "Tarafsızlık yalnızca yargı mensupları için gereklidir."}, {"t": "Bir kez taraf tutulsa bile ileride tarafsızlık kolayca yeniden kazanılır."}, {"t": "Kamu görevlileri için tarafsız olmak kadar tarafsız görünmek de önemlidir."}, {"t": "Tarafsızlık ancak yasal düzenleme ile sağlanabilir."}, {"t": "Tarafsızlık algısı toplumun güvenini etkilemez."}], "a": 2, "exp": "17. biçim: **bir kez tarafsızlığı bozacak adım atıldıktan sonra tarafsız kalmak imkânsızdır**. Kamu görevlileri için **tarafsız olmak kadar tarafsız görünmek de önemlidir**; tarafsızlık algısı bozulan bir kamu görevlisi **toplumun güvenini de sarsar**."}, {"q": "Bir yönetici, nüfuzlu birinden çekindiği için etik dışı davranan bir personel hakkında işlem yapmaktan kaçınıyor. Bu, hangi haklılaştırma biçimine örnektir ve kaynağa göre doğrusu nedir?", "opts": [{"t": "Benden bulmasın düşüncesi – etik dışı davrananı cezalandırmak da görevdir."}, {"t": "Yakalanırsam kurum bana arka çıkar – kurum yöneticiyi korur."}, {"t": "Kimse zarar görmeyecek – işlem yapmamak kimseye zarar vermez."}, {"t": "Hâlâ tarafsız olabilirim – yönetici ileride tarafsızlığını korur."}, {"t": "Bu işin bir parçası – kayırma iş hayatının doğal parçasıdır."}], "a": 0, "exp": "18. biçim **\"Benden bulmasın düşüncesi\"**: kamu görevlileri yetkilerini **yasal ve etik sınırlar içinde** kullanmakla sorumludur; **gerektiğinde yasa dışı ve etik dışı davranan kişilerin cezalandırılması da bu göreve dahildir**. Kamu görevlileri **baskı, nüfuz ya da benzeri etkilerden korkmadan** görevin gereklerini yerine getirmek zorundadır."}, {"q": "Aşağıdaki haklılaştırma biçimi–yanıt eşleştirmelerinden hangisi YANLIŞTIR?", "opts": [{"t": "Herkes aynı şeyi yapıyor – Yanlış, yanlıştır"}, {"t": "Eğer yasal ve izin verilebilir ise uygundur – Yunus parkı yasaldır ama etik midir?"}, {"t": "Ateşe ateşle karşılık veriyorum – Etik dışı olan, etik dışıdır"}, {"t": "Kimse zarar görmeyecek – Akvaryum teorisi"}, {"t": "Hak ettiğimi alamıyorum – Maaş yetersizliği ikinci işin gerekçesi olamaz"}], "a": 3, "exp": "**Akvaryum teorisi**, \"**kimsenin durumu fark etmeyeceği inancı**\"na karşı verilir. \"**Kimse zarar görmeyecek**\" biçimine yanıt ise: zarar vermeyeceği varsayımıyla hareket etmek o davranışı **etik yapmaz**. Diğer eşleştirmeler doğrudur."}, {"q": "Kaynağa göre bir kişi belli bir konuda karar vermeden önce kaç soruya yanıt vermelidir?", "opts": [{"t": "Üç"}, {"t": "Yedi"}, {"t": "On sekiz"}, {"t": "Altı"}, {"t": "Dokuz"}], "a": 4, "exp": "\"Davranışın etik açıdan yargılanması\" başlığında kişi karar vermeden önce **dokuz soruya** yanıt vermelidir. **On sekiz**, etik dışı davranışı haklılaştırma biçimlerinin sayısıdır; **altı** ise ahlaki gelişim aşamalarının sayısıdır."}, {"q": "Aşağıdakilerden hangisi davranışın etik açıdan yargılanmasında sorulması önerilen dokuz soru arasında YER ALMAZ?", "opts": [{"t": "Eğer birisi zarar görecekse bu kim?"}, {"t": "Eğer gazetede yayınlansaydı ne hissederdin?"}, {"t": "Olay nasıl kokuyor?"}, {"t": "Bu davranış bana ne kazandırır?"}, {"t": "Bir soruşturma açılsa kendini savunabilir misin?"}], "a": 3, "exp": "Dokuz soru: 1. Bu doğru mu? 2. Bu adil mi? 3. **Gazetede yayınlansaydı** ne hissederdin? 4. **Birisi zarar görecekse bu kim?** 5. Ailenize, çocuğunuza, akrabalarınıza söyler miydiniz? 6. Herkes senin gibi davransaydı ne olurdu? 7. **Soruşturma** açılsa kendini savunabilir misin? 8. Kararının sonuçlarına katlanabilecek misin? 9. **Olay nasıl kokuyor?** \"Bana ne kazandırır\" sorusu çıkar odaklıdır; terazide \"yanlış\" kefesindedir."}, {"q": "Etik değerlendirme sorularından \"Herkes senin gibi davransaydı ne olurdu?\" sorusu kaynakta geçen hangi etik değerlendirme testine en uygun düşer?", "opts": [{"t": "Doğruluğun ölçüsü"}, {"t": "Gazete (aleniyet) testi"}, {"t": "Akvaryum teorisi"}, {"t": "Niyet–pişmanlık–sorumluluk"}, {"t": "Evrensellik"}], "a": 4, "exp": "\"Herkes senin gibi davransaydı ne olurdu?\" sorusu, davranışın herkes için genelleştirilebilir olup olmadığını sorgular; bu **evrensellik** testidir. Kaynak etik değerlendirme testlerinde ayrıca **doğruluğun ölçüsünü** (değerler, ilkeler, kurallar, standartlar) ve \"**Bana yapılsaydı ne hissederdim, adil bulur muydum?**\" sorusunu verir.\n💡 Evrensellik, Kant'ın \"eyleminin ilkesi evrensel yasa olabilsin\" fikrine dayanır."}, {"q": "Kaynakta yer alan etik değerlendirme testlerine göre \"doğruluğun ölçüsü\" nedir?", "opts": [{"t": "Değerler, ilkeler, kurallar ve standartlar"}, {"t": "Yasalar, yönetmelikler ve genelgeler"}, {"t": "Niyet, pişmanlık ve sorumluluk"}, {"t": "Çıkar, kazanç ve fayda"}, {"t": "Çoğunluğun görüşü ve gelenekler"}], "a": 0, "exp": "Kaynak: \"**Doğruluğun ölçüsü; değerler, ilkeler, kurallar ve standartlardır.**\" Yalnız yasalar ölçü değildir (yasal olan her şey etik değildir); çoğunluğun görüşü de ölçü olamaz (\"herkes aynı şeyi yapıyor\" gerekçesi geçersizdir)."}, {"q": "Bir hekim, bir karar vermeden önce kendine \"Bu bana yapılsaydı ne hissederdim, adil bulur muydum?\" diye soruyor. Bu, aşağıdakilerden hangisidir?", "opts": [{"t": "Etik dışı davranışı haklılaştırma biçimi"}, {"t": "Sahte gereklilikler tuzağı"}, {"t": "Kaynakta yer alan bir etik değerlendirme testi"}, {"t": "Geleneksel öncesi düzeyde ahlaki akıl yürütme"}, {"t": "Sessizlik yasasının bir uygulaması"}], "a": 2, "exp": "\"**Bana yapılsaydı ne hissederdim, adil bulur muydum?**\" sorusu kaynağın **etik değerlendirme testleri** kısmında, doğruluğun ölçüsü ve **evrensellik** ile birlikte yer alır. Haklılaştırma biçimleri ise etik dışı davranışı mazur göstermeye yöneliktir; bu soru tam tersine davranışı sorgular."}, {"q": "\"Doğru şeyi yapmak için yanlış zaman yoktur.\" sözü kaynakta kime atfedilmiştir?", "opts": [{"t": "Immanuel Kant"}, {"t": "H. Jackson Brown Jr."}, {"t": "Hüseyin Ali Kutlu"}, {"t": "Lawrence Kohlberg"}, {"t": "Aristoteles"}], "a": 1, "exp": "Bu söz kaynakta **H. Jackson Brown Jr.**'a atfedilir. Kaynağın kapanış cümlesi ise \"**Etiğin ödülü yine etiktir.**\"\n💡 İki kapanış: \"Doğru şey için yanlış zaman yok\" + \"Etiğin ödülü yine etik\"."}]}, {"title": "Sosyal Sorumluluk (6. Bölüm)", "desc": "Sosyal sorumluluk kavramı ve tanımları, uygulamalar ve toplum kapsamı, dört boyut, işletmenin sosyal sorumluluk yönleri, Şekil 6.1 sorumluluk alanları", "short": "Sosyal Sor.", "questions": [{"q": "Kaynaktaki kısa tanıma göre sosyal sorumluluk nedir?", "opts": [{"t": "Bir kurumun çalışanlarına piyasa üstünde ücret ödemesi"}, {"t": "Bir kurumun kaynaklarını toplum yararına olacak şekilde kullanması"}, {"t": "Bir kurumun kârını en yükseğe çıkaracak şekilde faaliyet göstermesi"}, {"t": "Bir kurumun yalnızca yasal yükümlülüklerini eksiksiz yerine getirmesi"}, {"t": "Bir kurumun hissedarlarına düzenli olarak kâr payı dağıtması"}], "a": 1, "exp": "Kısa tanım: sosyal sorumluluk, **bir kurumun kaynaklarını toplum yararına olacak şekilde kullanmasıdır**. Yalnızca yasal yükümlülükleri yerine getirmek, sosyal sorumluluğun boyutlarından yalnız birini (hukuki boyut) karşılar."}, {"q": "Sosyal sorumluluğun geniş tanımında, kurumun çalışma stratejisi ve politikasının uygun olması gereken unsurlar arasında aşağıdakilerden hangisi YER ALMAZ?", "opts": [{"t": "Kurum içindeki kişilerin beklentileri"}, {"t": "Çevresindeki kişi ve kurumların beklentileri"}, {"t": "Ekonomik ve yasal koşullar"}, {"t": "Rakiplerin fiyat politikaları"}, {"t": "İş ahlakı"}], "a": 3, "exp": "Geniş tanım: \"Bir kurumun **ekonomik ve yasal koşullara, iş ahlakına, kurum içi ve çevresindeki kişi ve kurumların beklentilerine** uygun bir çalışma stratejisi ve politikası gütmesidir.\" Rakiplerin fiyat politikaları tanımda yoktur."}, {"q": "Sosyal sorumluluk uygulamalarının niteliğine ilişkin aşağıdakilerden hangisi kaynakla uyumludur?", "opts": [{"t": "Yalnızca kâr amacı gütmeyen kuruluşların yürüttüğü yardım faaliyetleridir."}, {"t": "Devletin işletmelere yüklediği zorunlu kamu hizmetleridir."}, {"t": "Sadece işletme çalışanlarına yönelik yasal sosyal haklar ve yan ödemelerdir."}, {"t": "Yasalarca zorunlu tutulan vergi, harç ve sosyal güvenlik ödemeleridir."}, {"t": "Toplum refahını, çevreyi ve sosyal konuları destekleyen isteğe bağlı yatırımlardır."}], "a": 4, "exp": "Kaynağa göre sosyal sorumluluk uygulamaları, kurumun benimsediği ve yürüttüğü; **toplumun refahını iyileştirme, çevreyi koruma ve sosyal konuları destekleyen isteğe bağlı** iş uygulamaları ve yatırımlarıdır. Zorunlu değil, **gönüllü** niteliktedir.\n💡 \"Sosyal sorumluluk = zorunluluğun ötesinde, gönüllü katkı.\""}, {"q": "Sosyal sorumluluk uygulamalarında geçen \"toplum\" kavramının kapsamına ilişkin aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Yalnızca işletmenin faaliyet gösterdiği bölgedeki yerel halkı kapsar."}, {"t": "Yalnızca işletmenin ürün ve hizmetlerini satın alan müşterilerini kapsar."}, {"t": "Çalışanlar, tedarikçiler, dağıtıcılar, kamu ortakları ve genel toplum üyelerini de içerir."}, {"t": "Çalışanlar hariç işletmenin tüm paydaşlarını kapsar."}, {"t": "Yalnızca işletme dışındaki genel toplum üyelerini ve kamu kurumlarını kapsar."}], "a": 2, "exp": "Toplum kavramı içerisinde **kurum çalışanları, tedarikçiler, dağıtıcılar, kâr amacı gütmeyenler ve kamu sektörü ortaklarının yanı sıra genel toplum üyeleri** yer alır. Yani çalışanlar da bu \"topluma\" dahildir."}, {"q": "Kaynakta işletmelerin sosyal sorumluluk faaliyetleri gerçekleştirebileceği alanlara örnek olarak hangileri verilmiştir?", "opts": [{"t": "Vergi, finans, sigorta"}, {"t": "Ulaşım, enerji, iletişim"}, {"t": "Savunma, güvenlik, adalet"}, {"t": "Eğitim, sağlık, kültür"}, {"t": "Reklam, pazarlama, satış"}], "a": 3, "exp": "Kaynak: \"İşletmeler **eğitim, sağlık, kültür** gibi birçok alanda sosyal sorumluluk faaliyetleri gerçekleştirebilmektedirler.\""}, {"q": "Kaynağa göre işletmelerin sosyal sorumluluk gereği yaptıkları hizmetler toplumun, devletin ve insanlığın lehine ise bu durum neyin sonucudur?", "opts": [{"t": "Pazarlama stratejisinin"}, {"t": "Ahlaki bir davranışın"}, {"t": "Vergi avantajı arayışının"}, {"t": "Rekabet baskısının"}, {"t": "Yasal bir zorunluluğun"}], "a": 1, "exp": "Kaynak, bu hizmetler toplumun, devletin ve insanlığın lehine ise bunun **ahlaki bir davranışın sonucu** olduğunu belirtir; bu ifadeyle işletmelerin sosyal sorumluluğunun **çeşitli boyutları** olduğu düşünülebilir."}, {"q": "Kaynakta işletmelerin sosyal sorumluluğunun boyutları kaç grupta toplanmıştır?", "opts": [{"t": "Yedi"}, {"t": "İki"}, {"t": "Üç"}, {"t": "Dört"}, {"t": "Beş"}], "a": 3, "exp": "Sosyal sorumluluğun boyutları **dört grupta** toplanır: **ekonomik, hukuki, ahlaki ve gönüllülük** boyutu.\n💡 \"E-H-A-G\": Ekonomik – Hukuki – Ahlaki – Gönüllülük (zorunludan gönüllüye doğru sıralanır)."}, {"q": "Aşağıdakilerden hangisi kaynakta sayılan sosyal sorumluluk boyutlarından biri DEĞİLDİR?", "opts": [{"t": "Gönüllülük boyutu"}, {"t": "Hukuki boyut"}, {"t": "Siyasi boyut"}, {"t": "Ahlaki boyut"}, {"t": "Ekonomik boyut"}], "a": 2, "exp": "Dört boyut: **ekonomik, hukuki, ahlaki, gönüllülük**. **Siyasi boyut** sayılmaz."}, {"q": "Kaynağa göre işletme \"sosyal bir organizma\" olarak öncelikle neyle ilgilenir?", "opts": [{"t": "Kendi içinde yer alan insan topluluklarının sorunlarıyla"}, {"t": "Yalnızca uluslararası pazarlardaki gelişmelerle"}, {"t": "Yalnızca hissedarlarının kâr beklentileriyle"}, {"t": "Yalnızca rakip işletmelerin faaliyetleriyle"}, {"t": "Yalnızca devletin vergi politikalarıyla"}], "a": 0, "exp": "İşletme bir yandan **sosyal bir organizma** olarak **kendi içinde yer alan insan topluluklarının sorunlarına** eğilir; diğer yandan işletme dışındaki geniş toplumsal kesimle ilişki kurar."}, {"q": "İşletmenin dış çevreyle ilişkisinde kaynağın \"özellikle\" yakından takip edildiğini belirttiği kesim hangisidir?", "opts": [{"t": "Ürettiği mal/hizmeti satın alan tüketiciler"}, {"t": "Aynı sektördeki rakip işletmeler"}, {"t": "Hissedarlar ve kurumsal yatırımcılar"}, {"t": "Hükümet ve yerel kamu kurumları"}, {"t": "Hammadde tedarikçileri ve dağıtıcılar"}], "a": 0, "exp": "Kaynak, işletmenin toplumun çeşitli kesimlerini ve **özellikle ürettiği mal ya da hizmeti satın alan tüketici kesimini** yakından takip ettiğini belirtir."}, {"q": "I. Toplumun bileşimi\nII. Demografik yapı\nIII. Kültür\nIV. Gelenek, görenek ve alışkanlıklar\n\nKaynağa göre işletmeyi her yanından saran toplumun yukarıdaki özelliklerinden hangileri işletmeyi önemli ölçüde etkiler?", "opts": [{"t": "Yalnız I"}, {"t": "I ve II"}, {"t": "II ve III"}, {"t": "I, III ve IV"}, {"t": "I, II, III ve IV"}], "a": 4, "exp": "Kaynak: \"İşletmeyi her yanından saran toplumun **bileşimi, demografik yapısı, kültürü, gelenek, görenek ve alışkanlıkları** işletmeyi önemli ölçüde etkiler.\" Dördü de sayılmıştır. İşletme, üretimini topluma yönelttiği için **toplumla iç içe yaşamak zorunda** olan bir kuruluştur."}, {"q": "Şekil 6.1'e (İşletmenin Sorumluluk Alanları) göre aşağıdakilerden hangisi ORGANİZASYON İÇİ sorumluluk alanıdır?", "opts": [{"t": "Tedarikçilere karşı sorumluluk"}, {"t": "Çalışma hayatına karşı sorumluluk"}, {"t": "Hissedarlara karşı sorumluluk"}, {"t": "Hükümete karşı sorumluluk"}, {"t": "Müşterilere karşı sorumluluk"}], "a": 2, "exp": "Şekil 6.1'de **organizasyon içi** sorumluluk üç alandır: **çalışanlara, hissedarlara ve yöneticilere** karşı sorumluluk. Müşteriler, tedarikçiler, hükümet ve çalışma hayatı **organizasyon dışı** alanlardır.\n💡 İç = \"ÇHY\": Çalışanlar – Hissedarlar – Yöneticiler."}, {"q": "Şekil 6.1'e göre aşağıdakilerden hangisi ORGANİZASYON DIŞI sorumluluk alanlarından biri DEĞİLDİR?", "opts": [{"t": "Yöneticilere karşı sorumluluk"}, {"t": "Rakiplere karşı sorumluluk"}, {"t": "Çevreye karşı sorumluluk"}, {"t": "Topluma karşı sorumluluk"}, {"t": "Çalışma hayatına karşı sorumluluk"}], "a": 0, "exp": "**Yöneticilere karşı sorumluluk** organizasyon **içi** alandır. Organizasyon **dışı** yedi alan: **müşterilere, tedarikçilere, rakiplere, topluma, çevreye, çalışma hayatına ve hükümete** karşı sorumluluk."}, {"q": "Şekil 6.1'de organizasyon içi ve organizasyon dışı sorumluluk alanlarının sayısı sırasıyla kaçtır?", "opts": [{"t": "4 ve 6"}, {"t": "3 ve 7"}, {"t": "3 ve 6"}, {"t": "2 ve 8"}, {"t": "5 ve 5"}], "a": 1, "exp": "Organizasyon **içi 3** alan (çalışanlar, hissedarlar, yöneticiler); organizasyon **dışı 7** alan (müşteriler, tedarikçiler, rakipler, toplum, çevre, çalışma hayatı, hükümet). Toplam **10** sorumluluk alanı vardır."}]}, {"title": "Genel Tekrar I: Etik, Etik ve Yasa, Etik Karar Alma Yaklaşımları, Etik Yönetimi ve Sosyal Sorumluluk Düzeyleri", "desc": "Etik ve ahlak, etik–yasa ilişkisi, etik kusur ve ikilem, dört etik karar alma yaklaşımı, etik davranışı etkileyen faktörler (Kohlberg), etik yönetimi araçları (etik kodlar, TEİD), klasik ve sosyoekonomik görüş, Carroll piramidi", "short": "Etik Tekrar I", "questions": [{"q": "Ünitenin anahtar kavramları arasında aşağıdakilerden hangisi YER ALMAZ?", "opts": [{"t": "Üçlü sorumluluk"}, {"t": "Sosyal denetim"}, {"t": "Kurumsal yönetişim"}, {"t": "Etik ikilemler"}, {"t": "Paydaş"}], "a": 2, "exp": "Ünitenin anahtar kavramları: **Etik, Etik İkilemler, Etik Kodlar, Sosyal Sorumluluk, Paydaş, Sosyal Denetim, Üçlü Sorumluluk**. \"Kurumsal yönetişim\" bu listede yoktur.\n💡 7 kavram: 4'ü \"Etik/Sosyal\" ile başlar, 3'ü (Paydaş–Denetim–Üçlü) sağ sütundadır."}, {"q": "Giriş bölümüne göre, bundan yirmi beş yıl önce Batı kaynaklı işletme kitaplarında etik ve sosyal sorumluluk konusu nasıl ele alınıyordu?", "opts": [{"t": "Hiçbir işletme kitabında yer almıyordu"}, {"t": "Kâr maksimizasyonunun bir alt başlığı olarak görülüyordu"}, {"t": "Yirmi birinci yüzyılın öncelikli meselesi olarak işleniyordu"}, {"t": "Yalnızca hukuk kitaplarının konusu sayılıyordu"}, {"t": "İşletmelerin gelecekteki zorlu alanları arasında gösteriliyordu"}], "a": 4, "exp": "Kaynağa göre 25 yıl önce etik ve sosyal sorumluluk **işletmelerin gelecekte zorlu alanları arasında** gösteriliyordu; bugün ise **21. yüzyıl işletmelerinin öncelikli meseleleri** arasına yerleşmiştir. \"21. yüzyılın öncelikli meselesi\" seçeneği bugünkü durumu anlatır."}, {"q": "Giriş bölümüne göre son yıllarda ortaya çıkan şirket skandallarının sonucu aşağıdakilerden hangisidir?", "opts": [{"t": "Baskı gruplarının etkisinin azalması"}, {"t": "Yasal düzenlemelerin gevşetilmesi"}, {"t": "Hissedar sayısının artması"}, {"t": "Halkın işletmelere karşı öfkesi ve güven kaybı"}, {"t": "Etik kodlara olan ihtiyacın tamamen ortadan kalkması"}], "a": 3, "exp": "Skandallar iş dünyasındaki **aldatma ve sahtekârlıkları** gün yüzüne çıkarmakta, bu da **halkın işletmelere karşı öfkesi ve güven kaybıyla** sonuçlanmaktadır. Ayrıca günümüz işletmeleri karmaşık iş etiği sorunlarını **tanıma ve üstesinden gelebilme yeteneğine** ihtiyaç duymaktadır."}, {"q": "Giriş bölümüne göre işletmelerin daha etik ve doğal çevreye daha duyarlı iş yapması talepleri BAŞLANGIÇTA kimlerden gelmiştir?", "opts": [{"t": "Tüketiciler ve baskı gruplarından"}, {"t": "Uluslararası ekonomik kuruluşlardan"}, {"t": "Hükümetler ve yasa yapıcılardan"}, {"t": "Yatırımcılar ve hissedarlardan"}, {"t": "Çalışanlar ve sendikalardan"}], "a": 0, "exp": "Talepler başlangıçta **tüketiciler ve baskı gruplarından** gelmiş, bugün daha geniş platformlarda dile getirilmekte ve **yerel ve küresel çözümler** geliştirilmeye çalışılmaktadır. Bugün işletme kararlarını mercek altına alanlar arasında tüketiciler, çalışanlar, yatırımcılar, hükümetler ve özel ilgi grupları sayılır."}, {"q": "Giriş bölümüne göre etik konusunun \"zorlu yanı\" nedir?", "opts": [{"t": "Etiğin sayısal olarak ölçülebilmesi"}, {"t": "Etik konusunda evrensel bir çözüm yaklaşımının bulunması"}, {"t": "Etik kuralların yasalarla aynı olması"}, {"t": "Etik sorunların karmaşıklığı"}, {"t": "Etik konuların yalnızca büyük şirketleri ilgilendirmesi"}], "a": 3, "exp": "Konunun zorlu yanı **etik sorunların karmaşıklığıdır**; çünkü kararların doğruluğuna idealler, beklentiler, algılar, kültürel değerler gibi pek çok faktörün etkisinde hüküm verilir. İş etiği meselelerinin çoğu tartışmaya açıktır ve **evrensel olarak kabul edilmiş bir çözüm yaklaşımı yoktur** (\"evrensel çözüm yaklaşımı bulunması\" seçeneği bu yüzden yanlış)."}, {"q": "Giriş bölümündeki DİKKAT kutusunda aktarılan, 25.000 üniversite öğrencisiyle yapılan araştırmaya göre öğrencilerin yüzde kaçı en az bir kez kopya çekmiştir?", "opts": [{"t": "%90"}, {"t": "%50"}, {"t": "%25"}, {"t": "%75"}, {"t": "%62"}], "a": 4, "exp": "Araştırmaya göre öğrencilerin **%62'si** en az bir kez kopya çekmiştir. Başka bir araştırma ise öğrencilerin internetten ödev amaçlı içerik/müzik indirmeyi ya da başka öğrencinin cevaplarını kopyalamayı **hilekârlık olarak tanımlamadıklarını** göstermiştir (Ferrell vd., 2008). Mesaj: tek bir doğru üzerinde anlaşmak zordur.\n💡 25.000 öğrenci → %62."}, {"q": "\"Bir toplumda birey ya da grupların uymak zorunda oldukları davranış biçimleri ve kurallar\" aşağıdaki kavramlardan hangisinin tanımıdır?", "opts": [{"t": "Ahlak"}, {"t": "Değer"}, {"t": "Etik"}, {"t": "İş etiği"}, {"t": "Yasa"}], "a": 0, "exp": "**Ahlak**, bir toplumda birey/grupların uymak zorunda oldukları davranış biçimleri ve kurallardır. **Etik** ise ahlak bilimidir: davranışların doğruluğu/yanlışlığı hakkında **hüküm vermeyi sağlayan** ahlaki ilke ve değerler toplamıdır.\n💡 Ahlak = kurallar; Etik = o kurallar hakkında hüküm veren bilim."}, {"q": "Aşağıdakilerden hangisi kaynakta verilen \"iş etiği\" tanımına en uygundur?", "opts": [{"t": "Bir toplumda bireylerin uymak zorunda oldukları ve devletçe yaptırıma bağlanmış yazılı hukuk kuralları"}, {"t": "İşletmenin yalnızca hissedarlarına karşı taşıdığı ve finansal kazançla ölçülen kâr sağlama yükümlülüğü"}, {"t": "Kurumların toplumla etkileşimiyle oluşan karar ve eylemlerinde geçerli ahlaki ilke, değer ve standartlar"}, {"t": "Bireyin hiçbir dış kontrol olmaksızın kendi kendini sınırladığı özgür seçim alanındaki kişisel standartlar"}, {"t": "Bir meslek grubunun üyelerinden beklediği davranış türlerini yazılı olarak açıklayan bildirgeler"}], "a": 2, "exp": "**İş etiği**, kurumların toplumla etkileşimi sonucu oluşan kararlarında ve eylemlerinde geçerli ahlaki ilkeler, değerler ve standartlardır; ahlak norm ve kurallarının iş hayatında işletmelerde, şirketlerde ve kuruluşlarda **uygulanması** ile ilgilidir. \"Meslek grubunun beklediği davranışları açıklayan bildirge\" **etik kod** tanımına, \"kendi kendini sınırlama\" ise özgür seçim alanına aittir."}, {"q": "Kaynağa göre işletmeler açısından etik meseleler doğrudan neyle ilişkilidir?", "opts": [{"t": "Yalnızca ulusal ve uluslararası yasal çerçeveyle"}, {"t": "Rakip firmaların fiyatlandırma politikalarıyla"}, {"t": "Hissedarların yıllık kâr payı beklentileriyle"}, {"t": "Kurum kültürünün parçası olan kurum içi değerlerle"}, {"t": "Uluslararası ticaret anlaşmalarının hükümleriyle"}], "a": 3, "exp": "Etik, karar alma ve uygulamada neyin iyi neyin kötü olduğuna ilişkin **standartları** ortaya koyar. İşletmeler açısından etik meseleler **kurum kültürünün bir parçası olan kurum içi değerlerle** doğrudan ilişkilidir. Değerler, işletmenin iç ve dış çevreye karşı sorumluluklarına ilişkin kararlarını etkiler."}, {"q": "Kaynakta işletmenin iç ve dış çevresine verilen örneklere göre aşağıdaki eşleştirmelerden hangisi doğrudur?", "opts": [{"t": "Müşteriler – iç çevre; çalışanlar ve yatırımcılar – dış çevre"}, {"t": "Çalışanlar ve yatırımcılar – iç çevre; müşteriler – dış çevre"}, {"t": "Çalışanlar ve müşteriler – iç çevre; yatırımcılar – dış çevre"}, {"t": "Yatırımcılar – iç çevre; çalışanlar ve müşteriler – dış çevre"}, {"t": "Çalışanlar – iç çevre; müşteriler ve yatırımcılar – dış çevre"}], "a": 4, "exp": "Kaynakta **çalışanlar iç çevre**, **müşteriler ve yatırımcılar dış çevre** unsurlarına örnek olarak verilmiştir. Yatırımcıların işletmeye para koyması onları iç çevre yapmaz; kaynak onları dış çevrede sayar."}, {"q": "Kaynağa göre \"etik bir mesele\" ne zaman ortaya çıkar?", "opts": [{"t": "Örgüt ya da bireyin eylemlerinin başkalarına yarar veya zarar verebileceği durumda"}, {"t": "İşletme kâr maksimizasyonu hedefinden saptığında ve hissedarlar zarar gördüğünde"}, {"t": "Çalışanlar işletmenin yazılı bir iç kuralını bilerek ve isteyerek ihlal ettiğinde"}, {"t": "Bir davranış ulusal yasalarla açıkça yasaklanıp cezai yaptırıma bağlandığında"}, {"t": "Bir karar yalnızca karar vericinin kendisini etkilediğinde ve başkasına yansımadığında"}], "a": 0, "exp": "**Etik mesele**, örgütün veya bireyin eylemlerinin **diğerlerine yarar sağlayabileceği veya zararlı olabileceği** bir durumda ortaya çıkar. Bizler bulunduğumuz noktadan meselenin etik ve etik olmayan çözümleri hakkında görüş bildiririz. Kilit unsur, eylemin **başkalarını** etkilemesidir."}, {"q": "İnsan davranışlarının dışsal kontrolün yoğunluğu açısından ayrıldığı üç kategori düşünüldüğünde, dışsal kontrolün EN YOĞUN olduğu alan hangisidir?", "opts": [{"t": "Etik alanı"}, {"t": "Özgür seçim alanı"}, {"t": "Yasa (hukuk) alanı"}, {"t": "Örgüt kültürü alanı"}, {"t": "Gönüllü sorumluluk alanı"}], "a": 2, "exp": "Üç kategori: **yasa (hukuk) alanı – etik alanı – özgür seçim alanı**. Dışsal kontrolün en yoğun olduğu alan, değer ve standartların **yazılı** olduğu, kanun yapıcıların kuralları net belirlediği **yasa alanıdır** (ör. motosiklet sürücüsü olmanın şartları, şirketlerin vergi yükümlülükleri). Diğer uçta özgür seçim alanı yer alır.\n💡 Kontrol yoğunluğu: Yasa > Etik > Özgür seçim."}, {"q": "Bireylerin neye yatırım yapacakları ya da şirketlerin ne kadar mamul üretecekleri, insan davranışının hangi kategorisine örnektir?", "opts": [{"t": "Etik kusur durumu"}, {"t": "Özgür seçim alanı"}, {"t": "Yasalarla tanımlı alan"}, {"t": "Toplumsal etik alanı"}, {"t": "Etik ikilem durumu"}], "a": 1, "exp": "**Özgür seçim alanı**, yasalarda hiçbir şekilde yer almayan davranışlara aittir; kişinin neye yatırım yapacağı ya da şirketin ne kadar üreteceği onların özgür seçimine bağlıdır. Bu alanda **itaat kurumu yoktur**; kişi sadece **kendi kendisini** sınırlayabilir."}, {"q": "Yasa alanı ile özgür seçim alanı arasında kalan \"etik alan\" için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Kuralları kanun yapıcılar net olarak belirler ve uyulmaması hâlinde yaptırım uygulanır"}, {"t": "Dışsal kontrolün en yoğun olduğu alandır; değer ve standartlar hukuk sistemi içinde yazılıdır"}, {"t": "Hiçbir davranış standardı yoktur; kişi tamamen kendi tercihine göre davranır ve kendini sınırlar"}, {"t": "Spesifik yasa yoktur; ancak toplumca kabul görmüş ilke ve değerlere dayalı standartlar vardır"}, {"t": "Davranışlar yazılı kanunlarla belirlenmiştir ve bu alandaki standartların yaptırım gücü yüksektir"}], "a": 3, "exp": "İki uç arasında kalan alan **etik alandır**: burada **spesifik bir yasa yoktur**, ancak birey/şirkete yol gösterecek, **toplumda genel kabul görmüş ilke ve değerlere** dayalı davranış standartları vardır. Bu norm ve standartlar hakkında yasaların **yaptırım gücü yoktur**. \"Yazılı kanun\", \"kanun yapıcıların belirlemesi\" ve \"en yoğun dışsal kontrol\" yasa alanını; \"hiçbir standart yok\" ise özgür seçim alanını anlatır."}, {"q": "Kaynağa göre \"etik açıdan kabul edilebilir davranış\" nasıl tanımlanır?", "opts": [{"t": "Hem yasal hem de toplumun büyük kesimince ahlaken kabul edilebilir olan davranış"}, {"t": "Doğrudan etkilenenler arasında çoğunluğa en yüksek faydayı sağlayan davranış"}, {"t": "Şirketin kârını maksimize eden ve hissedarlarca onaylanan her türlü davranış"}, {"t": "Yasalarla yasaklanmamış olduğu için yasal sayılabilen her türlü davranış"}, {"t": "Karar vericinin toplumun görüşüne bakmaksızın vicdanına uygun bulduğu davranış"}], "a": 0, "exp": "**Etik açıdan kabul edilebilir davranış**, hem **yasal** olarak hem de **toplumun büyük bir kesimi** tarafından **ahlaki** açıdan kabul edilebilir olandır. Sadece yasal olmak yetmez; bu yanılgı \"yasal olan her şey etiktir\" kabulüdür."}, {"q": "Kaynaktaki özete göre aşağıdaki alan–standart eşleştirmelerinden hangisi DOĞRUDUR?", "opts": [{"t": "Hukuk alanı – toplumsal standartlar; etik alanı – yasal standartlar; özgür seçim alanı – bireysel standartlar"}, {"t": "Hukuk alanı – yasal standartlar; etik alanı – toplumsal standartlar; özgür seçim alanı – bireysel standartlar"}, {"t": "Hukuk alanı – yasal standartlar; etik alanı – bireysel standartlar; özgür seçim alanı – toplumsal standartlar"}, {"t": "Hukuk alanı – yasal standartlar; etik alanı – örgütsel standartlar; özgür seçim alanı – toplumsal standartlar"}, {"t": "Hukuk alanı – bireysel standartlar; etik alanı – toplumsal standartlar; özgür seçim alanı – yasal standartlar"}], "a": 1, "exp": "Kaynaktaki özet: **hukuk alanında yasal**, **etik alanında toplumsal**, **özgür seçim alanında bireysel** standartlar söz konusudur.\n💡 Sıralama \"Y-T-B\": Yasa → Toplum → Birey (dışsal kontrol azaldıkça standart bireyselleşir)."}, {"q": "Kaynağa göre şirketlerin de bireylerin de güçlük çektikleri konu nedir ve bu durum hangi yanlış kabule götürür?", "opts": [{"t": "Yasal yükümlülüklerini etik alanında ele almaları; \"etik olan her şey aynı zamanda yasaldır\" kabulü"}, {"t": "Etik kodları yasaların yerine koymaları; \"etik kodu olan şirket asla denetlenmez\" kabulü"}, {"t": "Kâr hedeflerini etik alanında ele almaları; \"kârlı olan her şey toplum için de etiktir\" kabulü"}, {"t": "Yasal yükümlülük dışı kararları özgür seçim alanında ele almak; \"yasal olan her şey etiktir\""}, {"t": "Özgür seçim alanındaki kararları yasalara göre vermeleri; \"yasa dışı olan her şey etiktir\" kabulü"}], "a": 3, "exp": "Şirketler ve bireyler, **yasal yükümlülükleri dışındaki** karar problemlerini **özgür seçim bölgesinde** ele alırlar; bu da onları **yasal olan her şeyin etik olduğu** kabulüne götürür. Oysa etik alanın farkında olunması, şirketlerin hem içeride hem dışarıda davranışlarını düzenleyebilmesini sağlar."}, {"q": "Kaynağa göre şirketlerin kendi etik kodlarını oluşturup kurum kültürlerini dönüştürmelerinin bir sonucu aşağıdakilerden hangisidir?", "opts": [{"t": "Etik ikilemlerin işletmelerde tamamen yok olması"}, {"t": "Vergi yükümlülüklerinin büyük ölçüde ortadan kalkması"}, {"t": "İlave yasal düzenlemelere olan ihtiyacın azalması"}, {"t": "Sosyal denetim ihtiyacının tamamen ortadan kalkması"}, {"t": "Özgür seçim alanının yasalar aleyhine genişlemesi"}], "a": 2, "exp": "Günümüz küresel iş ortamında etik ilkeler ve sosyal sorumluluk giderek yaygınlaşmaktadır. Şirketler kendi **etik kodlarını** oluşturup kurum kültürlerini dönüştürdükçe **ilave yasal düzenlemelere olan ihtiyaç azalmakta** ve kararların yol açabileceği problemlerden kaçınılabilmektedir."}, {"q": "\"Bireyin aldığı kararın ahlaki açıdan yanlış, yasa dışı veya etik dışı olması durumu\" aşağıdakilerden hangisidir?", "opts": [{"t": "Etik kusur"}, {"t": "Sosyal denetim"}, {"t": "Etik ikilem"}, {"t": "Etik mesele"}, {"t": "Etik kod"}], "a": 0, "exp": "**Etik kusur**, bireyin aldığı kararın ahlaki açıdan yanlış, yasa dışı veya etik dışı olmasıdır; bazı davranışlar etik açıdan **net olarak** kusurlu nitelenebilir. **Etik ikilemde** ise doğru ile yanlış net değildir."}, {"q": "\"Birbiriyle çatışan ancak her ikisinin de olası geçerli etik yönleri olan iki seçenekten birinin seçilmesinin gerektiği durum\" hangi kavramla ifade edilir?", "opts": [{"t": "Etik mesele"}, {"t": "Etik ikilem"}, {"t": "Prosedürel adalet"}, {"t": "Etik kusur"}, {"t": "Faydacılık"}], "a": 1, "exp": "**Etik ikilem**, hem bir seçimin hem de davranış alternatifinin **potansiyel zararlı etik sonuçları** nedeniyle istenmediği durumlarda ortaya çıkar; **yanlış ve doğru net olarak belirlenemeyebilir**. Kaynak burada Nasreddin Hoca, oğlu ve eşeği hikâyesini hatırlatır (kim binse birileri eleştirir).\n💡 Etik kusur = net yanlış; etik ikilem = iki \"kısmen doğru\" arasında sıkışma."}, {"q": "Kaynağa göre etik bir meselede en uygun davranış konusunda anlaşmazlık ve ikilemler ortaya çıkmasının nedeni nedir?", "opts": [{"t": "Etik standartların ulusal yasalarla birebir aynı ve yazılı olması"}, {"t": "Etik kodların yalnızca belirli büyüklükteki şirketlerde bulunması"}, {"t": "Etik kurallara uyulmamasının cezai yaptırımlarının çok ağır olması"}, {"t": "Yöneticilerin baskı altında rasyonel ve tutarlı kararlar alamaması"}, {"t": "Etik standartların resmî, yazılı ve uzlaşılmış maddeler olmaması"}], "a": 4, "exp": "Etik standartlar **resmî, yazılı, toplumun tüm bireylerinin kabul ettiği, üzerinde uzlaşılmış maddeler olmadığı** için etik bir meselede en uygun davranışın ne olduğu konusunda anlaşmazlık ve ikilemler çıkabilir."}, {"q": "Kaynaktaki DİKKAT kutusuna göre, işletmeden tüketiciye ticaretin yeni biçimi olan elektronik ticaretle bağlantılı etik konular arasında aşağıdakilerden hangisi sayılmıştır?", "opts": [{"t": "Kargo teslim sürelerinin uzunluğu"}, {"t": "İzinsiz ticari e-posta"}, {"t": "Ürün iade sürelerinin kısalığı"}, {"t": "Web sitelerinin yavaş açılması"}, {"t": "Çevrimiçi fiyatların mağaza fiyatlarından farklı olması"}], "a": 1, "exp": "Küreselleşme, keskin rekabet ve teknoloji etik meseleleri etkiler. E-ticaretle bağlantılı etik konular: **kişisel bilgilerin gizliliği, izinsiz ticari e-posta, çocuklara yönelik elektronik ticaret uygulamaları** (Varinli ve Öz, 2006). Diğer şıklar kaynakta geçmez.\n💡 E-ticaret etiği üçlüsü: Gizlilik – Spam – Çocuk."}, {"q": "Kaynağa göre bazı işletmelerde karmaşık etik durumlar için karar almak üzere hangi yapılar bulunmaktadır?\nI. Görevlendirilmiş etik sorumluları\nII. Etik kurulları\nIII. Vergi denetim birimleri", "opts": [{"t": "Yalnız I"}, {"t": "Yalnız II"}, {"t": "I ve II"}, {"t"
