<tr><th>Basamak</th><th>İçerik</th><th>Toplum gözünde</th></tr>
<tr><td>4. Hayırseverlik (tepe)</td><td>"İyi, sorumlu vatandaş"; <b>gönüllü sorumluluk</b>; para, zaman, bilgi aktarımı, projelerle refah ve yaşam kalitesi</td><td>Arzu edilir</td></tr>
<tr><td>3. Etik</td><td>Adil ve doğru olma, iyi niyet; yasal engel olmasa bile paydaş beklentisine uygun davranış (Kuzey Amerika iklim değişikliği – tüketici baskısıyla gönüllü girişimler)</td><td>Beklenir</td></tr>
<tr><td>2. Yasal</td><td>Yasalara ve düzenlemelere uyum (ör. rekabet stratejileri)</td><td>Gerekli görülür</td></tr>
<tr><td>1. Ekonomik (taban)</td><td>Varlık nedeni; işlevini yerine getirip varlığını sürdürmek. Yatırımcı → yatırımın karşılığı; çalışan → iş güvenliği, adil ücret; müşteri → uygun fiyatlı kaliteli ürün</td><td>Gerekli görülür</td></tr>
</table></div>
<p>Ekonomik basamak iki açıdan önemli: (1) <b>diğer tüm sorumluluklar ona bağlıdır</b>; (2) zaafiyeti yatırımcı, çalışan, tedarikçi, müşteriyi ve <b>ülke ekonomisini</b> olumsuz etkiler.</p>`,
`<h3>1. Sosyal Sorumluluk Düzeyleri – Carroll Piramidi (Şekil 3.2)</h3> <p><span class="k">Carroll'ın Dört Parçalı Kurumsal Sosyal Sorumluluk Modeli</span> (Carroll 1991'den; Crane &amp; Matten 2010). Sorumluluklar <b>ardışık katmanlar</b>dır; alttan üste çıkıldıkça işletme toplumun daha geniş kesimine duyarlılık gösterir.</p> <div class="tbl"><table><tr><th>Basamak (alttan üste)</th><th>Toplumun bakışı</th><th>Öz</th></tr> <tr><td>1. Ekonomik</td><td>Gerekli görülür (zorunlu)</td><td>Varlığını sürdürme; diğer tüm sorumluluklar buna bağlı</td></tr> <tr><td>2. Yasal</td><td>Gerekli görülür (zorunlu)</td><td>Yasalara ve düzenlemelere uyma</td></tr> <tr><td>3. Etik</td><td><b>Beklenir</b></td><td>Yasal engel olmasa da adil ve doğru olma</td></tr> <tr><td>4. Hayırseverlik (gönüllü)</td><td><b>Arzu edilir</b> – memnuniyet yaratır</td><td>Topluma para, zaman, bilgi aktarımı; "iyi, sorumlu vatandaş"</td></tr></table></div> <ul><li>Sıra Sizde 3: ilk ikisi <b>zorunlu</b>; <span class="warn">günümüzde ön plana çıkanlar etik ve hayırseverlik sorumluluklarıdır</span>.</li> <li>Örnek: çalışanların zamanını, parasını, ürününü kâr amacı gütmeyen örgütlere bağışlamak → <b>hayırseverlik</b>.</li></ul>  <h3>2. Sürdürülebilirlik</h3> <p>Sorumluluklar bağlamında iki önemli konu: <b>makro amaçlı</b> <span class="k">sürdürülebilirlik</span> ve yönetsel yaklaşım/strateji dayanağı olarak <span class="k">paydaş kuramı</span>.</p> <ul><li>Küreselleşmeyle şirket etkilerini düzenleme ihtiyacı doğdu. Örnek sorunlar: iklim değişikliğine yol açan <b>çevre kirliliği</b>; <b>"kullan at" kültürü ve aşırı paketleme</b> atıkları; şirketlerin <b>küçülmesi/kapanmasının</b> yerel halka etkisi; <b>yerel kültürlerin erozyonu</b>.</li> <li><b>1992 Rio Dünya Zirvesi</b> sonrası "sürdürülebilirlik" çokça konuşuldu; büyük şirketlerin rapor başlıklarına yerleşti ("Sürdürülebilirlik/Sosyal Sorumluluk Raporu").</li> <li><span class="k">Sürdürülebilir kalkınma</span> (Dünya Çevre ve Kalkınma Komisyonu, <b>1987</b>): "gelecek nesillerin kendi ihtiyaçlarını karşılama yeteneğine zarar vermeksizin bugünkü nesillerin ihtiyaçlarını karşılayan kalkınma". İdealist ve tartışmalı ama spesifik bir amaca işaret eder.</li> <li><span class="k">Sürdürülebilirlik</span>: çevresel, ekonomik ve sosyal açıdan <b>tüm sistemin uzun dönemli korunması</b>.</li> <li><span class="warn">1987 = sürdürülebilir kalkınma tanımı; 1992 = Rio, sürdürülebilirlik kavramının yaygınlaşması.</span></li></ul>  <h3>3. Üçlü Sorumluluk (Triple Bottom Line) – Şekil 3.3</h3> <ul><li>Sürdürülebilirliğin daha net ifadesi; isim babası ve savunucusu <b>John Elkington (1998)</b>.</li> <li>İşletmenin <b>tek (kâr) hedefi</b> olduğu fikrini reddeder; bir <b>amaç seti</b> vardır: <b>ekonomik, sosyal, çevresel değer</b> üretmek.</li> <li><span class="warn">Finansal sorumlulukları dışlamaz.</span> İşletmelerden beklentilerin genişlediğini gösterir; sürdürülebilirlik iş etiği için potansiyel yeni hedeftir.</li></ul> <div class="tbl"><table><tr><th>Model</th><th>Bileşenler</th></tr> <tr><td>Carroll (dört basamak)</td><td>Ekonomik, yasal, etik, hayırseverlik</td></tr> <tr><td>Elkington (üçlü)</td><td>Ekonomik, sosyal, çevresel</td></tr></table></div> <p><b>DİKKAT – BM Milenyum Kalkınma Hedefleri</b> (8): aşırı yoksulluk ve açlığı kaldırmak; her yerde temel eğitim; kadını güçlendirme ve cinsiyet eşitliği; çocuk ölüm oranını azaltmak; anne sağlığını iyileştirmek; HIV/AIDS, sıtma ve diğer hastalıklarla mücadele; çevresel sürdürülebilirlik; kalkınma için küresel iş birliği.</p>  <h3>4. Sosyal Sorumluluk ve Paydaş Yaklaşımı</h3> <ul><li>Paydaş yaklaşımı <b>1980'lerde Edward Freeman</b>; kavram iş dünyasında ilk <b>1960'larda</b> kullanıldı, sonra popülerleşti.</li> <li>Sosyal sorumluluk yaklaşımı → işletmenin <b>sorumluluklarına</b>; paydaş yaklaşımı → sorumlu olunan <b>gruplara</b> odaklanır.</li> <li>Temel iddiası <b>sosyoekonomik görüşle</b> örtüşür: işletme yalnızca hissedar/sahiplerin değil, içindeki ve etrafındaki önemli grupların göz önüne alınarak yönetilmeli.</li> <li><span class="k">Paydaş</span>: işletmenin amaçlarını gerçekleştirirken <b>etkilediği veya etkilendiği</b> herhangi grup/birey. Şirketten başkalarının haklarını ihlal etmemesi ve etkilerinden sorumlu olması istenir.</li> <li>Paydaşlar işletmeden işletmeye ve aynı işletmenin farklı durum/görev/projelerinde değişir. Üretim işletmesi: devlet, sahipler, tedarikçiler, çalışanlar, müşteriler, yerel toplum; ayrıca özel ilgi grupları, kitlesel medya, ticari birlikler, rakipler.</li></ul> <div class="tbl"><table><tr><th>Şekil 3.4</th><th>Gruplar</th><th>İlişki</th></tr> <tr><td>Geleneksel model</td><td>Hissedarlar, müşteriler, tedarikçiler, çalışanlar</td><td>Sahipler baskın; çift yönlü ok yalnız hissedarlarla</td></tr> <tr><td>Paydaş modeli</td><td>+ Devlet, rakipler, sivil toplum</td><td>Tüm ilişkiler <b>iki yönlü</b></td></tr></table></div> <div class="tbl"><table><tr><th>Paydaş</th><th>Beklenti</th></tr> <tr><td>Toplum (doğal çevre)</td><td>Temiz çevre</td></tr> <tr><td>Ortaklar/yatırımcılar</td><td>Kâr ve güvenilir bilgi akışı</td></tr> <tr><td>Tüketiciler</td><td>Güvenilir ürün, doğru bilgilendirme, seçme hakkına saygı</td></tr> <tr><td>Çalışanlar</td><td>Fırsat eşitliği, cinsiyet ayrımcılığı olmaması, iş güvencesi ve kazançların korunması, engellilerin dikkate alınması, güvenli-sağlıklı ortam</td></tr> <tr><td>Yöneticiler</td><td>Yüksek ücret, yetki, statü</td></tr></table></div> <p>Paydaş modeli farklı beklentiler arasında <b>denge</b> önerir (zorlu süreç; günümüz işletmesinin yeni görevi).</p> <ul><li><span class="k">Kurumsal vatandaşlık</span>: paydaşların beklediği sorumlulukları <b>stratejik kararlarda</b> göz önünde bulundurma.</li> <li><span class="k">İtibar</span>: paydaşlar nezdinde eylem, seçim, davranış ve sonuçlara göre oluşan/değişen, <b>fiziksel olmayan en değerli varlıklardan</b> biri.</li> <li><span class="warn">Tek atımlık sosyal projeler yetmez</span>; tüm düzeyleri kapsayan anlayış sistematik olarak uygulamalara yerleşmeli.</li></ul>  <h3>5. Sosyal Sorumlu İşletme Olmanın Yol Haritası</h3> <p>Paydaş çerçevesinin özelliği: strateji oluşturma ve uygulamada <b>paydaşlardan geri bildirim</b> almak. Adımlar (Ferrell, Fraedrich, Ferrell 2011):</p> <ol><li><b>Kurum kültürünün gözden geçirilmesi</b> – misyon, değerler, normlar; özellikle <b>değerler ve normlar</b> paydaşları ve önemli konuları belirlemede kilit. Kaynak: stratejik planlar, misyon açıklamaları, yıllık raporlar, İnternet siteleri.</li> <li><b>Paydaş gruplarının tanınması</b> – ihtiyaç/istek/arzular; çelişkide <b>iş birliği</b>; politikayı etkileyen ve ondan etkilenen gruplar. Paydaşlar kaynakları elinde tutar ya da tehdit eder. <span class="warn">Örgütün başarısına bağımlı değillerse ve önemli kaynaklara erişebiliyorlarsa daha güçlüdürler</span>; diğer gruplarla iş birliği potansiyeli de hesaba katılır.</li> <li><b>Paydaşlarla ilgili konuların belirlenmesi</b> – ilk iki adım <b>güç ve meşruiyet</b> bilgisini verir (aciliyet). Örnekler: gıda sektöründe <b>obezite</b>; açlık, kadına yönelik şiddet, kültürel miras, silahsızlanma, kanserle mücadele. Belirleyenler: konunun şiddeti, paydaş gücü, işletmenin politikaları ve kaynakları.</li> <li><b>Sosyal sorumluluk alanlarının tespiti</b> – ilk üç adımı işletmenin yararına uygun çerçevede birleştirir; mevcut uygulamaları değerlendirme ve girişim seçimi. Taahhütler yıllık rapor, web, broşürde açıklanır: <b>resmi ve bağlayıcı</b>, pazarlama iletişimi sayılabilir, web'de "kurumsal" başlığı. Örnek: kahve işletmesi (çevre + sosyalleşme programları).</li> <li><b>Kaynaklar ve öncelikler</b> – kaynaklar sınırlı. İki kriter: <b>finansal durum ve yatırım miktarı</b>; <b>aciliyet</b> (konunun önemi + beklenen paydaş baskısı). Projeler hissedar ve kamu beklentisine uygun; konu ve mesajlar itibarın kaynaklarıdır.</li> <li><b>Paydaşlardan geri bildirim</b> – paydaş tatmini/itibar araştırmaları; blog, web, podcast, bülten; formal yöntemler: <b>odak grup, gözlem, anket</b>; özel web siteleri. <span class="warn">Eylemlerde dikkate alınmayan geri bildirim işlevsizdir.</span></li></ol> <p>Sıra Sizde 5 – uygulama örnekleri: çevre koruma, eğitim, sosyal-kültürel etkinlik, spor, yerel topluma katkı (hayırseverlikler), bağımsız kuruluşlarca <b>sosyal denetim</b>, <b>nedene dayalı pazarlama</b>.</p>  <h3>6. Yol Gösterici İlkeler</h3> <div class="tbl"><table><tr><th>Girişim</th><th>Yıl / kurucu</th><th>İçerik</th></tr> <tr><td>Dinler arası Bildirge</td><td>1994; üç dinin iş ve hükümet liderleri, ilahiyatçılar, akademisyenler</td><td>Adalet, karşılıklı saygı, çevresel-ekonomik-sosyal faktörlerin yönetiminden sorumluluk, dürüstlük</td></tr> <tr><td>Caux Roundtable (Minnesota İlkeleri)</td><td>1994; Avrupa, Amerika, Japonya iş liderleri; 2009 kriz sonrası revize</td><td>İki ideal: insana saygı + <b>kyosei</b> (herkesin iyiliği için birlikte yaşama-çalışma); 7 ilke</td></tr> <tr><td>UN Global Compact</td><td>2000, BM; 2009'a dek 120 ülkeden 4700+ işletme</td><td>10 ilke: insan hakları, işgücü, çevre, yolsuzluk</td></tr></table></div> <p><b>Caux 7 ilkesi:</b> 1) Ortakların ötesine paydaşlara yönelme 2) İnovasyon, adalet ve tüm insanlığa yönelme 3) Yasaların ötesinde güven 4) Kurallara saygı 5) Çok taraflı ticarete destek 6) Doğal çevreye saygı 7) Yasadışı operasyonlardan kaçınma.</p> <div class="tbl"><table><tr><th>Global Compact alanı</th><th>İlkeler (Tablo 3.1)</th></tr> <tr><td>İnsan hakları (2)</td><td>1: insan haklarını destekle/saygı duy; 2: ihlallere suç ortağı olma</td></tr> <tr><td>Çalışma standartları (4)</td><td>3: sendikalaşma ve toplu müzakere; 4: zorla çalıştırmaya son; 5: çocuk işçiliğe son; 6: işe alım/yerleştirmede ayrımcılığa son</td></tr> <tr><td>Çevre (3)</td><td>7: ihtiyati yaklaşım; 8: çevresel sorumluluğu artıran faaliyetlere destek; 9: çevre dostu teknolojiler</td></tr> <tr><td>Yolsuzlukla mücadele (1)</td><td>10: rüşvet ve haraç dâhil her türlü yolsuzlukla savaş</td></tr></table></div> <p>Yerel/sektörel/mesleki ilkeler: yayın kuruluşlarının yayın ilkeleri, muhasebecilerin meslek ilkeleri, STK etik ilkeleri.</p>  <h3>7. Standartlar ve Raporlama</h3> <p>Standartlar, ilkelerin benimsendiğini ve planlı iyileştirmeyi <b>onaylar</b> ve paydaşlara duyurmayı sağlar.</p> <div class="tbl"><table><tr><th>Standart</th><th>Özellik</th></tr> <tr><td>ISO 14000</td><td>Standart serisi; <b>çevre yönetim sistemlerini akredite</b> eder; en yaygın çevre standardı; tedarikçi seçme kriteri</td></tr> <tr><td>SA 8000</td><td>SAI; sosyal hesap verebilirlik ve <b>iş yeri çalışma koşulları</b>; tedarik zincirindeki işgörenler; insan hakları ve iş hukuku anlaşmalarına dayanır</td></tr> <tr><td>ISO 26000</td><td>ISO'nun <b>en yeni</b>, şirket sosyal sorumluluğu girişimi; geniş katılımlı; daha çok <b>rehber</b>; niteliksel göstergeler (çalışan tatmini, müşteri motivasyonu, şirket değerleri, etik karar süreçleri) algısal ölçülür, değeri eksilmez</td></tr> <tr><td>GRI</td><td>Küresel Raporlama Girişimi, <b>1997</b>; bütünleşik sorumluluk raporlamasında en yaygın; üçlü sorumluluk; <b>sürdürülebilirlik raporlama rehberi</b></td></tr></table></div> <p><span class="warn">İlke ≠ standart: en bilinen ilkeler Caux ve Küresel İlkeler Sözleşmesi; standartlar ISO 14000, SA 8000, ISO 26000.</span></p>  <h3>8. Ünite Özeti ve Kendimizi Sınayalım Notları</h3> <ul><li><span class="k">Etik</span>: kararın doğru/yanlışlığını belirleyen ilkeler ve ahlaki standartlar. <span class="k">Yasa</span>: yazılı, tanımlanmış davranışlar; yaptırım gücü var, cezası kesin.</li> <li>Hem etik hem yasal: iş yeri güvenliği, vergi, sigortasız işçi çalıştırmama. Yalnız etik (yaptırımsız, sadece <b>sosyal cezalandırma</b>): yalan söylememek, hayırseverlik, işletme olanaklarını özel amaçla kullanmamak.</li> <li><b>Etik olmayan davranış</b> (ör. şirket sırrını rakibe sızdırmak) ≠ <b>etik ikilem</b>: iki çözüm de geçerli, ama tarafların hakları çatışır (ör. serbest satılan ilaçların bazı risklerini gizleme).</li> <li><b>Klasik görüş</b>: tek sorumluluk hissedar getirisini maksimize etmek. <b>Sosyoekonomik görüş</b>: topluma karşı da sorumlu – günümüzde baskın.</li> <li>Etik davranışı artıran araçlar: misyon/değerler bildirgeleri, etik kodlar, etik eğitimi, etik komiteleri, etik danışmanları, tavsiye ve bilgi paylaşma kanalları, risk analizi ve yönetimi, paydaş iletişimi, etik denetim, hesap verme ve raporlama.</li> <li>Etik karar almayı etkileyen faktörler: bireysel karakteristikler, yapısal faktörler, örgüt kültürü, konunun derinliği (<span class="warn">eğitim düzeyi değil</span>). Faydacılık = çoğunluğun en yüksek iyiliği. Etik kodlar yazılıdır, <b>herkesi</b> ilgilendirir.</li> <li>Sıra Sizde 1: güçlü, yüksek etik standartlı kültür olumlu etkiler; zayıf kültürde bireyler <b>alt kültür</b> normlarına uyar; çalışma grupları ve bölüm standartları etkilidir.</li> <li>Sıra Sizde 2: <span class="k">Değerlere dayalı yönetim</span> = paylaşılan değerlerin oluşturulması, teşviki, uygulanması → karar ve eylemlere rehberlik, tutarlılık.</li></ul>  <h3>9. Yaşamın İçinden ve Okuma Parçası</h3> <ul><li><b>Dr. Ayhan Tokgöz</b>: 1986'dan beri 3 arkadaşıyla karşılıksız sağlık hizmeti (gönüllü/hayırseverlik sorumluluğu). İzmit Lokman Hekim Sağlık Vakfı Hastanesi: <b>50 kuruşa</b> dâhiliye muayenesi, diş tedavisi, tahliller, okuma-yazma kursu; evlerde ücretsiz ilaç. Levent polikliniğinin geliri Gebze'deki hastaneye. Geri dönüşüm: kutular haftada 2 kez, 19 yıldır tek STK, ayda 1 ton; 250 bin ton hurda kâğıtla 420 bin hastanın 170 bini ücretsiz. Diğer "fark yaratanlar": Bill Gates, Hayrettin Karaca, Nihat Gökyiğit, İbrahim Betil.</li> <li><b>Ahilik</b>: haklı şikâyette kusurlu mal üreten esnafın <b>pabucu dama atılırdı</b>; kalite düzelince indirilirdi.</li> <li>İş etiği: "neyin doğru neyin yanlış olduğunu bilmek ve doğru olanı yapmak, adil olmak". Etik dışılık en çok parayla uğraşan birimlerde (satın alma, finans, muhasebe); ulaşılmaz hedefler etik dışılığa iter.</li> <li><b>Uğur Zel</b>: hedefe/kısa vadeli sonuca zorlama → etik dışı yollar (finans, ilaç sektörü).</li> <li><b>Ural Aküzüm (TEDMER)</b>: etik değerler anglo-sakson kavram, son 10 yılda tanışıldı. En sık ihlaller: ürün niteliğini gizlice düşürmek, çevreye zarar, çalışana kanun/insaf dışı uygulama. En çok ihlal edilen sektörler: <b>medya, tıp, bankacılık, ilaç, gıda, GSM</b>.</li> <li>Nasıl etik olunur: kurallar belirlenip herkese iletilmeli, eğitim; net kurallar <b>gri alanları</b> azaltır (100 sayfa fotokopi örneği); rol model yönetici; üst yönetim çelişmemeli ("ne pahasına olursa olsun bitecek" → rüşvet); destekleyici ortam; etik kurulu ve <b>Alo Etik</b> (<span class="warn">Türkiye'de ihbar/ispiyon gibi algılanıyor</span>); ödül-ceza; hukuki düzenlemeler (çocuk işçi, vergi kaçakçılığı, haksız rekabet, tüketici koruma).</li> <li><b>Metin Çakmakçı (TEİD)</b>: şirketler gelirlerinin ortalama <b>%5</b>'ini yolsuzlukla kaybeder (gelişmekte olan ülkelerde ~<b>%9</b>); en büyük darbe <b>itibar kaybı</b>.</li> <li><b>Manchester 2009</b>: iki kat para veren ATM'yi 6 saat kimse bildirmedi.</li></ul>`
];

/* --- localStorage: yalnızca "en iyi skor" kolaylığı; her erişim korumalı --- */
function loadBest(){ try{ return JSON.parse(localStorage.getItem("etik-best-v1")||"{}"); }catch(e){ return {}; } }
function saveBest(id,pct){ try{ const b=loadBest(); if(b[id]==null||pct>b[id]){ b[id]=pct; localStorage.setItem("etik-best-v1",JSON.stringify(b)); } }catch(e){} }

let S = null;      // test oturumu
let F = null;      // kart oturumu

function esc(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
/* Açıklama metni: **kalın**, *italik* ve satır sonu desteği */
function fmt(t){
  t = esc(t).replace(/\n/g,"<br>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t = t.replace(/\*([^*]+)\*/g,"<i>$1</i>");
  return t;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  const best=loadBest();

    const b = best["set"+i]!=null ? `<span class="best">En iyi: %${best["set"+i]}</span>` : "";

  const bAll = best["all"]!=null ? `<span class="best">En iyi: %${best["all"]}</span>` : "";
  app.innerHTML = `
  <header class="masthead">
    <div class="eyebrow">Çoktan seçmeli · Bilgi kartları · Konu özetleri</div>
    <h1>Etik ve Sosyal Sorumluluk Soru Bankası</h1>
    <p>Uygulamalı etik, kamu etiği, etik dışı davranışlar, sosyal sorumluluk ve 7. hafta genel tekrar materyalinin tamamından hazırlanmış ${TOTAL} soru. Sorular konu başlıklarına göre dizildi; her konunun üç çalışma modu var: test, bilgi kartları ve sınav öncesi konu özeti.</p>
    <div class="stats">
      <span class="stat"><b>${TOTAL}</b> soru</span>
      <span class="stat"><b>${SETS.length}</b> konu başlığı</span>
      <span class="stat">Vaka + karşılaştırma + tablo soruları</span>
    </div>
  </header>
  <div class="plan">
    <div class="label">Önerilen çalışma sırası</div>
    <ol>
      <li><b>Özeti oku</b> — konunun haritasını çıkar.</li>
      <li><b>Testi çöz</b> — açıklamaları mutlaka oku; sonunda yanlışları tekrar çöz.</li>
      <li><b>Kartlarla pekiştir</b> — her kart bir bilgiyi açıklamasıyla öğretir.</li>
      <li>Sınavdan önce <b>Deneme Sınavı</b> ile kendini ölç.</li>
    </ol>
  </div>
  <div class="sets">
    ${cards}
    <button class="set-card special" onclick="startExam()">
      <span class="set-num">?</span>
      <span class="set-body">
        <span class="set-title">Deneme Sınavı</span>
        <span class="set-desc">Tüm konulardan rastgele 40 soru — gerçek sınav provası</span>
        <span class="set-meta"><span>40 soru · her seferinde farklı</span>${bEx}</span>
      </span>
      <span class="go">›</span>
    </button>
    <button class="set-card special" onclick="startAll()">
      <span class="set-num">∞</span>
      <span class="set-body">
        <span class="set-title">Maraton</span>
        <span class="set-desc">${TOTAL} sorunun tamamı, baştan sona</span>
        <span class="set-meta"><span>${TOTAL} soru</span>${bAll}</span>
      </span>
      <span class="go">›</span>
    </button>
  </div>
  <p class="note">Skorların yalnızca bu tarayıcıda saklanır. Klavye: testte A–E ile cevapla, Enter ile ilerle; kartlarda ← / → ile gezin.</p>`;
  window.scrollTo(0,0);
}

/* ---------- set menüsü ---------- */
function setMenu(i){
  S=null; F=null;
  const s=SETS[i]; const best=loadBest();
  const b = best["set"+i]!=null ? ` · En iyi skorun: %${best["set"+i]}` : "";
  const sumBtn = SUMMARIES[i] ? `
    <button class="mode" onclick="showSummary(${i})">
      <span class="ic">📋</span>
      <span class="set-body"><span class="t">Konu özeti</span>
      <span class="d">Sınav öncesi hızlı tekrar: tablolar ve kopya kağıdı kıvamında notlar</span></span>
      <span class="go">›</span>
    </button>`:"";
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="home()">‹ Ana sayfa</button><span></span>
  </div></div>
  <div class="menu-head">
    <div class="eyebrow">${esc(s.short)}</div>
    <h2>${esc(s.title)}</h2>
    <p>${esc(s.desc)} — ${s.questions.length} soru${b}</p>
  </div>
  <div class="modes">
    <button class="mode" onclick="startSet(${i})">
      <span class="ic">✏️</span>
      <span class="set-body"><span class="t">Teste başla</span>

      <span class="go">›</span>
    </button>
    <button class="mode" onclick="startFlash(${i})">
      <span class="ic">🃏</span>
      <span class="set-body"><span class="t">Bilgi kartları</span>
      <span class="d">Konunun bilgileri sırayla, açıklamalı öğretici kartlar — soru yok, okuyarak öğren</span></span>
      <span class="go">›</span>
    </button>
    ${sumBtn}
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- özet ---------- */
function showSummary(i){
  const s=SETS[i];
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="setMenu(${i})">‹ ${esc(s.short)}</button>
    <button class="btn-ghost" onclick="home()">Ana sayfa</button>
  </div></div>
  <div class="menu-head"><div class="eyebrow">Konu özeti</div><h2>${esc(s.title)}</h2></div>
  <div class="sum">${SUMMARIES[i]}</div>
  <div class="result-actions" style="margin-top:28px">
    <button class="btn" onclick="startSet(${i})">Şimdi testi çöz →</button>
    <button class="btn secondary" onclick="startFlash(${i})">Kartlara geç</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- test oturumu ---------- */
function startSet(i){ begin(SETS[i].title, SETS[i].questions.map(q=>({...q,from:SETS[i].short})), "set"+i, i); }
function startExam(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Deneme Sınavı", shuffle(pool).slice(0,40), "exam", null);
}
function startAll(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Maraton", pool, "all", null);
}
function retryWrong(){
  if(!S) return;
  const wrongQs = S.answers.filter(a=>!a.ok).map(a=>a.q);
  begin(S.title.replace(" · Yanlışlar","")+" · Yanlışlar", wrongQs, null, S.setIdx);
}
function begin(title, qs, storeId, setIdx){
  F=null;
  S = { title, qs, idx:0, right:0, wrongN:0, answers:[], storeId, setIdx };
  renderQ();
}

function renderQ(){
  const q = S.qs[S.idx];
  const n = S.idx+1, N = S.qs.length;
  let opts="";
  q.opts.forEach((o,i)=>{
    opts += `<button class="opt" id="opt${i}" onclick="answer(${i})">
      <span class="key">${LETTERS[i]}</span><span class="txt">${esc(o.t)}</span></button>`;
  });
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="${S.setIdx!=null?`setMenu(${S.setIdx})`:"home()"}">‹ Çık</button>
      <span class="counts">Soru ${n}/${N} &nbsp; <span class="ok">✓ ${S.right}</span> <span class="no">✗ ${S.wrongN}</span></span>
    </div>
    <div class="bar"><i style="width:${Math.round((S.idx)/N*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(S.title)}${q.from && S.storeId!==("set"+S.setIdx) ? " · "+esc(q.from):""}</div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${opts}</div>
  <div id="after"></div>
  <p class="hint-keys">A–E: cevapla · Enter: sonraki</p>`;
  window.scrollTo(0,0);
}

function answer(i){
  const q = S.qs[S.idx];
  if(document.getElementById("after").dataset.done) return;
  const ok = (i===q.a);
  if(ok) S.right++; else S.wrongN++;
  S.answers.push({q, ok, picked:i});
  q.opts.forEach((o,j)=>{
    const el=document.getElementById("opt"+j);
    el.disabled=true;
    if(j===q.a) el.classList.add("correct");
    else if(j===i) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const last = S.idx===S.qs.length-1;
  const after=document.getElementById("after");
  after.dataset.done="1";
  after.innerHTML = `
    <div class="verdict ${ok?"ok":"no"}">${ok?"Doğru!":"Yanlış — doğru cevap: "+LETTERS[q.a]}</div>
    <div class="explain"><div class="label">Açıklama</div><p>${fmt(q.exp)}</p></div>
    <div class="nextrow"><button class="btn" id="nextBtn" onclick="next()">${last?"Sonuçları gör":"Sonraki soru"} →</button></div>`;
  document.getElementById("nextBtn").focus({preventScroll:true});
}

function next(){
  if(S.idx < S.qs.length-1){ S.idx++; renderQ(); }
  else results();
}

/* ---------- sonuç ---------- */
function results(){
  const N=S.qs.length, pct=Math.round(S.right/N*100);
  if(S.storeId) saveBest(S.storeId,pct);
  const wrongs=S.answers.filter(a=>!a.ok);
  let msg;
  if(pct===100) msg="Kusursuz. Bu konu sende.";
  else if(pct>=85) msg="Çok iyi — yanlışlara bir göz at, tamamdır.";
  else if(pct>=70) msg="İyi gidiyor. Yanlışları tekrar çözmek farkı kapatır.";
  else if(pct>=50) msg="Temel var; açıklamaları okuyarak bir tur daha dön.";
  else msg="Bu setin özetini okuyup kartlarla çalışmak, sonra testi tekrarlamak en verimlisi.";
  let review="";
  if(wrongs.length){
    review = `<div class="review"><h3>Yanlış cevapladıkların (${wrongs.length})</h3>` + wrongs.map(a=>`
      <div class="review-item">
        <div class="rq">${esc(a.q.q)}</div>
        <div class="ra"><span class="you">Senin cevabın: ${LETTERS[a.picked]})</span> ${esc(a.q.opts[a.picked].t)}<br>
        <span class="cor">Doğrusu: ${LETTERS[a.q.a]})</span> ${esc(a.q.opts[a.q.a].t)}</div>
        <div class="re">${fmt(a.q.exp)}</div>
      </div>`).join("") + `</div>`;
  } else {
    review = `<p style="text-align:center" class="perfect">Hiç yanlışın yok 🎉</p>`;
  }
  const sumLink = (S.setIdx!=null && SUMMARIES[S.setIdx]) ? `<button class="btn secondary" onclick="showSummary(${S.setIdx})">Konu özetine dön</button>`:"";
  app.innerHTML = `
  <div class="result-head">
    <div class="score-ring" style="--p:${pct}"><div><b>%${pct}</b><small>${S.right}/${N}</small></div></div>
    <h2>${esc(S.title)} tamamlandı</h2>
    <p>${msg}</p>
  </div>
  <div class="result-actions">
    ${wrongs.length?`<button class="btn" onclick="retryWrong()">Yanlışları tekrar çöz (${wrongs.length})</button>`:""}
    ${sumLink}
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>
  ${review}`;
  window.scrollTo(0,0);
}

/* ---------- bilgi kartları (öğretici: cevap ve açıklama hep açık) ---------- */
function startFlash(i, at){
  S=null;
  F = { setIdx:i, title:SETS[i].title, cards:SETS[i].questions, idx:at||0 };
  renderFlash();
}
function renderFlash(){
  const N=F.cards.length, c=F.cards[F.idx], n=F.idx+1;
  const last = F.idx===N-1;
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="setMenu(${F.setIdx})">‹ Çık</button>
      <span class="counts">Kart ${n}/${N}</span>
    </div>
    <div class="bar"><i style="width:${Math.round(n/N*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(F.title)} · Bilgi kartları</div>
  <div class="flash-card">
    ${/^(I|II|III|IV|V)\b[ ,veIV]*$/.test(c.opts[c.a].t.trim()) ? "" : `<div class="flash-tag">Anahtar bilgi</div><div class="flash-ans">${esc(c.opts[c.a].t)}</div>`}
    <div class="flash-exp">${fmt(c.exp)}</div>
  </div>
  <div class="flash-actions">
    <button class="btn secondary" onclick="flashGo(-1)" ${F.idx===0?"disabled":""}>‹ Önceki</button>
    <button class="btn" onclick="flashGo(1)">${last?"Bitir":"Sonraki ›"}</button>
  </div>
  <p class="hint-keys">← / → : önceki / sonraki kart</p>`;
  window.scrollTo(0,0);
}
function flashGo(d){
  const j=F.idx+d;
  if(j<0) return;
  if(j>=F.cards.length){ flashDone(); return; }
  F.idx=j; renderFlash();
}
function flashDone(){
  const i=F.setIdx; F=null;
  app.innerHTML = `
  <div class="result-head">
    <h2>Kartlar bitti</h2>
    <p>${SETS[i].questions.length} kartın hepsini okudun. Şimdi testle kendini dene.</p>
  </div>
  <div class="result-actions">
    <button class="btn" onclick="startSet(${i})">Testi çöz</button>
    <button class="btn secondary" onclick="startFlash(${i})">Kartlara baştan dön</button>
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- klavye ---------- */
document.addEventListener("keydown",e=>{
  if(F){
    if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){ e.preventDefault(); flashGo(1); return; }
    if(e.key==="ArrowLeft"){ e.preventDefault(); flashGo(-1); return; }
    return;
  }
  if(!S) return;
  const after=document.getElementById("after");
  if(e.key==="Enter" && after && after.dataset.done){ next(); return; }
  const k="abcde".indexOf(e.key.toLowerCase());
  if(k>-1 && after && !after.dataset.done && S.qs[S.idx].opts[k]) answer(k);
});

home();
</script>
